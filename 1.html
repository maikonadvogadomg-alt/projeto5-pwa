&lt;body&gt;

&lt;div class=&quot;drop-overlay&quot; id=&quot;dropOverlay&quot;&gt;📂 Solte o arquivo aqui&lt;/div&gt;

&lt;header&gt;
  &lt;span style=&quot;font-size:20px&quot;&gt;🔧&lt;/span&gt;
  &lt;h1&gt;Analisador Universal de Projetos&lt;/h1&gt;
  &lt;span&gt;Importe ZIP ou pasta → analise → edite → gere arquivos&lt;/span&gt;
  &lt;div style=&quot;margin-left:auto;display:flex;gap:8px&quot;&gt;
    &lt;button onclick=&quot;document.getElementById('fileInput').click()&quot; style=&quot;padding:6px 12px;background:#1f6feb;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px&quot;&gt;📂 Importar ZIP&lt;/button&gt;
    &lt;button onclick=&quot;document.getElementById('folderInput').click()&quot; style=&quot;padding:6px 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px&quot;&gt;📁 Importar Pasta&lt;/button&gt;
    &lt;button onclick=&quot;exportProject()&quot; style=&quot;padding:6px 12px;background:#238636;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px&quot;&gt;💾 Exportar ZIP&lt;/button&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip,.tar,.tar.gz,.tgz&quot; onchange=&quot;handleFileInput(this)&quot;/&gt;
&lt;input type=&quot;file&quot; id=&quot;folderInput&quot; webkitdirectory multiple onchange=&quot;handleFolderInput(this)&quot;/&gt;

&lt;div class=&quot;main&quot;&gt;
  &lt;!-- SIDEBAR --&gt;
  &lt;div class=&quot;sidebar&quot;&gt;
    &lt;div class=&quot;sidebar-header&quot;&gt;
      &lt;button onclick=&quot;expandAll()&quot;&gt;▼ Expandir&lt;/button&gt;
      &lt;button onclick=&quot;collapseAll()&quot;&gt;▶ Recolher&lt;/button&gt;
      &lt;button onclick=&quot;filterFiles('')&quot; id=&quot;filterBtn&quot;&gt;🔍 Filtrar&lt;/button&gt;
      &lt;button class=&quot;primary&quot; onclick=&quot;runAnalysis()&quot; id=&quot;analyzeBtn&quot; style=&quot;display:none&quot;&gt;⚡ Analisar&lt;/button&gt;
    &lt;/div&gt;
    &lt;div style=&quot;padding:4px 8px;display:none&quot; id=&quot;filterBox&quot;&gt;
      &lt;input id=&quot;filterInput&quot; type=&quot;text&quot; placeholder=&quot;Filtrar arquivos...&quot; oninput=&quot;filterFiles(this.value)&quot;
        style=&quot;width:100%;padding:4px 8px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:12px&quot;/&gt;
    &lt;/div&gt;
    &lt;div class=&quot;file-tree&quot; id=&quot;fileTree&quot;&gt;
      &lt;div style=&quot;padding:20px;text-align:center;color:#8b949e;font-size:12px&quot;&gt;
        &lt;div style=&quot;font-size:32px;margin-bottom:8px&quot;&gt;📂&lt;/div&gt;
        Importe um projeto para começar
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- EDITOR --&gt;
  &lt;div class=&quot;editor-area&quot;&gt;
    &lt;div class=&quot;editor-tabs&quot; id=&quot;editorTabs&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;editor-content&quot; id=&quot;editorContent&quot;&gt;
      &lt;div class=&quot;welcome&quot;&gt;
        &lt;div style=&quot;font-size:48px&quot;&gt;🔧&lt;/div&gt;
        &lt;h2&gt;Analisador Universal&lt;/h2&gt;
        &lt;p&gt;Importe um ZIP ou pasta para começar.&lt;br/&gt;
        Clique em qualquer arquivo para editar.&lt;br/&gt;
        Use o painel direito para analisar e gerar arquivos.&lt;/p&gt;
        &lt;div style=&quot;display:flex;gap:8px;margin-top:8px&quot;&gt;
          &lt;button onclick=&quot;document.getElementById('fileInput').click()&quot; style=&quot;padding:8px 16px;background:#1f6feb;border:none;border-radius:6px;color:#fff;cursor:pointer&quot;&gt;📂 Importar ZIP&lt;/button&gt;
          &lt;button onclick=&quot;document.getElementById('folderInput').click()&quot; style=&quot;padding:8px 16px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer&quot;&gt;📁 Importar Pasta&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- PAINEL DIREITO --&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;panel-tabs&quot;&gt;
      &lt;div class=&quot;panel-tab active&quot; onclick=&quot;switchPanel('analysis')&quot;&gt;🔍 Análise&lt;/div&gt;
      &lt;div class=&quot;panel-tab&quot; onclick=&quot;switchPanel('generate')&quot;&gt;⚙️ Gerar&lt;/div&gt;
      &lt;div class=&quot;panel-tab&quot; onclick=&quot;switchPanel('clean')&quot;&gt;🧹 Limpar&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel-content&quot; id=&quot;panelContent&quot;&gt;
      &lt;div style=&quot;color:#8b949e;font-size:12px;text-align:center;padding:20px&quot;&gt;
        &lt;div style=&quot;font-size:32px;margin-bottom:8px&quot;&gt;🔍&lt;/div&gt;
        Importe um projeto e clique em&lt;br/&gt;&lt;strong style=&quot;color:#58a6ff&quot;&gt;⚡ Analisar&lt;/strong&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// ═══════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════
let PROJECT = {};        // { path: { content: string, modified: bool } }
let OPEN_TABS = [];      // [ path ]
let ACTIVE_TAB = null;
let ANALYSIS = null;
let PANEL = 'analysis';
let TREE_STATE = {};     // { folderPath: expanded }
let FILTER = '';

// ═══════════════════════════════════════════════════════
// IMPORTAÇÃO
// ═══════════════════════════════════════════════════════
async function handleFileInput(input) {
  const file = input.files[0];
  if (!file) return;
  showToast('⏳ Lendo arquivo...');
  try {
    if (file.name.endsWith('.zip')) {
      await importZip(file);
    } else {
      showToast('Use arquivos .zip por enquanto', 'warn');
    }
  } catch(e) {
    showToast('Erro: ' + e.message, 'error');
  }
  input.value = '';
}

async function importZip(file) {
  const { default: JSZip } = await loadJSZip();
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  PROJECT = {};
  let count = 0;
  const entries = Object.entries(zip.files);
  // Detecta prefixo comum
  const paths = entries.filter(([,v])=&gt;!v.dir).map(([k])=&gt;k);
  const tops = [...new Set(paths.map(k=&gt;k.split('/')[0]))];
  const prefix = tops.length === 1 ? tops[0] + '/' : '';
  for (const [path, entry] of entries) {
    if (entry.dir) continue;
    const rel = prefix ? path.slice(prefix.length) : path;
    if (!rel) continue;
    try {
      const buf2 = await entry.async('arraybuffer');
      const text = tryDecodeText(buf2);
      PROJECT[rel] = { content: text, binary: text === null, raw: buf2, modified: false };
      count++;
    } catch {}
  }
  showToast(`✅ ${count} arquivos importados!`);
  renderTree();
  document.getElementById('analyzeBtn').style.display = 'block';
  document.getElementById('filterBtn').style.display = 'block';
  ANALYSIS = null;
  runAnalysis();
}

function handleFolderInput(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  PROJECT = {};
  let count = 0;
  const readers = files.map(file =&gt; new Promise(resolve =&gt; {
    const reader = new FileReader();
    const path = file.webkitRelativePath.replace(/^[^/]+\//, '');
    if (!path) { resolve(); return; }
    reader.onload = e =&gt; {
      const buf = e.target.result;
      const text = tryDecodeText(buf);
      PROJECT[path] = { content: text, binary: text === null, raw: buf, modified: false };
      count++;
      resolve();
    };
    reader.readAsArrayBuffer(file);
  }));
  Promise.all(readers).then(() =&gt; {
    showToast(`✅ ${count} arquivos importados!`);
    renderTree();
    document.getElementById('analyzeBtn').style.display = 'block';
    ANALYSIS = null;
    runAnalysis();
  });
  input.value = '';
}

function tryDecodeText(buf) {
  try {
    const bytes = new Uint8Array(buf);
    // Detecta binário pelos primeiros bytes
    for (let i = 0; i &lt; Math.min(512, bytes.length); i++) {
      if (bytes[i] === 0) return null; // binário
    }
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch {
    try { return new TextDecoder('latin1').decode(buf); } catch { return null; }
  }
}

// ═══════════════════════════════════════════════════════
// ÁRVORE DE ARQUIVOS
// ═══════════════════════════════════════════════════════
function renderTree() {
  const tree = document.getElementById('fileTree');
  const paths = Object.keys(PROJECT).filter(p =&gt; !FILTER || p.toLowerCase().includes(FILTER.toLowerCase())).sort();
  if (!paths.length) {
    tree.innerHTML = '&lt;div style=&quot;padding:20px;text-align:center;color:#8b949e;font-size:12px&quot;&gt;Nenhum arquivo encontrado&lt;/div&gt;';
    return;
  }
  // Constrói estrutura de pastas
  const root = buildTree(paths);
  tree.innerHTML = renderNode(root, 0);
}

function buildTree(paths) {
  const root = { type: 'folder', name: '', children: {} };
  for (const p of paths) {
    const parts = p.split('/');
    let node = root;
    for (let i = 0; i &lt; parts.length - 1; i++) {
      const part = parts[i];
      if (!node.children[part]) node.children[part] = { type: 'folder', name: part, children: {}, path: parts.slice(0,i+1).join('/') };
      node = node.children[part];
    }
    const fname = parts[parts.length - 1];
    node.children[fname] = { type: 'file', name: fname, path: p };
  }
  return root;
}

function renderNode(node, depth) {
  let html = '';
  const sorted = Object.values(node.children).sort((a,b) =&gt; {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  for (const child of sorted) {
    const indent = depth * 16;
    if (child.type === 'folder') {
      const expanded = TREE_STATE[child.path] !== false;
      const icon = expanded ? '📂' : '📁';
      html += `&lt;div class=&quot;tree-item folder&quot; style=&quot;padding-left:${12+indent}px&quot; onclick=&quot;toggleFolder('${child.path}')&quot;&gt;
        &lt;span class=&quot;icon&quot;&gt;${icon}&lt;/span&gt;
        &lt;span class=&quot;name&quot;&gt;${child.name}&lt;/span&gt;
        &lt;span style=&quot;color:#8b949e;font-size:10px&quot;&gt;${countFiles(child)}&lt;/span&gt;
      &lt;/div&gt;`;
      if (expanded) html += renderNode(child, depth + 1);
    } else {
      const isActive = ACTIVE_TAB === child.path;
      const isModified = PROJECT[child.path]?.modified ? ' ●' : '';
      const isBinary = PROJECT[child.path]?.binary;
      const fileIcon = getFileIcon(child.name);
      const size = formatSize(PROJECT[child.path]?.raw?.byteLength || PROJECT[child.path]?.content?.length || 0);
      html += `&lt;div class=&quot;tree-item file ${isActive?'active':''}&quot; style=&quot;padding-left:${12+indent}px&quot; onclick=&quot;openFile('${child.path.replace(/'/g,&quot;\\'&quot;)}')&quot;&gt;
        &lt;span class=&quot;icon&quot;&gt;${fileIcon}&lt;/span&gt;
        &lt;span class=&quot;name&quot;&gt;${child.name}${isModified}&lt;/span&gt;
        &lt;span class=&quot;size&quot;&gt;${isBinary?'bin':size}&lt;/span&gt;
      &lt;/div&gt;`;
    }
  }
  return html;
}

function countFiles(node) {
  let n = 0;
  for (const c of Object.values(node.children)) {
    if (c.type === 'file') n++;
    else n += countFiles(c);
  }
  return n;
}

function toggleFolder(path) {
  TREE_STATE[path] = TREE_STATE[path] === false ? true : false;
  renderTree();
}

function expandAll() {
  Object.keys(PROJECT).forEach(p =&gt; {
    const parts = p.split('/');
    for (let i = 1; i &lt; parts.length; i++) TREE_STATE[parts.slice(0,i).join('/')] = true;
  });
  renderTree();
}

function collapseAll() {
  Object.keys(TREE_STATE).forEach(k =&gt; TREE_STATE[k] = false);
  renderTree();
}

function filterFiles(val) {
  FILTER = val;
  const box = document.getElementById('filterBox');
  if (val === '' &amp;&amp; box.style.display !== 'none') {
    // toggle
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  } else {
    box.style.display = 'block';
  }
  renderTree();
}

function getFileIcon(name) {
  const ext = name.split('.').pop()?.toLowerCase();
  const icons = {
    html:'🌐', htm:'🌐', css:'🎨', js:'📜', ts:'📘', tsx:'⚛️', jsx:'⚛️',
    json:'📋', md:'📝', txt:'📄', yml:'⚙️', yaml:'⚙️', sh:'💻',
    png:'🖼️', jpg:'🖼️', jpeg:'🖼️', svg:'🎭', ico:'🎯', gif:'🖼️',
    zip:'📦', apk:'📱', exe:'🖥️', dmg:'🍎',
    gradle:'🔨', xml:'📋', java:'☕', kt:'🎯', ts:'📘',
    env:'🔑', gitignore:'👁️', lock:'🔒',
  };
  return icons[ext] || '📄';
}

function formatSize(bytes) {
  if (!bytes) return '0B';
  if (bytes &lt; 1024) return bytes + 'B';
  if (bytes &lt; 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

// ═══════════════════════════════════════════════════════
// EDITOR DE ARQUIVOS
// ═══════════════════════════════════════════════════════
function openFile(path) {
  const file = PROJECT[path];
  if (!file) return;
  if (file.binary) { showToast('Arquivo binário — não editável', 'warn'); return; }
  if (!OPEN_TABS.includes(path)) {
    OPEN_TABS.push(path);
    if (OPEN_TABS.length &gt; 10) {
      const removed = OPEN_TABS.shift();
      if (removed !== path) { /* ok */ }
    }
  }
  ACTIVE_TAB = path;
  renderTabs();
  renderEditor();
  renderTree();
}

function closeTab(path, e) {
  e.stopPropagation();
  const idx = OPEN_TABS.indexOf(path);
  OPEN_TABS.splice(idx, 1);
  if (ACTIVE_TAB === path) {
    ACTIVE_TAB = OPEN_TABS[Math.min(idx, OPEN_TABS.length-1)] || null;
  }
  renderTabs();
  renderEditor();
  renderTree();
}

function renderTabs() {
  const tabs = document.getElementById('editorTabs');
  tabs.innerHTML = OPEN_TABS.map(p =&gt; {
    const name = p.split('/').pop();
    const mod = PROJECT[p]?.modified ? '●' : '×';
    const modColor = PROJECT[p]?.modified ? '#e3b341' : '';
    return `&lt;div class=&quot;tab ${p===ACTIVE_TAB?'active':''}&quot; onclick=&quot;openFile('${p.replace(/'/g,&quot;\\'&quot;)}')&quot;&gt;
      &lt;span&gt;${getFileIcon(name)} ${name}&lt;/span&gt;
      &lt;span class=&quot;close&quot; style=&quot;color:${modColor}&quot; onclick=&quot;closeTab('${p.replace(/'/g,&quot;\\'&quot;)}',event)&quot;&gt;${mod}&lt;/span&gt;
    &lt;/div&gt;`;
  }).join('');
}

function renderEditor() {
  const content = document.getElementById('editorContent');
  if (!ACTIVE_TAB || !PROJECT[ACTIVE_TAB]) {
    content.innerHTML = `&lt;div class=&quot;welcome&quot;&gt;&lt;div style=&quot;font-size:48px&quot;&gt;📄&lt;/div&gt;&lt;p&gt;Selecione um arquivo na árvore&lt;/p&gt;&lt;/div&gt;`;
    return;
  }
  const file = PROJECT[ACTIVE_TAB];
  const escaped = (file.content || '').replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;');
  content.innerHTML = `
    &lt;div style=&quot;display:flex;align-items:center;padding:4px 12px;background:#161b22;border-bottom:1px solid #30363d;font-size:11px;color:#8b949e;gap:12px&quot;&gt;

}

function markModified(path, textarea) {
  PROJECT[path].content = textarea.value;
  PROJECT[path].modified = true;

}

function saveFile(path) {
  PROJECT[path].modified = false;

}

// ═══════════════════════════════════════════════════════
// ANÁLISE DO PROJETO
// ═══════════════════════════════════════════════════════
function runAnalysis() {
  const paths = Object.keys(PROJECT);
  if (!paths.length) return;

  const has = (pattern) =&gt; {
    if (typeof pattern === 'string') return paths.some(p =&gt; p.endsWith(pattern) || p.includes(pattern));
    return paths.some(p =&gt; pattern.test(p));
  };
  const get = (pattern) =&gt; paths.find(p =&gt; typeof pattern === 'string' ? (p.endsWith(pattern) || p === pattern) : pattern.test(p));

  // Detecta tipo de projeto
  const hasPackageJson = has('package.json');
  const hasVite = has('vite.config') || has('vite.config.ts') || has('vite.config.js');
  const hasReact = hasPackageJson &amp;&amp; (() =&gt; { try { const p = JSON.parse(PROJECT[get('package.json')]?.content||'{}'); return !!(p.dependencies?.react || p.devDependencies?.react); } catch { return false; } })();
  const hasExpo = has('app.json') || has('app.config.js') || has('expo');
  const hasCapacitor = has('capacitor.config');
  const hasEAS = has('eas.json');
  const hasManifest = has('manifest.json');
  const hasSW = has('sw.js') || has('service-worker.js') || has('serviceWorker');
  const hasWorkflow = has('.github/workflows');
  const hasIndexHtml = has('index.html');
  const hasDistFolder = paths.some(p =&gt; p.startsWith('dist/') || p.startsWith('www/') || p.startsWith('build/'));
  const hasAndroid = paths.some(p =&gt; p.startsWith('android/'));
  const hasIcons = has('icon') || has('favicon') || paths.some(p =&gt; /\.(png|svg|ico)$/.test(p));
  const hasEnvFile = has('.env') || has('.env.local');
  const hasReplitRefs = paths.some(p =&gt; {
    const c = PROJECT[p]?.content || '';
    return /replit\.dev|repl\.co|REPL_ID|REPLIT/i.test(c);
  });

  // Detecta workspace/monorepo
  let isWorkspace = false;
  try {
    const pkg = JSON.parse(PROJECT[get('package.json')]?.content || '{}');
    isWorkspace = pkg.name?.includes('@workspace') || pkg.name?.includes('/');
  } catch {}

  let projectType = 'HTML Puro';
  if (hasExpo) projectType = 'Expo / React Native';
  else if (hasReact &amp;&amp; hasVite) projectType = 'React + Vite';
  else if (hasReact) projectType = 'React';
  else if (hasPackageJson) projectType = 'Node.js / Web';

  ANALYSIS = {
    projectType, paths, hasPackageJson, hasVite, hasReact, hasExpo,
    hasCapacitor, hasEAS, hasManifest, hasSW, hasWorkflow, hasIndexHtml,
    hasDistFolder, hasAndroid, hasIcons, hasEnvFile, hasReplitRefs, isWorkspace,
    totalFiles: paths.length,
    totalSize: paths.reduce((s,p) =&gt; s + (PROJECT[p]?.content?.length||0), 0),
  };

  renderPanel();
  switchPanel('analysis');
}

function switchPanel(tab) {
  PANEL = tab;

}

  }
  if (PANEL === 'analysis') renderAnalysisPanel(el);

}

// ═══════════════════════════════════════════════════════
// LIMPEZA REPLIT
// ═══════════════════════════════════════════════════════
const REPLIT_PATTERNS = [
  [/https?:\/\/[a-z0-9-]+\.replit\.dev[^\s&quot;'`)]*/gi, ''],
  [/https?:\/\/[a-z0-9-]+\.repl\.co[^\s&quot;'`)]*/gi, ''],
  [/&quot;REPLIT_DEV_DOMAIN&quot;\s*:\s*&quot;[^&quot;]*&quot;/gi, '&quot;REPLIT_DEV_DOMAIN&quot;:&quot;&quot;'],
  [/&quot;REPL_ID&quot;\s*:\s*&quot;[^&quot;]*&quot;/gi, '&quot;REPL_ID&quot;:&quot;&quot;'],
  [/process\.env\.REPL_ID/g, '&quot;&quot;'],
  [/process\.env\.REPLIT_DEV_DOMAIN/g, '&quot;&quot;'],
  [/import\.meta\.env\.REPLIT[A-Z_]*/g, '&quot;&quot;'],
  [/[&quot;']vite-plugin-dev-banner[&quot;']/g, ''],
  [/[&quot;']vite-plugin-runtime-error-modal[&quot;']/g, ''],
  [/import.*vite-plugin-dev-banner.*\n/g, ''],
  [/import.*vite-plugin-runtime-error-modal.*\n/g, ''],
  [/cartographer[^\n]*/g, ''],
];

function cleanReplitInFile(path) {
  let content = PROJECT[path]?.content || '';
  let changed = false;
  for (const [pattern, replacement] of REPLIT_PATTERNS) {
    const newContent = content.replace(pattern, replacement);
    if (newContent !== content) { content = newContent; changed = true; }
  }
  if (changed) {
    PROJECT[path].content = content;
    PROJECT[path].modified = true;
    if (ACTIVE_TAB === path) renderEditor();
    renderTree();
    showToast(`🧹 Limpeza feita em ${path.split('/').pop()}`);
  } else {
    showToast('Nenhuma referência encontrada neste arquivo', 'warn');
  }
  runAnalysis();
}

function cleanAllReplit() {
  const files = Object.keys(PROJECT).filter(p =&gt; {
    const c = PROJECT[p]?.content || '';
    return /replit\.dev|repl\.co|REPL_ID|REPLIT|cartographer|vite-plugin-dev-banner|vite-plugin-runtime-error/i.test(c);
  });
  files.forEach(p =&gt; cleanReplitInFile(p));
  showToast(`🧹 ${files.length} arquivos limpos!`);
}

function removeNodeModules() {
  const keys = Object.keys(PROJECT).filter(p =&gt; p.startsWith('node_modules/'));
  keys.forEach(k =&gt; delete PROJECT[k]);
  showToast(`🗑️ ${keys.length} arquivos removidos`);
  renderTree();
  runAnalysis();
}

function removeDist() {
  const keys = Object.keys(PROJECT).filter(p =&gt; /^(dist|build|www)\//.test(p));
  keys.forEach(k =&gt; delete PROJECT[k]);
  showToast(`🗑️ ${keys.length} arquivos removidos`);
  renderTree();
  runAnalysis();
}

function addFile(path, content) {
  PROJECT[path] = { content, modified: true, binary: false };

  openFile(path);

function getAppName() {
  try {
    const pkg = JSON.parse(PROJECT[Object.keys(PROJECT).find(p=&gt;p.endsWith('package.json'))]?.content||'{}');
    return pkg.name?.replace(/@[^/]+\//,'') || 'meu-app';
  } catch { return 'meu-app'; }
}

function genManifest() {
  const name = getAppName();
  addFile('manifest.json', JSON.stringify({
    name: name, short_name: name,
    description: `Aplicativo ${name}`,
    start_url: '/', display: 'standalone',
    background_color: '#0f172a', theme_color: '#6366f1',
    orientation: 'portrait',
    icons: [
      { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
    ]
  }, null, 2));
}

function genServiceWorker() {
  addFile('sw.js', `/* Service Worker */
const CACHE = 'app-v1';
const PRECACHE = ['/', '/index.html', '/manifest.json'];

self.addEventListener('install', e =&gt; {
  e.waitUntil(caches.open(CACHE).then(c =&gt; c.addAll(PRECACHE)));
  self.skipWaiting();
});

self.addEventListener('activate', e =&gt; {
  e.waitUntil(caches.keys().then(keys =&gt;
    Promise.all(keys.filter(k =&gt; k !== CACHE).map(k =&gt; caches.delete(k)))
  ));
  self.clients.claim();
});

self.addEventListener('fetch', e =&gt; {
  e.respondWith(
    caches.match(e.request).then(cached =&gt; cached || fetch(e.request))
  );
});`);
}

function genCapacitorConfig() {
  const name = getAppName();
  const id = `com.example.${name.replace(/[^a-z0-9]/gi,'').toLowerCase()}`;
  addFile('capacitor.config.ts', `import type { CapacitorConfig } from '@capacitor/cli';
const config: CapacitorConfig = {
  appId: '${id}',
  appName: '${name}',
  webDir: 'dist',
  server: { androidScheme: 'https' },
};
export default config;`);
}

function genEasJson() {
  addFile('eas.json', JSON.stringify({
    cli: { version: '&gt;= 10.0.0' },
    build: {
      development: { developmentClient: true, distribution: 'internal' },
      preview: { distribution: 'internal' },
      production: {}
    },
    submit: { production: {} }
  }, null, 2));
}

function fixPackageJson() {
  const path = Object.keys(PROJECT).find(p =&gt; p.endsWith('package.json') &amp;&amp; !p.includes('node_modules'));
  if (!path) { showToast('package.json não encontrado', 'error'); return; }
  try {
    const pkg = JSON.parse(PROJECT[path].content);
    if (pkg.name?.includes('/')) pkg.name = pkg.name.split('/').pop();
    if (pkg.name?.includes('@')) pkg.name = pkg.name.replace(/@[^/]+\//, '');
    PROJECT[path].content = JSON.stringify(pkg, null, 2);
    PROJECT[path].modified = true;
    openFile(path);
    runAnalysis();
    showToast('✅ package.json corrigido!');
  } catch(e) {
    showToast('Erro ao corrigir: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════
// EXPORTAR ZIP
// ═══════════════════════════════════════════════════════
async function exportProject() {
  if (!Object.keys(PROJECT).length) { showToast('Nenhum projeto carregado', 'warn'); return; }
  showToast('⏳ Gerando ZIP...');
  const { default: JSZip } = await loadJSZip();
  const zip = new JSZip();
  for (const [path, file] of Object.entries(PROJECT)) {
    if (file.binary &amp;&amp; file.raw) zip.file(path, file.raw);
    else if (file.content) zip.file(path, file.content);
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'projeto-corrigido.zip'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ ZIP baixado!');
}

// ═══════════════════════════════════════════════════════
// JSZIP LOADER
// ═══════════════════════════════════════════════════════
let _jszipCache = null;
async function loadJSZip() {
  if (_jszipCache) return _jszipCache;
  return new Promise((resolve, reject) =&gt; {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () =&gt; { _jszipCache = { default: window.JSZip }; resolve(_jszipCache); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (_toastTimer) clearTimeout(_toastTimer);
  const el = document.createElement('div');
  el.className = `toast ${type === 'error' ? 'error' : type === 'warn' ? 'warn' : ''}`;
  el.textContent = msg;
  document.body.appendChild(el);
  _toastTimer = setTimeout(() =&gt; el.remove(), 3000);
}

// ── Drag and drop ────────────────────────────────────
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e=&gt;{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave', ()=&gt;drop.classList.remove('over'));
drop.addEventListener('drop', e=&gt;{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])analyze(e.dataTransfer.files[0]);});

async function run(input) { if(input.files[0]) analyze(input.files[0]); }

// ── Estado global ────────────────────────────────────
let PROJECT = { name:'meu-projeto', deps:{}, devDeps:{}, scripts:{}, techs:[], type:'', files:[], dirs:[] };

// ── Análise principal ────────────────────────────────
async function analyze(file) {
  drop.innerHTML = '&lt;div style=&quot;font-size:28px&quot;&gt;⏳&lt;/div&gt;&lt;p style=&quot;font-size:13px;margin-top:8px;&quot;&gt;Analisando...&lt;/p&gt;';

  const zip = await JSZip.loadAsync(file);
  const files = [];
  const TEXT = new Set(['html','css','js','ts','tsx','jsx','json','md','txt','py','sh','bat','yaml','yml','env','toml','cjs','mjs']);

  for (const [name, entry] of Object.entries(zip.files)) {
    if (entry.dir) continue;
    const ext = (name.split('.').pop()||'').toLowerCase();
    let content = null;
    if (TEXT.has(ext)) { try { content = await entry.async('text'); } catch{} }
    files.push({ path: name, ext, content });
  }

  // Detectar raiz
  const root = detectRoot(files.map(f=&gt;f.path));
  PROJECT.files = files.map(f=&gt;({...f, clean: root?f.path.slice(root.length):f.path})).filter(f=&gt;f.clean);

  // Extrair dirs
  const dirs = new Set();
  for (const f of PROJECT.files) {
    const parts = f.clean.split('/');
    for (let i=1;i&lt;parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
  }
  PROJECT.dirs = [...dirs].sort();

  // Ler package.json
  const pkg = PROJECT.files.find(f=&gt;f.clean==='package.json'||f.clean.endsWith('/package.json')&amp;&amp;!f.clean.includes('node_modules'));
  if (pkg?.content) {
    try {
      const d = JSON.parse(pkg.content);
      PROJECT.name = d.name || file.name.replace('.zip','').replace(/[-_]/g,' ').trim();
      PROJECT.deps    = d.dependencies    || {};
      PROJECT.devDeps = d.devDependencies || {};
      PROJECT.scripts = d.scripts         || {};
    } catch{}
  }

  // Detectar tecnologias
  PROJECT.techs = detectTechs();
  PROJECT.type  = detectType();

  // Renderizar
  renderProjectType();
  renderDeps();
  renderPackageJson();
  renderCommands();
  renderTree();

  document.getElementById('result').style.display = 'block';
  drop.innerHTML = `&lt;div style=&quot;font-size:24px&quot;&gt;✅&lt;/div&gt;&lt;p style=&quot;font-size:13px;margin-top:6px;&quot;&gt;${file.name} — ${PROJECT.files.length} arquivos analisados&lt;/p&gt;`;
}

// ── Detectar raiz ────────────────────────────────────
function detectRoot(paths) {
  if (!paths.length) return '';
  const first = paths[0].split('/')[0];
  return paths.every(p=&gt;p.startsWith(first+'/')) ? first+'/' : '';
}

// ── Detectar tecnologias ─────────────────────────────
function detectTechs() {
  const paths = PROJECT.files.map(f=&gt;f.clean.toLowerCase());
  const all = {...PROJECT.deps,...PROJECT.devDeps};
  const techs = [];
  if (all['react'])           techs.push('React');
  if (all['react-native'])    techs.push('React Native');
  if (all['next'])            techs.push('Next.js');
  if (all['vite']||paths.some(p=&gt;p.includes('vite.config'))) techs.push('Vite');
  if (all['typescript']||paths.some(p=&gt;p.endsWith('.tsx')||p.endsWith('.ts'))) techs.push('TypeScript');
  if (all['tailwindcss'])     techs.push('Tailwind CSS');
  if (all['electron'])        techs.push('Electron');
  if (all['expo'])            techs.push('Expo');
  if (all['express'])         techs.push('Express');
  if (all['drizzle-orm'])     techs.push('Drizzle ORM');
  if (all['@supabase/supabase-js']) techs.push('Supabase');
  if (all['better-sqlite3']||all['@libsql/client']) techs.push('SQLite');
  if (all['@webcontainer/api']) techs.push('WebContainer');
  if (paths.some(p=&gt;p.endsWith('.py'))) techs.push('Python');
  if (paths.some(p=&gt;p.includes('electron/')||p.includes('electron\\'))) techs.push('Electron');
  return [...new Set(techs)];
}

function detectType() {
  const t = PROJECT.techs;
  if (t.includes('Expo')||t.includes('React Native')) return 'Mobile (Expo/React Native)';
  if (t.includes('Electron')) return 'Desktop (Electron)';
  if (t.includes('Next.js')) return 'Web Full-Stack (Next.js)';
  if (t.includes('React')&amp;&amp;t.includes('Express')) return 'Web Full-Stack (React + Express)';
  if (t.includes('React')) return 'Web Frontend (React/Vite)';
  if (t.includes('Express')) return 'Backend (Node.js/Express)';
  return 'Projeto Web';
}

// ── Renderizar tipo ──────────────────────────────────
function renderProjectType() {
  const el = document.getElementById('project-type');
  el.innerHTML = `
    &lt;p style=&quot;font-size:14px;font-weight:600;margin-bottom:8px;&quot;&gt;📌 ${PROJECT.type}&lt;/p&gt;
    &lt;p style=&quot;font-size:12px;color:#8b949e;margin-bottom:10px;&quot;&gt;Nome: &lt;strong style=&quot;color:#e6edf3;&quot;&gt;${PROJECT.name}&lt;/strong&gt;&lt;/p&gt;
    &lt;div style=&quot;display:flex;flex-wrap:wrap;gap:4px;&quot;&gt;
      ${PROJECT.techs.map(t=&gt;`&lt;span class=&quot;tag tag-dep&quot;&gt;${t}&lt;/span&gt;`).join('')||'&lt;span style=&quot;color:#8b949e;font-size:12px;&quot;&gt;Nenhuma tecnologia detectada&lt;/span&gt;'}
    &lt;/div&gt;
  `;
}

// ── Renderizar deps ──────────────────────────────────
function renderDeps() {
  const el = document.getElementById('deps-list');
  const allDeps = [
    ...Object.entries(PROJECT.deps).map(([n,v])=&gt;({n,v,type:'dep'})),
    ...Object.entries(PROJECT.devDeps).map(([n,v])=&gt;({n,v,type:'dev'})),
  ];

  if (!allDeps.length) { el.innerHTML='&lt;p style=&quot;font-size:12px;color:#8b949e;&quot;&gt;Nenhuma dependência encontrada no package.json&lt;/p&gt;'; return; }

  el.innerHTML = `
    &lt;p style=&quot;font-size:11px;color:#8b949e;margin-bottom:8px;&quot;&gt;${allDeps.length} dependências • Clique em &quot;Buscar versões no npm&quot; para ver as versões mais recentes&lt;/p&gt;
    &lt;div id=&quot;dep-rows&quot;&gt;
      ${allDeps.map(d=&gt;`
        &lt;div class=&quot;dep-item&quot; id=&quot;dep-${d.n.replace(/[@\/]/g,'_')}&quot;&gt;
          &lt;span class=&quot;dep-name&quot;&gt;${d.n}&lt;/span&gt;
          &lt;span class=&quot;dep-ver&quot; id=&quot;ver-${d.n.replace(/[@\/]/g,'_')}&quot;&gt;${d.v}&lt;/span&gt;
          &lt;span class=&quot;dep-type&quot; style=&quot;background:${d.type==='dep'?'#1f2a1f':'#1f1f2a'};color:${d.type==='dep'?'#3fb950':'#58a6ff'};&quot;&gt;${d.type==='dep'?'prod':'dev'}&lt;/span&gt;
          &lt;span class=&quot;dep-desc&quot; id=&quot;desc-${d.n.replace(/[@\/]/g,'_')}&quot;&gt;—&lt;/span&gt;
        &lt;/div&gt;`).join('')}
    &lt;/div&gt;
  `;
}

// ── Buscar versões no npm ────────────────────────────
window.searchAllNpm = async () =&gt; {
  const allDeps = [...Object.keys(PROJECT.deps),...Object.keys(PROJECT.devDeps)];
  const statusEl = document.getElementById('npm-status');
  statusEl.innerHTML = `&lt;span class=&quot;loading&quot;&gt;⏳&lt;/span&gt; Buscando ${allDeps.length} pacotes...`;

  let found=0, fail=0;
  const results = {};

  // Buscar em paralelo (lotes de 5)
  for (let i=0;i&lt;allDeps.length;i+=5) {
    const batch = allDeps.slice(i,i+5);
    await Promise.all(batch.map(async (pkg) =&gt; {
      try {
        const r = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg)}/latest`,{signal:AbortSignal.timeout(5000)});
        if (r.ok) {
          const d = await r.json();
          results[pkg] = { version: d.version||'latest', desc: (d.description||'').slice(0,60) };
          found++;
        } else { fail++; }
      } catch { fail++; }
      // Atualizar UI em tempo real
      const key = pkg.replace(/[@\/]/g,'_');
      const verEl = document.getElementById('ver-'+key);
      const descEl = document.getElementById('desc-'+key);
      if (verEl &amp;&amp; results[pkg]) {
        verEl.textContent = '^'+results[pkg].version;
        verEl.style.color = '#3fb950';
      }
      if (descEl &amp;&amp; results[pkg]?.desc) descEl.textContent = results[pkg].desc;
    }));
    statusEl.textContent = `Buscando... ${Math.min(i+5,allDeps.length)}/${allDeps.length}`;
  }

  // Atualizar package.json com versões novas
  for (const [pkg, info] of Object.entries(results)) {
    if (PROJECT.deps[pkg])    PROJECT.deps[pkg]    = '^'+info.version;
    if (PROJECT.devDeps[pkg]) PROJECT.devDeps[pkg] = '^'+info.version;
  }
  renderPackageJson();
  statusEl.textContent = `✅ ${found} encontrados · ${fail} não encontrados`;
};

// ── package.json ─────────────────────────────────────
function renderPackageJson() {
  const pkg = {
    name: PROJECT.name.toLowerCase().replace(/\s+/g,'-'),
    version: '1.0.0',
    private: true,
    scripts: PROJECT.scripts,
    dependencies: PROJECT.deps,
    devDependencies: PROJECT.devDeps,
  };
  if (!Object.keys(pkg.scripts).length) delete pkg.scripts;
  if (!Object.keys(pkg.dependencies).length) delete pkg.dependencies;
  if (!Object.keys(pkg.devDependencies).length) delete pkg.devDependencies;
  document.getElementById('pkg-out').value = JSON.stringify(pkg, null, 2);
}

// ── Comandos para recriar ────────────────────────────
function renderCommands() {
  const t = PROJECT.techs;
  const isTs = t.includes('TypeScript');
  const isReact = t.includes('React');
  const isVite = t.includes('Vite');
  const isNext = t.includes('Next.js');
  const isElectron = t.includes('Electron');
  const isExpo = t.includes('Expo');
  const isExpress = t.includes('Express');
  const isTailwind = t.includes('Tailwind CSS');
  const isSB = t.includes('Supabase');
  const isDrizzle = t.includes('Drizzle ORM');

  const sections = [];

  // 1. Criar projeto base
  sections.push({
    title: '1. CRIAR PROJETO BASE',
    cmds: isExpo
      ? [`npx create-expo-app ${PROJECT.name} --template blank-typescript`]
      : isNext
      ? [`npx create-next-app@latest ${PROJECT.name} --typescript --tailwind --eslint`]
      : isVite &amp;&amp; isReact
      ? [`npm create vite@latest ${PROJECT.name} -- --template ${isTs?'react-ts':'react'}`, `cd ${PROJECT.name}`]
      : [`mkdir ${PROJECT.name}`, `cd ${PROJECT.name}`, `npm init -y`]
  });

  // 2. Instalar dependências principais
  const prodDeps = Object.keys(PROJECT.deps).filter(d=&gt;!['react','react-dom','next'].includes(d));
  if (prodDeps.length) {
    sections.push({ title:'2. INSTALAR DEPENDÊNCIAS', cmds:[`npm install ${prodDeps.join(' ')}`] });
  }

  // 3. Dev dependencies
  const devDeps = Object.keys(PROJECT.devDeps).filter(d=&gt;!['typescript','@types/react','@types/react-dom','vite','@vitejs/plugin-react','tailwindcss'].includes(d));
  if (devDeps.length) {
    sections.push({ title:'3. INSTALAR DEV DEPENDENCIES', cmds:[`npm install -D ${devDeps.join(' ')}`] });
  }

  // 4. Configurar Tailwind
  if (isTailwind &amp;&amp; !isNext) {
    sections.push({ title:'4. CONFIGURAR TAILWIND', cmds:[
      'npm install -D tailwindcss postcss autoprefixer',
      'npx tailwindcss init -p',
    ]});
  }

  // 5. Configurar Electron
  if (isElectron) {
    sections.push({ title:'5. CONFIGURAR ELECTRON', cmds:[
      'npm install -D electron electron-builder',
      '(criar electron/main.js conforme estrutura original)',
    ]});
  }

  // 6. Configurar Drizzle
  if (isDrizzle) {
    sections.push({ title:'6. CONFIGURAR DRIZZLE ORM', cmds:[
      'npm install drizzle-orm @libsql/client',
      'npm install -D drizzle-kit',
      '(criar drizzle.config.ts e schema em lib/db/schema/)',
      'npx drizzle-kit push',
    ]});
  }

  // 7. Configurar Supabase
  if (isSB) {
    sections.push({ title:'7. CONFIGURAR SUPABASE', cmds:[
      'npm install @supabase/supabase-js',
      '(criar .env com VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY)',
      '(criar lib/supabase.ts com createClient)',
    ]});
  }

  // 8. Criar estrutura de pastas
  const importantDirs = PROJECT.dirs.filter(d=&gt;
    !d.startsWith('node_modules')&amp;&amp;!d.startsWith('dist')&amp;&amp;!d.startsWith('.git')&amp;&amp;d.includes('/')===false
  ).slice(0,15);
  if (importantDirs.length) {
    sections.push({ title:'8. CRIAR PASTAS', cmds: importantDirs.map(d=&gt;`mkdir ${d}`) });
  }

  // 9. Criar arquivos de configuração
  const cfgFiles = PROJECT.files.filter(f=&gt;
    ['tsconfig.json','vite.config.ts','vite.config.js','tailwind.config.ts','drizzle.config.ts','.env.example','postcss.config.js'].some(n=&gt;f.clean.endsWith(n))
  );
  if (cfgFiles.length) {
    sections.push({ title:'9. CRIAR ARQUIVOS DE CONFIG', cmds: cfgFiles.map(f=&gt;`(criar ${f.clean} — ver conteúdo original)`) });
  }

  // 10. Rodar projeto
  const devScript = PROJECT.scripts['dev']||PROJECT.scripts['start']||PROJECT.scripts['serve'];
  sections.push({ title:'10. RODAR PROJETO', cmds:[
    'npm install',
    devScript ? `npm run ${Object.keys(PROJECT.scripts).find(k=&gt;PROJECT.scripts[k]===devScript)||'dev'}` : 'npm run dev',
  ]});

  // Gerar texto do bat
  let bat = `@echo off\necho Replicando projeto: ${PROJECT.name}\n\n`;
  for (const sec of sections) {
    bat += `rem === ${sec.title} ===\n`;
    for (const cmd of sec.cmds) {
      if (cmd.startsWith('(')) bat += `rem ${cmd}\n`;
      else bat += `${cmd}\n`;
    }
    bat += '\n';
  }
  bat += `echo.\necho Projeto criado! Verifique os arquivos de configuracao.\npause`;
  document.getElementById('cmds-out').value = bat;
}

// ── Árvore ───────────────────────────────────────────
function renderTree() {
  const files = PROJECT.files.filter(f=&gt;
    !f.clean.startsWith('node_modules')&amp;&amp;!f.clean.startsWith('dist')&amp;&amp;!f.clean.startsWith('.git')
  );

  const tree = {};
  for (const f of files) {
    const parts = f.clean.split('/');
    let node = tree;
    for (let i=0;i&lt;parts.length-1;i++){
      if (!node[parts[i]]) node[parts[i]]={};
      node = node[parts[i]];
    }
    node[parts[parts.length-1]] = f;
  }

  const lines = [];
  function print(node, prefix='') {
    const keys = Object.keys(node).sort((a,b)=&gt;{
      const ad=typeof node[a]==='object'&amp;&amp;!node[a].path;
      const bd=typeof node[b]==='object'&amp;&amp;!node[b].path;
      return (bd-ad)||a.localeCompare(b);
    });
    keys.forEach((k,i)=&gt;{
      const last=i===keys.length-1;
      const c=last?'└─ ':'├─ ';
      const child=node[k];
      if (child?.path) lines.push(`${prefix}${c}📄 ${k}`);
      else { lines.push(`${prefix}${c}📁 ${k}/`); print(child, prefix+(last?'   ':'│  ')); }
    });
  }
  print(tree);
  document.getElementById('tree-out').textContent = lines.slice(0,200).join('\n')+(lines.length&gt;200?'\n... (truncado)':'');
}

// ── Utilitários ──────────────────────────────────────
function copyText(id) {
  const el=document.getElementById(id);
  const txt=el.tagName==='TEXTAREA'?el.value:el.textContent;
  navigator.clipboard.writeText(txt).then(()=&gt;toast('✅ Copiado!'));
}

function downloadText(id, fname) {
  const el=document.getElementById(id);
  const txt=el.tagName==='TEXTAREA'?el.value:el.textContent;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=fname; a.click();
}

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=&gt;t.style.display='none',2500);
}

            &lt;input type=&quot;number&quot; id=&quot;contextLimit&quot; value=&quot;8000&quot; min=&quot;1000&quot; max=&quot;200000&quot;&gt;

            &lt;label&gt;System Prompt&lt;/label&gt;
            &lt;textarea id=&quot;systemPrompt&quot;&gt;Você é um assistente especialista em programação. Gere código limpo, sem caracteres estranhos, comentado em português.&lt;/textarea&gt;
        &lt;/div&gt;

            &lt;button class=&quot;btn&quot; onclick=&quot;APP.Settings.close()&quot;&gt;Cancelar&lt;/button&gt;

&lt;input type=&quot;file&quot; id=&quot;fileImportCode&quot; style=&quot;display:none&quot; accept=&quot;.js,.py,.html,.css,.ts,.txt,.json,.md,.jsx,.tsx&quot;&gt;

&lt;script&gt;
'use strict';

const STATE = {
    conversations: {},
    activeConvId: null,
    codeTabs: [],
    activeCodeTab: 0,
    settings: {
        apiKey: '',
        anthropicKey: '',
        geminiKey: '',
        huggingfaceKey: '',
        cohereKey: '',
        togetherKey: '',
        ollamaUrl: 'http://localhost:11434',
        contextLimit: 8000,
        systemPrompt: '',
        provider: 'openai',
        model: '',
        temperature: 0.7,
        maxTokens: 2048
    },
    isLoading: false
};

const APP = {
    switchTab(name) {
        document.querySelectorAll('.tab-content').forEach(t =&gt; t.classList.remove('active'));
        document.querySelectorAll('.main-tab').forEach(t =&gt; t.classList.remove('active'));
        document.getElementById(name + 'Tab').classList.add('active');
        event.target.classList.add('active');
    },

    Provider: {
        MODELS: {
            openai:       ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'],
            anthropic:    ['claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5'],
            gemini:       ['gemini-1.5-pro', 'gemini-1.5-flash', 'gemini-2.0-flash'],
            groq:         ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768'],
            huggingface:  ['mistralai/Mistral-7B-Instruct-v0.1', 'meta-llama/Llama-2-7b-chat', 'gpt2'],
            cohere:       ['command-light', 'command', 'command-nightly'],
            together:     ['meta-llama/Llama-2-70b-chat-hf', 'mistralai/Mistral-7B-Instruct-v0.1'],
            ollama:       ['llama3.2', 'mistral', 'neural-chat', 'dolphin-mixtral']
        },

        onChange() {
            this.updateSelect();
        },

        updateSelect() {
            const provider = document.getElementById('aiProvider').value;
            const sel = document.getElementById('modelSelect');
            const models = this.MODELS[provider] || [];
            sel.innerHTML = models.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');
        }
    },

    Chat: {
        newChat() {
            const id = 'conv_' + Date.now();
            STATE.conversations[id] = {
                id,
                title: 'Nova Conversa',
                messages: [],
                createdAt: Date.now()
            };
            STATE.activeConvId = id;
            APP.Storage.save();
            this.renderConversations();
            this.loadConv(id);
            APP.UI.toast('✅ Novo chat iniciado!', 'success');
        },

        loadConv(id) {
            STATE.activeConvId = id;
            const conv = STATE.conversations[id];
            if (!conv) return;
            document.getElementById('convTitleEdit').value = conv.title;
            this.renderMessages(conv.messages);
            APP.Context.updateBar(conv.messages);
            this.renderConversations();
        },

        renameConv(title) {
            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv || !title.trim()) return;
            conv.title = title.trim();
            this.renderConversations();
            APP.Storage.save();
        },

        deleteConv(id, e) {
            e.stopPropagation();
            if (!confirm('Deletar esta conversa?')) return;
            delete STATE.conversations[id];
            if (STATE.activeConvId === id) {
                const keys = Object.keys(STATE.conversations);
                if (keys.length &gt; 0) this.loadConv(keys[keys.length - 1]);
                else this.newChat();
            }
            APP.Storage.save();
            this.renderConversations();
        },

        renderConversations() {
            const list = document.getElementById('convList');
            list.innerHTML = '';
            const convs = Object.values(STATE.conversations)
                .sort((a, b) =&gt; b.createdAt - a.createdAt);
            convs.forEach(conv =&gt; {
                const div = document.createElement('div');
                div.className = 'conv-item' + (conv.id === STATE.activeConvId ? ' active' : '');
                div.innerHTML = `
                    &lt;div style=&quot;flex:1;overflow:hidden&quot;&gt;
                        &lt;div class=&quot;conv-title&quot;&gt;${escapeHtml(conv.title)}&lt;/div&gt;
                        &lt;div class=&quot;conv-meta&quot;&gt;${conv.messages?.length || 0} msgs&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;span class=&quot;conv-delete&quot; onclick=&quot;APP.Chat.deleteConv('${conv.id}',event)&quot;&gt;✕&lt;/span&gt;
                `;
                div.onclick = (e) =&gt; {
                    if (e.target.classList.contains('conv-delete')) return;
                    this.loadConv(conv.id);
                };
                list.appendChild(div);
            });
        },

        renderMessages(messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            (messages || []).forEach(msg =&gt; this.appendMsg(msg));
            container.scrollTop = container.scrollHeight;
        },

        appendMsg(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            const emoji = msg.role === 'user' ? '👤' : '🤖';
            div.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('pt-BR') : '';
            div.innerHTML = `
                &lt;div class=&quot;avatar&quot;&gt;${emoji}&lt;/div&gt;
                &lt;div class=&quot;bubble&quot;&gt;
                    ${formatMessage(msg.content)}
                    ${time ? `&lt;div class=&quot;msg-time&quot;&gt;${time}&lt;/div&gt;` : ''}
                &lt;/div&gt;
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        },

        async send() {
            if (STATE.isLoading) return;
            const input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;

            const codeMode = document.getElementById('codeMode').checked;
            const codeContent = document.getElementById('codeEditor').value.trim();
            if (codeMode &amp;&amp; codeContent) {
                const lang = document.getElementById('codeLang').value;
                text += `\n\n**Código no editor:**\n\`\`\`${lang}\n${codeContent}\n\`\`\``;
            }

            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv) { this.newChat(); return; }

            const userMsg = { role: 'user', content: text, timestamp: Date.now() };
            conv.messages.push(userMsg);
            this.appendMsg(userMsg);

            if (conv.messages.length === 1) {
                conv.title = text.substring(0, 45) + (text.length &gt; 45 ? '...' : '');
                document.getElementById('convTitleEdit').value = conv.title;
                this.renderConversations();
            }

            input.value = '';
            APP.UI.autoResize(input);
            APP.Context.updateBar(conv.messages);

            STATE.isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const reply = await APP.AI.call(conv.messages);
                const aiMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
                conv.messages.push(aiMsg);
                this.appendMsg(aiMsg);
                APP.Context.updateBar(conv.messages);
                APP.Storage.save();
            } catch(err) {
                const errMsg = { role: 'assistant', content: `❌ Erro: ${err.message}`, timestamp: Date.now() };
                conv.messages.push(errMsg);
                this.appendMsg(errMsg);
                APP.UI.toast('❌ ' + err.message, 'error');
            }

            STATE.isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }
    },

    Context: {
        estimateTokens(messages) {
            return Math.ceil((messages || []).reduce((a, m) =&gt; a + (m.content?.length || 0), 0) / 4);
        },

        updateBar(messages) {
            const tokens = this.estimateTokens(messages);
            const limit = parseInt(STATE.settings.contextLimit) || 8000;
            const pct = Math.min(100, (tokens / limit) * 100);
            document.getElementById('tokenCount').textContent = tokens.toLocaleString('pt-BR');
            const fill = document.getElementById('contextFill');
            fill.style.width = pct + '%';
            fill.style.background = pct &gt; 80 ? 'var(--red)' : pct &gt; 55 ? 'var(--yellow)' : 'var(--green)';
        },

        clear() {
            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv) return;
            if (!confirm('Limpar contexto?')) return;
            conv.messages = [];
            APP.Chat.renderMessages([]);
            this.updateBar([]);
            APP.Storage.save();
            APP.UI.toast('✂️ Contexto limpo!', 'success');
        }
    },

    AI: {
        async call(messages) {
            const { provider, model } = this.current();
            const s = STATE.settings;
            const temp = parseFloat(document.getElementById('tempSlider').value);
            const maxT = parseInt(document.getElementById('maxTokens').value);

            const msgs = [{
                role: 'system',
                content: s.systemPrompt || 'Você é um assistente especialista em programação.'
            }, ...messages.map(m =&gt; ({
                role: m.role === 'assistant' ? 'assistant' : 'user',
                content: m.content
            }))];

            switch (provider) {
                case 'openai': return await this.openai(msgs, model, s.apiKey, temp, maxT);
                case 'anthropic': return await this.anthropic(msgs, model, s.anthropicKey, temp, maxT);
                case 'gemini': return await this.gemini(msgs, model, s.geminiKey, temp, maxT);
                case 'groq': return await this.groq(msgs, model, s.apiKey, temp, maxT);
                case 'huggingface': return await this.huggingface(msgs, model, s.huggingfaceKey, temp, maxT);
                case 'cohere': return await this.cohere(msgs, model, s.cohereKey, temp, maxT);
                case 'together': return await this.together(msgs, model, s.togetherKey, temp, maxT);
                case 'ollama': return await this.ollama(msgs, model, temp, maxT);
                default: throw new Error('Provider não suportado');
            }
        },

        current() {
            return {
                provider: document.getElementById('aiProvider').value,
                model: document.getElementById('modelSelect').value
            };
        },

        async openai(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key OpenAI não configurada!');
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) {
                const err = await res.json().catch(() =&gt; ({}));
                throw new Error(err.error?.message || `HTTP ${res.status}`);
            }
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async anthropic(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Anthropic não configurada!');
            const system = messages.find(m =&gt; m.role === 'system')?.content || '';
            const msgs = messages.filter(m =&gt; m.role !== 'system');
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({ model, messages: msgs, system, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.content[0].text;
        },

        async gemini(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Gemini não configurada!');
            const contents = messages
                .filter(m =&gt; m.role !== 'system')
                .map(m =&gt; ({
                    role: m.role === 'assistant' ? 'model' : 'user',
                    parts: [{ text: m.content }]
                }));
            const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents,
                        generationConfig: { temperature: temp, maxOutputTokens: maxTokens }
                    })
                }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        },

        async groq(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Groq não configurada!');
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async huggingface(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('HuggingFace Token não configurado!');
            const text = messages.map(m =&gt; `${m.role}: ${m.content}`).join('\n');
            const res = await fetch('https://api-inference.huggingface.co/models/' + model, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: text,
                    parameters: { temperature: temp, max_length: maxTokens }
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return Array.isArray(data) ? data[0].generated_text : data.generated_text;
        },

        async cohere(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('Cohere API Key não configurada!');
            const text = messages.map(m =&gt; m.content).join('\n');
            const res = await fetch('https://api.cohere.com/v1/generate', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: text,
                    temperature: temp,
                    max_tokens: maxTokens,
                    model: model
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.generations[0].text;
        },

        async together(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('Together AI Key não configurada!');
            const res = await fetch('https://api.together.xyz/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model,
                    messages,
                    temperature: temp,
                    max_tokens: maxTokens
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async ollama(messages, model, temp, maxTokens) {
            const url = STATE.settings.ollamaUrl || 'http://localhost:11434';
            const res = await fetch(`${url}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    messages: messages.map(m =&gt; ({ role: m.role, content: m.content })),
                    options: { temperature: temp, num_predict: maxTokens },
                    stream: false
                })
            });
            if (!res.ok) throw new Error(`Ollama HTTP ${res.status}`);
            const data = await res.json();
            return data.message.content;
        }
    },

    Playground: {
        newTab(name = null) {
            const tab = {
                id: 'tab_' + Date.now(),
                name: name || `código_${STATE.codeTabs.length + 1}`,
                content: '',
                language: 'html'
            };
            STATE.codeTabs.push(tab);
            STATE.activeCodeTab = STATE.codeTabs.length - 1;
            this.renderTabs();
            this.loadTab(STATE.activeCodeTab);
            APP.Storage.save();
        },

        renderTabs() {
            const container = document.getElementById('codeTabs');
            container.innerHTML = '';
            STATE.codeTabs.forEach((tab, i) =&gt; {
                const div = document.createElement('div');
                div.className = 'code-tab' + (i === STATE.activeCodeTab ? ' active' : '');
                div.innerHTML = `
                    &lt;span onclick=&quot;APP.Playground.switchTab(${i})&quot;&gt;${escapeHtml(tab.name)}&lt;/span&gt;
                    &lt;span class=&quot;code-tab-close&quot; onclick=&quot;APP.Playground.closeTab(${i},event)&quot;&gt;✕&lt;/span&gt;
                `;
                container.appendChild(div);
            });
        },

        switchTab(i) {
            this.saveCurrentTab();
            STATE.activeCodeTab = i;
            this.loadTab(i);
            this.renderTabs();
        },

        closeTab(i, e) {
            e.stopPropagation();
            if (STATE.codeTabs.length === 1) { APP.UI.toast('Mínimo 1 tab', 'error'); return; }
            STATE.codeTabs.splice(i, 1);
            if (STATE.activeCodeTab &gt;= STATE.codeTabs.length) STATE.activeCodeTab = STATE.codeTabs.length - 1;
            this.renderTabs();
            this.loadTab(STATE.activeCodeTab);
            APP.Storage.save();
        },

        loadTab(i) {
            const tab = STATE.codeTabs[i];
            if (!tab) return;
            document.getElementById('codeEditor').value = tab.content;
            document.getElementById('codeLang').value = tab.language || 'html';
        },

        saveCurrentTab() {
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            if (!tab) return;
            tab.content = document.getElementById('codeEditor').value;
            tab.language = document.getElementById('codeLang').value;
        },

        copyClean() {
            this.saveCurrentTab();
            const code = cleanCode(document.getElementById('codeEditor').value);
            navigator.clipboard.writeText(code).then(() =&gt; {
                APP.UI.toast('✅ Código copiado!', 'success');
            }).catch(() =&gt; {
                APP.UI.toast('❌ Erro ao copiar', 'error');
            });
        },

        paste() {
            navigator.clipboard.readText().then(text =&gt; {
                const editor = document.getElementById('codeEditor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const before = editor.value.substring(0, start);
                const after = editor.value.substring(end);
                editor.value = before + text + after;
                editor.selectionStart = editor.selectionEnd = start + text.length;
                this.saveCurrentTab();
                APP.UI.toast('📌 Código colado!', 'success');
            }).catch(() =&gt; {
                APP.UI.toast('❌ Erro ao colar', 'error');
            });
        },

        sendToChat() {
            this.saveCurrentTab();
            const code = document.getElementById('codeEditor').value.trim();
            const lang = document.getElementById('codeLang').value;
            if (!code) { APP.UI.toast('Editor vazio!', 'error'); return; }
            const input = document.getElementById('userInput');
            input.value = `Analise este código:\n\`\`\`${lang}\n${code}\n\`\`\``;
            APP.UI.autoResize(input);
            APP.switchTab('chat');
            input.focus();
        },

        clear() {
            if (!confirm('Limpar editor?')) return;
            document.getElementById('codeEditor').value = '';
            this.saveCurrentTab();
        },

        download() {
            this.saveCurrentTab();
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            const code = cleanCode(tab.content);
            const extMap = {
                javascript: 'js', python: 'py', html: 'html', css: 'css',
                typescript: 'ts', text: 'txt'
            };
            const ext = extMap[tab.language] || 'txt';
            APP.Storage._download(code, `${tab.name}.${ext}`, 'text/plain');
            APP.UI.toast('⬇️ Download iniciado!', 'success');
        },

        updatePreview() {
            this.saveCurrentTab();
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            const lang = tab.language;
            const content = tab.content;
            const preview = document.getElementById('previewContent');

            if (lang === 'html') {
                const iframe = document.createElement('iframe');
                iframe.className = 'preview-frame';
                iframe.sandbox = 'allow-scripts allow-same-origin allow-forms';
                preview.innerHTML = '';
                preview.appendChild(iframe);
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(content);
                doc.close();
            } else {
                preview.innerHTML = `&lt;div class=&quot;preview-placeholder&quot;&gt;Preview disponível apenas para HTML&lt;/div&gt;`;
            }
        }
    },

    Settings: {
        open() {
            const s = STATE.settings;
            document.getElementById('apiKeyInput').value = s.apiKey || '';
            document.getElementById('anthropicKeyInput').value = s.anthropicKey || '';
            document.getElementById('geminiKeyInput').value = s.geminiKey || '';
            document.getElementById('huggingfaceKeyInput').value = s.huggingfaceKey || '';
            document.getElementById('cohereKeyInput').value = s.cohereKey || '';
            document.getElementById('togetherKeyInput').value = s.togetherKey || '';
            document.getElementById('ollamaUrl').value = s.ollamaUrl || 'http://localhost:11434';
            document.getElementById('contextLimit').value = s.contextLimit || 8000;
            document.getElementById('systemPrompt').value = s.systemPrompt || '';
            document.getElementById('settingsModal').classList.add('open');
        },

        close() {
            document.getElementById('settingsModal').classList.remove('open');
        },

        save() {
            const s = STATE.settings;
            s.apiKey = document.getElementById('apiKeyInput').value;
            s.anthropicKey = document.getElementById('anthropicKeyInput').value;
            s.geminiKey = document.getElementById('geminiKeyInput').value;
            s.huggingfaceKey = document.getElementById('huggingfaceKeyInput').value;
            s.cohereKey = document.getElementById('cohereKeyInput').value;
            s.togetherKey = document.getElementById('togetherKeyInput').value;
            s.ollamaUrl = document.getElementById('ollamaUrl').value;
            s.contextLimit = parseInt(document.getElementById('contextLimit').value);
            s.systemPrompt = document.getElementById('systemPrompt').value;
            s.provider = document.getElementById('aiProvider').value;
            s.model = document.getElementById('modelSelect').value;
            s.temperature = parseFloat(document.getElementById('tempSlider').value);
            s.maxTokens = parseInt(document.getElementById('maxTokens').value);
            APP.Storage.save();
            this.close();
            APP.UI.toast('✅ Configurações salvas!', 'success');
        }
    },

    Storage: {
        save() {
            try {
                localStorage.setItem('aiStudio_v3', JSON.stringify({
                    conversations: STATE.conversations,
                    activeConvId: STATE.activeConvId,
                    codeTabs: STATE.codeTabs,
                    activeCodeTab: STATE.activeCodeTab,
                    settings: STATE.settings
                }));
            } catch(e) {
                APP.UI.toast('⚠️ Erro ao salvar', 'error');
            }
        },

        load() {
            try {
                const raw = localStorage.getItem('aiStudio_v3');
                if (!raw) return;
                const d = JSON.parse(raw);
                STATE.conversations = d.conversations || {};
                STATE.activeConvId = d.activeConvId || null;
                STATE.codeTabs = d.codeTabs || [];
                STATE.activeCodeTab = d.activeCodeTab || 0;
                if (d.settings) STATE.settings = { ...STATE.settings, ...d.settings };
            } catch(e) {
                console.error('Erro ao carregar:', e);
            }
        },

        exportAll() {
            const data = {
                exportedAt: new Date().toISOString(),
                conversations: STATE.conversations,
                codeTabs: STATE.codeTabs,
                settings: { ...STATE.settings, apiKey: '***', anthropicKey: '***', geminiKey: '***', huggingfaceKey: '***', cohereKey: '***', togetherKey: '***' }
            };
            this._download(JSON.stringify(data, null, 2), `backup-${Date.now()}.json`, 'application/json');
            APP.UI.toast('💾 Backup exportado!', 'success');
        },

        _download(content, filename, type) {
            const blob = new Blob([content], { type });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }
    },

    UI: {
        toast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = `toast show ${type}`;
            clearTimeout(el._t);
            el._t = setTimeout(() =&gt; { el.className = 'toast'; }, 3000);
        },

        autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 180) + 'px';
        },

        handleKey(e) {
            if (e.ctrlKey &amp;&amp; e.key === 'Enter') {
                e.preventDefault();
                APP.Chat.send();
            }
        }
    }
};

function escapeHtml(text) {
    return String(text)
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/&lt;/g, '&amp;lt;')
        .replace(/&gt;/g, '&amp;gt;')
        .replace(/&quot;/g, '&amp;quot;');
}

function cleanCode(code) {
    return String(code)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\u00A0/g, ' ')
        .trim();
}

function formatMessage(text) {
    text = String(text);
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =&gt; {
        const clean = escapeHtml(cleanCode(code.trim()));
        return `&lt;pre&gt;&lt;button class=&quot;copy-code-btn&quot; onclick=&quot;copyCodeBlock(this)&quot;&gt;📋 Copiar&lt;/button&gt;&lt;code&gt;${clean}&lt;/code&gt;&lt;/pre&gt;`;
    });
    text = text.replace(/\*\*(.*?)\*\*/g, '&lt;strong&gt;$1&lt;/strong&gt;');
    text = text.replace(/`([^`]+)`/g, '&lt;code style=&quot;background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:monospace&quot;&gt;$1&lt;/code&gt;');
    text = text.replace(/\n/g, '&lt;br&gt;');
    return text;
}

function copyCodeBlock(btn) {
    const code = cleanCode(btn.nextElementSibling.textContent);
    navigator.clipboard.writeText(code).then(() =&gt; {
        btn.textContent = '✅ Copiado!';
        setTimeout(() =&gt; btn.textContent = '📋 Copiar', 2000);
    });
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
});

document.getElementById('fileImportCode').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) =&gt; {
        const content = evt.target.result;
        const editor = document.getElementById('codeEditor');
        editor.value = content;
        const ext = file.name.split('.').pop().toLowerCase();
        const langMap = { js: 'javascript', py: 'python', html: 'html', css: 'css', ts: 'typescript', txt: 'text', jsx: 'javascript', tsx: 'typescript', md: 'text', json: 'text' };
        document.getElementById('codeLang').value = langMap[ext] || 'text';
        APP.Playground.saveCurrentTab();
        APP.UI.toast(`📂 ${file.name} importado!`, 'success');
    };
    reader.readAsText(file);
    e.target.value = '';
});

document.getElementById('tempSlider').addEventListener('input', function() {
    document.getElementById('tempVal').textContent = this.value;
});

function INIT() {
    APP.Storage.load();
    APP.Provider.updateSelect();

    if (STATE.activeConvId &amp;&amp; STATE.conversations[STATE.activeConvId]) {
        APP.Chat.loadConv(STATE.activeConvId);
    } else {
        APP.Chat.newChat();
    }

    if (STATE.codeTabs.length === 0) {
        APP.Playground.newTab();
    } else {
        APP.Playground.renderTabs();
        APP.Playground.loadTab(STATE.activeCodeTab);
    }

    APP.UI.toast('🚀 AI Code Studio + Playground pronto!', 'success');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', INIT);
} else {
    INIT();
}
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe>

<script>
function trocarProjeto(index) {
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  localStorage.setItem('ultimo-projeto', index);
}

window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
