&lt;script&gt;
// ============================================================
// PREVIEW DE ÍCONE
// ============================================================
function updateIconPreview() {
    const emoji = document.getElementById('appEmoji').value || '🚀';
    const bg = document.getElementById('iconBg').value;
    const sizes = [48, 72, 96, 192];
    const preview = document.getElementById('iconPreview');
    preview.innerHTML = '';

    sizes.forEach(size =&gt; {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fundo
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.roundRect(0, 0, size, size, size * 0.2);
        ctx.fill();

        // Emoji/texto
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${size * 0.55}px serif`;
        ctx.fillText(emoji, size / 2, size / 2);

        const box = document.createElement('div');
        box.className = 'icon-box';
        box.appendChild(canvas);
        box.innerHTML += `${size}×${size}`;
        preview.appendChild(box);
    });
}

// ============================================================
// GERAR MANIFEST
// ============================================================
function generateManifest() {
    const name = document.getElementById('appName').value || 'Meu App';
    const short = document.getElementById('appShort').value || 'App';
    const desc = document.getElementById('appDesc').value || '';
    const theme = document.getElementById('themeColor').value;
    const bg = document.getElementById('iconBg').value;
    const cat = document.getElementById('appCategory').value;

    return JSON.stringify({
        name,
        short_name: short,
        description: desc,
        start_url: &quot;./index.html&quot;,
        display: &quot;standalone&quot;,
        orientation: &quot;any&quot;,
        background_color: bg,
        theme_color: theme,
        lang: &quot;pt-BR&quot;,
        scope: &quot;./&quot;,
        categories: [cat],
        icons: [
            { src: &quot;icon-48.png&quot;,  sizes: &quot;48x48&quot;,   type: &quot;image/png&quot;, purpose: &quot;any maskable&quot; },
            { src: &quot;icon-72.png&quot;,  sizes: &quot;72x72&quot;,   type: &quot;image/png&quot;, purpose: &quot;any maskable&quot; },
            { src: &quot;icon-96.png&quot;,  sizes: &quot;96x96&quot;,   type: &quot;image/png&quot;, purpose: &quot;any maskable&quot; },
            { src: &quot;icon-192.png&quot;, sizes: &quot;192x192&quot;, type: &quot;image/png&quot;, purpose: &quot;any maskable&quot; },
            { src: &quot;icon-512.png&quot;, sizes: &quot;512x512&quot;, type: &quot;image/png&quot;, purpose: &quot;any maskable&quot; }
        ],
        screenshots: [],
        prefer_related_applications: false
    }, null, 2);
}

// ============================================================
// GERAR SERVICE WORKER
// ============================================================
function generateSW() {
    const name = (document.getElementById('appName').value || 'app').replace(/\s+/g, '-').toLowerCase();
    return `// Service Worker — ${document.getElementById('appName').value || 'Meu App'}
// Gerado pelo PWA Builder
const CACHE_NAME = '${name}-v1';
const ASSETS = [
  './',
  './index.html',
  './manifest.json',
  './icon-192.png',
  './icon-512.png'
];

// Instalar: salva os arquivos no cache
self.addEventListener('install', event =&gt; {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache =&gt; {
      console.log('[SW] Cache criado');
      return cache.addAll(ASSETS);
    })
  );
  self.skipWaiting();
});

// Ativar: limpa caches antigos
self.addEventListener('activate', event =&gt; {
  event.waitUntil(
    caches.keys().then(keys =&gt;
      Promise.all(
        keys.filter(k =&gt; k !== CACHE_NAME).map(k =&gt; caches.delete(k))
      )
    )
  );
  self.clients.claim();
});

// Interceptar requisições — cache first
self.addEventListener('fetch', event =&gt; {
  event.respondWith(
    caches.match(event.request).then(cached =&gt; {
      if (cached) return cached;
      return fetch(event.request).then(response =&gt; {
        if (!response || response.status !== 200 || response.type !== 'basic') {
          return response;
        }
        const clone = response.clone();
        caches.open(CACHE_NAME).then(cache =&gt; cache.put(event.request, clone));
        return response;
      }).catch(() =&gt; caches.match('./index.html'));
    })
  );
});
`;
}

// ============================================================
// GERAR HTML COMPLETO
// ============================================================
function generateHTML() {
    const name = document.getElementById('appName').value || 'Meu App';
    const theme = document.getElementById('themeColor').value;
    const userHTML = document.getElementById('htmlCode').value.trim();

    if (userHTML) {
        // Injetar tags PWA no HTML existente
        let html = userHTML;

        // Remover &lt;/head&gt; existente e injetar antes
        const pwaHead = `
  &lt;!-- PWA: Gerado pelo PWA Builder --&gt;
  &lt;link rel=&quot;manifest&quot; href=&quot;./manifest.json&quot;&gt;
  &lt;meta name=&quot;theme-color&quot; content=&quot;${theme}&quot;&gt;
  &lt;meta name=&quot;mobile-web-app-capable&quot; content=&quot;yes&quot;&gt;
  &lt;meta name=&quot;apple-mobile-web-app-capable&quot; content=&quot;yes&quot;&gt;
  &lt;meta name=&quot;apple-mobile-web-app-status-bar-style&quot; content=&quot;black-translucent&quot;&gt;
  &lt;meta name=&quot;apple-mobile-web-app-title&quot; content=&quot;${name}&quot;&gt;
  &lt;link rel=&quot;apple-touch-icon&quot; href=&quot;./icon-192.png&quot;&gt;
  &lt;script&gt;
    if ('serviceWorker' in navigator) {

// ============================================================
// GERAR ÍCONE PNG (canvas → blob)
// ============================================================
function generateIconBlob(size) {
    return new Promise(resolve =&gt; {
        const emoji = document.getElementById('appEmoji').value || '🚀';
        const bg = document.getElementById('iconBg').value;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = bg;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(0, 0, size, size, size * 0.2);
        else ctx.rect(0, 0, size, size);
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${size * 0.55}px serif`;
        ctx.fillText(emoji, size / 2, size / 2);
        canvas.toBlob(blob =&gt; resolve(blob), 'image/png');
    });
}

// ============================================================
// DOWNLOAD HELPERS
// ============================================================
function downloadFile(content, filename, type = 'text/plain') {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function downloadManifest() {
    downloadFile(generateManifest(), 'manifest.json', 'application/json');
    showAlert('success', '✅ manifest.json baixado!');
}

function downloadSW() {
    downloadFile(generateSW(), 'service-worker.js', 'application/javascript');
    showAlert('success', '✅ service-worker.js baixado!');
}

function downloadHTML() {
    downloadFile(generateHTML(), 'index.html', 'text/html');
    showAlert('success', '✅ index.html baixado com tags PWA!');
}

async function generateAll() {
    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');

    const steps = [
        { pct: 20, label: 'Gerando manifest.json...' },

        { pct: 60, label: 'Gerando index.html...' },
        { pct: 80, label: 'Gerando ícones...' },
        { pct: 100, label: 'Concluído!' },
    ];

    for (const step of steps) {
        fill.style.width = step.pct + '%';
        showAlert('info', '⚙️ ' + step.label);
        await new Promise(r =&gt; setTimeout(r, 300));
    }

    // Downloads automáticos com delay
    setTimeout(() =&gt; downloadFile(generateManifest(), 'manifest.json', 'application/json'), 100);
    setTimeout(() =&gt; downloadFile(generateSW(), 'service-worker.js', 'application/javascript'), 400);
    setTimeout(() =&gt; downloadFile(generateHTML(), 'index.html', 'text/html'), 700);

    // Ícones
    const iconSizes = [48, 72, 96, 192, 512];
    for (let i = 0; i &lt; iconSizes.size; i++) {

async function analyze(input) {
  if (input.files[0]) runAnalysis(input.files[0]);
}

async function runAnalysis(file) {
  drop.innerHTML = '&lt;div class=&quot;icon&quot;&gt;⏳&lt;/div&gt;&lt;h2&gt;Analisando...&lt;/h2&gt;';

  const zip = await JSZip.loadAsync(file);
  const entries = [];

  for (const [name, entry] of Object.entries(zip.files)) {
    if (entry.dir) continue;
    const ext = (name.split('.').pop()||'').toLowerCase();
    const textExts = new Set(['html','htm','css','js','ts','jsx','tsx','json','md','txt','py','svg','xml','sh','bat','yaml','yml','env','toml','ini','cjs','mjs']);
    let content = null;
    if (textExts.has(ext)) {
      try { content = await entry.async('text'); } catch{}
    }
    entries.push({ path: name, ext, content, size: content ? content.length : 0, lines: content ? content.split('\n').length : 0 });
  }

  entries.sort((a,b) =&gt; a.path.localeCompare(b.path));

  // Detectar raiz
  const rootPrefix = detectRoot(entries.map(e=&gt;e.path));
  const clean = entries.map(e =&gt; ({...e, clean: rootPrefix ? e.path.slice(rootPrefix.length) : e.path})).filter(e=&gt;e.clean);

  buildStats(clean, file.name);
  buildTree(clean);
  buildPlano(clean, file.name);
  buildCommands(clean);
  buildFilesContent(clean);

  document.getElementById('result').style.display = 'block';
  drop.innerHTML = `&lt;div class=&quot;icon&quot;&gt;✅&lt;/div&gt;&lt;h2&gt;${file.name} analisado&lt;/h2&gt;&lt;p&gt;${clean.length} arquivos processados&lt;/p&gt;`;
}

function detectRoot(paths) {
  if (!paths.length) return '';
  const first = paths[0].split('/')[0];
  if (paths.every(p =&gt; p.startsWith(first+'/'))) return first+'/';
  return '';
}

function buildStats(entries, fileName) {
  const byExt = {};
  let totalLines = 0, textFiles = 0;
  for (const e of entries) {
    byExt[e.ext] = (byExt[e.ext]||0)+1;
    if (e.content) { totalLines+=e.lines; textFiles++; }
  }
  const top = Object.entries(byExt).sort((a,b)=&gt;b[1]-a[1]).slice(0,5);
  document.getElementById('stats').innerHTML = `
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${entries.length}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;arquivos&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${textFiles}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;com código&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${totalLines.toLocaleString()}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;linhas totais&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${top.map(([ext,n])=&gt;`${ext}(${n})`).join(' · ')}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;extensões&lt;/div&gt;&lt;/div&gt;
  `;
}

function buildTree(entries) {
  const dirs = new Set();
  for (const e of entries) {
    const parts = e.clean.split('/');
    for (let i=1;i&lt;parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
  }

  const lines = [];
  const extBadge = ext =&gt; {
    const map={js:'js',ts:'js',jsx:'js',tsx:'js',html:'html',htm:'html',css:'css',py:'py',json:'json'};
    return map[ext]||'';
  };

  // Construir árvore simples
  const tree = {};
  for (const e of entries) {
    const parts = e.clean.split('/');
    let node = tree;
    for (let i=0;i&lt;parts.length-1;i++) {
      if (!node[parts[i]]) node[parts[i]] = {};
      node = node[parts[i]];
    }
    node[parts[parts.length-1]] = e;
  }

  function printTree(node, prefix='') {
    const keys = Object.keys(node).sort((a,b) =&gt; {
      const aIsDir = typeof node[a]==='object'&amp;&amp;!node[a].path;
      const bIsDir = typeof node[b]==='object'&amp;&amp;!node[b].path;
      if (aIsDir&amp;&amp;!bIsDir) return -1;
      if (!aIsDir&amp;&amp;bIsDir) return 1;
      return a.localeCompare(b);
    });
    keys.forEach((k,i) =&gt; {
      const isLast = i===keys.length-1;
      const conn = isLast?'└─ ':'├─ ';
      const child = node[k];
      if (child&amp;&amp;child.path) {
        const b = extBadge(child.ext);
        const info = child.content ? ` (${child.lines} linhas)` : '';
        lines.push(`${prefix}${conn}📄 ${k}${info}`);
      } else {
        lines.push(`${prefix}${conn}📁 ${k}/`);
        printTree(child, prefix+(isLast?'   ':'│  '));
      }
    });
  }

  printTree(tree);
  document.getElementById('tree-out').textContent = lines.join('\n');
}

function buildPlano(entries, fileName) {
  const projectName = fileName.replace('.zip','').replace(/[-_]/g,' ');
  const byExt = {};
  let totalLines=0;
  for(const e of entries){byExt[e.ext]=(byExt[e.ext]||0)+1;if(e.content)totalLines+=e.lines;}
  const techs = detectTechs(entries);
  const structure = describeStructure(entries);

  const plano = `# PLANO DO PROJETO — ${projectName.toUpperCase()}
Gerado em: ${new Date().toLocaleString('pt-BR')}

## VISÃO GERAL
- Total de arquivos: ${entries.length}
- Total de linhas de código: ${totalLines.toLocaleString()}
- Tecnologias detectadas: ${techs.join(', ')||'—'}

## EXTENSÕES
${Object.entries(byExt).sort((a,b)=&gt;b[1]-a[1]).map(([ext,n])=&gt;`- .${ext}: ${n} arquivo(s)`).join('\n')}

## ESTRUTURA DO PROJETO
${structure}

## ARQUIVOS PRINCIPAIS
${getKeyFiles(entries).map(e=&gt;`### ${e.clean}
- Linhas: ${e.lines}
- Função provável: ${guessFunction(e)}
`).join('\n')}

## DEPENDÊNCIAS DETECTADAS
${getDeps(entries)}

## SCRIPTS DISPONÍVEIS
${getScripts(entries)}

## COMO RECRIAR
1. Extraia o ZIP original na pasta desejada
2. Execute o arquivo criar_estrutura.bat gerado
3. Rode npm install (se projeto Node.js)
4. Configure as variáveis de ambiente (.env)
5. Execute o comando de desenvolvimento

## OBSERVAÇÕES
${getObservations(entries)}
`;

  document.getElementById('plano-out').value = plano;
}

function buildCommands(entries) {
  const dirs = new Set();
  for(const e of entries){
    const parts=e.clean.split('/');
    for(let i=1;i&lt;parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
  }

  let cmd = `@echo off\necho Criando estrutura do projeto...\n\n`;

  // Criar pastas
  const sortedDirs = [...dirs].sort();
  if (sortedDirs.length) {
    cmd += `rem === PASTAS ===\n`;
    for(const d of sortedDirs) cmd += `mkdir &quot;${d.replace(/\//g,'\\')}&quot; 2&gt;nul\n`;
    cmd += '\n';
  }

  // Criar arquivos vazios
  cmd += `rem === ARQUIVOS ===\n`;
  for(const e of entries){
    const winPath = e.clean.replace(/\//g,'\\');
    cmd += `type nul &gt; &quot;${winPath}&quot;\n`;
  }

  cmd += `\necho Estrutura criada com sucesso!\npause`;

  document.getElementById('cmds-out').textContent = cmd;
}

function buildFilesContent(entries) {
  const key = getKeyFiles(entries);
  let out = '';
  for (const e of key) {
    if (!e.content) continue;
    out += `\n${'═'.repeat(60)}\n`;
    out += `ARQUIVO: ${e.clean}\n`;
    out += `LINHAS: ${e.lines} | TAMANHO: ${(e.size/1024).toFixed(1)}KB\n`;
    out += `${'═'.repeat(60)}\n\n`;
    out += e.content.slice(0, 3000);
    if (e.content.length &gt; 3000) out += '\n\n... [truncado — arquivo grande]';
    out += '\n';
  }
  document.getElementById('files-out').value = out.trim();
}

// ── Helpers de análise ──────────────────────────────────────
function detectTechs(entries) {
  const techs = [];
  const paths = entries.map(e=&gt;e.clean);
  const hasPkg = entries.find(e=&gt;e.clean.endsWith('package.json'));

  if (paths.some(p=&gt;p.endsWith('vite.config.ts')||p.endsWith('vite.config.js'))) techs.push('Vite');
  if (paths.some(p=&gt;p.endsWith('next.config.js')||p.endsWith('next.config.ts'))) techs.push('Next.js');
  if (paths.some(p=&gt;p.includes('tsconfig'))) techs.push('TypeScript');
  if (paths.some(p=&gt;p.endsWith('.tsx')||p.endsWith('.jsx'))) techs.push('React');
  if (paths.some(p=&gt;p.endsWith('tailwind.config')||p.includes('tailwindcss'))) techs.push('Tailwind CSS');
  if (paths.some(p=&gt;p.includes('electron')||p.includes('Electron'))) techs.push('Electron');
  if (paths.some(p=&gt;p.endsWith('app.json')||p.endsWith('eas.json'))) techs.push('Expo/React Native');
  if (paths.some(p=&gt;p.endsWith('supabase.ts')||p.includes('supabase'))) techs.push('Supabase');
  if (paths.some(p=&gt;p.endsWith('.py'))) techs.push('Python');
  if (paths.some(p=&gt;p.endsWith('drizzle.config.ts')||p.includes('drizzle'))) techs.push('Drizzle ORM');
  if (paths.some(p=&gt;p.endsWith('server.ts')||p.endsWith('server.js')||p.endsWith('server.cjs'))) techs.push('Node.js/Express');
  if (hasPkg) { try { const d=JSON.parse(hasPkg.content||'{}'); if(d.dependencies?.['react-native']) techs.push('React Native'); } catch{} }
  return [...new Set(techs)];
}

function describeStructure(entries) {
  const dirs = new Set();
  for(const e of entries){ const p=e.clean.split('/'); if(p.length&gt;1) dirs.add(p[0]+'/'); }
  const lines = [];
  for(const d of [...dirs].sort()) {
    const count = entries.filter(e=&gt;e.clean.startsWith(d)).length;
    const desc = {
      'src/':'Código fonte principal',
      'app/':'Páginas/rotas (Expo Router / Next.js)',
      'components/':'Componentes reutilizáveis',
      'lib/':'Bibliotecas e utilitários',
      'server/':'Backend / API',
      'electron/':'Configuração do Electron (desktop)',
      'public/':'Arquivos públicos estáticos',
      'assets/':'Imagens e recursos',
      'dist/':'Build compilado (não editar)',
      'node_modules/':'Dependências (não editar)',
    };
    lines.push(`- **${d}** — ${desc[d]||'pasta do projeto'} (${count} arquivos)`);
  }
  return lines.join('\n') || '— Projeto sem subpastas —';
}

function getKeyFiles(entries) {
  const IMPORTANT = ['package.json','app.json','eas.json','vite.config.ts','vite.config.js',
    'index.html','README.md','PLANO.md','.env.example','server.ts','server.js','server.cjs',
    'drizzle.config.ts','tailwind.config.ts','tsconfig.json','electron/main.js','electron/main.cjs'];
  const result = [];
  for (const key of IMPORTANT) {
    const found = entries.find(e=&gt;e.clean.endsWith(key)||e.clean===key);
    if (found &amp;&amp; found.content) result.push(found);
  }
  // Adicionar arquivos maiores que não estão na lista
  const big = entries.filter(e=&gt;e.content&amp;&amp;e.lines&gt;50&amp;&amp;!result.includes(e)).sort((a,b)=&gt;b.lines-a.lines).slice(0,5);
  return [...result, ...big];
}

function guessFunction(e) {
  const p = e.clean.toLowerCase();
  if (p.includes('server')) return 'Servidor backend / API';
  if (p.includes('auth')) return 'Autenticação de usuários';
  if (p.includes('route')) return 'Definição de rotas';
  if (p.includes('schema')) return 'Esquema do banco de dados';
  if (p.includes('config')) return 'Configuração do projeto';
  if (p.includes('main') &amp;&amp; p.includes('electron')) return 'Processo principal do Electron';
  if (p.endsWith('index.html')) return 'Página HTML principal';
  if (p.endsWith('package.json')) return 'Dependências e scripts npm';
  if (p.endsWith('app.json')) return 'Configuração do app (Expo)';
  if (p.endsWith('eas.json')) return 'Configuração de build (EAS)';
  if (p.endsWith('tailwind.config.ts')) return 'Configuração do Tailwind CSS';
  if (p.endsWith('vite.config.ts') || p.endsWith('vite.config.js')) return 'Configuração do bundler Vite';
  if (p.includes('component')) return 'Componente de interface';
  if (p.includes('hook')) return 'React hook customizado';
  if (p.includes('util') || p.includes('helper')) return 'Funções utilitárias';
  if (p.includes('type')) return 'Definições de tipos TypeScript';
  if (p.includes('store') || p.includes('state')) return 'Gerenciamento de estado';
  if (p.includes('db') || p.includes('database')) return 'Configuração do banco de dados';
  return 'Funcionalidade do projeto';
}

function getDeps(entries) {
  const pkg = entries.find(e=&gt;e.clean.endsWith('package.json')&amp;&amp;!e.clean.includes('node_modules'));
  if (!pkg?.content) return '— package.json não encontrado —';
  try {
    const d = JSON.parse(pkg.content);
    const deps = Object.keys(d.dependencies||{}).slice(0,15).join(', ');
    const dev  = Object.keys(d.devDependencies||{}).slice(0,10).join(', ');
    return `**Dependências:** ${deps||'nenhuma'}\n**Dev:** ${dev||'nenhuma'}`;
  } catch { return '— Erro ao ler package.json —'; }
}

function getScripts(entries) {
  const pkg = entries.find(e=&gt;e.clean.endsWith('package.json')&amp;&amp;!e.clean.includes('node_modules'));
  if (!pkg?.content) return '— package.json não encontrado —';
  try {
    const d = JSON.parse(pkg.content);
    const scripts = Object.entries(d.scripts||{});
    return scripts.map(([k,v])=&gt;`- \`npm run ${k}\` → ${v}`).join('\n')||'— nenhum script —';
  } catch { return '— Erro ao ler package.json —'; }
}

function getObservations(entries) {
  const obs = [];
  if (entries.some(e=&gt;e.clean.includes('.replit')||e.content?.includes('replit'))) obs.push('⚠️ Contém referências à Replit — pode ter dependências do ambiente deles.');
  if (entries.some(e=&gt;e.clean.endsWith('pnpm-workspace.yaml'))) obs.push('⚠️ Usa pnpm workspace — pode ter catalog: que não funciona com npm.');
  if (entries.some(e=&gt;e.clean.endsWith('.env'))) obs.push('ℹ️ Tem arquivo .env — configure as variáveis de ambiente antes de rodar.');
  if (entries.some(e=&gt;e.clean.includes('electron'))) obs.push('ℹ️ Projeto Electron — pode ser empacotado como .exe com electron-builder.');
  if (entries.some(e=&gt;e.clean.endsWith('eas.json'))) obs.push('ℹ️ Projeto Expo — gere APK com: eas build --profile preview --platform android');
  if (!obs.length) obs.push('Nenhuma observação especial.');
  return obs.join('\n');
}

// ── Utilitários ──────────────────────────────────────────────
function copyEl(id) {
  const el = document.getElementById(id);
  const txt = el.tagName==='TEXTAREA'||el.tagName==='INPUT' ? el.value : el.textContent;
  navigator.clipboard.writeText(txt).then(()=&gt;showToast('✅ Copiado!'));
}

function downloadEl(id, filename) {
  const el = document.getElementById(id);
  const txt = el.tagName==='TEXTAREA'||el.tagName==='INPUT' ? el.value : el.textContent;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download = filename; a.click();
}

function showToast(msg) {
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:6px;font-size:13px;color:#fff;background:#238636;z-index:99;';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=&gt;t.style.display='none',2500);
}

const P = {

  devDeps: {},
  scripts: {},

// ═══════════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════════
const TABS = ['drop','viewer','analysis','chat'];
function goTab(name) {
  TABS.forEach(t =&gt; {
    document.getElementById('sec-'+t).classList.toggle('active', t===name);
    document.getElementById('tb-'+t)?.classList.toggle('active', t===name);
  });
  if (name==='viewer'||name==='analysis') {
    document.getElementById('file-panel').classList.remove('hidden');
  } else {
    document.getElementById('file-panel').classList.add('hidden');
  }
}
function toggleFilePanel() {
  document.getElementById('file-panel').classList.toggle('hidden');
}

// ═══════════════════════════════════════════════════
//  IMPORTAR ZIP
// ═══════════════════════════════════════════════════
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e=&gt;{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave', ()=&gt;drop.classList.remove('over'));
drop.addEventListener('drop', e=&gt;{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])processZip(e.dataTransfer.files[0]);});

async function loadZip(inp) { if(inp.files[0]) processZip(inp.files[0]); inp.value=''; }

async function processZip(file) {
  showToast('Carregando '+ file.name + '...');
  const zip = await JSZip.loadAsync(file);
  const TEXT = new Set(['html','htm','css','js','ts','tsx','jsx','mjs','cjs','json','md','txt','py','sh','bat','yaml','yml','env','toml','ini','svg','xml']);
  const entries = [];

  for (const [name, entry] of Object.entries(zip.files)) {
    if (entry.dir) continue;
    const ext = (name.split('.').pop()||'').toLowerCase();
    let content = null;
    if (TEXT.has(ext)) {
      try { content = await entry.async('text'); } catch{}
    }
    entries.push({ path: name, ext, content,
      size: content ? content.length : 0,
      lines: content ? content.split('\n').length : 0 });
  }

  // Detectar e remover prefixo raiz
  const root = (() =&gt; {
    const paths = entries.map(e=&gt;e.path);
    if (!paths.length) return '';
    const first = paths[0].split('/')[0];
    return paths.every(p=&gt;p.startsWith(first+'/')) ? first+'/' : '';
  })();

  P.files = entries
    .map(e=&gt;({...e, clean: root ? e.path.slice(root.length) : e.path}))
    .filter(e=&gt;e.clean &amp;&amp; !e.clean.startsWith('node_modules') &amp;&amp; !e.clean.startsWith('.git'));

  // Ler package.json
  const pkg = P.files.find(f=&gt;f.clean==='package.json');
  if (pkg?.content) {
    try {
      const d = JSON.parse(pkg.content);
      P.name    = d.name || file.name.replace(/\.zip$/i,'');
      P.deps    = d.dependencies    || {};
      P.devDeps = d.devDependencies || {};
      P.scripts = d.scripts         || {};
    } catch{}
  }

  P.techs = detectTechs();
  P.type  = detectType();

  // Atualizar UI
  document.getElementById('proj-badge').textContent = P.name + ' · ' + P.files.length + ' arquivos';
  renderFileList();
  renderAnalysis();
  buildPkgJson();
  buildCommands();
  buildTree();

  goTab('viewer');
  showToast('✅ '+ P.files.length +' arquivos carregados');
}

// ═══════════════════════════════════════════════════
//  LISTA DE ARQUIVOS (sem limite)

function renderFileList() {
  const list = document.getElementById('file-list');
  const allFiles = P.files.sort((a,b)=&gt;a.clean.localeCompare(b.clean));
  list.innerHTML = allFiles.map(f =&gt; `

      &lt;span&gt;${fileIcon(f.ext)}&lt;/span&gt;
      &lt;span class=&quot;fi-name&quot; title=&quot;${esc(f.clean)}&quot;&gt;${esc(f.clean)}&lt;/span&gt;

// ═══════════════════════════════════════════════════
//  VIEWER — abre arquivo COMPLETO sem limite
// ═══════════════════════════════════════════════════
function openFile(clean) {
  const f = P.files.find(x=&gt;x.clean===clean);
  if (!f) return;
  currentFile = clean;

  document.querySelectorAll('.fi').forEach(el =&gt; el.classList.remove('active'));
  const el = document.getElementById('fi-' + CSS.escape(clean));
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }

  const ta = document.getElementById('viewer-code');
  if (f.content !== null) {
    ta.value = f.content;  // SEM truncar — arquivo completo
  } else {
    ta.value = '[Arquivo binário — não exibível como texto]';
  }

  document.getElementById('viewer-fname').textContent = clean;
  document.getElementById('viewer-info').textContent =
    f.content ? `${f.lines.toLocaleString()} linhas · ${(f.size/1024).toFixed(1)} KB · .${f.ext}` : '(binário)';

  goTab('viewer');
}

function copyViewer() {
  navigator.clipboard.writeText(document.getElementById('viewer-code').value).then(()=&gt;showToast('📋 Copiado!'));
}

function downloadViewer() {
  if (!currentFile) return;
  const f = P.files.find(x=&gt;x.clean===currentFile);
  if (!f?.content) return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([f.content],{type:'text/plain'}));
  a.download=currentFile.split('/').pop(); a.click();
}

function sendFileToAI() {
  if (!currentFile) return;
  const f = P.files.find(x=&gt;x.clean===currentFile);
  if (!f?.content) return;
  document.getElementById('chat-input').value = `Analise o arquivo ${currentFile}:\n\`\`\`\n${f.content.slice(0,8000)}\n\`\`\``;
  goTab('chat');
  document.getElementById('chat-input').focus();

// ═══════════════════════════════════════════════════
//  ANÁLISE
// ═══════════════════════════════════════════════════

  const textFiles = P.files.filter(f=&gt;f.content);

  const topExts = Object.entries(byExt).sort((a,b)=&gt;b[1]-a[1]).slice(0,5).map(([e,n])=&gt;`${e}:${n}`).join(' · ');

  document.getElementById('stats').innerHTML = [
    ['📁',P.files.length,'arquivos'],
    ['📝',textFiles.length,'com texto'],
    ['📏',totalLines.toLocaleString(),'linhas totais'],
    ['📦',Object.keys(P.deps).length,'deps'],
    ['🔧',Object.keys(P.devDeps).length,'devDeps'],
  ].map(([i,n,l])=&gt;`&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${n}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${i} ${l}&lt;/div&gt;&lt;/div&gt;`).join('');

  document.getElementById('proj-type').textContent = P.type;
  document.getElementById('techs').innerHTML = P.techs.map(t=&gt;`&lt;span class=&quot;tag&quot;&gt;${t}&lt;/span&gt;`).join('');

  // Deps — TODAS, sem slice
  const allDeps = [
    ...Object.entries(P.deps).map(([n,v])=&gt;({n,v,type:'prod'})),
    ...Object.entries(P.devDeps).map(([n,v])=&gt;({n,v,type:'dev'})),
  ];
  document.getElementById('dep-count').textContent = allDeps.length;
  document.getElementById('deps-body').innerHTML = allDeps.length
    ? `&lt;div&gt;${allDeps.map(d=&gt;`
        &lt;div class=&quot;dep-row&quot;&gt;
          &lt;span class=&quot;dep-name&quot;&gt;${esc(d.n)}&lt;/span&gt;
          &lt;span class=&quot;dep-ver&quot; id=&quot;dv-${CSS.escape(d.n)}&quot;&gt;${esc(d.v)}&lt;/span&gt;
          &lt;span class=&quot;dep-type&quot; style=&quot;background:${d.type==='prod'?'#1f2a1f':'#1f1f2a'};color:${d.type==='prod'?'var(--gr)':'var(--bl)'}&quot;&gt;${d.type}&lt;/span&gt;
          &lt;span class=&quot;dep-desc&quot; id=&quot;dd-${CSS.escape(d.n)}&quot;&gt;—&lt;/span&gt;
        &lt;/div&gt;`).join('')}&lt;/div&gt;`
    : '&lt;p style=&quot;font-size:12px;color:var(--mu);&quot;&gt;Nenhuma dependência encontrada.&lt;/p&gt;';
}

// ═══════════════════════════════════════════════════
//  BUSCAR VERSÕES NO NPM (sem limite)
// ═══════════════════════════════════════════════════
window.searchAllNpm = async () =&gt; {
  const all = [...Object.keys(P.deps),...Object.keys(P.devDeps)];
  const statusEl = document.getElementById('npm-status');
  let done = 0;

  for (let i=0;i&lt;all.length;i+=6) {
    const batch = all.slice(i,i+6);
    await Promise.all(batch.map(async pkg=&gt;{
      try {
        const r = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg)}/latest`,
          {signal:AbortSignal.timeout(6000)});
        if (r.ok) {
          const d = await r.json();
          const ver = '^'+(d.version||'latest');
          const desc = (d.description||'').slice(0,70);
          const key = CSS.escape(pkg);
          const ve = document.getElementById('dv-'+key);
          const de = document.getElementById('dd-'+key);
          if (ve) { ve.textContent=ver; ve.style.color='var(--gr)'; }
          if (de) de.textContent = desc;
          if (P.deps[pkg])    P.deps[pkg]    = ver;
          if (P.devDeps[pkg]) P.devDeps[pkg] = ver;
        }
      } catch{}
      done++;
      statusEl.textContent = `${done}/${all.length}`;
    }));
  }
  buildPkgJson();
  statusEl.textContent = `✅ ${done} verificados`;
  showToast('✅ Versões atualizadas!');
};

// ═══════════════════════════════════════════════════
//  PACKAGE.JSON
// ═══════════════════════════════════════════════════
function buildPkgJson() {
  const pkg = {
    name: P.name.toLowerCase().replace(/[\s]+/g,'-'),
    version: '1.0.0',
    private: true,
  };
  if (Object.keys(P.scripts).length)  pkg.scripts         = P.scripts;
  if (Object.keys(P.deps).length)     pkg.dependencies    = P.deps;
  if (Object.keys(P.devDeps).length)  pkg.devDependencies = P.devDeps;
  document.getElementById('pkg-ta').value = JSON.stringify(pkg,null,2);
}

// ═══════════════════════════════════════════════════
//  COMANDOS (sem slice)
// ═══════════════════════════════════════════════════
function buildCommands() {
  const t = P.techs;
  const name = P.name.replace(/\s+/g,'-').toLowerCase();
  const secs = [];

  secs.push({title:'1. CRIAR PROJETO BASE', cmds: t.includes('Expo')
    ? [`npx create-expo-app@latest ${name} --template blank-typescript`]
    : t.includes('Next.js')
    ? [`npx create-next-app@latest ${name} --typescript --tailwind --eslint --app`]
    : (t.includes('React')&amp;&amp;t.includes('Vite'))
    ? [`npm create vite@latest ${name} -- --template ${t.includes('TypeScript')?'react-ts':'react'}`,`cd ${name}`]
    : [`mkdir ${name}`,`cd ${name}`,`npm init -y`]
  });

  const prod = Object.keys(P.deps).filter(d=&gt;!['react','react-dom','next'].includes(d));
  if (prod.length) secs.push({title:'2. DEPENDÊNCIAS PRINCIPAIS', cmds:[`npm install ${prod.join(' ')}`]});

  const dev = Object.keys(P.devDeps).filter(d=&gt;!['vite','typescript','@vitejs/plugin-react'].includes(d));
  if (dev.length) secs.push({title:'3. DEV DEPENDENCIES', cmds:[`npm install -D ${dev.join(' ')}`]});

  if (t.includes('Tailwind CSS')&amp;&amp;!t.includes('Next.js'))
    secs.push({title:'4. TAILWIND CSS', cmds:['npm install -D tailwindcss postcss autoprefixer','npx tailwindcss init -p']});

  if (t.includes('Electron'))
    secs.push({title:'5. ELECTRON', cmds:['npm install -D electron electron-builder','rem Criar electron/main.js conforme original']});

  if (t.includes('Drizzle ORM'))
    secs.push({title:'6. DRIZZLE ORM', cmds:['npm install drizzle-orm @libsql/client','npm install -D drizzle-kit','rem Criar drizzle.config.ts e schema','npx drizzle-kit push']});

  if (t.includes('Supabase'))
    secs.push({title:'7. SUPABASE', cmds:['npm install @supabase/supabase-js','rem Criar .env com SUPABASE_URL e SUPABASE_KEY']});

  // Todas as pastas sem limite
  const dirs = new Set();
  P.files.forEach(f=&gt;{
    const parts=f.clean.split('/');
    for(let i=1;i&lt;parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
  });
  if (dirs.size) secs.push({title:'8. CRIAR PASTAS', cmds:[...[...dirs].sort().map(d=&gt;`mkdir &quot;${d.replace(/\//g,'\\')}&quot; 2&gt;nul`)]});

  const devScript = Object.entries(P.scripts).find(([k])=&gt;['dev','start','serve'].includes(k));
  secs.push({title:'9. INSTALAR E RODAR',cmds:['npm install', devScript?`npm run ${devScript[0]}`:'npm run dev']});

  // Renderizar visual
  document.getElementById('cmds-sections').innerHTML = secs.map(s=&gt;`
    &lt;div class=&quot;cmd-section&quot;&gt;
      &lt;h4&gt;${s.title}&lt;/h4&gt;
      ${s.cmds.map(c=&gt;c.startsWith('rem ')||c.startsWith('(')?
        `&lt;div class=&quot;cmd-row comment&quot;&gt;&lt;code&gt;${esc(c)}&lt;/code&gt;&lt;/div&gt;`:
        `&lt;div class=&quot;cmd-row&quot;&gt;&lt;code&gt;${esc(c)}&lt;/code&gt;&lt;button class=&quot;cmd-copy&quot; onclick=&quot;copy('${esc(c)}')&quot;&gt;📋&lt;/button&gt;&lt;/div&gt;`
      ).join('')}
    &lt;/div&gt;`).join('');

  // Texto para .bat
  let bat = `@echo off\necho Replicando: ${P.name}\n\n`;
  secs.forEach(s=&gt;{
    bat+=`rem === ${s.title} ===\n`;
    s.cmds.forEach(c=&gt;bat+=`${c}\n`);
    bat+='\n';
  });
  bat+=`echo.\necho Projeto criado com sucesso!\npause`;
  document.getElementById('cmds-ta').value = bat;
}

// ═══════════════════════════════════════════════════
//  ÁRVORE COMPLETA (sem limite)
// ═══════════════════════════════════════════════════
function buildTree() {
  const tree = {};
  P.files.forEach(f=&gt;{
    const parts=f.clean.split('/');
    let node=tree;
    for(let i=0;i&lt;parts.length-1;i++){
      if(!node[parts[i]])node[parts[i]]={};
      node=node[parts[i]];
    }
    node[parts[parts.length-1]]=f;
  });

  const lines=[];
  function print(node,prefix=''){
    const keys=Object.keys(node).sort((a,b)=&gt;{
      const ad=!node[a]?.path&amp;&amp;typeof node[a]==='object';
      const bd=!node[b]?.path&amp;&amp;typeof node[b]==='object';
      return (bd-ad)||a.localeCompare(b);
    });
    keys.forEach((k,i)=&gt;{
      const last=i===keys.length-1,c=last?'└─ ':'├─ ',child=node[k];
      if(child?.path){
        const info=child.content?` (${child.lines}L)`:'';
        lines.push(`${prefix}${c}📄 ${k}${info}`);
      } else {
        lines.push(`${prefix}${c}📁 ${k}/`);
        print(child,prefix+(last?'   ':'│  '));
      }
    });
  }
  print(tree);
  document.getElementById('tree-ta').value = lines.join('\n'); // SEM limite
}

// ═══════════════════════════════════════════════════
//  CHAT IA (com contexto do projeto)
// ═══════════════════════════════════════════════════
const MODELS = {
  gemini:['gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-pro'],
  groq:['llama-3.3-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768'],
  openai:['gpt-4o','gpt-4o-mini','gpt-3.5-turbo'],
};

function refreshModels(){
  const p=document.getElementById('ai-provider').value;
  document.getElementById('ai-model').innerHTML=MODELS[p].map(m=&gt;`&lt;option&gt;${m}&lt;/option&gt;`).join('');
  const saved=localStorage.getItem('ai_key_'+p);
  if(saved)document.getElementById('ai-key').placeholder='✅ Chave salva';
  updateChatStatus();
}
refreshModels();

function saveKey(){
  const p=document.getElementById('ai-provider').value;
  const k=document.getElementById('ai-key').value.trim();
  if(!k)return;
  localStorage.setItem('ai_key_'+p,k);
  document.getElementById('ai-key').value='';
  document.getElementById('ai-key').placeholder='✅ Salva';
  updateChatStatus(); showToast('✅ Chave salva!');
}

function updateChatStatus(){
  const p=document.getElementById('ai-provider').value;
  const k=localStorage.getItem('ai_key_'+p);
  document.getElementById('chat-status').textContent = k ? `${p} pronto` : 'Configure a chave acima';
}

function buildProjectContext(){
  // Contexto: lista de arquivos + package.json + arquivo atual
  let ctx = `PROJETO: ${P.name}\nTIPO: ${P.type}\nTECNOLOGIAS: ${P.techs.join(', ')}\n\n`;
  ctx += `ARQUIVOS (${P.files.length} total):\n${P.files.map(f=&gt;f.clean+(f.content?` (${f.lines}L)`:'')).join('\n')}\n\n`;
  const pkg = P.files.find(f=&gt;f.clean==='package.json');
  if(pkg?.content) ctx += `PACKAGE.JSON:\n${pkg.content.slice(0,2000)}\n\n`;
  if(currentFile){
    const cf = P.files.find(f=&gt;f.clean===currentFile);
    if(cf?.content) ctx += `ARQUIVO ATUAL (${currentFile}):\n${cf.content.slice(0,6000)}\n`;
  }
  return ctx;
}

window.sendChat = async () =&gt; {
  if(chatBusy) return;
  const input=document.getElementById('chat-input');
  const text=input.value.trim(); if(!text) return;
  const provider=document.getElementById('ai-provider').value;
  const key=localStorage.getItem('ai_key_'+provider);
  if(!key){showToast('Configure a chave de IA','err');return;}
  input.value='';

  chatMsgs.push({role:'user',content:text});
  addBubble('user',text);

  chatBusy=true;
  document.getElementById('chat-send').disabled=true;
  document.getElementById('chat-send').textContent='…';

  const think=addBubble('ai','&lt;span class=&quot;dot-anim&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/span&gt;');

  try {
    const model=document.getElementById('ai-model').value;
    const sysCtx=buildProjectContext();
    const system={role:'system',content:`Você é um assistente especializado em análise de projetos de software.\n${sysCtx}`};
    const msgs=[system,...chatMsgs.slice(-12)];

    const bases={
      gemini:'https://generativelanguage.googleapis.com/v1beta/openai',
      groq:'https://api.groq.com/openai/v1',
      openai:'https://api.openai.com/v1',
    };
    const r=await fetch(`${bases[provider]}/chat/completions`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body:JSON.stringify({model,messages:msgs,max_tokens:8192}),
    });
    const d=await r.json();
    if(d.error) throw new Error(d.error.message||JSON.stringify(d.error));
    const reply=d.choices?.[0]?.message?.content||'';
    think.querySelector('.bubble').innerHTML=mdRender(reply);
    chatMsgs.push({role:'assistant',content:reply});
  } catch(e){
    think.querySelector('.bubble').innerHTML=`&lt;span style=&quot;color:var(--rd)&quot;&gt;Erro: ${esc(e.message)}&lt;/span&gt;`;
  }

  chatBusy=false;
  document.getElementById('chat-send').disabled=false;
  document.getElementById('chat-send').textContent='▶';
  document.getElementById('chat-msgs').scrollTop=99999;
};

function addBubble(role,html){
  const wrap=document.createElement('div');
  const b=document.createElement('div');
  b.className='bubble '+role;
  b.innerHTML=html;
  wrap.appendChild(b);
  document.getElementById('chat-msgs').appendChild(wrap);
  document.getElementById('chat-msgs').scrollTop=99999;
  return wrap;
}

function clearChat(){chatMsgs=[];document.getElementById('chat-msgs').innerHTML='';}

function mdRender(s){
  return String(s)
    .replace(/```([\s\S]*?)```/g,'&lt;pre&gt;&lt;code&gt;$1&lt;/code&gt;&lt;/pre&gt;')
    .replace(/`([^`]+)`/g,'&lt;code&gt;$1&lt;/code&gt;')
    .replace(/\*\*(.+?)\*\*/g,'&lt;strong&gt;$1&lt;/strong&gt;')
    .replace(/\n/g,'&lt;br&gt;');
}

//  DETECÇÃO
// ═══════════════════════════════════════════════════
function detectTechs(){
  const paths=P.files.map(f=&gt;f.clean.toLowerCase());
  const all={...P.deps,...P.devDeps};
  const t=[];
  if(all['react']||paths.some(p=&gt;p.endsWith('.tsx')||p.endsWith('.jsx'))) t.push('React');
  if(all['react-native']||all['expo']) t.push('Expo/React Native');
  if(all['next']||paths.some(p=&gt;p.includes('next.config'))) t.push('Next.js');
  if(all['vite']||paths.some(p=&gt;p.includes('vite.config'))) t.push('Vite');
  if(all['typescript']||paths.some(p=&gt;p.endsWith('.ts')||p.endsWith('.tsx'))) t.push('TypeScript');
  if(all['tailwindcss']) t.push('Tailwind CSS');
  if(all['electron']||paths.some(p=&gt;p.startsWith('electron/'))) t.push('Electron');
  if(all['express']) t.push('Express');
  if(all['drizzle-orm']) t.push('Drizzle ORM');
  if(all['@supabase/supabase-js']||paths.some(p=&gt;p.includes('supabase'))) t.push('Supabase');
  if(all['better-sqlite3']||all['@libsql/client']) t.push('SQLite');
  if(all['@webcontainer/api']) t.push('WebContainer');
  if(paths.some(p=&gt;p.endsWith('.py'))) t.push('Python');
  return [...new Set(t)];
}

function detectType(){
  const t=P.techs;
  if(t.includes('Expo/React Native')) return 'Mobile — Expo/React Native';
  if(t.includes('Electron')) return 'Desktop — Electron';
  if(t.includes('Next.js')) return 'Web Full-Stack — Next.js';
  if(t.includes('Express')&amp;&amp;t.includes('React')) return 'Web Full-Stack — React + Express';
  if(t.includes('React')) return 'Web Frontend — React/Vite';
  if(t.includes('Express')) return 'Backend — Node.js/Express';
  return 'Projeto Web';
}

    &lt;input id=&quot;inp-md&quot; class=&quot;minput&quot; type=&quot;text&quot; placeholder=&quot;minha-pasta&quot; onkeydown=&quot;if(event.key==='Enter')doCreate('d')&quot;&gt;
    &lt;div class=&quot;mbtns&quot;&gt;
      &lt;button class=&quot;btn btn-cancel&quot; onclick=&quot;closeModal('md')&quot;&gt;Cancelar&lt;/button&gt;
      &lt;button class=&quot;btn btn-ok&quot; onclick=&quot;doCreate('d')&quot;&gt;Criar&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- MODAL RENOMEAR --&gt;
&lt;div id=&quot;modal-rn&quot; class=&quot;modal&quot;&gt;
  &lt;div class=&quot;mbox&quot;&gt;
    &lt;div class=&quot;mtitle&quot;&gt;✏️ Renomear&lt;/div&gt;
    &lt;input id=&quot;inp-rn&quot; class=&quot;minput&quot; type=&quot;text&quot; onkeydown=&quot;if(event.key==='Enter')doRename()&quot;&gt;
    &lt;div class=&quot;mbtns&quot;&gt;
      &lt;button class=&quot;btn btn-cancel&quot; onclick=&quot;closeModal('rn')&quot;&gt;Cancelar&lt;/button&gt;
      &lt;button class=&quot;btn btn-ok&quot; onclick=&quot;doRename()&quot;&gt;Renomear&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- CONTEXT MENU --&gt;
&lt;div id=&quot;ctx&quot;&gt;
  &lt;button class=&quot;citem&quot; onclick=&quot;ctxAct('rename')&quot;&gt;✏️ Renomear&lt;/button&gt;
  &lt;button class=&quot;citem&quot; id=&quot;ctx-dup&quot; onclick=&quot;ctxAct('dup')&quot;&gt;⧉ Duplicar&lt;/button&gt;
  &lt;button class=&quot;citem&quot; id=&quot;ctx-dl&quot; onclick=&quot;ctxAct('dl')&quot;&gt;⬇ Baixar&lt;/button&gt;
  &lt;div class=&quot;csep&quot;&gt;&lt;/div&gt;
  &lt;button class=&quot;citem danger&quot; onclick=&quot;ctxAct('del')&quot;&gt;🗑️ Excluir&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
// =====================
// UTILITÁRIOS
// =====================
const id  = s =&gt; document.getElementById(s);
const qs  = s =&gt; document.querySelector(s);
const qsa = s =&gt; [...document.querySelectorAll(s)];
const ext = p =&gt; (p.split('.').pop()||'').toLowerCase();
const lsGet = k =&gt; { try{return localStorage.getItem(k)}catch{return null} };
const lsSet = (k,v) =&gt; { try{localStorage.setItem(k,v)}catch{} };
const esc = s =&gt; String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');

let _toastT;
function toast(msg, type='ok'){
  const el=document.createElement('div');
  el.className='toast t'+type;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=&gt;el.remove(),2800);
}

function dlBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=&gt;URL.revokeObjectURL(a.href),6000);
}

const ICON = n=&gt;({
  html:'🌐',htm:'🌐',css:'🎨',scss:'🎨',sass:'🎨',less:'🎨',
  js:'📜',mjs:'📜',cjs:'📜',jsx:'⚛',ts:'📘',tsx:'⚛',
  json:'📋',yaml:'📋',yml:'📋',toml:'📋',
  md:'📝',txt:'📄',sh:'⚙',bat:'⚙',
  py:'🐍',java:'☕',kt:'🟠',php:'🐘',rb:'💎',go:'🐹',rs:'🦀',
  sql:'🗄',prisma:'🗄',graphql:'🔷',
  png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',svg:'🖼',webp:'🖼',ico:'🖼',
  pdf:'📕',zip:'📦',tar:'📦',gz:'📦',env:'🔒'
})[ext(n)]||'📄';

// =====================
// ESTADO
// =====================
let files      = {};
let curFile    = null;
let folderOpen = {};
let pmMode     = 1;
let prevTimer  = null;
let vDrag      = false, vDragY=0, vDragH=0;
let ctxPath    = null, ctxType=null;
let modalCtx   = '';

// =====================
// INIT
// =====================
function init(){
  const saved=lsGet('ej-files');
  if(saved) try{files=JSON.parse(saved)}catch{}
  if(!Object.keys(files).length){
    files['index.html']='&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;UTF-8&quot;&gt;\n  &lt;title&gt;Meu Projeto&lt;/title&gt;\n  &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Olá!&lt;/h1&gt;\n  &lt;script src=&quot;app.js&quot;&gt;&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;';
    files['style.css']='body {\n  font-family: sans-serif;\n  background: #f0f0f0;\n  padding: 20px;\n}\n\nh1 {\n  color: #333;\n}';
    files['app.js']='console.log(&quot;Projeto iniciado!&quot;);';
  }
  renderTree();
  const first=Object.keys(files).find(f=&gt;ext(f)==='html')||Object.keys(files)[0];
  if(first) openFile(first);
  setPM(1);
}

// =====================
// ÁRVORE DE ARQUIVOS
// =====================
function buildTree(fm){
  const root={t:'dir',name:'',kids:{}};
  for(const path of Object.keys(fm)){
    const parts=path.replace(/^\//,'').split('/');
    let node=root;
    for(let i=0;i&lt;parts.length;i++){
      const p=parts[i];
      if(i===parts.length-1){
        node.kids[p]={t:'file',name:p,path};
      } else {
        if(!node.kids[p]) node.kids[p]={t:'dir',name:p,kids:{}};
        node=node.kids[p];
      }
    }
  }
  return root;
}

function renderTree(){
  const root=buildTree(files);
  id('tree').innerHTML=renderKids(root.kids,'');
}

function renderKids(kids,parent){
  const entries=Object.entries(kids).sort(([an,av],[bn,bv])=&gt;{
    if(av.t==='dir'&amp;&amp;bv.t==='file') return -1;
    if(av.t==='file'&amp;&amp;bv.t==='dir') return 1;
    return an.localeCompare(bn);
  });
  return entries.map(([name,node])=&gt;{
    const full=parent?parent+'/'+name:name;
    if(node.t==='dir'){
      const open=folderOpen[full]!==false;
      const safeId='fc_'+full.replace(/[^a-zA-Z0-9]/g,'_');
      return `&lt;div&gt;
        &lt;div class=&quot;trow&quot; onclick=&quot;toggleDir('${full}',event)&quot; oncontextmenu=&quot;openCtx(event,'dir','${full}')&quot;&gt;
          &lt;span class=&quot;tarr ${open?'op':''}&quot;&gt;▶&lt;/span&gt;
          &lt;span class=&quot;tico&quot;&gt;📁&lt;/span&gt;
          &lt;span class=&quot;tname&quot;&gt;${esc(name)}&lt;/span&gt;
          &lt;div class=&quot;tacts&quot;&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openModal('mf','${full}')&quot; title=&quot;Novo arquivo&quot;&gt;📄&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openModal('md','${full}')&quot; title=&quot;Nova pasta&quot;&gt;📁&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openRename('dir','${full}')&quot;&gt;✏️&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();delItem('${full}','dir')&quot;&gt;🗑️&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;kids ${open?'':'hide'}&quot; id=&quot;${safeId}&quot;&gt;
          ${renderKids(node.kids,full)}
        &lt;/div&gt;
      &lt;/div&gt;`;
    } else {
      const sel=node.path===curFile?'sel':'';
      return `&lt;div class=&quot;trow ${sel}&quot; onclick=&quot;openFile('${node.path}')&quot; oncontextmenu=&quot;openCtx(event,'file','${node.path}')&quot;&gt;
        &lt;span class=&quot;tico&quot;&gt;${ICON(name)}&lt;/span&gt;
        &lt;span class=&quot;tname&quot;&gt;${esc(name)}&lt;/span&gt;
        &lt;div class=&quot;tacts&quot;&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openRename('file','${node.path}')&quot;&gt;✏️&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();dupFile('${node.path}')&quot;&gt;⧉&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();dlFile('${node.path}')&quot;&gt;⬇&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();delItem('${node.path}','file')&quot;&gt;🗑️&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    }
  }).join('');
}

function toggleDir(path,e){
  if(e) e.stopPropagation();
  folderOpen[path]=folderOpen[path]===false?true:false;
  renderTree();
}

// =====================
// ABRIR / SALVAR
// =====================
function openFile(path){
  if(curFile&amp;&amp;files[curFile]!==undefined){
    files[curFile]=id('cta').value;
    saveAll();
  }
  curFile=path;
  id('cta').value=files[path]||'';
  id('fname').value=path.split('/').pop();
  id('lbadge').textContent=ext(path)||'txt';
  renderTree();
  updateLN();
  refreshPreview();
}

function saveFile(){
  if(!curFile) return;
  files[curFile]=id('cta').value;
  saveAll();
  toast('💾 Salvo!');
}

function saveAll(){
  lsSet('ej-files',JSON.stringify(files));
}

// =====================
// CRIAR ARQUIVO / PASTA
// =====================
function openModal(type, folder){
  modalCtx=folder||'';
  id('inp-'+type).value='';
  id('modal-'+type).classList.add('open');
  setTimeout(()=&gt;id('inp-'+type).focus(),80);
}

function closeModal(type){
  id('modal-'+type).classList.remove('open');
}

function doCreate(type){
  const isDir=(type==='d');
  const name=(id('inp-m'+type).value||'').trim();
  if(!name){ toast('Nome inválido','err'); return; }
  const base=modalCtx?modalCtx+'/'+name:name;
  if(isDir){
    const keeper=base+'/.gitkeep';
    if(!files[keeper]) files[keeper]='';
    folderOpen[base]=true;
    saveAll();
    renderTree();
    closeModal('md');
    toast('📁 Pasta criada!');
  } else {
    if(files[base]!==undefined){ toast('Arquivo já existe','err'); return; }
    files[base]='';
    saveAll();
    renderTree();
    openFile(base);
    closeModal('mf');
    toast('📄 Arquivo criado!');
  }
}

// =====================
// RENOMEAR
// =====================
function openRename(type,path){
  ctxType=type; ctxPath=path;
  id('inp-rn').value=path.split('/').pop();
  id('modal-rn').classList.add('open');
  setTimeout(()=&gt;{ id('inp-rn').focus(); id('inp-rn').select(); },80);
}

function doRename(){
  const newName=(id('inp-rn').value||'').trim();
  if(!newName){ toast('Nome inválido','err'); return; }
  const dir=ctxPath.includes('/')?ctxPath.slice(0,ctxPath.lastIndexOf('/')+1):'';
  const newPath=dir+newName;
  if(ctxType==='file'){
    if(files[newPath]!==undefined&amp;&amp;newPath!==ctxPath){ toast('Nome já existe','err'); return; }
    files[newPath]=files[ctxPath];
    delete files[ctxPath];
    if(curFile===ctxPath) curFile=newPath;
  } else {
    const pre=ctxPath+'/', nPre=newPath+'/';
    for(const k of Object.keys(files)){
      if(k.startsWith(pre)){
        files[nPre+k.slice(pre.length)]=files[k];
        delete files[k];
        if(curFile===k) curFile=nPre+k.slice(pre.length);
      }
    }
    const nFO={};
    for(const[k,v] of Object.entries(folderOpen)){
      if(k===ctxPath) nFO[newPath]=v;
      else if(k.startsWith(ctxPath+'/')) nFO[newPath+k.slice(ctxPath.length)]=v;
      else nFO[k]=v;
    }
    folderOpen=nFO;
  }
  saveAll(); renderTree();
  if(curFile){
    id('fname').value=curFile.split('/').pop();
    id('lbadge').textContent=ext(curFile)||'txt';
  }
  closeModal('rn');
  toast('✅ Renomeado!');
}

function renameBar(){
  if(!curFile) return;
  const newName=(id('fname').value||'').trim();
  if(!newName){ id('fname').value=curFile.split('/').pop(); return; }
  const dir=curFile.includes('/')?curFile.slice(0,curFile.lastIndexOf('/')+1):'';
  const newPath=dir+newName;
  if(newPath===curFile) return;
  if(files[newPath]!==undefined){ toast('Nome já existe','err'); id('fname').value=curFile.split('/').pop(); return; }
  files[newPath]=files[curFile];
  delete files[curFile];
  curFile=newPath;
  id('lbadge').textContent=ext(newPath)||'txt';
  saveAll(); renderTree();
  toast('✅ Renomeado!');
}

// =====================
// DUPLICAR / BAIXAR / EXCLUIR
// =====================
function dupFile(path){
  const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';
  const base=path.split('/').pop().replace(/(\.[^.]+)$/,'');
  const e2=path.includes('.')?'.'+ext(path):'';
  let np=dir+base+'_copia'+e2; let i=2;
  while(files[np]!==undefined) np=dir+base+'_copia'+(i++)+e2;
  files[np]=files[path];
  saveAll(); renderTree(); openFile(np);
  toast('⧉ Duplicado!');
}

function dlFile(path){
  const p=path||curFile;
  if(!p){ toast('Nenhum arquivo selecionado','err'); return; }
  dlBlob(new Blob([files[p]||''],{type:'text/plain'}),p.split('/').pop());
}

function delItem(path,type){
  if(!confirm('Excluir &quot;'+path+'&quot;?')) return;
  if(type==='file'){
    delete files[path];
    if(curFile===path){
      curFile=null;
      id('cta').value='';
      id('fname').value='sem arquivo';
      id('lbadge').textContent='';
    }
  } else {
    for(const k of Object.keys(files))
      if(k.startsWith(path+'/')) delete files[k];
    if(curFile&amp;&amp;curFile.startsWith(path+'/')){
      curFile=null;
      id('cta').value='';
      id('fname').value='sem arquivo';
      id('lbadge').textContent='';
    }
  }
  saveAll(); renderTree();
  toast('🗑️ Excluído!');
}

// =====================
// CONTEXT MENU
// =====================
function openCtx(e,type,path){
  e.preventDefault(); e.stopPropagation();
  ctxPath=path; ctxType=type;
  id('ctx-dup').style.display=type==='file'?'block':'none';
  id('ctx-dl').style.display=type==='file'?'block':'none';
  const m=id('ctx');
  m.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-160)+'px';
  m.style.display='block';
}

function ctxAct(act){
  id('ctx').style.display='none';
  if(act==='rename') openRename(ctxType,ctxPath);
  else if(act==='dup') dupFile(ctxPath);
  else if(act==='dl') dlFile(ctxPath);
  else if(act==='del') delItem(ctxPath,ctxType);
}

document.addEventListener('click',()=&gt;id('ctx').style.display='none');

// =====================
// EDITOR
// =====================
function onInput(){
  if(curFile) files[curFile]=id('cta').value;
  updateLN();
  clearTimeout(prevTimer);
  if(pmMode&gt;0) prevTimer=setTimeout(refreshPreview,600);
}

function updateLN(){
  const ta=id('cta'), ln=id('lnum');
  const n=ta.value.split('\n').length;
  ln.innerHTML=Array.from({length:n},(_,i)=&gt;`&lt;span class=&quot;ln&quot;&gt;${i+1}&lt;/span&gt;`).join('');
}

function syncScroll(){
  id('lnum').scrollTop=id('cta').scrollTop;
}

function onKD(e){
  const ta=e.target;
  if(e.key==='Tab'){
    e.preventDefault();
    const s=ta.selectionStart, en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=s+2;
    onInput();
  }
  if(e.key==='s'&amp;&amp;(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    saveFile();
  }
}

// =====================
// PREVIEW
// =====================
function setPM(mode){
  pmMode=mode;
  qsa('.tbtn[id^=&quot;bpm&quot;]').forEach(b=&gt;b.classList.remove('on'));
  id('bpm'+mode)?.classList.add('on');
  const pv=id('prev');
  if(mode===0){
    pv.classList.remove('show');
    pv.style.height='';
  } else {
    pv.classList.add('show');
    pv.style.height=mode===2?'60vh':'220px';
    id('pframe').style.display='';
    refreshPreview();
  }
}

function toggleMin(){
  const pv=id('prev');
  const pf=id('pframe');
  const btn=qs('#prevbar .pbtn');
  if(pv.style.height==='30px'){
    pv.style.height='220px';
    pf.style.display='';
    btn.textContent='⬆ Preview';
  } else {
    pv.style.height='30px';
    pf.style.display='none';
    btn.textContent='⬇ Preview';
  }
}

function dragStart(e){
  if(pmMode===0) return;
  vDrag=true; vDragY=e.clientY;
  vDragH=id('prev').getBoundingClientRect().height;
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('mouseup',dragStop);
}

function dragMove(e){
  if(!vDrag) return;
  const total=id('work').getBoundingClientRect().height;
  const delta=vDragY-e.clientY;
  const newH=Math.max(60,Math.min(total-60,vDragH+delta));
  id('prev').style.height=newH+'px';
}

function dragStop(){
  vDrag=false;
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('mouseup',dragStop);
}

function refreshPreview(){
  if(!curFile) return;
  const e2=ext(curFile);
  const fr=id('pframe');
  const lb=id('prevlbl');
  if(e2==='html'){
    lb.textContent='🌐 '+curFile;
    fr.srcdoc=files[curFile]||'';
  } else if(e2==='css'){
    lb.textContent='🎨 CSS';
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;${files[curFile]||''}&lt;/style&gt;&lt;/head&gt;&lt;body style=&quot;background:#1e293b;color:#e2e8f0;padding:20px&quot;&gt;&lt;h2&gt;Preview CSS&lt;/h2&gt;&lt;p&gt;Estilos aplicados.&lt;/p&gt;&lt;/body&gt;&lt;/html&gt;`;
  } else if(e2==='md'){
    lb.textContent='📝 Markdown';
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px;background:#0f172a;color:#e2e8f0;line-height:1.7}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;pre style=&quot;white-space:pre-wrap;font-family:inherit&quot;&gt;${esc(files[curFile]||'')}&lt;/pre&gt;&lt;/body&gt;&lt;/html&gt;`;
  } else {
    lb.textContent='📄 '+curFile;
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;body{background:#1e293b;color:#94a3b8;font-family:monospace;padding:20px;font-size:13px;line-height:1.6;white-space:pre-wrap}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;${esc(files[curFile]||'')}&lt;/body&gt;&lt;/html&gt;`;
  }
}

// =====================
// IMPORTAR / EXPORTAR
// =====================
async function doImport(e){
  const f=e.target.files[0];
  if(!f) return;
  if(!window.JSZip){ toast('JSZip não carregou','err'); return; }
  try{
    const z=await JSZip.loadAsync(f);
    const nf={};
    for(const[p,obj] of Object.entries(z.files)){
      if(obj.dir) continue;
      try{ nf[p]=await obj.async('string') }catch{}
    }
    files=nf; folderOpen={};
    renderTree();
    const first=Object.keys(files).find(f2=&gt;ext(f2)==='html')||Object.keys(files)[0];
    if(first) openFile(first);
    saveAll();
    toast('📦 '+Object.keys(files).length+' arquivos importados!');
  } catch(err){
    toast('Erro: '+err.message,'err');
  }
  e.target.value='';
}

async function exportZip(){
  if(!window.JSZip){ toast('JSZip não carregou','err'); return; }
  if(curFile) files[curFile]=id('cta').value;
  const z=new JSZip();
  for(const[n,c] of Object.entries(files)) z.file(n,c||'');
  dlBlob(await z.generateAsync({type:'blob',compression:'DEFLATE'}),'projeto-'+Date.now()+'.zip');
  toast('📥 ZIP exportado!');
}

// =====================
// SIDEBAR
// =====================
function toggleSB(){
  id('sidebar').classList.toggle('hide');
}

// =====================
// FECHAR MODAIS COM ESC
// =====================
document.addEventListener('keydown',e=&gt;{
  if(e.key==='Escape'){
    ['mf','md','rn'].forEach(t=&gt;closeModal(t));
    id('ctx').style.display='none';
  }
});

// =====================
// INICIAR
// =====================
init();

*{box-sizing:border-box;margin:0;padding:0}

/* SIDEBAR - árvore de arquivos */
.sidebar{width:280px;min-width:200px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:10px 12px;border-bottom:1px solid #30363d;display:flex;gap:6px;flex-wrap:wrap}
.sidebar-header button{font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer}
.sidebar-header button:hover{background:#30363d}
.sidebar-header button.primary{background:#238636;border-color:#238636;color:#fff}
.file-tree{flex:1;overflow-y:auto;padding:8px 0}
.tree-item{display:flex;align-items:center;gap:6px;padding:3px 12px;cursor:pointer;font-size:12px;user-select:none}
.tree-item:hover{background:#21262d}
.tree-item.active{background:#1f3a5f;color:#58a6ff}
.tree-item.folder{color:#e3b341}
.tree-item.file{color:#c9d1d9}
.tree-item .icon{font-size:13px;flex-shrink:0}
.tree-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .size{color:#8b949e;font-size:10px;flex-shrink:0}
.indent{padding-left:16px}

/* EDITOR central */
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-tabs{background:#161b22;border-bottom:1px solid #30363d;display:flex;overflow-x:auto;min-height:36px}
.tab{padding:8px 14px;font-size:12px;cursor:pointer;border-right:1px solid #30363d;white-space:nowrap;display:flex;align-items:center;gap:6px;color:#8b949e}
.tab:hover{background:#21262d;color:#c9d1d9}
.tab.active{background:#0d1117;color:#c9d1d9;border-bottom:2px solid #58a6ff}
.tab .close{opacity:0.5;font-size:14px}
.tab .close:hover{opacity:1;color:#f85149}
.editor-content{flex:1;overflow:hidden;position:relative}
textarea.code-editor{width:100%;height:100%;background:#0d1117;color:#c9d1d9;border:none;outline:none;padding:16px;font-family:'Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;resize:none;tab-size:2}

.panel{width:320px;min-width:260px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
.panel-tabs{display:flex;border-bottom:1px solid #30363d}
.panel-tab{flex:1;padding:8px;font-size:11px;text-align:center;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent}

.panel-tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.panel-content{flex:1;overflow-y:auto;padding:12px}

/* Análise */
.analysis-section{margin-bottom:16px}
.analysis-section h3{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:4px;font-size:12px}
.check-item.ok{background:#0d2818;color:#3fb950}
.check-item.warn{background:#2d1f00;color:#e3b341}
.check-item.error{background:#2d0f0f;color:#f85149}
.check-item .icon{flex-shrink:0;font-size:14px}
.check-item .info{flex:1}
.check-item .label{font-weight:600}
.check-item .detail{color:#8b949e;font-size:11px;margin-top:2px}

/* Botões de geração */
.gen-btn{width:100%;padding:8px 12px;margin-bottom:6px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:12px;text-align:left;display:flex;align-items:center;gap:8px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:#21262d;border-radius:6px;padding:8px;text-align:center}
.stat-box .num{font-size:20px;font-weight:700;color:#58a6ff}
.stat-box .lbl{font-size:10px;color:#8b949e;margin-top:2px}

/* Limpeza Replit */
.replit-file{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;background:#2d1f00;margin-bottom:4px;font-size:11px;color:#e3b341}
.replit-file button{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:4px;border:none;background:#9a6700;color:#fff;cursor:pointer}
