<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Iara Search Pro — Busca Avançada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .header-title { font-size: 14px; font-weight: 600; color: #58a6ff; }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    .btn:hover:not(:disabled) { background: #4f46e5; }
    .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
    .btn.secondary { background: #475569; }
    .btn.danger { background: #ff6b6b; }
    .btn.success { background: #3fb950; }
    .header-status { margin-left: auto; font-size: 11px; color: #94a3b8; }
    .file-input-wrapper { position: relative; overflow: hidden; }
    .file-input-wrapper input[type="file"] { position: absolute; left: -9999px; }
    .content { flex: 1; display: flex; gap: 0; overflow: hidden; }
    .sidebar { width: 280px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 12px; color: #58a6ff; font-weight: 600; }
    .files-list { flex: 1; overflow-y: auto; padding: 8px; }
    .file-item { padding: 8px; margin-bottom: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 11px; }
    .file-item:hover { background: #1e293b; border-color: #58a6ff; }
    .file-item.active { background: #1e293b; border-color: #3fb950; box-shadow: 0 0 8px rgba(63, 185, 80, 0.3); }
    .file-item-name { color: #58a6ff; font-weight: 600; margin-bottom: 2px; }
    .file-item-info { color: #94a3b8; font-size: 10px; }
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .search-bar { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 11px; }
    .search-input:focus { outline: none; border-color: #58a6ff; }
    .search-options { display: flex; gap: 8px; align-items: center; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; cursor: pointer; }
    .checkbox-label input { cursor: pointer; }
    .editor-area { flex: 1; display: flex; gap: 0; overflow: hidden; }
    .code-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; overflow: hidden; }
    .panel-header { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .panel-header-title { font-weight: 600; color: #58a6ff; }
    .code-wrapper { flex: 1; display: flex; overflow: hidden; }
    .line-numbers { background: #0f172a; color: #475569; padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; border-right: 1px solid #334155; overflow: hidden; user-select: none; text-align: right; }
    .code-editor { flex: 1; padding: 8px 12px; background: #0f172a; color: #e2e8f0; border: none; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; resize: none; outline: none; overflow: auto; white-space: pre; }
    .results-panel { width: 350px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .results-header { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #58a6ff; font-weight: 600; }
    .results-list { flex: 1; overflow-y: auto; padding: 8px; }
    .result-item { padding: 8px; margin-bottom: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 10px; }
    .result-item:hover { background: #1e293b; border-color: #58a6ff; }
    .result-item.active { background: #1e293b; border-color: #3fb950; box-shadow: 0 0 8px rgba(63, 185, 80, 0.3); }
    .result-line { color: #58a6ff; font-weight: 600; margin-bottom: 2px; }
    .result-context { color: #94a3b8; font-size: 9px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    .highlight-match { background: rgba(255, 193, 7, 0.3); color: #ffc107; font-weight: 600; }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 16px; background: #3fb950; color: #fff; border-radius: 8px; font-size: 11px; font-weight: 600; z-index: 9999; animation: slideIn 0.3s ease-out; }
    .toast.err { background: #ff6b6b; }
    .toast.warn { background: #ffc107; color: #000; }
    @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 768px) { .results-panel { width: 100%; height: 200px; border-left: none; border-top: 1px solid #334155; } .editor-area { flex-direction: column; } .code-panel { border-right: none; border-bottom: 1px solid #334155; } }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-title">🔍 Iara Search Pro</div>
    <div class="header-buttons">
      <div class="file-input-wrapper">
        <button class="btn">📁 Importar</button>
        <input type="file" id="file-input" accept="*" multiple>
      </div>
      <button class="btn danger" id="btn-clear">🗑️ Limpar</button>
      <button class="btn success" id="btn-export">💾 Exportar</button>
    </div>
    <div class="header-status">
      <span id="status-text">Pronto</span>
    </div>
  </div>
  
  <div class="content">
    <div class="sidebar">
      <div class="sidebar-header">📂 Arquivos</div>
      <div class="files-list" id="files-list">
        <div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">📁 Importe um arquivo</div>
      </div>
    </div>
    
    <div class="main-area">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar no código...">
        <div class="search-options">
          <label class="checkbox-label">
            <input type="checkbox" id="case-sensitive"> Maiúscula/Minúscula
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="regex-mode"> Regex
          </label>
          <span id="match-count" style="font-size: 11px; color: #3fb950; min-width: 100px;">0 resultados</span>
        </div>
      </div>
      
      <div class="editor-area">
        <div class="code-panel">
          <div class="panel-header">
            <span class="panel-header-title" id="editor-title">📄 Código</span>
            <span id="editor-info" style="font-size: 10px; color: #94a3b8;"></span>
          </div>
          <div class="code-wrapper">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea class="code-editor" id="code-editor" placeholder="Importe um arquivo..." readonly></textarea>
          </div>
        </div>
        
        <div class="results-panel">
          <div class="results-header">🔎 Resultados</div>
          <div class="results-list" id="results-list">
            <div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">Digite para buscar...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const qs = s => document.querySelector(s);
  const qsa = s => [...document.querySelectorAll(s)];
  
  let files = [];
  let currentFile = null;
  let currentMatches = [];
  let currentMatchIndex = 0;
  
  function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
  
  function getExt(name) {
    return (name.split('.').pop() || '').toLowerCase();
  }
  
  function updateLineNums() {
    const ta = qs('#code-editor');
    const ln = qs('#line-numbers');
    const lines = ta.value.split('\n').length;
    ln.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  }
  
  function syncScroll() {
    const ta = qs('#code-editor');
    const ln = qs('#line-numbers');
    ln.scrollTop = ta.scrollTop;
  }
  
  async function handleFileUpload(e) {
    const fileList = e.target.files;
    if (!fileList.length) return;
    
    qs('#status-text').textContent = '📥 Processando...';
    
    try {
      for (let file of fileList) {
        const content = await file.text();
        files.push({
          name: file.name,
          content: content,
          ext: getExt(file.name),
          size: file.size
        });
      }
      renderFilesList();
      toast('✅ Arquivo(s) carregado(s)!');
    } catch (err) {
      toast('❌ Erro: ' + err.message, 'err');
    }
    
    qs('#status-text').textContent = 'Pronto';
    qs('#file-input').value = '';
  }
  
  function renderFilesList() {
    const html = files.map((f, i) => `
      <div class="file-item ${currentFile === i ? 'active' : ''}" onclick="selectFile(${i})">
        <div class="file-item-name">📄 ${f.name.split('/').pop()}</div>
        <div class="file-item-info">${f.ext.toUpperCase()} · ${(f.size / 1024).toFixed(1)}KB</div>
      </div>
    `).join('');
    
    qs('#files-list').innerHTML = html || '<div style="color: #94a3b8; font-size: 11px; padding: 20px;">Nenhum arquivo</div>';
  }
  
  function selectFile(i) {
    currentFile = i;
    const file = files[i];
    
    qs('#code-editor').value = file.content;
    qs('#editor-title').textContent = `📄 ${file.name}`;
    qs('#editor-info').textContent = file.ext.toUpperCase();
    
    updateLineNums();
    renderFilesList();
    performSearch();
  }
  
  function performSearch() {
    if (currentFile === null) {
      qs('#results-list').innerHTML = '<div style="color: #94a3b8; font-size: 11px; padding: 20px;">Selecione um arquivo</div>';
      return;
    }
    
    const searchTerm = qs('#search-input').value;
    const caseSensitive = qs('#case-sensitive').checked;
    const regexMode = qs('#regex-mode').checked;
    
    if (!searchTerm) {
      qs('#results-list').innerHTML = '<div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">Digite para buscar...</div>';
      qs('#match-count').textContent = '0 resultados';
      return;
    }
    
    const file = files[currentFile];
    const lines = file.content.split('\n');
    currentMatches = [];
    
    try {
      let regex;
      if (regexMode) {
        regex = new RegExp(searchTerm, caseSensitive ? 'g' : 'gi');
      } else {
        const escaped = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        regex = new RegExp(escaped, caseSensitive ? 'g' : 'gi');
      }
      
      lines.forEach((line, lineNum) => {
        let match;
        while ((match = regex.exec(line)) !== null) {
          currentMatches.push({
            line: lineNum,
            column: match.index,
            text: match[0],
            context: line
          });
        }
      });
    } catch (err) {
      toast('❌ Erro na regex: ' + err.message, 'err');
      return;
    }
    
    qs('#match-count').textContent = `${currentMatches.length} resultado(s)`;
    
    if (currentMatches.length === 0) {
      qs('#results-list').innerHTML = '<div style="color: #ff6b6b; font-size: 11px; text-align: center; padding: 20px;">❌ Nenhum resultado</div>';
      return;
    }
    
    const html = currentMatches.map((m, i) => `
      <div class="result-item ${i === 0 ? 'active' : ''}" onclick="goToMatch(${i})">
        <div class="result-line">Linha ${m.line + 1}</div>
        <div class="result-context">${escapeHtml(m.context.slice(0, 60))}</div>
      </div>
    `).join('');
    
    qs('#results-list').innerHTML = html;
    goToMatch(0);
  }
  
  function goToMatch(i) {
    if (i < 0 || i >= currentMatches.length) return;
    
    currentMatchIndex = i;
    const match = currentMatches[i];
    
    // Highlight no editor
    const ta = qs('#code-editor');
    const lines = ta.value.split('\n');
    const beforeLines = lines.slice(0, match.line).join('\n');
    const startPos = beforeLines.length + (match.line > 0 ? 1 : 0) + match.column;
    const endPos = startPos + match.text.length;
    
    ta.focus();
    ta.setSelectionRange(startPos, endPos);
    
    // Scroll
    const lineHeight = 17.6;
    ta.scrollTop = match.line * lineHeight - 100;
    
    // Atualizar resultado ativo
    qsa('.result-item').forEach((el, idx) => {
      el.classList.toggle('active', idx === i);
    });
    
    // Scroll resultado para vista
    const resultItem = qsa('.result-item')[i];
    if (resultItem) {
      resultItem.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }
  }
  
  function escapeHtml(text) {
    const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
    return text.replace(/[&<>"']/g, m => map[m]);
  }
  
  function clearAll() {
    if (confirm('🗑️ Limpar todos os arquivos?')) {
      files = [];
      currentFile = null;
      qs('#code-editor').value = '';
      qs('#files-list').innerHTML = '<div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">📁 Importe um arquivo</div>';
      qs('#results-list').innerHTML = '<div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">Digite para buscar...</div>';
      toast('🗑️ Tudo limpo!');
    }
  }
  
  function exportFile() {
    if (currentFile === null) {
      toast('❌ Selecione um arquivo', 'err');
      return;
    }
    
    const file = files[currentFile];
    const blob = new Blob([file.content], {type: 'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('✅ Exportado!');
  }
  
  qs('#file-input').addEventListener('change', handleFileUpload);
  qs('#search-input').addEventListener('input', performSearch);
  qs('#case-sensitive').addEventListener('change', performSearch);
  qs('#regex-mode').addEventListener('change', performSearch);
  qs('#btn-clear').addEventListener('click', clearAll);
  qs('#btn-export').addEventListener('click', exportFile);
  qs('#code-editor').addEventListener('scroll', syncScroll);
  
  // Navegação com teclado
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'g') {
      e.preventDefault();
      goToMatch(currentMatchIndex + 1);
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'G') {
      e.preventDefault();
      goToMatch(currentMatchIndex - 1);
    }
  });
</script>

</body>
</html>
