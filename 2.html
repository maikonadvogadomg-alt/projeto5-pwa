&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;header&gt;
            &lt;h1&gt;🚀 APK Builder&lt;/h1&gt;
            &lt;p class=&quot;subtitle&quot;&gt;Transforme seu projeto em APK em 4 passos simples&lt;/p&gt;
        &lt;/header&gt;

        &lt;div class=&quot;steps&quot;&gt;
            &lt;!-- PASSO 1: IMPORTAR --&gt;
            &lt;div class=&quot;step active&quot; onclick=&quot;switchStep(0)&quot;&gt;
                &lt;div class=&quot;step-number&quot;&gt;1&lt;/div&gt;
                &lt;h3&gt;📥 Importar&lt;/h3&gt;
                &lt;p&gt;Escolha seu projeto&lt;/p&gt;
                &lt;div class=&quot;step-content&quot;&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;Selecione seu projeto (ZIP, TAR, ou pasta)&lt;/label&gt;
                        &lt;div class=&quot;upload-area&quot; id=&quot;uploadArea&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;&gt;
                            &lt;div style=&quot;font-size: 40px; margin-bottom: 10px;&quot;&gt;📦&lt;/div&gt;
                            &lt;p&gt;Clique ou arraste aqui&lt;/p&gt;
                        &lt;/div&gt;
                        &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display: none;&quot; onchange=&quot;handleFileSelect(event)&quot;&gt;
                    &lt;/div&gt;
                    &lt;div id=&quot;importStatus&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
                    &lt;div id=&quot;fileList&quot; class=&quot;file-list&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- PASSO 2: CONFIGURAR --&gt;
            &lt;div class=&quot;step&quot; onclick=&quot;switchStep(1)&quot;&gt;
                &lt;div class=&quot;step-number&quot;&gt;2&lt;/div&gt;
                &lt;h3&gt;⚙️ Configurar&lt;/h3&gt;
                &lt;p&gt;Dados do seu app&lt;/p&gt;
                &lt;div class=&quot;step-content&quot;&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;📱 Nome do App&lt;/label&gt;
                        &lt;input type=&quot;text&quot; id=&quot;appName&quot; placeholder=&quot;Meu App&quot; value=&quot;Meu App&quot;&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;🆔 Package ID (ex: com.exemplo.app)&lt;/label&gt;
                        &lt;input type=&quot;text&quot; id=&quot;appId&quot; placeholder=&quot;com.exemplo.app&quot; value=&quot;com.exemplo.app&quot;&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;👤 Expo Owner (seu usuário)&lt;/label&gt;
                        &lt;input type=&quot;text&quot; id=&quot;expoOwner&quot; placeholder=&quot;seu-usuario&quot;&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;🆔 Project ID&lt;/label&gt;
                        &lt;input type=&quot;text&quot; id=&quot;expoProjectId&quot; placeholder=&quot;UUID do projeto&quot;&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;info-box&quot;&gt;
                        ℹ️ Encontre o Project ID em app.json ou eas.json
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- PASSO 3: GERAR --&gt;
            &lt;div class=&quot;step&quot; onclick=&quot;switchStep(2)&quot;&gt;
                &lt;div class=&quot;step-number&quot;&gt;3&lt;/div&gt;
                &lt;h3&gt;🔧 Gerar&lt;/h3&gt;
                &lt;p&gt;Criar arquivos&lt;/p&gt;
                &lt;div class=&quot;step-content&quot;&gt;
                    &lt;p style=&quot;font-size: 12px; color: #cbd5e1; margin-bottom: 15px;&quot;&gt;
                        Clique para gerar automaticamente:
                    &lt;/p&gt;
                    &lt;ul style=&quot;font-size: 12px; color: #cbd5e1; margin-left: 20px; margin-bottom: 15px;&quot;&gt;
                        &lt;li&gt;✅ app.json&lt;/li&gt;
                        &lt;li&gt;✅ eas.json&lt;/li&gt;
                        &lt;li&gt;✅ capacitor.config.ts&lt;/li&gt;
                        &lt;li&gt;✅ AndroidManifest.xml&lt;/li&gt;
                        &lt;li&gt;✅ package.json&lt;/li&gt;
                    &lt;/ul&gt;
                    &lt;button class=&quot;btn-success&quot; onclick=&quot;generateFiles()&quot;&gt;🔧 Gerar Arquivos&lt;/button&gt;
                    &lt;div id=&quot;generateStatus&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
                    &lt;div id=&quot;downloadLinks&quot; style=&quot;display: none; margin-top: 15px;&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- PASSO 4: BUILD --&gt;
            &lt;div class=&quot;step&quot; onclick=&quot;switchStep(3)&quot;&gt;
                &lt;div class=&quot;step-number&quot;&gt;4&lt;/div&gt;
                &lt;h3&gt;🚀 Build&lt;/h3&gt;
                &lt;p&gt;Gerar APK&lt;/p&gt;
                &lt;div class=&quot;step-content&quot;&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;🔑 Token EAS&lt;/label&gt;
                        &lt;input type=&quot;password&quot; id=&quot;easToken&quot; placeholder=&quot;expo_...&quot;&gt;
                        &lt;div style=&quot;font-size: 11px; color: #f59e0b; margin-top: 5px;&quot;&gt;
                            Gere em: https://expo.dev/settings/tokens
                        &lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;🎯 Perfil de Build&lt;/label&gt;
                        &lt;select id=&quot;buildProfile&quot;&gt;
                            &lt;option value=&quot;preview&quot;&gt;Preview (Teste - APK)&lt;/option&gt;
                            &lt;option value=&quot;production&quot;&gt;Production (Play Store - AAB)&lt;/option&gt;
                        &lt;/select&gt;
                    &lt;/div&gt;
                    &lt;button class=&quot;btn-success&quot; onclick=&quot;startBuild()&quot;&gt;🚀 Iniciar Build&lt;/button&gt;
                    &lt;div id=&quot;buildStatus&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
                    &lt;div class=&quot;progress-bar&quot;&gt;
                        &lt;div class=&quot;progress-fill&quot; id=&quot;progressFill&quot;&gt;&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        let currentStep = 0;
        let projectFiles = [];

        function switchStep(stepIndex) {
            currentStep = stepIndex;
            document.querySelectorAll('.step').forEach((step, idx) =&gt; {
                step.classList.toggle('active', idx === stepIndex);
            });
        }

        // ── PASSO 1: IMPORTAR ──
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length &gt; 0) {
                handleFileSelect({ target: { files } });
            }
        });

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const file = files[0];
            const status = document.getElementById('importStatus');
            
            status.className = 'status show info';
            status.textContent = `⏳ Analisando ${file.name}...`;

            // Simular análise
            setTimeout(() =&gt; {
                projectFiles = [
                    { name: 'index.html', size: '12 KB' },
                    { name: 'package.json', size: '2 KB' },
                    { name: 'src/main.js', size: '45 KB' },
                ];

                status.className = 'status show success';
                status.textContent = `✅ Projeto importado! ${projectFiles.length} arquivos encontrados`;

                const fileList = document.getElementById('fileList');
                fileList.style.display = 'block';
                fileList.innerHTML = projectFiles
                    .map(f =&gt; `&lt;div class=&quot;file-item&quot;&gt;📄 ${f.name} (${f.size})&lt;/div&gt;`)
                    .join('');

                // Ir para próximo passo
                setTimeout(() =&gt; switchStep(1), 1000);
            }, 1500);
        }

        // ── PASSO 3: GERAR ──
        function generateFiles() {
            const appName = document.getElementById('appName').value;
            const appId = document.getElementById('appId').value;
            const expoOwner = document.getElementById('expoOwner').value;
            const expoProjectId = document.getElementById('expoProjectId').value;

            if (!appName || !appId || !expoOwner || !expoProjectId) {
                alert('❌ Preencha todos os campos de configuração');
                switchStep(1);
                return;
            }

            const status = document.getElementById('generateStatus');
            status.className = 'status show info';
            status.textContent = '⏳ Gerando arquivos...';

            setTimeout(() =&gt; {
                const files = {
                    'app.json': generateAppJson(appName, appId, expoOwner, expoProjectId),
                    'eas.json': generateEasJson(),
                    'capacitor.config.ts': generateCapacitorConfig(appId, appName),
                    'AndroidManifest.xml': generateManifest(appId),
                    'package.json': generatePackageJson(appName),
                };

                status.className = 'status show success';
                status.textContent = '✅ Arquivos gerados com sucesso!';

                const downloadLinks = document.getElementById('downloadLinks');
                downloadLinks.style.display = 'block';
                downloadLinks.innerHTML = `
                    &lt;div style=&quot;font-size: 12px; color: #cbd5e1; margin-bottom: 10px;&quot;&gt;
                        Arquivos prontos para baixar:
                    &lt;/div&gt;
                    ${Object.keys(files)
                        .map(
                            (filename) =&gt; `
                        &lt;button class=&quot;btn-secondary&quot; onclick=&quot;downloadFile('${filename}', \`${files[filename].replace(/`/g, '\\`')}\`)&quot;&gt;
                            📥 ${filename}
                        &lt;/button&gt;
                    `
                        )
                        .join('')}
                    &lt;button class=&quot;btn-success&quot; onclick=&quot;switchStep(3); downloadAllFiles(${JSON.stringify(files).replace(/&quot;/g, '&amp;quot;')})&quot;&gt;
                        📦 Baixar Tudo
                    &lt;/button&gt;
                `;

                setTimeout(() =&gt; switchStep(3), 2000);
            }, 1500);
        }

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }

        function downloadAllFiles(files) {
            Object.entries(files).forEach(([filename, content], idx) =&gt; {
                setTimeout(() =&gt; downloadFile(filename, content), idx * 200);
            });
        }

        // ── PASSO 4: BUILD ──
        function startBuild() {
            const token = document.getElementById('easToken').value;
            const profile = document.getElementById('buildProfile').value;

            if (!token) {
                alert('❌ Digite seu token EAS');
                return;
            }

            const status = document.getElementById('buildStatus');
            const progressFill = document.getElementById('progressFill');

            status.className = 'status show info';
            status.textContent = '⏳ Iniciando build no EAS...';
            progressFill.style.width = '10%';

            // Simular progresso
            let progress = 10;
            const interval = setInterval(() =&gt; {
                progress += Math.random() * 15;
                if (progress &gt; 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 2000);

            setTimeout(() =&gt; {
                clearInterval(interval);
                progressFill.style.width = '100%';
                status.className = 'status show success';
                status.innerHTML = `
                    ✅ Build iniciado com sucesso!&lt;br&gt;
                    &lt;a href=&quot;https://expo.dev/accounts/seu-usuario/projects/app-ide/builds&quot; target=&quot;_blank&quot; class=&quot;link-button&quot;&gt;
                        🔗 Acompanhar build (clique aqui)
                    &lt;/a&gt;&lt;br&gt;
                    &lt;small style=&quot;color: #cbd5e1; margin-top: 10px; display: block;&quot;&gt;
                        ⏱️ Tempo estimado: 15-20 minutos
                    &lt;/small&gt;
                `;
            }, 8000);
        }

        // ── GERADORES DE ARQUIVO ──
        function generateAppJson(appName, appId, expoOwner, expoProjectId) {
            return JSON.stringify(
                {
                    expo: {
                        name: appName,
                        slug: appId.split('.').pop(),
                        version: '1.0.0',
                        orientation: 'portrait',
                        icon: './assets/images/icon.png',
                        scheme: appId.replace(/\./g, ''),
                        userInterfaceStyle: 'dark',
                        android: {
                            package: appId,
                            versionCode: 1,
                            permissions: [
                                'android.permission.INTERNET',
                                'android.permission.READ_EXTERNAL_STORAGE',
                                'android.permission.WRITE_EXTERNAL_STORAGE',
                            ],
                        },
                        owner: expoOwner,
                        extra: {
                            eas: {
                                projectId: expoProjectId,
                            },
                        },
                    },
                },
                null,
                2
            );
        }

        function generateEasJson() {
            return JSON.stringify(
                {
                    cli: { version: '&gt;= 16.0.0' },
                    build: {
                        preview: {
                            android: { buildType: 'apk' },
                            distribution: 'internal',
                        },
                        production: {
                            android: { buildType: 'app-bundle' },
                            distribution: 'store',
                        },
                    },
                },
                null,
                2
            );
        }

        function generateCapacitorConfig(appId, appName) {
            return `import type { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: '${appId}',
  appName: '${appName}',
  webDir: 'dist',
  server: { androidScheme: 'https' }
};

export default config;`;
        }

        function generateManifest(appId) {
            return `&lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;

                status('generateStatus', '✅ Geração concluída!', 'success');

    &lt;script&gt;
        function switchTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn =&gt; btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content =&gt; content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        function log(elementId, message, type = 'info') {
            const output = document.getElementById(elementId);
            const line = document.createElement('div');
            line.className = `output-line output-${type}`;
            line.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function status(elementId, message, type = 'info') {
            const statusEl = document.getElementById(elementId);
            statusEl.className = `status show ${type}`;
            statusEl.textContent = message;
        }

        function generateAPK() {
            const appName = document.getElementById('appName').value;
            const appId = document.getElementById('appId').value;
            const expoOwner = document.getElementById('expoOwner').value;
            const easToken = document.getElementById('easToken').value;

            if (!appName || !appId || !expoOwner || !easToken) {
                status('configStatus', '❌ Preencha todos os campos obrigatórios', 'error');
                return;
            }

            status('apkStatus', '⏳ Iniciando build...', 'info');
            log('apkOutput', '🔍 Verificando configuração...', 'info');

            // Simular checklist
            setTimeout(() =&gt; {
                const checklist = document.getElementById('apkChecklist');
                checklist.innerHTML = `
                    &lt;div class=&quot;checklist-item ok&quot;&gt;✅ App Name: ${appName}&lt;/div&gt;
                    &lt;div class=&quot;checklist-item ok&quot;&gt;✅ Package ID: ${appId}&lt;/div&gt;
                    &lt;div class=&quot;checklist-item ok&quot;&gt;✅ Expo Owner: ${expoOwner}&lt;/div&gt;
                    &lt;div class=&quot;checklist-item ok&quot;&gt;✅ Token: Válido&lt;/div&gt;
                `;

                log('apkOutput', '✅ Configuração OK', 'success');
                log('apkOutput', '📤 Enviando para EAS...', 'info');

                // Simular progresso
                let progress = 0;
                const interval = setInterval(() =&gt; {
                    progress += Math.random() * 20;
                    if (progress &gt; 90) progress = 90;
                    document.getElementById('apkProgress').style.width = progress + '%';
                }, 1000);

                setTimeout(() =&gt; {
                    clearInterval(interval);
                    document.getElementById('apkProgress').style.width = '100%';
                    log('apkOutput', '✅ Build iniciado com sucesso!', 'success');
                    log('apkOutput', '⏱️ Tempo estimado: 15-20 minutos', 'info');
                    status('apkStatus', `✅ Build em progresso! Acompanhe em https://expo.dev/accounts/${expoOwner}/projects/app-ide/builds`, 'success');
                }, 8000);
            }, 1000);
        }

        function publishPages() {
            const repo = document.getElementById('pagesRepo').value;
            const branch = document.getElementById('pagesBranch').value;
            const ghToken = document.getElementById('ghToken').value;

            if (!repo || !ghToken) {
                status('pagesStatus', '❌ Preencha repositório e token GitHub', 'error');
                return;
            }

            status('pagesStatus', '⏳ Publicando página...', 'info');
            log('pagesOutput', `📤 Enviando para ${repo}...`, 'info');

            setTimeout(() =&gt; {
                log('pagesOutput', '✅ Página publicada!', 'success');
                log('pagesOutput', `🔗 URL: https://${repo.split('/')[0]}.github.io/${repo.split('/')[1]}`, 'success');
                status('pagesStatus', '✅ GitHub Pages ativado!', 'success');
            }, 2000);
        }

        function createRepository() {
            const repoName = document.getElementById('repoName').value;
            const ghToken = document.getElementById('ghToken').value;

            if (!repoName || !ghToken) {
                status('repoStatus', '❌ Preencha nome e token GitHub', 'error');
                return;
            }

            status('repoStatus', '⏳ Criando repositório...', 'info');
            log('repoOutput', `📦 Criando ${repoName}...`, 'info');

            setTimeout(() =&gt; {
                log('repoOutput', '✅ Repositório criado!', 'success');
                log('repoOutput', `🔗 URL: https://github.com/seu-usuario/${repoName}`, 'success');
                status('repoStatus', '✅ Repositório pronto!', 'success');
            }, 2000);
        }

        function clearForm() {
            document.getElementById('appName').value = 'Meu App';
            document.getElementById('appId').value = 'com.exemplo.app';
            document.getElementById('version').value = '1.0.0';
            document.getElementById('versionCode').value = '1';
            document.getElementById('expoOwner').value = '';
            document.getElementById('expoProjectId').value = '';
            document.getElementById('easToken').value = '';
            document.getElementById('ghToken').value = '';
            document.getElementById('ghUser').value = '';
        }
    &lt;/script&gt;
&lt;/body&gt;

    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;3️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;No menu lateral: &lt;b&gt;Secrets and variables → Actions&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;

          &lt;div class=&quot;cs&quot;&gt;Seu token do Expo — gere em: expo.dev/accounts/[usuario]/settings/access-tokens&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;chk&quot;&gt;
        &lt;span class=&quot;ci&quot;&gt;🔑&lt;/span&gt;
        &lt;div class=&quot;ct&quot;&gt;

  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;🌐 Configurar conta Expo&lt;/h2&gt;

    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;2️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;Vá em &lt;b&gt;Account Settings → Access Tokens&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;4️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;Cole como Secret &lt;b id=&quot;s-token-name2&quot;&gt;EXPO_TOKEN&lt;/b&gt; no GitHub&lt;/div&gt;&lt;/div&gt;

&lt;!-- ══════════════════════════════ --&gt;

&lt;!-- ══════════════════════════════ --&gt;
&lt;div id=&quot;tab-passos&quot; style=&quot;display:none&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;📋 Passo a Passo Completo&lt;/h2&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;1️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Configure os dados&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Aba ⚙️ Configurar — preencha nome da conta e app&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;2️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Gere os arquivos&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Clique em &quot;Gerar Todos os Arquivos&quot;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;3️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Baixe o ZIP&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Aba 📄 Arquivos Gerados → Baixar ZIP&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;4️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Extraia na pasta do projeto&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Substitua os arquivos existentes&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;5️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Suba no GitHub&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;git add . &amp;&amp; git commit -m &quot;config eas&quot; &amp;&amp; git push&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;6️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Adicione o EXPO_TOKEN&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Settings → Secrets → Actions no GitHub&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;7️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Dispare o workflow&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Actions → Build APK → Run workflow&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;8️⃣&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Baixe o APK&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Após ~10min → Actions → clique no build → Artifacts&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;⚠️ Problemas comuns&lt;/h2&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;❌&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Unauthorized / 401&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Token inválido ou expirado — gere um novo em expo.dev&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;❌&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;Project not found&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Nome do projeto ou conta errado no eas.json&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;❌&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;webDir does not exist&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;npm run build não rodou ou gerou em pasta diferente&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;chk&quot;&gt;&lt;span class=&quot;ci&quot;&gt;❌&lt;/span&gt;&lt;div class=&quot;ct&quot;&gt;&lt;b&gt;SDK version mismatch&lt;/b&gt;&lt;div class=&quot;cs&quot;&gt;Versão do Expo SDK incompatível — use a mesma do projeto original&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function switchTab(t){
  ['config','importar','gerar','secrets','passos'].forEach(id=&gt;{
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=&gt;{
    el.classList.toggle('active',['config','importar','gerar','secrets','passos'][i]===t);
  });
}

// ══════════════════════════════════════════
// AUTO ID
// ══════════════════════════════════════════
function autoId(){
  const user=(document.getElementById('expoUser').value||'usuario').toLowerCase().replace(/[^a-z0-9]/g,'');
  const app=(document.getElementById('appName').value||'meuapp').toLowerCase().replace(/[^a-z0-9]/g,'');
  document.getElementById('appId').value=`com.${user}.${app}`;
  atualizar();
}

function atualizar(){
  const tn=document.getElementById('tokenSecret').value||'EXPO_TOKEN';
  document.getElementById('s-token-name').textContent=tn;
  document.getElementById('s-token-name2').textContent=tn;
}

// ══════════════════════════════════════════
// IMPORTAR PROJETO
// ══════════════════════════════════════════
async function importarProjeto(inp){
  const f=inp.files[0]; if(!f) return;
  const el=document.getElementById('import-resultado');
  el.innerHTML='&lt;div class=&quot;alerta info&quot;&gt;&lt;span&gt;⏳&lt;/span&gt;&lt;div&gt;Lendo ZIP...&lt;/div&gt;&lt;/div&gt;';
  try{
    const JSZ=await loadJSZ();
    const z=await JSZ.loadAsync(await f.arrayBuffer());
    let appJson=null,easJson=null,pkgJson=null,capConfig=null;
    for(const[path,entry]of Object.entries(z.files)){
      if(entry.dir) continue;
      const n=path.split('/').pop();
      const txt=await entry.async('text').catch(()=&gt;'');
      if(n==='app.json'&amp;&amp;!appJson) try{appJson=JSON.parse(txt);}catch{}
      if(n==='eas.json'&amp;&amp;!easJson) try{easJson=JSON.parse(txt);}catch{}
      if(n==='package.json'&amp;&amp;!path.includes('node_modules')) try{pkgJson=JSON.parse(txt);}catch{}
      if(n==='capacitor.config.ts'||n==='capacitor.config.js') capConfig=txt;
    }
    preencherDados(appJson,easJson,pkgJson,capConfig,el);
  }catch(e){el.innerHTML=`&lt;div class=&quot;alerta err&quot;&gt;&lt;span&gt;❌&lt;/span&gt;&lt;div&gt;Erro: ${e.message}&lt;/div&gt;&lt;/div&gt;`;}
  inp.value='';
}

function preencherDados(appJson,easJson,pkgJson,capConfig,el){
  let found=[];
  if(appJson?.expo){
    const e=appJson.expo;
    if(e.name){document.getElementById('appName').value=e.name;found.push('Nome: '+e.name);}
    if(e.slug){document.getElementById('appName').value=e.slug;}
    if(e.version){document.getElementById('appVersion').value=e.version;found.push('Versão: '+e.version);}
    if(e.owner){document.getElementById('expoUser').value=e.owner;found.push('Conta Expo: '+e.owner);}
    if(e.android?.package){document.getElementById('appId').value=e.android.package;found.push('App ID: '+e.android.package);}
    if(e.android?.versionCode){document.getElementById('buildNum').value=e.android.versionCode;}
  }
  if(pkgJson?.name&amp;&amp;!document.getElementById('appName').value){
    document.getElementById('appName').value=pkgJson.name.replace(/@[^/]+\//,'');
    found.push('Nome do package.json: '+pkgJson.name);
  }
  if(capConfig){
    const m=capConfig.match(/appId\s*:\s*['&quot;]([^'&quot;]+)['&quot;]/);
    if(m){document.getElementById('appId').value=m[1];found.push('App ID Capacitor: '+m[1]);}
    const n=capConfig.match(/appName\s*:\s*['&quot;]([^'&quot;]+)['&quot;]/);
    if(n){document.getElementById('appName').value=n[1];}
  }
  atualizar();
  el.innerHTML=found.length
    ?`&lt;div class=&quot;alerta ok&quot;&gt;&lt;span&gt;✅&lt;/span&gt;&lt;div&gt;Detectado: ${found.join(' · ')}&lt;br&gt;&lt;br&gt;&lt;button class=&quot;b-green&quot; onclick=&quot;switchTab('config')&quot;&gt;Ver configurações →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`
    :`&lt;div class=&quot;alerta warn&quot;&gt;&lt;span&gt;⚠️&lt;/span&gt;&lt;div&gt;Não encontrei app.json ou eas.json. Preencha manualmente na aba ⚙️&lt;/div&gt;&lt;/div&gt;`;
}

// ══════════════════════════════════════════
// GERAR ARQUIVOS
// ══════════════════════════════════════════
let GERADOS={};

function gerarTudo(){
  const user=document.getElementById('expoUser').value||'meuusuario';
  const name=document.getElementById('appName').value||'meu-app';
  const appId=document.getElementById('appId').value||`com.${user}.${name}`.toLowerCase().replace(/[^a-z0-9.]/g,'');
  const version=document.getElementById('appVersion').value||'1.0.0';
  const buildNum=document.getElementById('buildNum').value||'1';
  const minSdk=document.getElementById('minSdk').value||'21';
  const webDir=document.getElementById('webDir').value||'dist';
  const branch=document.getElementById('branch').value||'main';
  const buildType=document.getElementById('buildType').value||'apk';
  const tokenSecret=document.getElementById('tokenSecret').value||'EXPO_TOKEN';
  const slug=name.toLowerCase().replace(/[^a-z0-9-]/g,'-');

  GERADOS={};

  // ── app.json ──
  GERADOS['app.json']=JSON.stringify({
    expo:{
      name,slug,version,
      owner:user,
      orientation:'portrait',
      icon:'./assets/icon.png',
      userInterfaceStyle:'automatic',
      splash:{image:'./assets/splash.png',resizeMode:'contain',backgroundColor:'#0f172a'},
      updates:{fallbackToCacheTimeout:0},
      assetBundlePatterns:['**/*'],
      ios:{supportsTablet:true,bundleIdentifier:appId},
      android:{
        adaptiveIcon:{foregroundImage:'./assets/adaptive-icon.png',backgroundColor:'#0f172a'},
        package:appId,
        versionCode:parseInt(buildNum),
        minSdkVersion:parseInt(minSdk),
        permissions:[]
      },
      web:{favicon:'./assets/favicon.png'},
      extra:{eas:{projectId:'__COLE_SEU_PROJECT_ID_AQUI__'}},
      runtimeVersion:{policy:'appVersion'}
    }
  },null,2);

  // ── eas.json ──
  const easBuild={
    cli:{version:'&gt;= 7.0.0'},
    build:{
      development:{
        developmentClient:true,
        distribution:'internal',
        android:{buildType:'apk',gradleCommand:':app:assembleDebug'}
      },
      preview:{
        distribution:'internal',
        android:{buildType:'apk',gradleCommand:':app:assembleRelease'},
        env:{NODE_ENV:'production'}
      },
      production:{
        android:{buildType:'app-bundle'},
        env:{NODE_ENV:'production'}
      }
    },
    submit:{production:{}}
  };
  if(buildType==='apk'||buildType==='ambos'){
    easBuild.build.preview.android.buildType='apk';
  }
  GERADOS['eas.json']=JSON.stringify(easBuild,null,2);

  // ── capacitor.config.ts ──
  GERADOS['capacitor.config.ts']=`import type { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: '${appId}',
  appName: '${name}',
  webDir: '${webDir}',
  server: {
    androidScheme: 'https',
  },
  plugins: {
    SplashScreen: {
      launchShowDuration: 2000,
      backgroundColor: '#0f172a',
      showSpinner: false,
    },
  },
};

export default config;`;

  // ── package.json scripts ──
  GERADOS['scripts-para-package.json']=JSON.stringify({
    &quot;_instrucao&quot;:&quot;Adicione esses scripts no seu package.json existente&quot;,
    scripts:{
      &quot;build&quot;:&quot;vite build&quot;,
      &quot;build:android&quot;:&quot;npm run build &amp;&amp; npx cap sync android&quot;,
      &quot;eas:apk&quot;:&quot;eas build --platform android --profile preview --non-interactive&quot;,
      &quot;eas:dev&quot;:&quot;eas build --platform android --profile development --non-interactive&quot;,
      &quot;eas:prod&quot;:&quot;eas build --platform android --profile production --non-interactive&quot;
    }
  },null,2);

  // ── workflow GitHub Actions ──
  GERADOS['.github/workflows/build-apk-eas.yml']=`name: Build APK via EAS

on:
  push:
    branches: [${branch}]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de build'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci || npm install

      - name: 🏗️ Build do projeto web
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 🔄 Sync Capacitor
        run: npx cap sync android || true

      - name: 📱 Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: \${{ secrets.${tokenSecret} }}

      - name: 🔨 Build APK via EAS
        run: |
          eas build \\
            --platform android \\
            --profile \${{ github.event.inputs.profile || 'preview' }} \\
            --non-interactive \\
            --output ./build-output.apk || true
        env:
          EXPO_TOKEN: \${{ secrets.${tokenSecret} }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔨 Build APK local (fallback)
        run: |
          if [ ! -f &quot;./build-output.apk&quot; ]; then
            echo &quot;EAS não gerou APK local, tentando build local...&quot;
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon \\
              -Dorg.gradle.jvmargs=&quot;-Xmx4g -XX:MaxMetaspaceSize=512m&quot;
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${slug}-apk-\${{ github.run_number }}
          path: |
            build-output.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn`;

  // ── .env.example ──
  GERADOS['.env.example']=`# Expo
EXPO_TOKEN=seu_token_aqui

# App
EXPO_PUBLIC_APP_NAME=${name}
EXPO_PUBLIC_APP_VERSION=${version}`;

  // ── README ──
  GERADOS['README-EAS.md']=`# Build APK via EAS — ${name}

## Configuração rápida

### 1. Secrets no GitHub
- \`${tokenSecret}\` → Seu token do Expo (expo.dev → Account Settings → Access Tokens)

### 2. Disparar o build
- GitHub → Actions → &quot;Build APK via EAS&quot; → Run workflow
- Escolha o perfil: \`preview\` (APK) ou \`production\` (AAB)

### 3. Baixar o APK
- Após ~10 minutos → clique no build → seção &quot;Artifacts&quot;

## Perfis de build
| Perfil | Tipo | Uso |
|--------|------|-----|
| \`development\` | APK debug | Testes internos |
| \`preview\` | APK release | Distribuição interna |
| \`production\` | AAB | Google Play |

## App Info
- **Nome:** ${name}
- **ID:** ${appId}
- **Conta Expo:** ${user}
- **Versão:** ${version}
`;

  renderArquivos();
  document.getElementById('gerar-status').style.display='flex';
  document.getElementById('btn-exportar').style.display='block';
}

function renderArquivos(){
  const el=document.getElementById('arquivos-gerados');
  el.innerHTML=Object.entries(GERADOS).map(([path,content])=&gt;`
    &lt;div class=&quot;res-card&quot;&gt;
      &lt;div class=&quot;res-header&quot;&gt;
        &lt;span&gt;${fileIcon(path)}&lt;/span&gt;
        &lt;span class=&quot;rh-name&quot;&gt;${path}&lt;/span&gt;
        &lt;button class=&quot;rh-copy&quot; onclick=&quot;copiar('${esc(path)}')&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;/div&gt;
      &lt;pre&gt;${escHtml(content.substring(0,3000))}${content.length&gt;3000?'\n... (truncado para exibição)':''}&lt;/pre&gt;
    &lt;/div&gt;`).join('');
}

function copiar(path){
  navigator.clipboard.writeText(GERADOS[path]||'').then(()=&gt;alert('✅ Copiado: '+path)).catch(()=&gt;{
    const ta=document.createElement('textarea');
    ta.value=GERADOS[path]||'';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    alert('✅ Copiado: '+path);
  });
}

// ══════════════════════════════════════════
// EXPORTAR ZIP
// ══════════════════════════════════════════
async function exportarZip(){
  if(!Object.keys(GERADOS).length){alert('Gere os arquivos primeiro!');return;}
  try{
    const JSZ=await loadJSZ();
    const zip=new JSZ();
    for(const[path,content]of Object.entries(GERADOS)) zip.file(path,content);
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const name=document.getElementById('appName').value||'meu-app';
    a.href=url;a.download=`${name}-eas-config.zip`;
    a.click();URL.revokeObjectURL(url);
  }catch(e){alert('Erro: '+e.message);}
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function fileIcon(p){
  if(p.endsWith('.json')) return '📋';
  if(p.endsWith('.ts')||p.endsWith('.js')) return '📜';
  if(p.endsWith('.yml')||p.endsWith('.yaml')) return '⚙️';
  if(p.endsWith('.md')) return '📝';
  if(p.endsWith('.env')||p.includes('.env')) return '🔑';
  return '📄';
}

function loadJSZ(){

&lt;script&gt;
// ═══════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════
let PROJECT = {};        // { path: { content: string, modified: bool } }
let OPEN_TABS = [];      // [ path ]
let ACTIVE_TAB = null;
let ANALYSIS = null;
let PANEL = 'analysis';
let TREE_STATE = {};     // { folderPath: expanded }
let FILTER = '';

// ═══════════════════════════════════════════════════════
// IMPORTAÇÃO
// ═══════════════════════════════════════════════════════
async function handleFileInput(input) {
  const file = input.files[0];
  if (!file) return;
  showToast('⏳ Lendo arquivo...');
  try {
    if (file.name.endsWith('.zip')) {
      await importZip(file);
    } else {
      showToast('Use arquivos .zip por enquanto', 'warn');
    }
  } catch(e) {
    showToast('Erro: ' + e.message, 'error');
  }
  input.value = '';
}

async function importZip(file) {
  const { default: JSZip } = await loadJSZip();
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  PROJECT = {};
  let count = 0;
  const entries = Object.entries(zip.files);
  // Detecta prefixo comum
  const paths = entries.filter(([,v])=&gt;!v.dir).map(([k])=&gt;k);
  const tops = [...new Set(paths.map(k=&gt;k.split('/')[0]))];
  const prefix = tops.length === 1 ? tops[0] + '/' : '';
  for (const [path, entry] of entries) {
    if (entry.dir) continue;
    const rel = prefix ? path.slice(prefix.length) : path;
    if (!rel) continue;
    try {
      const buf2 = await entry.async('arraybuffer');
      const text = tryDecodeText(buf2);
      PROJECT[rel] = { content: text, binary: text === null, raw: buf2, modified: false };
      count++;
    } catch {}
  }
  showToast(`✅ ${count} arquivos importados!`);
  renderTree();
  document.getElementById('analyzeBtn').style.display = 'block';
  document.getElementById('filterBtn').style.display = 'block';
  ANALYSIS = null;
  runAnalysis();
}

function handleFolderInput(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  PROJECT = {};
  let count = 0;
  const readers = files.map(file =&gt; new Promise(resolve =&gt; {
    const reader = new FileReader();
    const path = file.webkitRelativePath.replace(/^[^/]+\//, '');
    if (!path) { resolve(); return; }
    reader.onload = e =&gt; {
      const buf = e.target.result;
      const text = tryDecodeText(buf);
      PROJECT[path] = { content: text, binary: text === null, raw: buf, modified: false };
      count++;
      resolve();
    };
    reader.readAsArrayBuffer(file);
  }));
  Promise.all(readers).then(() =&gt; {
    showToast(`✅ ${count} arquivos importados!`);
    renderTree();
    document.getElementById('analyzeBtn').style.display = 'block';
    ANALYSIS = null;
    runAnalysis();
  });
  input.value = '';
}

function tryDecodeText(buf) {
  try {
    const bytes = new Uint8Array(buf);
    // Detecta binário pelos primeiros bytes
    for (let i = 0; i &lt; Math.min(512, bytes.length); i++) {
      if (bytes[i] === 0) return null; // binário
    }
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch {
    try { return new TextDecoder('latin1').decode(buf); } catch { return null; }
  }
}

// ═══════════════════════════════════════════════════════
// ÁRVORE DE ARQUIVOS
// ═══════════════════════════════════════════════════════
function renderTree() {
  const tree = document.getElementById('fileTree');
  const paths = Object.keys(PROJECT).filter(p =&gt; !FILTER || p.toLowerCase().includes(FILTER.toLowerCase())).sort();
  if (!paths.length) {
    tree.innerHTML = '&lt;div style=&quot;padding:20px;text-align:center;color:#8b949e;font-size:12px&quot;&gt;Nenhum arquivo encontrado&lt;/div&gt;';
    return;
  }
  // Constrói estrutura de pastas
  const root = buildTree(paths);
  tree.innerHTML = renderNode(root, 0);
}

function buildTree(paths) {
  const root = { type: 'folder', name: '', children: {} };
  for (const p of paths) {
    const parts = p.split('/');
    let node = root;
    for (let i = 0; i &lt; parts.length - 1; i++) {
      const part = parts[i];
      if (!node.children[part]) node.children[part] = { type: 'folder', name: part, children: {}, path: parts.slice(0,i+1).join('/') };
      node = node.children[part];
    }
    const fname = parts[parts.length - 1];
    node.children[fname] = { type: 'file', name: fname, path: p };
  }
  return root;
}

function renderNode(node, depth) {
  let html = '';
  const sorted = Object.values(node.children).sort((a,b) =&gt; {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  for (const child of sorted) {
    const indent = depth * 16;
    if (child.type === 'folder') {
      const expanded = TREE_STATE[child.path] !== false;
      const icon = expanded ? '📂' : '📁';
      html += `&lt;div class=&quot;tree-item folder&quot; style=&quot;padding-left:${12+indent}px&quot; onclick=&quot;toggleFolder('${child.path}')&quot;&gt;
        &lt;span class=&quot;icon&quot;&gt;${icon}&lt;/span&gt;
        &lt;span class=&quot;name&quot;&gt;${child.name}&lt;/span&gt;
        &lt;span style=&quot;color:#8b949e;font-size:10px&quot;&gt;${countFiles(child)}&lt;/span&gt;
      &lt;/div&gt;`;
      if (expanded) html += renderNode(child, depth + 1);
    } else {
      const isActive = ACTIVE_TAB === child.path;
      const isModified = PROJECT[child.path]?.modified ? ' ●' : '';
      const isBinary = PROJECT[child.path]?.binary;
      const fileIcon = getFileIcon(child.name);
      const size = formatSize(PROJECT[child.path]?.raw?.byteLength || PROJECT[child.path]?.content?.length || 0);
      html += `&lt;div class=&quot;tree-item file ${isActive?'active':''}&quot; style=&quot;padding-left:${12+indent}px&quot; onclick=&quot;openFile('${child.path.replace(/'/g,&quot;\\'&quot;)}')&quot;&gt;
        &lt;span class=&quot;icon&quot;&gt;${fileIcon}&lt;/span&gt;
        &lt;span class=&quot;name&quot;&gt;${child.name}${isModified}&lt;/span&gt;
        &lt;span class=&quot;size&quot;&gt;${isBinary?'bin':size}&lt;/span&gt;
      &lt;/div&gt;`;
    }
  }
  return html;
}

function countFiles(node) {
  let n = 0;
  for (const c of Object.values(node.children)) {
    if (c.type === 'file') n++;
    else n += countFiles(c);
  }
  return n;
}

function toggleFolder(path) {
  TREE_STATE[path] = TREE_STATE[path] === false ? true : false;
  renderTree();
}

function expandAll() {
  Object.keys(PROJECT).forEach(p =&gt; {
    const parts = p.split('/');
    for (let i = 1; i &lt; parts.length; i++) TREE_STATE[parts.slice(0,i).join('/')] = true;
  });
  renderTree();
}

function collapseAll() {
  Object.keys(TREE_STATE).forEach(k =&gt; TREE_STATE[k] = false);
  renderTree();
}

function filterFiles(val) {
  FILTER = val;
  const box = document.getElementById('filterBox');
  if (val === '' &amp;&amp; box.style.display !== 'none') {
    // toggle
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  } else {
    box.style.display = 'block';
  }
  renderTree();
}

function getFileIcon(name) {
  const ext = name.split('.').pop()?.toLowerCase();
  const icons = {
    html:'🌐', htm:'🌐', css:'🎨', js:'📜', ts:'📘', tsx:'⚛️', jsx:'⚛️',
    json:'📋', md:'📝', txt:'📄', yml:'⚙️', yaml:'⚙️', sh:'💻',
    png:'🖼️', jpg:'🖼️', jpeg:'🖼️', svg:'🎭', ico:'🎯', gif:'🖼️',
    zip:'📦', apk:'📱', exe:'🖥️', dmg:'🍎',
    gradle:'🔨', xml:'📋', java:'☕', kt:'🎯', ts:'📘',
    env:'🔑', gitignore:'👁️', lock:'🔒',
  };
  return icons[ext] || '📄';
}

function formatSize(bytes) {
  if (!bytes) return '0B';
  if (bytes &lt; 1024) return bytes + 'B';
  if (bytes &lt; 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

// ═══════════════════════════════════════════════════════
// EDITOR DE ARQUIVOS
// ═══════════════════════════════════════════════════════
function openFile(path) {
  const file = PROJECT[path];
  if (!file) return;
  if (file.binary) { showToast('Arquivo binário — não editável', 'warn'); return; }
  if (!OPEN_TABS.includes(path)) {
    OPEN_TABS.push(path);
    if (OPEN_TABS.length &gt; 10) {
      const removed = OPEN_TABS.shift();
      if (removed !== path) { /* ok */ }
    }
  }
  ACTIVE_TAB = path;
  renderTabs();
  renderEditor();
  renderTree();
}

function closeTab(path, e) {
  e.stopPropagation();
  const idx = OPEN_TABS.indexOf(path);
  OPEN_TABS.splice(idx, 1);
  if (ACTIVE_TAB === path) {
    ACTIVE_TAB = OPEN_TABS[Math.min(idx, OPEN_TABS.length-1)] || null;
  }
  renderTabs();
  renderEditor();
  renderTree();
}

function renderTabs() {
  const tabs = document.getElementById('editorTabs');
  tabs.innerHTML = OPEN_TABS.map(p =&gt; {
    const name = p.split('/').pop();
    const mod = PROJECT[p]?.modified ? '●' : '×';
    const modColor = PROJECT[p]?.modified ? '#e3b341' : '';
    return `&lt;div class=&quot;tab ${p===ACTIVE_TAB?'active':''}&quot; onclick=&quot;openFile('${p.replace(/'/g,&quot;\\'&quot;)}')&quot;&gt;
      &lt;span&gt;${getFileIcon(name)} ${name}&lt;/span&gt;
      &lt;span class=&quot;close&quot; style=&quot;color:${modColor}&quot; onclick=&quot;closeTab('${p.replace(/'/g,&quot;\\'&quot;)}',event)&quot;&gt;${mod}&lt;/span&gt;
    &lt;/div&gt;`;
  }).join('');
}

function renderEditor() {
  const content = document.getElementById('editorContent');
  if (!ACTIVE_TAB || !PROJECT[ACTIVE_TAB]) {
    content.innerHTML = `&lt;div class=&quot;welcome&quot;&gt;&lt;div style=&quot;font-size:48px&quot;&gt;📄&lt;/div&gt;&lt;p&gt;Selecione um arquivo na árvore&lt;/p&gt;&lt;/div&gt;`;
    return;
  }
  const file = PROJECT[ACTIVE_TAB];
  const escaped = (file.content || '').replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;');
  content.innerHTML = `
    &lt;div style=&quot;display:flex;align-items:center;padding:4px 12px;background:#161b22;border-bottom:1px solid #30363d;font-size:11px;color:#8b949e;gap:12px&quot;&gt;
      &lt;span&gt;${ACTIVE_TAB}&lt;/span&gt;
      &lt;span&gt;${formatSize(file.content?.length||0)}&lt;/span&gt;
      ${file.modified ? '&lt;span style=&quot;color:#e3b341&quot;&gt;● Modificado&lt;/span&gt;' : ''}
      &lt;button onclick=&quot;saveFile('${ACTIVE_TAB.replace(/'/g,&quot;\\'&quot;)}',this)&quot; style=&quot;margin-left:auto;padding:2px 8px;background:#238636;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px&quot;&gt;💾 Salvar&lt;/button&gt;
      &lt;button onclick=&quot;cleanReplitInFile('${ACTIVE_TAB.replace(/'/g,&quot;\\'&quot;)}',this)&quot; style=&quot;padding:2px 8px;background:#9a6700;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px&quot;&gt;🧹 Limpar Replit&lt;/button&gt;
    &lt;/div&gt;
    &lt;textarea class=&quot;code-editor&quot; id=&quot;codeEditor&quot; onInput=&quot;markModified('${ACTIVE_TAB.replace(/'/g,&quot;\\'&quot;)}',this)&quot;&gt;${escaped}&lt;/textarea&gt;`;
}

function markModified(path, textarea) {
  PROJECT[path].content = textarea.value;
  PROJECT[path].modified = true;
  renderTabs();
}

function saveFile(path) {
  PROJECT[path].modified = false;
  renderTabs();
  renderTree();
  showToast('💾 Arquivo salvo!');
}

// ═══════════════════════════════════════════════════════
// ANÁLISE DO PROJETO
// ═══════════════════════════════════════════════════════
function runAnalysis() {
  const paths = Object.keys(PROJECT);
  if (!paths.length) return;

  const has = (pattern) =&gt; {
    if (typeof pattern === 'string') return paths.some(p =&gt; p.endsWith(pattern) || p.includes(pattern));
    return paths.some(p =&gt; pattern.test(p));
  };
  const get = (pattern) =&gt; paths.find(p =&gt; typeof pattern === 'string' ? (p.endsWith(pattern) || p === pattern) : pattern.test(p));

  // Detecta tipo de projeto
  const hasPackageJson = has('package.json');
  const hasVite = has('vite.config') || has('vite.config.ts') || has('vite.config.js');
  const hasReact = hasPackageJson &amp;&amp; (() =&gt; { try { const p = JSON.parse(PROJECT[get('package.json')]?.content||'{}'); return !!(p.dependencies?.react || p.devDependencies?.react); } catch { return false; } })();
  const hasExpo = has('app.json') || has('app.config.js') || has('expo');
  const hasCapacitor = has('capacitor.config');
  const hasEAS = has('eas.json');
  const hasManifest = has('manifest.json');
  const hasSW = has('sw.js') || has('service-worker.js') || has('serviceWorker');
  const hasWorkflow = has('.github/workflows');
  const hasIndexHtml = has('index.html');
  const hasDistFolder = paths.some(p =&gt; p.startsWith('dist/') || p.startsWith('www/') || p.startsWith('build/'));
  const hasAndroid = paths.some(p =&gt; p.startsWith('android/'));
  const hasIcons = has('icon') || has('favicon') || paths.some(p =&gt; /\.(png|svg|ico)$/.test(p));
  const hasEnvFile = has('.env') || has('.env.local');
  const hasReplitRefs = paths.some(p =&gt; {
    const c = PROJECT[p]?.content || '';
    return /replit\.dev|repl\.co|REPL_ID|REPLIT/i.test(c);
  });

  // Detecta workspace/monorepo
  let isWorkspace = false;
  try {
    const pkg = JSON.parse(PROJECT[get('package.json')]?.content || '{}');
    isWorkspace = pkg.name?.includes('@workspace') || pkg.name?.includes('/');
  } catch {}

  let projectType = 'HTML Puro';
  if (hasExpo) projectType = 'Expo / React Native';
  else if (hasReact &amp;&amp; hasVite) projectType = 'React + Vite';
  else if (hasReact) projectType = 'React';
  else if (hasPackageJson) projectType = 'Node.js / Web';

  ANALYSIS = {
    projectType, paths, hasPackageJson, hasVite, hasReact, hasExpo,
    hasCapacitor, hasEAS, hasManifest, hasSW, hasWorkflow, hasIndexHtml,
    hasDistFolder, hasAndroid, hasIcons, hasEnvFile, hasReplitRefs, isWorkspace,
    totalFiles: paths.length,
    totalSize: paths.reduce((s,p) =&gt; s + (PROJECT[p]?.content?.length||0), 0),
  };

  renderPanel();
  switchPanel('analysis');
}

function switchPanel(tab) {
  PANEL = tab;
  document.querySelectorAll('.panel-tab').forEach((t,i) =&gt; {

}

  }
  if (PANEL === 'analysis') renderAnalysisPanel(el);

}

          &lt;span class=&quot;icon&quot;&gt;${c.ok===true?'✅':c.ok==='warn'?'⚠️':'❌'}&lt;/span&gt;
          &lt;div class=&quot;info&quot;&gt;

  el.innerHTML = html;

// ═══════════════════════════════════════════════════════
// LIMPEZA REPLIT
// ═══════════════════════════════════════════════════════
const REPLIT_PATTERNS = [
  [/https?:\/\/[a-z0-9-]+\.replit\.dev[^\s&quot;'`)]*/gi, ''],
  [/https?:\/\/[a-z0-9-]+\.repl\.co[^\s&quot;'`)]*/gi, ''],
  [/&quot;REPLIT_DEV_DOMAIN&quot;\s*:\s*&quot;[^&quot;]*&quot;/gi, '&quot;REPLIT_DEV_DOMAIN&quot;:&quot;&quot;'],
  [/&quot;REPL_ID&quot;\s*:\s*&quot;[^&quot;]*&quot;/gi, '&quot;REPL_ID&quot;:&quot;&quot;'],
  [/process\.env\.REPL_ID/g, '&quot;&quot;'],
  [/process\.env\.REPLIT_DEV_DOMAIN/g, '&quot;&quot;'],
  [/import\.meta\.env\.REPLIT[A-Z_]*/g, '&quot;&quot;'],
  [/[&quot;']vite-plugin-dev-banner[&quot;']/g, ''],
  [/[&quot;']vite-plugin-runtime-error-modal[&quot;']/g, ''],
  [/import.*vite-plugin-dev-banner.*\n/g, ''],
  [/import.*vite-plugin-runtime-error-modal.*\n/g, ''],
  [/cartographer[^\n]*/g, ''],
];

function cleanReplitInFile(path) {
  let content = PROJECT[path]?.content || '';
  let changed = false;
  for (const [pattern, replacement] of REPLIT_PATTERNS) {
    const newContent = content.replace(pattern, replacement);
    if (newContent !== content) { content = newContent; changed = true; }
  }
  if (changed) {
    PROJECT[path].content = content;
    PROJECT[path].modified = true;
    if (ACTIVE_TAB === path) renderEditor();
    renderTree();
    showToast(`🧹 Limpeza feita em ${path.split('/').pop()}`);
  } else {
    showToast('Nenhuma referência encontrada neste arquivo', 'warn');
  }
  runAnalysis();
}

function cleanAllReplit() {
  const files = Object.keys(PROJECT).filter(p =&gt; {
    const c = PROJECT[p]?.content || '';
    return /replit\.dev|repl\.co|REPL_ID|REPLIT|cartographer|vite-plugin-dev-banner|vite-plugin-runtime-error/i.test(c);
  });
  files.forEach(p =&gt; cleanReplitInFile(p));
  showToast(`🧹 ${files.length} arquivos limpos!`);
}

function removeNodeModules() {
  const keys = Object.keys(PROJECT).filter(p =&gt; p.startsWith('node_modules/'));
  keys.forEach(k =&gt; delete PROJECT[k]);
  showToast(`🗑️ ${keys.length} arquivos removidos`);
  renderTree();
  runAnalysis();
}

function removeDist() {
  const keys = Object.keys(PROJECT).filter(p =&gt; /^(dist|build|www)\//.test(p));
  keys.forEach(k =&gt; delete PROJECT[k]);
  showToast(`🗑️ ${keys.length} arquivos removidos`);
  renderTree();
  runAnalysis();
}

// ═══════════════════════════════════════════════════════
// GERADORES DE ARQUIVO
// ═══════════════════════════════════════════════════════
function addFile(path, content) {
  PROJECT[path] = { content, modified: true, binary: false };
  renderTree();
  openFile(path);
  runAnalysis();
  showToast(`✅ ${path} gerado!`);
}

function getAppName() {
  try {
    const pkg = JSON.parse(PROJECT[Object.keys(PROJECT).find(p=&gt;p.endsWith('package.json'))]?.content||'{}');
    return pkg.name?.replace(/@[^/]+\//,'') || 'meu-app';
  } catch { return 'meu-app'; }
}

function genManifest() {
  const name = getAppName();
  addFile('manifest.json', JSON.stringify({
    name: name, short_name: name,
    description: `Aplicativo ${name}`,
    start_url: '/', display: 'standalone',
    background_color: '#0f172a', theme_color: '#6366f1',
    orientation: 'portrait',
    icons: [
      { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
    ]
  }, null, 2));
}

function genServiceWorker() {
  addFile('sw.js', `/* Service Worker */
const CACHE = 'app-v1';
const PRECACHE = ['/', '/index.html', '/manifest.json'];

self.addEventListener('install', e =&gt; {
  e.waitUntil(caches.open(CACHE).then(c =&gt; c.addAll(PRECACHE)));
  self.skipWaiting();
});

self.addEventListener('activate', e =&gt; {
  e.waitUntil(caches.keys().then(keys =&gt;
    Promise.all(keys.filter(k =&gt; k !== CACHE).map(k =&gt; caches.delete(k)))
  ));
  self.clients.claim();
});

self.addEventListener('fetch', e =&gt; {
  e.respondWith(
    caches.match(e.request).then(cached =&gt; cached || fetch(e.request))
  );
});`);
}

function genCapacitorConfig() {
  const name = getAppName();
  const id = `com.example.${name.replace(/[^a-z0-9]/gi,'').toLowerCase()}`;
  addFile('capacitor.config.ts', `import type { CapacitorConfig } from '@capacitor/cli';
const config: CapacitorConfig = {
  appId: '${id}',
  appName: '${name}',
  webDir: 'dist',
  server: { androidScheme: 'https' },
};
export default config;`);
}

function genWorkflowApk() {
  addFile('.github/workflows/build-apk.yml', `name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk`);
}

function genWorkflowPages() {
  addFile('.github/workflows/deploy-pages.yml', `name: Deploy GitHub Pages

on:

function genTsconfig() {

  }, null, 2));
}

function genEasJson() {

function fixPackageJson() {
  const path = Object.keys(PROJECT).find(p =&gt; p.endsWith('package.json') &amp;&amp; !p.includes('node_modules'));
  if (!path) { showToast('package.json não encontrado', 'error'); return; }
  try {
    const pkg = JSON.parse(PROJECT[path].content);
    if (pkg.name?.includes('/')) pkg.name = pkg.name.split('/').pop();
    if (pkg.name?.includes('@')) pkg.name = pkg.name.replace(/@[^/]+\//, '');
    PROJECT[path].content = JSON.stringify(pkg, null, 2);
    PROJECT[path].modified = true;
    openFile(path);
    runAnalysis();
    showToast('✅ package.json corrigido!');
  } catch(e) {
    showToast('Erro ao corrigir: ' + e.message, 'error');
  }
}

// EXPORTAR ZIP
// ═══════════════════════════════════════════════════════
async function exportProject() {
  if (!Object.keys(PROJECT).length) { showToast('Nenhum projeto carregado', 'warn'); return; }
  showToast('⏳ Gerando ZIP...');
  const { default: JSZip } = await loadJSZip();
  const zip = new JSZip();
  for (const [path, file] of Object.entries(PROJECT)) {
    if (file.binary &amp;&amp; file.raw) zip.file(path, file.raw);
    else if (file.content) zip.file(path, file.content);
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'projeto-corrigido.zip'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ ZIP baixado!');
}

document.addEventListener('dragover', e =&gt; { e.preventDefault(); document.getElementById('dropOverlay').classList.add('active'); });
document.addEventListener('dragleave', e =&gt; { if (!e.relatedTarget) document.getElementById('dropOverlay').classList.remove('active'); });
document.addEventListener('drop', async e =&gt; {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file?.name.endsWith('.zip')) await importZip(file);
  else showToast('Solte um arquivo .zip', 'warn');
});

// ═══════════════════════════════════════════════════════
// JSZIP LOADER
// ═══════════════════════════════════════════════════════
let _jszipCache = null;
async function loadJSZip() {
  if (_jszipCache) return _jszipCache;
  return new Promise((resolve, reject) =&gt; {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () =&gt; { _jszipCache = { default: window.JSZip }; resolve(_jszipCache); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (_toastTimer) clearTimeout(_toastTimer);
  const el = document.createElement('div');
  el.className = `toast ${type === 'error' ? 'error' : type === 'warn' ? 'warn' : ''}`;
  el.textContent = msg;
  document.body.appendChild(el);
  _toastTimer = setTimeout(() =&gt; el.remove(), 3000);
}

  }
});

2. Código deve ser limpo, sem caracteres estranhos
