&lt;input type=&quot;file&quot; id=&quot;fileImport&quot; style=&quot;display:none&quot; accept=&quot;.js,.py,.html,.css,.ts,.java,.cs,.cpp,.php,.sql,.txt,.json,.md&quot; onchange=&quot;handleFileImport(event)&quot;&gt;

&lt;script&gt;
// ==================== STATE ====================
let state = {
    conversations: {},
    activeConvId: null,
    codeTabs: [],
    activeCodeTab: 0,
    settings: {
        apiKey: '',
        serperKey: '',
        ollamaUrl: 'http://localhost:11434',
        contextLimit: 8000,
        contextStrategy: 'trim',
        systemPrompt: '',
        autoSaveInterval: 30,
        provider: 'openai',
        model: '',
        temperature: 0.7,
        maxTokens: 4096
    },
    isLoading: false,
    autoSaveTimer: null
};

// ==================== MODELS ====================
const MODELS = {
    openai: [
        'gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-4',
        'gpt-3.5-turbo', 'gpt-3.5-turbo-16k'
    ],
    anthropic: [
        'claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5',
        'claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022',
        'claude-3-opus-20240229', 'claude-3-sonnet-20240229', 'claude-3-haiku-20240307'
    ],
    gemini: [
        'gemini-1.5-pro', 'gemini-1.5-flash', 'gemini-1.5-flash-8b',
        'gemini-pro', 'gemini-ultra'
    ],
    groq: [
        'llama-3.3-70b-versatile', 'llama-3.1-70b-versatile',
        'llama-3.1-8b-instant', 'mixtral-8x7b-32768',
        'gemma2-9b-it', 'gemma-7b-it'
    ],
    openrouter: [
        'openai/gpt-4o', 'anthropic/claude-3.5-sonnet',
        'google/gemini-pro-1.5', 'meta-llama/llama-3.1-70b-instruct',
        'mistralai/mixtral-8x7b-instruct', 'deepseek/deepseek-coder',
        'qwen/qwen-2.5-coder-32b-instruct', 'microsoft/phi-3.5-mini-128k-instruct'
    ],
    ollama: ['llama3.2', 'codellama', 'mistral', 'phi3', 'qwen2.5-coder', 'deepseek-coder-v2']
};

// ==================== INIT ====================
function init() {
    loadFromStorage();
    updateModelSelect();
    renderConversations();
    setupAutoSave();

    if (!state.activeConvId || !state.conversations[state.activeConvId]) {
        newConversation();
    } else {
        loadConversation(state.activeConvId);
    }

    if (state.codeTabs.length === 0) {
        newCodeTab();
    } else {
        renderCodeTabs();
        loadCodeTab(state.activeCodeTab);
    }

    document.getElementById('tempSlider').addEventListener('input', function() {
        document.getElementById('tempVal').textContent = this.value;
    });

    showToast('✅ AI Code Studio carregado!', 'success');
}

// ==================== STORAGE ====================
function saveToStorage() {
    try {
        localStorage.setItem('aiStudio_state', JSON.stringify({
            conversations: state.conversations,
            activeConvId: state.activeConvId,
            codeTabs: state.codeTabs,
            activeCodeTab: state.activeCodeTab,
            settings: state.settings
        }));
    } catch(e) {
        showToast('⚠️ Erro ao salvar (storage cheio?)', 'error');
    }
}

function loadFromStorage() {
    try {
        const saved = localStorage.getItem('aiStudio_state');
        if (saved) {
            const data = JSON.parse(saved);
            state.conversations = data.conversations || {};
            state.activeConvId = data.activeConvId || null;
            state.codeTabs = data.codeTabs || [];
            state.activeCodeTab = data.activeCodeTab || 0;
            state.settings = { ...state.settings, ...(data.settings || {}) };

            // Restore UI settings
            document.getElementById('aiProvider').value = state.settings.provider || 'openai';
            document.getElementById('maxTokens').value = state.settings.maxTokens || 4096;
            document.getElementById('tempSlider').value = state.settings.temperature || 0.7;
            document.getElementById('tempVal').textContent = state.settings.temperature || 0.7;
        }
    } catch(e) {
        console.error('Erro ao carregar:', e);
    }
}

function setupAutoSave() {
    if (state.autoSaveTimer) clearInterval(state.autoSaveTimer);
    const interval = parseInt(state.settings.autoSaveInterval) || 30;
    if (interval &gt; 0) {
        state.autoSaveTimer = setInterval(() =&gt; {
            saveToStorage();
            showToast('💾 Auto-saved', 'success');
        }, interval * 1000);
    }
}

// ==================== CONVERSATIONS ====================
function newConversation() {
    const id = 'conv_' + Date.now();
    state.conversations[id] = {
        id,
        title: 'Conversa ' + (Object.keys(state.conversations).length + 1),
        messages: [],
        createdAt: Date.now(),
        provider: document.getElementById('aiProvider').value,
        model: document.getElementById('modelSelect').value
    };
    state.activeConvId = id;
    saveToStorage();
    renderConversations();
    loadConversation(id);
}

function loadConversation(id) {
    state.activeConvId = id;
    const conv = state.conversations[id];
    if (!conv) return;

    document.getElementById('convTitle').textContent = conv.title;
    renderMessages(conv.messages);
    updateContextBar(conv.messages);
    renderConversations();
}

function deleteConversation(id, e) {
    e.stopPropagation();
    if (!confirm('Deletar esta conversa?')) return;
    delete state.conversations[id];
    if (state.activeConvId === id) {
        const keys = Object.keys(state.conversations);
        if (keys.length &gt; 0) loadConversation(keys[keys.length - 1]);
        else newConversation();
    }
    saveToStorage();
    renderConversations();
}

function renderConversations() {
    const list = document.getElementById('convList');
    list.innerHTML = '';
    const convs = Object.values(state.conversations).sort((a, b) =&gt; b.createdAt - a.createdAt);

    convs.forEach(conv =&gt; {
        const item = document.createElement('div');
        item.className = 'conv-item' + (conv.id === state.activeConvId ? ' active' : '');
        item.innerHTML = `
            &lt;span class=&quot;conv-title&quot; title=&quot;${conv.title}&quot;&gt;${conv.title}&lt;/span&gt;
            &lt;span class=&quot;conv-delete&quot; onclick=&quot;deleteConversation('${conv.id}', event)&quot;&gt;✕&lt;/span&gt;
        `;
        item.onclick = () =&gt; loadConversation(conv.id);
        list.appendChild(item);
    });
}

// ==================== MESSAGES ====================
function renderMessages(messages) {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    messages.forEach(msg =&gt; appendMessageToDOM(msg));
    container.scrollTop = container.scrollHeight;
}

function appendMessageToDOM(msg) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${msg.role === 'user' ? 'user' : msg.role === 'system' ? 'system' : 'ai'}`;

    const avatarEmoji = msg.role === 'user' ? '👤' : msg.role === 'system' ? '⚙️' : '🤖';
    const content = formatMessage(msg.content);

    div.innerHTML = `
        &lt;div class=&quot;avatar&quot;&gt;${avatarEmoji}&lt;/div&gt;
        &lt;div class=&quot;bubble&quot;&gt;${content}&lt;/div&gt;
    `;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function formatMessage(text) {
    // Detecta blocos de código
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) =&gt; {
        const cleanCode = cleanCodeOutput(code.trim());
        const language = lang || 'code';
        return `&lt;pre&gt;&lt;button class=&quot;copy-code-btn&quot; onclick=&quot;copyCodeBlock(this)&quot;&gt;📋 Copiar&lt;/button&gt;&lt;code class=&quot;lang-${language}&quot;&gt;${escapeHtml(cleanCode)}&lt;/code&gt;&lt;/pre&gt;`;
    });

    // Negrito
    text = text.replace(/\*\*(.*?)\*\*/g, '&lt;strong&gt;$1&lt;/strong&gt;');
    // Itálico
    text = text.replace(/\*(.*?)\*/g, '&lt;em&gt;$1&lt;/em&gt;');
    // Inline code
    text = text.replace(/`([^`]+)`/g, '&lt;code style=&quot;background:var(--bg3);padding:1px 5px;border-radius:3px&quot;&gt;$1&lt;/code&gt;');
    // Quebras de linha
    text = text.replace(/\n/g, '&lt;br&gt;');

    return text;
}

function escapeHtml(text) {
    return text
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/&lt;/g, '&amp;lt;')
        .replace(/&gt;/g, '&amp;gt;')
        .replace(/&quot;/g, '&amp;quot;');
}

function cleanCodeOutput(code) {
    // Remove caracteres estranhos e bagunça comum em respostas de IA
    return code
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[\u200B-\u200D\uFEFF]/g, '') // zero-width chars
        .replace(/\u00A0/g, ' ') // non-breaking space
        .replace(/[&quot;&quot;]/g, '&quot;') // smart quotes
        .replace(/['']/g, &quot;'&quot;) // smart apostrophes
        .replace(/…/g, '...')
        .trim();
}

function copyCodeBlock(btn) {
    const code = btn.nextElementSibling.textContent;
    navigator.clipboard.writeText(cleanCodeOutput(code)).then(() =&gt; {
        btn.textContent = '✅ Copiado!';
        setTimeout(() =&gt; btn.textContent = '📋 Copiar', 2000);
    });
}

// ==================== SEND MESSAGE ====================
async function sendMessage() {
    if (state.isLoading) return;

    const input = document.getElementById('userInput');
    let text = input.value.trim();
    if (!text) return;

    const codeMode = document.getElementById('codeMode').checked;
    const codeContent = document.getElementById('codeEditor').value.trim();

    if (codeMode &amp;&amp; codeContent) {
        const lang = document.getElementById('codeLanguage').value;
        text += `\n\n**Código atual no editor:**\n\`\`\`${lang}\n${codeContent}\n\`\`\``;
    }

    const conv = state.conversations[state.activeConvId];
    if (!conv) return;

    // Add user message
    const userMsg = { role: 'user', content: text, timestamp: Date.now() };
    conv.messages.push(userMsg);
    appendMessageToDOM(userMsg);

    // Update title if first message
    if (conv.messages.length === 1) {
        conv.title = text.substring(0, 40) + (text.length &gt; 40 ? '...' : '');
        document.getElementById('convTitle').textContent = conv.title;
        renderConversations();
    }

    input.value = '';
    autoResize(input);
    updateContextBar(conv.messages);

    // Show loading
    state.isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    const loadingDiv = addLoadingMessage();

    try {
        // Web search if enabled
        let webContext = '';
        if (document.getElementById('webSearchCheck').checked) {
            webContext = await doWebSearch(text);
        }

        const response = await callAI(conv.messages, webContext);

        loadingDiv.remove();

        const aiMsg = { role: 'assistant', content: response, timestamp: Date.now() };
        conv.messages.push(aiMsg);
        appendMessageToDOM(aiMsg);

        // Auto-extract code to editor
        const codeMatch = response.match(/```(\w+)?\n?([\s\S]*?)```/);
        if (codeMatch &amp;&amp; codeMode) {
            const extractedCode = cleanCodeOutput(codeMatch[2]);
            const activeTab = state.codeTabs[state.activeCodeTab];
            if (activeTab) {
                activeTab.content = extractedCode;
                activeTab.language = codeMatch[1] || 'text';
                document.getElementById('codeEditor').value = extractedCode;
                document.getElementById('codeLanguage').value = codeMatch[1] || 'text';
                showToast('💻 Código extraído para o editor!', 'success');
            }
        }

        updateContextBar(conv.messages);
        checkContextLimit(conv);
        saveToStorage();

    } catch (err) {
        loadingDiv.remove();
        const errMsg = { role: 'system', content: `❌ Erro: ${err.message}`, timestamp: Date.now() };
        conv.messages.push(errMsg);
        appendMessageToDOM(errMsg);
        showToast('❌ ' + err.message, 'error');
    }

    state.isLoading = false;
    document.getElementById('sendBtn').disabled = false;
}

function addLoadingMessage() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.innerHTML = `
        &lt;div class=&quot;avatar&quot;&gt;🤖&lt;/div&gt;
        &lt;div class=&quot;bubble&quot;&gt;
            &lt;div class=&quot;typing&quot;&gt;
                &lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
}

// ==================== AI CALLS ====================
async function callAI(messages, webContext = '') {
    const provider = document.getElementById('aiProvider').value;
    const model = document.getElementById('modelSelect').value;
    const apiKey = state.settings.apiKey;
    const temp = parseFloat(document.getElementById('tempSlider').value);
    const maxTok = parseInt(document.getElementById('maxTokens').value);
    const contextLimit = parseInt(state.settings.contextLimit) || 8000;

    // Build messages with context limit
    let msgs = buildContextMessages(messages, contextLimit, webContext);

    switch(provider) {
        case 'openai': return await callOpenAI(msgs, model, apiKey, temp, maxTok);
        case 'anthropic': return await callAnthropic(msgs, model, apiKey, temp, maxTok);
        case 'gemini': return await callGemini(msgs, model, apiKey, temp, maxTok);
        case 'groq': return await callGroq(msgs, model, apiKey, temp, maxTok);
        case 'openrouter': return await callOpenRouter(msgs, model, apiKey, temp, maxTok);
        case 'ollama': return await callOllama(msgs, model, temp, maxTok);
        default: throw new Error('Provider não suportado');
    }
}

function buildContextMessages(messages, limit, webContext) {
    const systemPrompt = state.settings.systemPrompt ||
        'Você é um assistente especialista em programação. Gere código limpo, sem caracteres estranhos, comentado em português.';

    let sysContent = systemPrompt;
    if (webContext) sysContent += `\n\nResultados da web:\n${webContext}`;

    const sys = [{ role: 'system', content: sysContent }];

    // Estimate tokens (rough: 1 token ≈ 4 chars)
    let tokenCount = sysContent.length / 4;
    const filtered = [];

    // Add from newest to oldest until limit
    for (let i = messages.length - 1; i &gt;= 0; i--) {
        const msg = messages[i];
        if (msg.role === 'system') continue;
        const msgTokens = msg.content.length / 4;
        if (tokenCount + msgTokens &gt; limit &amp;&amp; filtered.length &gt; 0) break;
        tokenCount += msgTokens;
        filtered.unshift({ role: msg.role === 'assistant' ? 'assistant' : 'user', content: msg.content });
    }

    return [...sys, ...filtered];
}

async function callOpenAI(messages, model, apiKey, temp, maxTokens) {
    if (!apiKey) throw new Error('API Key OpenAI não configurada! Vá em ⚙️ Config');

    const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
    });

    if (!res.ok) {
        const err = await res.json().catch(() =&gt; ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.choices[0].message.content;
}

async function callAnthropic(messages, model, apiKey, temp, maxTokens) {
    if (!apiKey) throw new Error('API Key Anthropic não configurada! Vá em ⚙️ Config');

    const system = messages.find(m =&gt; m.role === 'system')?.content || '';
    const msgs = messages.filter(m =&gt; m.role !== 'system');

    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
            model, messages: msgs, system,
            temperature: temp, max_tokens: maxTokens
        })
    });

    if (!res.ok) {
        const err = await res.json().catch(() =&gt; ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.content[0].text;
}

async function callGemini(messages, model, apiKey, temp, maxTokens) {
    if (!apiKey) throw new Error('API Key Gemini não configurada! Vá em ⚙️ Config');

    const res = await fetch(

}

// ==================== WEB SEARCH ====================
async function doWebSearch(query) {
    const key = state.settings.serperKey;
    if (!key) {
        showToast('⚠️ Configure a Serper API Key para web search', 'error');
        return '';
    }

    try {
        const res = await fetch('https://google.serper.dev/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-API-KEY': key
            },
            body: JSON.stringify({ q: query, num: 5 })
        });

        const data = await res.json();
        const results = data.organic?.slice(0, 5).map(r =&gt;
            `**${r.title}**\n${r.snippet}\nURL: ${r.link}`
        ).join('\n\n') || '';

        return results ? `Resultados de busca para &quot;${query}&quot;:\n\n${results}` : '';
    } catch(e) {
        showToast('⚠️ Erro na busca web', 'error');
        return '';
    }
}

// ==================== CONTEXT MANAGEMENT ====================
function estimateTokens(messages) {
    return Math.ceil(messages.reduce((acc, m) =&gt; acc + (m.content?.length || 0), 0) / 4);
}

function updateContextBar(messages) {
    const tokens = estimateTokens(messages);
    const limit = parseInt(state.settings.contextLimit) || 8000;
    const pct = Math.min(100, (tokens / limit) * 100);

    document.getElementById('tokenCount').textContent = tokens.toLocaleString();

    const fill = document.getElementById('contextFill');
    fill.style.width = pct + '%';
    fill.style.background = pct &gt; 80 ? 'var(--red)' : pct &gt; 60 ? 'var(--yellow)' : 'var(--green)';
}

function checkContextLimit(conv) {
    const tokens = estimateTokens(conv.messages);
    const limit = parseInt(state.settings.contextLimit) || 8000;

    if (tokens &gt; limit) {
        const strategy = state.settings.contextStrategy;
        if (strategy === 'trim') {
            // Remove oldest messages (keep system + last 10)
            while (estimateTokens(conv.messages) &gt; limit &amp;&amp; conv.messages.length &gt; 4) {
                conv.messages.splice(0, 1);
            }
            showToast('✂️ Contexto trimado automaticamente', 'success');
        } else if (strategy === 'warn') {
            showToast('⚠️ Limite de contexto atingido!', 'error');
        }
    }
}

function clearContext() {
    const conv = state.conversations[state.activeConvId];
    if (!conv) return;
    if (!confirm('Limpar contexto? As mensagens serão mantidas mas a IA não vai &quot;lembrar&quot; delas.')) return;
    conv.messages = [];
    renderMessages([]);
    updateContextBar([]);
    saveToStorage();
    showToast('🗑️ Contexto limpo!', 'success');
}

async function summarizeContext() {
    const conv = state.conversations[state.activeConvId];
    if (!conv || conv.messages.length &lt; 4) {
        showToast('Poucas mensagens para resumir', 'error');
        return;
    }

    showToast('📋 Resumindo contexto...', 'success');

    const summaryPrompt = `Faça um resumo conciso desta conversa em bullet points, mantendo os pontos técnicos importantes:\n\n${
        conv.messages.map(m =&gt; `${m.role}: ${m.content.substring(0, 500)}`).join('\n')
    }`;

    try {
        const tempMsgs = [
            { role: 'system', content: 'Você é um assistente que resume conversas de forma concisa.' },
            { role: 'user', content: summaryPrompt }
        ];

        const summary = await callAI(tempMsgs);
        conv.messages = [{ role: 'system', content: `📋 Resumo da conversa anterior:\n${summary}`, timestamp: Date.now() }];
        renderMessages(conv.messages);
        updateContextBar(conv.messages);
        saveToStorage();
        showToast('✅ Contexto resumido!', 'success');
    } catch(e) {
        showToast('❌ Erro ao resumir: ' + e.message, 'error');
    }
}

// ==================== CODE TABS ====================
function newCodeTab(name = null) {
    const tab = {
        id: Date.now(),
        name: name || `código_${state.codeTabs.length + 1}`,
        content: '',
        language: 'javascript'
    };
    state.codeTabs.push(tab);
    state.activeCodeTab = state.codeTabs.length - 1;
    renderCodeTabs();
    loadCodeTab(state.activeCodeTab);
    saveToStorage();
}

function renderCodeTabs() {
    const container = document.getElementById('codeTabs');
    container.innerHTML = '';
    state.codeTabs.forEach((tab, i) =&gt; {
        const div = document.createElement('div');
        div.className = 'code-tab' + (i === state.activeCodeTab ? ' active' : '');
        div.innerHTML = `
            &lt;span onclick=&quot;switchCodeTab(${i})&quot;&gt;${tab.name}&lt;/span&gt;
            &lt;span class=&quot;code-tab-close&quot; onclick=&quot;closeCodeTab(${i}, event)&quot;&gt;✕&lt;/span&gt;
        `;
        container.appendChild(div);
    });
}

function switchCodeTab(i) {
    saveCurrentCodeTab();
    state.activeCodeTab = i;
    loadCodeTab(i);
    renderCodeTabs();
}

function closeCodeTab(i, e) {
    e.stopPropagation();
    if (state.codeTabs.length === 1) { showToast('Mínimo 1 tab', 'error'); return; }
    state.codeTabs.splice(i, 1);
    if (state.activeCodeTab &gt;= state.codeTabs.length) state.activeCodeTab = state.codeTabs.length - 1;
    renderCodeTabs();
    loadCodeTab(state.activeCodeTab);
    saveToStorage();
}

function loadCodeTab(i) {
    const tab = state.codeTabs[i];
    if (!tab) return;
    document.getElementById('codeEditor').value = tab.content;
    document.getElementById('codeLanguage').value = tab.language || 'javascript';
}

function saveCurrentCodeTab() {
    const tab = state.codeTabs[state.activeCodeTab];
    if (!tab) return;
    tab.content = document.getElementById('codeEditor').value;
    tab.language = document.getElementById('codeLanguage').value;
}

function copyCleanCode() {
    saveCurrentCodeTab();
    const code = document.getElementById('codeEditor').value;
    const clean = cleanCodeOutput(code);
    navigator.clipboard.writeText(clean).then(() =&gt; {
        showToast('✅ Código limpo copiado!', 'success');
    });
}

function sendCodeToChat() {
    saveCurrentCodeTab();
    const code = document.getElementById('codeEditor').value.trim();
    const lang = document.getElementById('codeLanguage').value;
    if (!code) { showToast('Editor vazio!', 'error'); return; }

    const input = document.getElementById('userInput');
    input.value = `Analise e melhore este código:\n\`\`\`${lang}\n${code}\n\`\`\``;
    autoResize(input);
    input.focus();
}

function clearCode() {
    if (!confirm('Limpar editor?')) return;
    document.getElementById('codeEditor').value = '';
    saveCurrentCodeTab();
}

function downloadCode() {
    saveCurrentCodeTab();
    const tab = state.codeTabs[state.activeCodeTab];
    const code = cleanCodeOutput(tab.content);
    const ext = { javascript:'js', python:'py', html:'html', css:'css', java:'java',
                   csharp:'cs', cpp:'cpp', php:'php', sql:'sql', typescript:'ts',
                   rust:'rs', go:'go', bash:'sh', text:'txt' }[tab.language] || 'txt';

    const blob = new Blob([code], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${tab.name}.${ext}`;
    a.click();
    showToast('⬇️ Download iniciado!', 'success');
}

function importCodeFile() {
    document.getElementById('fileImport').click();
}

function handleFileImport(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) =&gt; {
        const content = ev.target.result;
        const ext = file.name.split('.').pop().toLowerCase();
        const langMap = { js:'javascript', py:'python', html:'html', css:'css',
                          java:'java', cs:'csharp', cpp:'cpp', php:'php',
                          sql:'sql', ts:'typescript', rs:'rust', go:'go', sh:'bash' };

        newCodeTab(file.name);
        const tab = state.codeTabs[state.activeCodeTab];
        tab.content = content;
        tab.language = langMap[ext] || 'text';
        document.getElementById('codeEditor').value = content;
        document.getElementById('codeLanguage').value = tab.language;
        renderCodeTabs();
        saveToStorage();
        showToast(`📂 ${file.name} importado!`, 'success');
    };
    reader.readAsText(file);
    e.target.value = '';
}

// ==================== PROVIDER / MODEL ====================
function onProviderChange() {
    updateModelSelect();
}

function updateModelSelect() {
    const provider = document.getElementById('aiProvider').value;
    const select = document.getElementById('modelSelect');
    const models = MODELS[provider] || [];
    select.innerHTML = models.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');

    // Restore saved model if same provider
    if (state.settings.provider === provider &amp;&amp; state.settings.model) {
        const exists = models.includes(state.settings.model);
        if (exists) select.value = state.settings.model;
    }
}

// ==================== PASTE CODE ====================
async function pasteCode() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) { showToast('Área de transferência vazia', 'error'); return; }

        // Detecta se parece código
        const looksLikeCode = /[{}();=&gt;&lt;\/\\]/.test(text) || text.includes('def ') || text.includes('function ');

        if (looksLikeCode) {
            // Pergunta se vai pro editor ou pro chat
            const toEditor = confirm('Parece código!\n\nOK = Colar no Editor de Código\nCancelar = Colar no Chat');
            if (toEditor) {
                document.getElementById('codeEditor').value = text;
                saveCurrentCodeTab();
                showToast('✅ Código colado no editor!', 'success');
                return;
            }
        }

        const input = document.getElementById('userInput');
        input.value += text;
        autoResize(input);
        showToast('✅ Colado no chat!', 'success');
    } catch(e) {
        showToast('❌ Sem permissão para acessar clipboard', 'error');
    }
}

function toggleCodePanel() {

    panel.classList.toggle('hidden');
}

function handleKey(e) {
    if (e.ctrlKey &amp;&amp; e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
    // Tab no textarea = inserir espaços
    if (e.key === 'Tab') {
        e.preventDefault();
        const ta = e.target;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
    }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() =&gt; {
        toast.className = 'toast';
    }, 3000);
}

    height: 5px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
}

.context-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.3s, background 0.3s;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.message {
    display: flex;
    gap: 8px;
    max-width: 100%;
}

.message.user { flex-direction: row-reverse; }

.avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
}

.message.user .avatar { background: var(--accent); color: #000; }
.message.ai .avatar { background: var(--purple); color: #000; }

.bubble {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    max-width: 82%;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
}

.message.user .bubble { background: var(--bg3); border-color: var(--accent); }

.bubble pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    margin: 7px 0;
    position: relative;
}

.bubble code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }

.copy-code-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    padding: 2px 7px;
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
}

.copy-code-btn:hover { background: var(--accent); color: #000; }

.msg-time {
    font-size: 10px;
    color: var(--text2);
    margin-top: 4px;
    text-align: right;
}

.input-area {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
}

.input-options {
    display: flex;
    gap: 10px;
    margin-bottom: 7px;
    flex-wrap: wrap;
    align-items: center;
}

.input-options label {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
}

.input-row {
    display: flex;
    gap: 7px;
    align-items: flex-end;
}

.input-box {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 13px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 180px;
    font-family: inherit;
    line-height: 1.5;
}

.input-box:focus { border-color: var(--accent); }

.playground-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    overflow: hidden;
    height: 100%;
}

@media (max-width: 1200px) {
    .playground-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
    }
}

.editor-section, .preview-section {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg2);
    min-height: 0;
}

.section-header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
}

.section-header select, .section-header button {
    font-size: 11px;
    padding: 4px 8px;
}

.code-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    overflow-x: auto;
    min-height: 30px;
}

.code-tab {
    padding: 6px 12px;
    font-size: 11px;
    cursor: pointer;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text2);
    background: transparent;
    border: none;
}

.code-tab:hover { background: var(--bg3); color: var(--text); }
.code-tab.active { background: var(--bg2); color: var(--accent); border-bottom: 2px solid var(--accent); }

.code-tab-close {
    opacity: 0;
    color: var(--red);
    font-size: 13px;
    cursor: pointer;
}

.code-tab:hover .code-tab-close { opacity: 1; }

.editor-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}

.code-editor {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 10px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    resize: none;
    outline: none;
    line-height: 1.6;
    tab-size: 2;
    min-height: 0;
}

.editor-actions {
    padding: 7px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
}

.preview-content {
    flex: 1;
    overflow: auto;
    background: #fff;
    position: relative;
    min-height: 0;
}

.preview-frame {
    width: 100%;
    height: 100%;
    border: none;
}

.preview-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text2);
    font-size: 13px;
    text-align: center;
    padding: 20px;
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    font-size: 16px;
    margin-bottom: 18px;
    color: var(--accent);
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 5px;
}

.form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 7px 10px;
}

.form-group textarea {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    resize: vertical;
    min-height: 70px;
    font-family: inherit;
}

.modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
}

.section-title {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 14px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
}

.toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 15px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

.hidden { display: none !important; }

&lt;script&gt;
'use strict';

const STATE = {
    conversations: {},
    activeConvId: null,
    codeTabs: [],
    activeCodeTab: 0,
    settings: {
        apiKey: '',
        anthropicKey: '',
        geminiKey: '',
        huggingfaceKey: '',
        cohereKey: '',
        togetherKey: '',
        ollamaUrl: 'http://localhost:11434',

        systemPrompt: '',

const APP = {
    switchTab(name) {
        document.querySelectorAll('.tab-content').forEach(t =&gt; t.classList.remove('active'));
        document.querySelectorAll('.main-tab').forEach(t =&gt; t.classList.remove('active'));
        document.getElementById(name + 'Tab').classList.add('active');
        event.target.classList.add('active');
    },

    Provider: {
        MODELS: {
            openai:       ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'],
            anthropic:    ['claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5'],
            gemini:       ['gemini-1.5-pro', 'gemini-1.5-flash', 'gemini-2.0-flash'],
            groq:         ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768'],
            huggingface:  ['mistralai/Mistral-7B-Instruct-v0.1', 'meta-llama/Llama-2-7b-chat', 'gpt2'],
            cohere:       ['command-light', 'command', 'command-nightly'],
            together:     ['meta-llama/Llama-2-70b-chat-hf', 'mistralai/Mistral-7B-Instruct-v0.1'],
            ollama:       ['llama3.2', 'mistral', 'neural-chat', 'dolphin-mixtral']
        },

        onChange() {
            this.updateSelect();
        },

        updateSelect() {
            const provider = document.getElementById('aiProvider').value;
            const sel = document.getElementById('modelSelect');
            const models = this.MODELS[provider] || [];
            sel.innerHTML = models.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');
        }
    },

    Chat: {
        newChat() {
            const id = 'conv_' + Date.now();
            STATE.conversations[id] = {
                id,
                title: 'Nova Conversa',
                messages: [],
                createdAt: Date.now()
            };
            STATE.activeConvId = id;
            APP.Storage.save();
            this.renderConversations();
            this.loadConv(id);
            APP.UI.toast('✅ Novo chat iniciado!', 'success');
        },

        loadConv(id) {
            STATE.activeConvId = id;
            const conv = STATE.conversations[id];
            if (!conv) return;
            document.getElementById('convTitleEdit').value = conv.title;
            this.renderMessages(conv.messages);
            APP.Context.updateBar(conv.messages);
            this.renderConversations();
        },

        renameConv(title) {
            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv || !title.trim()) return;
            conv.title = title.trim();
            this.renderConversations();
            APP.Storage.save();
        },

        deleteConv(id, e) {
            e.stopPropagation();
            if (!confirm('Deletar esta conversa?')) return;
            delete STATE.conversations[id];
            if (STATE.activeConvId === id) {
                const keys = Object.keys(STATE.conversations);
                if (keys.length &gt; 0) this.loadConv(keys[keys.length - 1]);
                else this.newChat();
            }
            APP.Storage.save();
            this.renderConversations();
        },

        renderConversations() {
            const list = document.getElementById('convList');
            list.innerHTML = '';
            const convs = Object.values(STATE.conversations)
                .sort((a, b) =&gt; b.createdAt - a.createdAt);
            convs.forEach(conv =&gt; {
                const div = document.createElement('div');
                div.className = 'conv-item' + (conv.id === STATE.activeConvId ? ' active' : '');
                div.innerHTML = `
                    &lt;div style=&quot;flex:1;overflow:hidden&quot;&gt;
                        &lt;div class=&quot;conv-title&quot;&gt;${escapeHtml(conv.title)}&lt;/div&gt;
                        &lt;div class=&quot;conv-meta&quot;&gt;${conv.messages?.length || 0} msgs&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;span class=&quot;conv-delete&quot; onclick=&quot;APP.Chat.deleteConv('${conv.id}',event)&quot;&gt;✕&lt;/span&gt;
                `;
                div.onclick = (e) =&gt; {
                    if (e.target.classList.contains('conv-delete')) return;
                    this.loadConv(conv.id);
                };
                list.appendChild(div);
            });
        },

        renderMessages(messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            (messages || []).forEach(msg =&gt; this.appendMsg(msg));
            container.scrollTop = container.scrollHeight;
        },

        appendMsg(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            const emoji = msg.role === 'user' ? '👤' : '🤖';
            div.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('pt-BR') : '';
            div.innerHTML = `
                &lt;div class=&quot;avatar&quot;&gt;${emoji}&lt;/div&gt;
                &lt;div class=&quot;bubble&quot;&gt;
                    ${formatMessage(msg.content)}
                    ${time ? `&lt;div class=&quot;msg-time&quot;&gt;${time}&lt;/div&gt;` : ''}
                &lt;/div&gt;
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        },

        async send() {
            if (STATE.isLoading) return;
            const input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;

            const codeMode = document.getElementById('codeMode').checked;
            const codeContent = document.getElementById('codeEditor').value.trim();
            if (codeMode &amp;&amp; codeContent) {
                const lang = document.getElementById('codeLang').value;
                text += `\n\n**Código no editor:**\n\`\`\`${lang}\n${codeContent}\n\`\`\``;
            }

            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv) { this.newChat(); return; }

            const userMsg = { role: 'user', content: text, timestamp: Date.now() };
            conv.messages.push(userMsg);
            this.appendMsg(userMsg);

            if (conv.messages.length === 1) {
                conv.title = text.substring(0, 45) + (text.length &gt; 45 ? '...' : '');
                document.getElementById('convTitleEdit').value = conv.title;
                this.renderConversations();
            }

            input.value = '';
            APP.UI.autoResize(input);
            APP.Context.updateBar(conv.messages);

            STATE.isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const reply = await APP.AI.call(conv.messages);
                const aiMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
                conv.messages.push(aiMsg);
                this.appendMsg(aiMsg);
                APP.Context.updateBar(conv.messages);
                APP.Storage.save();
            } catch(err) {
                const errMsg = { role: 'assistant', content: `❌ Erro: ${err.message}`, timestamp: Date.now() };
                conv.messages.push(errMsg);
                this.appendMsg(errMsg);
                APP.UI.toast('❌ ' + err.message, 'error');
            }

            STATE.isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }
    },

    Context: {
        estimateTokens(messages) {
            return Math.ceil((messages || []).reduce((a, m) =&gt; a + (m.content?.length || 0), 0) / 4);
        },

        updateBar(messages) {
            const tokens = this.estimateTokens(messages);
            const limit = parseInt(STATE.settings.contextLimit) || 8000;
            const pct = Math.min(100, (tokens / limit) * 100);
            document.getElementById('tokenCount').textContent = tokens.toLocaleString('pt-BR');
            const fill = document.getElementById('contextFill');
            fill.style.width = pct + '%';
            fill.style.background = pct &gt; 80 ? 'var(--red)' : pct &gt; 55 ? 'var(--yellow)' : 'var(--green)';
        },

        clear() {
            const conv = STATE.conversations[STATE.activeConvId];
            if (!conv) return;
            if (!confirm('Limpar contexto?')) return;
            conv.messages = [];
            APP.Chat.renderMessages([]);
            this.updateBar([]);
            APP.Storage.save();
            APP.UI.toast('✂️ Contexto limpo!', 'success');
        }
    },

    AI: {
        async call(messages) {
            const { provider, model } = this.current();
            const s = STATE.settings;
            const temp = parseFloat(document.getElementById('tempSlider').value);
            const maxT = parseInt(document.getElementById('maxTokens').value);

            const msgs = [{
                role: 'system',
                content: s.systemPrompt || 'Você é um assistente especialista em programação.'
            }, ...messages.map(m =&gt; ({
                role: m.role === 'assistant' ? 'assistant' : 'user',
                content: m.content
            }))];

            switch (provider) {
                case 'openai': return await this.openai(msgs, model, s.apiKey, temp, maxT);
                case 'anthropic': return await this.anthropic(msgs, model, s.anthropicKey, temp, maxT);
                case 'gemini': return await this.gemini(msgs, model, s.geminiKey, temp, maxT);
                case 'groq': return await this.groq(msgs, model, s.apiKey, temp, maxT);
                case 'huggingface': return await this.huggingface(msgs, model, s.huggingfaceKey, temp, maxT);
                case 'cohere': return await this.cohere(msgs, model, s.cohereKey, temp, maxT);
                case 'together': return await this.together(msgs, model, s.togetherKey, temp, maxT);
                case 'ollama': return await this.ollama(msgs, model, temp, maxT);
                default: throw new Error('Provider não suportado');
            }
        },

        current() {
            return {
                provider: document.getElementById('aiProvider').value,
                model: document.getElementById('modelSelect').value
            };
        },

        async openai(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key OpenAI não configurada!');
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) {
                const err = await res.json().catch(() =&gt; ({}));
                throw new Error(err.error?.message || `HTTP ${res.status}`);
            }
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async anthropic(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Anthropic não configurada!');
            const system = messages.find(m =&gt; m.role === 'system')?.content || '';
            const msgs = messages.filter(m =&gt; m.role !== 'system');
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({ model, messages: msgs, system, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.content[0].text;
        },

        async gemini(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Gemini não configurada!');
            const contents = messages
                .filter(m =&gt; m.role !== 'system')
                .map(m =&gt; ({
                    role: m.role === 'assistant' ? 'model' : 'user',
                    parts: [{ text: m.content }]
                }));
            const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents,
                        generationConfig: { temperature: temp, maxOutputTokens: maxTokens }
                    })
                }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        },

        async groq(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('API Key Groq não configurada!');
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async huggingface(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('HuggingFace Token não configurado!');
            const text = messages.map(m =&gt; `${m.role}: ${m.content}`).join('\n');
            const res = await fetch('https://api-inference.huggingface.co/models/' + model, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: text,
                    parameters: { temperature: temp, max_length: maxTokens }
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return Array.isArray(data) ? data[0].generated_text : data.generated_text;
        },

        async cohere(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('Cohere API Key não configurada!');
            const text = messages.map(m =&gt; m.content).join('\n');
            const res = await fetch('https://api.cohere.com/v1/generate', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: text,
                    temperature: temp,
                    max_tokens: maxTokens,
                    model: model
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.generations[0].text;
        },

        async together(messages, model, apiKey, temp, maxTokens) {
            if (!apiKey) throw new Error('Together AI Key não configurada!');
            const res = await fetch('https://api.together.xyz/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model,
                    messages,
                    temperature: temp,
                    max_tokens: maxTokens
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.choices[0].message.content;
        },

        async ollama(messages, model, temp, maxTokens) {
            const url = STATE.settings.ollamaUrl || 'http://localhost:11434';
            const res = await fetch(`${url}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    messages: messages.map(m =&gt; ({ role: m.role, content: m.content })),
                    options: { temperature: temp, num_predict: maxTokens },
                    stream: false
                })
            });
            if (!res.ok) throw new Error(`Ollama HTTP ${res.status}`);
            const data = await res.json();
            return data.message.content;
        }
    },

    Playground: {
        newTab(name = null) {
            const tab = {
                id: 'tab_' + Date.now(),
                name: name || `código_${STATE.codeTabs.length + 1}`,
                content: '',
                language: 'html'
            };
            STATE.codeTabs.push(tab);
            STATE.activeCodeTab = STATE.codeTabs.length - 1;
            this.renderTabs();
            this.loadTab(STATE.activeCodeTab);
            APP.Storage.save();
        },

        renderTabs() {
            const container = document.getElementById('codeTabs');
            container.innerHTML = '';
            STATE.codeTabs.forEach((tab, i) =&gt; {
                const div = document.createElement('div');
                div.className = 'code-tab' + (i === STATE.activeCodeTab ? ' active' : '');
                div.innerHTML = `
                    &lt;span onclick=&quot;APP.Playground.switchTab(${i})&quot;&gt;${escapeHtml(tab.name)}&lt;/span&gt;
                    &lt;span class=&quot;code-tab-close&quot; onclick=&quot;APP.Playground.closeTab(${i},event)&quot;&gt;✕&lt;/span&gt;
                `;
                container.appendChild(div);
            });
        },

        switchTab(i) {
            this.saveCurrentTab();
            STATE.activeCodeTab = i;
            this.loadTab(i);
            this.renderTabs();
        },

        closeTab(i, e) {
            e.stopPropagation();
            if (STATE.codeTabs.length === 1) { APP.UI.toast('Mínimo 1 tab', 'error'); return; }
            STATE.codeTabs.splice(i, 1);
            if (STATE.activeCodeTab &gt;= STATE.codeTabs.length) STATE.activeCodeTab = STATE.codeTabs.length - 1;
            this.renderTabs();
            this.loadTab(STATE.activeCodeTab);
            APP.Storage.save();
        },

        loadTab(i) {
            const tab = STATE.codeTabs[i];
            if (!tab) return;
            document.getElementById('codeEditor').value = tab.content;
            document.getElementById('codeLang').value = tab.language || 'html';
        },

        saveCurrentTab() {
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            if (!tab) return;
            tab.content = document.getElementById('codeEditor').value;
            tab.language = document.getElementById('codeLang').value;
        },

        copyClean() {
            this.saveCurrentTab();
            const code = cleanCode(document.getElementById('codeEditor').value);
            navigator.clipboard.writeText(code).then(() =&gt; {
                APP.UI.toast('✅ Código copiado!', 'success');
            }).catch(() =&gt; {
                APP.UI.toast('❌ Erro ao copiar', 'error');
            });
        },

        paste() {
            navigator.clipboard.readText().then(text =&gt; {
                const editor = document.getElementById('codeEditor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const before = editor.value.substring(0, start);
                const after = editor.value.substring(end);
                editor.value = before + text + after;
                editor.selectionStart = editor.selectionEnd = start + text.length;
                this.saveCurrentTab();
                APP.UI.toast('📌 Código colado!', 'success');
            }).catch(() =&gt; {
                APP.UI.toast('❌ Erro ao colar', 'error');
            });
        },

        sendToChat() {
            this.saveCurrentTab();
            const code = document.getElementById('codeEditor').value.trim();
            const lang = document.getElementById('codeLang').value;
            if (!code) { APP.UI.toast('Editor vazio!', 'error'); return; }
            const input = document.getElementById('userInput');
            input.value = `Analise este código:\n\`\`\`${lang}\n${code}\n\`\`\``;
            APP.UI.autoResize(input);
            APP.switchTab('chat');
            input.focus();
        },

        clear() {
            if (!confirm('Limpar editor?')) return;
            document.getElementById('codeEditor').value = '';
            this.saveCurrentTab();
        },

        download() {
            this.saveCurrentTab();
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            const code = cleanCode(tab.content);
            const extMap = {
                javascript: 'js', python: 'py', html: 'html', css: 'css',
                typescript: 'ts', text: 'txt'
            };
            const ext = extMap[tab.language] || 'txt';
            APP.Storage._download(code, `${tab.name}.${ext}`, 'text/plain');
            APP.UI.toast('⬇️ Download iniciado!', 'success');
        },

        updatePreview() {
            this.saveCurrentTab();
            const tab = STATE.codeTabs[STATE.activeCodeTab];
            const lang = tab.language;
            const content = tab.content;
            const preview = document.getElementById('previewContent');

            if (lang === 'html') {
                const iframe = document.createElement('iframe');
                iframe.className = 'preview-frame';
                iframe.sandbox = 'allow-scripts allow-same-origin allow-forms';
                preview.innerHTML = '';
                preview.appendChild(iframe);
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(content);
                doc.close();
            } else {
                preview.innerHTML = `&lt;div class=&quot;preview-placeholder&quot;&gt;Preview disponível apenas para HTML&lt;/div&gt;`;
            }
        }
    },

    Settings: {

            const s = STATE.settings;
            document.getElementById('apiKeyInput').value = s.apiKey || '';
            document.getElementById('anthropicKeyInput').value = s.anthropicKey || '';
            document.getElementById('geminiKeyInput').value = s.geminiKey || '';
            document.getElementById('huggingfaceKeyInput').value = s.huggingfaceKey || '';
            document.getElementById('cohereKeyInput').value = s.cohereKey || '';
            document.getElementById('togetherKeyInput').value = s.togetherKey || '';
            document.getElementById('ollamaUrl').value = s.ollamaUrl || 'http://localhost:11434';
            document.getElementById('contextLimit').value = s.contextLimit || 8000;
            document.getElementById('systemPrompt').value = s.systemPrompt || '';

        },

        save() {

            s.apiKey = document.getElementById('apiKeyInput').value;
            s.anthropicKey = document.getElementById('anthropicKeyInput').value;
            s.geminiKey = document.getElementById('geminiKeyInput').value;
            s.huggingfaceKey = document.getElementById('huggingfaceKeyInput').value;
            s.cohereKey = document.getElementById('cohereKeyInput').value;
            s.togetherKey = document.getElementById('togetherKeyInput').value;
            s.ollamaUrl = document.getElementById('ollamaUrl').value;
            s.contextLimit = parseInt(document.getElementById('contextLimit').value);
            s.systemPrompt = document.getElementById('systemPrompt').value;

            s.temperature = parseFloat(document.getElementById('tempSlider').value);
            s.maxTokens = parseInt(document.getElementById('maxTokens').value);
            APP.Storage.save();
            this.close();
            APP.UI.toast('✅ Configurações salvas!', 'success');
        }
    },

    Storage: {
        save() {
            try {
                localStorage.setItem('aiStudio_v3', JSON.stringify({
                    conversations: STATE.conversations,
                    activeConvId: STATE.activeConvId,
                    codeTabs: STATE.codeTabs,
                    activeCodeTab: STATE.activeCodeTab,
                    settings: STATE.settings
                }));
            } catch(e) {
                APP.UI.toast('⚠️ Erro ao salvar', 'error');
            }
        },

        load() {
            try {
                const raw = localStorage.getItem('aiStudio_v3');
                if (!raw) return;
                const d = JSON.parse(raw);
                STATE.conversations = d.conversations || {};
                STATE.activeConvId = d.activeConvId || null;
                STATE.codeTabs = d.codeTabs || [];
                STATE.activeCodeTab = d.activeCodeTab || 0;
                if (d.settings) STATE.settings = { ...STATE.settings, ...d.settings };
            } catch(e) {
                console.error('Erro ao carregar:', e);
            }
        },

        exportAll() {
            const data = {
                exportedAt: new Date().toISOString(),
                conversations: STATE.conversations,
                codeTabs: STATE.codeTabs,
                settings: { ...STATE.settings, apiKey: '***', anthropicKey: '***', geminiKey: '***', huggingfaceKey: '***', cohereKey: '***', togetherKey: '***' }
            };
            this._download(JSON.stringify(data, null, 2), `backup-${Date.now()}.json`, 'application/json');
            APP.UI.toast('💾 Backup exportado!', 'success');
        },

        _download(content, filename, type) {
            const blob = new Blob([content], { type });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }
    },

    UI: {
        toast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = `toast show ${type}`;
            clearTimeout(el._t);
            el._t = setTimeout(() =&gt; { el.className = 'toast'; }, 3000);
        },

        autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 180) + 'px';
        },

        handleKey(e) {
            if (e.ctrlKey &amp;&amp; e.key === 'Enter') {
                e.preventDefault();
                APP.Chat.send();
            }
        }
    }
};

function escapeHtml(text) {
    return String(text)
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/&lt;/g, '&amp;lt;')
        .replace(/&gt;/g, '&amp;gt;')
        .replace(/&quot;/g, '&amp;quot;');
}

function cleanCode(code) {
    return String(code)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\u00A0/g, ' ')
        .trim();
}

function formatMessage(text) {
    text = String(text);
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =&gt; {
        const clean = escapeHtml(cleanCode(code.trim()));
        return `&lt;pre&gt;&lt;button class=&quot;copy-code-btn&quot; onclick=&quot;copyCodeBlock(this)&quot;&gt;📋 Copiar&lt;/button&gt;&lt;code&gt;${clean}&lt;/code&gt;&lt;/pre&gt;`;
    });
    text = text.replace(/\*\*(.*?)\*\*/g, '&lt;strong&gt;$1&lt;/strong&gt;');
    text = text.replace(/`([^`]+)`/g, '&lt;code style=&quot;background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:monospace&quot;&gt;$1&lt;/code&gt;');
    text = text.replace(/\n/g, '&lt;br&gt;');
    return text;
}

function copyCodeBlock(btn) {
    const code = cleanCode(btn.nextElementSibling.textContent);
    navigator.clipboard.writeText(code).then(() =&gt; {
        btn.textContent = '✅ Copiado!';
        setTimeout(() =&gt; btn.textContent = '📋 Copiar', 2000);
    });
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
});

document.getElementById('fileImportCode').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) =&gt; {
        const content = evt.target.result;
        const editor = document.getElementById('codeEditor');
        editor.value = content;
        const ext = file.name.split('.').pop().toLowerCase();
        const langMap = { js: 'javascript', py: 'python', html: 'html', css: 'css', ts: 'typescript', txt: 'text', jsx: 'javascript', tsx: 'typescript', md: 'text', json: 'text' };
        document.getElementById('codeLang').value = langMap[ext] || 'text';
        APP.Playground.saveCurrentTab();
        APP.UI.toast(`📂 ${file.name} importado!`, 'success');
    };
    reader.readAsText(file);
    e.target.value = '';
});

document.getElementById('tempSlider').addEventListener('input', function() {
    document.getElementById('tempVal').textContent = this.value;
});

function INIT() {
    APP.Storage.load();
    APP.Provider.updateSelect();

    if (STATE.activeConvId &amp;&amp; STATE.conversations[STATE.activeConvId]) {
        APP.Chat.loadConv(STATE.activeConvId);
    } else {
        APP.Chat.newChat();
    }

    if (STATE.codeTabs.length === 0) {
        APP.Playground.newTab();
    } else {
        APP.Playground.renderTabs();
        APP.Playground.loadTab(STATE.activeCodeTab);
    }

    APP.UI.toast('🚀 AI Code Studio + Playground pronto!', 'success');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', INIT);
} else {
    INIT();
}
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe>
</div>


<script>
function trocarProjeto(index) {
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  localStorage.setItem('ultimo-projeto', index);
}

window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
