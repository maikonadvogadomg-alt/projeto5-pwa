<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Iara Mapper Pro - Final</title>
  
  <!-- Bibliotecas OBRIGATÓRIAS para ZIP e Cores funcionarem -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      width: 100%; height: 100%;
      background: var(--bg-dark); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* CABEÇALHO */
    .header {
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .header h1 { font-size: 16px; color: var(--accent); margin-right: auto; }
    
    .btn {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: bold; cursor: pointer; color: white;
      background: #475569; transition: 0.2s;
    }
    .btn:hover { filter: brightness(1.2); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); }
    
    /* INPUT DE ARQUIVO ESCONDIDO */
    .file-wrapper { position: relative; overflow: hidden; display: inline-block; }
    .file-wrapper input[type="file"] { position: absolute; left: -9999px; }

    /* ÁREA PRINCIPAL */
    .main-container {
      display: flex; flex: 1; overflow: hidden;
    }

    /* BARRA LATERAL (ARQUIVOS) */
    .sidebar {
      width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; transition: 0.3s;
    }
    .sidebar.collapsed { width: 0; border: none; }
    .sidebar-header {
      padding: 10px; display: flex; justify-content: space-between;
      border-bottom: 1px solid var(--border); background: var(--bg-dark);
    }
    .file-list { flex: 1; overflow-y: auto; padding: 10px; }
    .file-item {
      padding: 8px; margin-bottom: 5px; background: var(--bg-dark);
      border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
      font-size: 12px; word-break: break-all;
    }
    .file-item:hover { border-color: var(--accent); }
    .file-item.active { border-color: var(--success); background: rgba(63, 185, 80, 0.1); }

    /* ÁREA DO EDITOR E PREVIEW */
    .content-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    
    .editor-section {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    
    .toolbar {
      padding: 8px; background: var(--bg-dark); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; font-size: 12px; color: #888;
    }

    .code-container {
      flex: 1; overflow: auto; background: var(--bg-dark); padding: 15px;
    }
    
    /* PREVIEW NA PARTE DE BAIXO */
    .preview-section {
      height: 40%; background: var(--bg-panel); border-top: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .preview-content {
      flex: 1; overflow: auto; padding: 15px; font-family: monospace; font-size: 13px;
    }

    /* RESPONSIVO CELULAR */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar.collapsed { height: 0; }
      .preview-section { height: 50%; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚀 Iara Mapper Pro</h1>
    <button class="btn" onclick="toggleSidebar()">☰ Ocultar Lista</button>
    
    <div class="file-wrapper">
      <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📁 Carregar Arquivo / ZIP</button>
      <input type="file" id="file-input" accept="*/*" multiple>
    </div>
    
    <button class="btn btn-danger" onclick="limparTudo()">🗑️ Limpar Tudo</button>
  </div>

  <div class="main-container">
    <!-- LADO ESQUERDO: ARQUIVOS -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span style="font-size: 12px; font-weight: bold; color: var(--accent);">📂 Seus Arquivos</span>
      </div>
      <div class="file-list" id="file-list">
        <div style="color: #666; text-align: center; margin-top: 20px; font-size: 12px;">Nenhum arquivo carregado.</div>
      </div>
    </div>

    <!-- LADO DIREITO: EDITOR E PREVIEW -->
    <div class="content-area">
      
      <!-- PARTE DE CIMA: CÓDIGO FONTE -->
      <div class="editor-section">
        <div class="toolbar">
          <span id="file-name">Nenhum arquivo selecionado</span>
          <span id="file-info"></span>
        </div>
        <div class="code-container">
          <pre><code id="code-editor" class="language-plaintext">Carregue um arquivo para visualizar o código aqui...</code></pre>
        </div>
      </div>

      <!-- PARTE DE BAIXO: PREVIEW -->
      <div class="preview-section">
        <div class="toolbar" style="background: var(--bg-panel);">
          <span style="color: var(--success); font-weight: bold;">👁️ Preview / Resultado</span>
        </div>
        <div class="preview-content" id="preview-box">
          Aguardando arquivo...
        </div>
      </div>

    </div>
  </div>

  <script>
    let arquivos = [];
    let arquivoAtual = null;

    // Função para detectar a linguagem baseada na extensão
    function obterLinguagem(nomeArquivo) {
      const ext = nomeArquivo.split('.').pop().toLowerCase();
      const mapa = {
        'js': 'javascript', 'html': 'xml', 'htm': 'xml', 'css': 'css',
        'json': 'json', 'py': 'python', 'java': 'java', 'php': 'php',
        'sql': 'sql', 'xml': 'xml', 'md': 'markdown', 'txt': 'plaintext'
      };
      return mapa[ext] || 'plaintext';
    }

    // Lidar com o upload de arquivos
    document.getElementById('file-input').addEventListener('change', async function(e) {
      const files = e.target.files;
      if (files.length === 0) return;

      document.getElementById('file-name').innerText = "Processando...";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        
        // SE FOR ZIP: Usa a biblioteca JSZip para extrair
        if (file.name.toLowerCase().endsWith('.zip')) {
          try {
            const zip = new JSZip();
            const conteudoZip = await zip.loadAsync(file);
            
            // Passa por todos os arquivos dentro do ZIP
            for (let nomeRelativo in conteudoZip.files) {
              const arquivoZip = conteudoZip.files[nomeRelativo];
              if (!arquivoZip.dir) {
                const texto = await arquivoZip.async("string");
                arquivos.push({
                  nome: nomeRelativo,
                  conteudo: texto,
                  linguagem: obterLinguagem(nomeRelativo)
                });
              }
            }
          } catch (erro) {
            alert("Erro ao ler o ZIP: " + erro.message);
          }
        } 
        // SE FOR ARQUIVO NORMAL (HTML, JS, TXT, etc)
        else {
          const texto = await file.text();
          arquivos.push({
            nome: file.name,
            conteudo: texto,
            linguagem: obterLinguagem(file.name)
          });
        }
      }

      atualizarListaArquivos();
      document.getElementById('file-input').value = ""; // Reseta o input
    });

    // Atualiza a barra lateral
    function atualizarListaArquivos() {
      const lista = document.getElementById('file-list');
      if (arquivos.length === 0) {
        lista.innerHTML = '<div style="color: #666; text-align: center; margin-top: 20px; font-size: 12px;">Nenhum arquivo carregado.</div>';
        return;
      }

      lista.innerHTML = "";
      arquivos.forEach((arq, index) => {
        const div = document.createElement('div');
        div.className = `file-item ${arquivoAtual === index ? 'active' : ''}`;
        div.innerText = `📄 ${arq.nome}`;
        div.onclick = () => selecionarArquivo(index);
        lista.appendChild(div);
      });

      // Seleciona o primeiro arquivo automaticamente se não houver nenhum selecionado
      if (arquivoAtual === null && arquivos.length > 0) {
        selecionarArquivo(0);
      }
    }

    // Mostra o arquivo na tela
    function selecionarArquivo(index) {
      arquivoAtual = index;
      const arq = arquivos[index];
      
      // Atualiza textos
      document.getElementById('file-name').innerText = `📝 ${arq.nome}`;
      document.getElementById('file-info').innerText = `Tipo: ${arq.linguagem}`;
      
      // Atualiza o Editor com cores (Highlight.js)
      const editor = document.getElementById('code-editor');
      editor.className = `language-${arq.linguagem}`;
      editor.textContent = arq.conteudo;
      hljs.highlightElement(editor); // Aplica as cores!

      // Atualiza o Preview na parte de baixo
      const previewBox = document.getElementById('preview-box');
      if (arq.linguagem === 'xml' || arq.nome.endsWith('.html')) {
        // Se for HTML, renderiza em um iframe para ver funcionando
        previewBox.innerHTML = `<iframe style="width:100%; height:100%; border:none; background:white;" srcdoc="${arq.conteudo.replace(/"/g, '&quot;')}"></iframe>`;
      } else {
        // Se for outro arquivo, mostra o texto puro
        previewBox.innerHTML = `<pre style="white-space: pre-wrap; word-wrap: break-word;">${arq.conteudo.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
      }

      atualizarListaArquivos(); // Atualiza a cor de seleção na lista
    }

    // Botão de limpar
    function limparTudo() {
      if(confirm("Tem certeza que deseja apagar tudo?")) {
        arquivos = [];
        arquivoAtual = null;
        atualizarListaArquivos();
        document.getElementById('code-editor').textContent = "Carregue um arquivo para visualizar o código aqui...";
        document.getElementById('code-editor').className = "language-plaintext";
        document.getElementById('preview-box').innerHTML = "Aguardando arquivo...";
        document.getElementById('file-name').innerText = "Nenhum arquivo selecionado";
        document.getElementById('file-info').innerText = "";
      }
    }

    // Botão de esconder barra lateral
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
  </script>
</body>
</html>
