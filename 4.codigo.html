&lt;script&gt;
let zipA = null, zipB = null;
let filesA = {}, filesB = {};
let results = [];

// Drag &amp; drop
['a','b'].forEach(side =&gt; {
  const drop = document.getElementById(`drop-${side}`);
  drop.addEventListener('dragover', e =&gt; { e.preventDefault(); drop.style.borderColor = '#58a6ff'; });
  drop.addEventListener('dragleave', () =&gt; { drop.style.borderColor = '#30363d'; });
  drop.addEventListener('drop', e =&gt; {
    e.preventDefault(); drop.style.borderColor = '#30363d';
    if (e.dataTransfer.files[0]) loadZipFile(side, e.dataTransfer.files[0]);
  });
});

async function loadZip(side, input) {
  if (input.files[0]) loadZipFile(side, input.files[0]);
}

async function loadZipFile(side, file) {
  const label = document.getElementById(`label-${side}`);
  const drop = document.getElementById(`drop-${side}`);
  label.textContent = '⏳ Lendo...';
  try {
    const zip = await JSZip.loadAsync(file);
    const files = {};
    for (const [name, entry] of Object.entries(zip.files)) {
      if (entry.dir) continue;
      // Pular binários e node_modules
      const skip = ['node_modules/', '.git/', 'dist/', 'dist-apk/'].some(s =&gt; name.includes(s));
      if (skip) continue;
      const ext = name.split('.').pop()?.toLowerCase();
      const textExts = ['ts','tsx','js','jsx','json','md','css','html','txt','env','yml','yaml','toml','sh','bat','py','cjs','mjs','svg'];
      if (!textExts.includes(ext)) continue;
      try {
        files[normalPath(name)] = await entry.async('text');
      } catch {}
    }
    if (side === 'a') { filesA = files; }
    else { filesB = files; }
    const count = Object.keys(files).length;
    label.textContent = `✅ ${file.name} (${count} arquivos)`;
    drop.style.borderColor = '#3fb950';
    label.style.color = '#3fb950';
  } catch(e) {
    label.textContent = '❌ Erro: ' + e.message;
    label.style.color = '#f85149';
  }
}

function normalPath(p) {
  // Remove primeiro segmento (nome da pasta do zip)
  const parts = p.split('/');
  return parts.length &gt; 1 ? parts.slice(1).join('/') : p;
}

function compareZips() {
  if (!Object.keys(filesA).length || !Object.keys(filesB).length) {
    alert('Carregue os dois ZIPs primeiro!'); return;
  }
  const allKeys = new Set([...Object.keys(filesA), ...Object.keys(filesB)]);
  results = [];
  let mod=0, newf=0, del=0, same=0;

  for (const key of allKeys) {
    const a = filesA[key];
    const b = filesB[key];
    let status;
    if (a === undefined) { status = 'new'; newf++; }
    else if (b === undefined) { status = 'del'; del++; }
    else if (a === b) { status = 'same'; same++; }
    else { status = 'mod'; mod++; }
    results.push({ key, status, a, b });
  }

  results.sort((x, y) =&gt; {
    const order = {mod:0, new:1, del:2, same:3};
    return (order[x.status] - order[y.status]) || x.key.localeCompare(y.key);
  });

  // Atualizar resumo
  document.getElementById('s-total').textContent = allKeys.size;
  document.getElementById('s-mod').textContent = mod;
  document.getElementById('s-new').textContent = newf;
  document.getElementById('s-del').textContent = del;
  document.getElementById('s-same').textContent = same;
  document.getElementById('summary').style.display = 'block';

  renderList();
}

function renderList() {
  const showMod = document.getElementById('show-mod').checked;
  const showNew = document.getElementById('show-new').checked;
  const showDel = document.getElementById('show-del').checked;
  const showSame = document.getElementById('show-same').checked;
  const filterText = document.getElementById('filter-text').value.toLowerCase();

  const filtered = results.filter(r =&gt; {
    if (!showMod &amp;&amp; r.status === 'mod') return false;
    if (!showNew &amp;&amp; r.status === 'new') return false;
    if (!showDel &amp;&amp; r.status === 'del') return false;
    if (!showSame &amp;&amp; r.status === 'same') return false;
    if (filterText &amp;&amp; !r.key.toLowerCase().includes(filterText)) return false;
    return true;
  });

  const badges = { mod:'&lt;span class=&quot;badge mod&quot;&gt;MODIFICADO&lt;/span&gt;', new:'&lt;span class=&quot;badge new&quot;&gt;NOVO&lt;/span&gt;', del:'&lt;span class=&quot;badge del&quot;&gt;REMOVIDO&lt;/span&gt;', same:'&lt;span class=&quot;badge same-b&quot;&gt;IGUAL&lt;/span&gt;' };

  const container = document.getElementById('files-container');
  container.innerHTML = filtered.map((r, i) =&gt; `
    &lt;div class=&quot;file-row&quot; onclick=&quot;showDiff(${results.indexOf(r)})&quot;&gt;
      &lt;span&gt;${r.key}&lt;/span&gt;
      ${badges[r.status]}
    &lt;/div&gt;
  `).join('') || '&lt;div style=&quot;padding:20px;text-align:center;color:#8b949e;font-size:13px;&quot;&gt;Nenhum arquivo com esses filtros&lt;/div&gt;';

  document.getElementById('file-list').style.display = 'block';
}

['show-mod','show-new','show-del','show-same'].forEach(id =&gt; {
  document.getElementById(id).onchange = renderList;
});
document.getElementById('filter-text').oninput = renderList;

function showDiff(i) {
  const r = results[i];
  document.getElementById('diff-title').textContent = r.key;
  document.getElementById('diff-panel').style.display = 'block';

  const content = document.getElementById('diff-content');

  if (r.status === 'new') {
    content.innerHTML = `&lt;div class=&quot;added&quot; style=&quot;padding:10px;&quot;&gt;+++ ARQUIVO NOVO +++\n\n${esc(r.b)}&lt;/div&gt;`;
  } else if (r.status === 'del') {
    content.innerHTML = `&lt;div class=&quot;removed&quot; style=&quot;padding:10px;&quot;&gt;--- ARQUIVO REMOVIDO ---\n\n${esc(r.a)}&lt;/div&gt;`;
  } else if (r.status === 'same') {
    content.innerHTML = `&lt;div class=&quot;same&quot; style=&quot;padding:10px;&quot;&gt;= Arquivos idênticos =\n\n${esc(r.a)}&lt;/div&gt;`;
  } else {
    // Diff linha a linha
    const linesA = (r.a || '').split('\n');
    const linesB = (r.b || '').split('\n');
    content.innerHTML = diffLines(linesA, linesB);
  }

  document.getElementById('diff-panel').scrollIntoView({ behavior: 'smooth' });
}

function diffLines(a, b) {
  // Diff simples linha a linha
  const maxA = a.length, maxB = b.length;
  let html = '';
  let i = 0, j = 0;

  while (i &lt; maxA || j &lt; maxB) {
    if (i &gt;= maxA) {
      html += `&lt;div class=&quot;added&quot;&gt;+ ${esc(b[j])}&lt;/div&gt;`;
      j++;
    } else if (j &gt;= maxB) {
      html += `&lt;div class=&quot;removed&quot;&gt;- ${esc(a[i])}&lt;/div&gt;`;
      i++;
    } else if (a[i] === b[j]) {
      html += `&lt;div class=&quot;same&quot;&gt;  ${esc(a[i])}&lt;/div&gt;`;
      i++; j++;
    } else {
      // Procurar match próximo
      let foundB = -1, foundA = -1;
      for (let k = 1; k &lt;= 5; k++) {
        if (j+k &lt; maxB &amp;&amp; a[i] === b[j+k]) { foundB = k; break; }
        if (i+k &lt; maxA &amp;&amp; b[j] === a[i+k]) { foundA = k; break; }
      }
      if (foundB !== -1 &amp;&amp; (foundA === -1 || foundB &lt;= foundA)) {
        for (let k = 0; k &lt; foundB; k++) {
          html += `&lt;div class=&quot;added&quot;&gt;+ ${esc(b[j+k])}&lt;/div&gt;`;
        }
        j += foundB;
      } else if (foundA !== -1) {
        for (let k = 0; k &lt; foundA; k++) {
          html += `&lt;div class=&quot;removed&quot;&gt;- ${esc(a[i+k])}&lt;/div&gt;`;
        }
        i += foundA;
      } else {
        html += `&lt;div class=&quot;removed&quot;&gt;- ${esc(a[i])}&lt;/div&gt;`;
        html += `&lt;div class=&quot;added&quot;&gt;+ ${esc(b[j])}&lt;/div&gt;`;
        i++; j++;
      }
    }
  }
  return html || '&lt;div class=&quot;same&quot; style=&quot;padding:10px;&quot;&gt;Sem diferenças visíveis&lt;/div&gt;';
}

function esc(s) {
  return String(s ?? '').replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;');
}
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>

    &lt;div id=&quot;result-files&quot; style=&quot;margin-bottom: 16px;&quot;&gt;&lt;/div&gt;
    
    &lt;div style=&quot;background: #0a0e14; border-radius: 6px; padding: 14px; margin-bottom: 12px;&quot;&gt;
      &lt;div style=&quot;font-size: 12px; font-weight: 600; color: #58a6ff; margin-bottom: 8px;&quot;&gt;📋 Próximos passos:&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-num&quot;&gt;1&lt;/span&gt;&lt;span&gt;Extraia o ZIP gerado na pasta do seu projeto&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-num&quot;&gt;3&lt;/span&gt;&lt;span&gt;Faça login: &lt;code style=&quot;background:#161b22;padding:2px 6px;border-radius:4px;color:#3fb950;&quot;&gt;npx eas login&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot; id=&quot;step-build&quot;&gt;&lt;span class=&quot;step-num&quot;&gt;4&lt;/span&gt;&lt;span&gt;Gere o APK: &lt;code style=&quot;background:#161b22;padding:2px 6px;border-radius:4px;color:#3fb950;&quot;&gt;eas build --profile preview --platform android&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-num&quot;&gt;5&lt;/span&gt;&lt;span&gt;Baixe o APK no link que aparecer no terminal&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div style=&quot;background: #1a1500; border: 1px solid #d29922; border-radius: 6px; padding: 10px; font-size: 12px; color: #d29922;&quot;&gt;
      ⚠️ Precisa ter Node.js e uma conta gratuita em expo.dev para funcionar.
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
let loadedZip = null;
let loadedFiles = {};

// Drag and drop
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e =&gt; { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () =&gt; dz.classList.remove('drag'));
dz.addEventListener('drop', e =&gt; { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) processZipFile(e.dataTransfer.files[0]); });

async function loadZip(input) {
  if (input.files[0]) processZipFile(input.files[0]);
}

async function processZipFile(file) {
  const status = document.getElementById('zip-status');
  status.textContent = '⏳ Lendo ZIP...';
  status.style.color = '#8b949e';

  try {
    const zip = await JSZip.loadAsync(file);
    loadedZip = zip;
    loadedFiles = {};

    let appJson = null, pkgJson = null;
    const fileList = [];

    for (const [name, entry] of Object.entries(zip.files)) {
      if (entry.dir) continue;
      const content = await entry.async('text').catch(() =&gt; null);
      if (content !== null) {
        loadedFiles[name] = content;
        fileList.push(name);
        const baseName = name.split('/').pop();
        if (baseName === 'app.json') appJson = { path: name, content };
        if (baseName === 'package.json') pkgJson = { path: name, content };
      }
    }

    // Auto-preencher campos com dados do projeto importado
    if (appJson) {
      try {
        const data = JSON.parse(appJson.content);
        const expo = data.expo || data;
        if (expo.name) document.getElementById('app-name').value = expo.name;
        if (expo.slug) document.getElementById('app-slug').value = expo.slug;
        if (expo.owner) document.getElementById('app-owner').value = expo.owner;
        if (expo.version) document.getElementById('app-version').value = expo.version;
        if (expo.scheme) document.getElementById('app-scheme').value = expo.scheme;
        if (expo.android?.package) document.getElementById('android-package').value = expo.android.package;
        if (expo.extra?.eas?.projectId) document.getElementById('project-id').value = expo.extra.eas.projectId;
        status.innerHTML = '✅ app.json encontrado e campos preenchidos automaticamente!';
        status.style.color = '#3fb950';
      } catch { status.textContent = '⚠️ Leu o ZIP mas não conseguiu ler o app.json'; status.style.color = '#d29922'; }
    } else {
      status.textContent = '⚠️ Não encontrou app.json — preencha os campos manualmente';
      status.style.color = '#d29922';
    }

    // Mostrar arquivos principais
    const important = fileList.filter(f =&gt; {
      const b = f.split('/').pop();
      return ['app.json','package.json','eas.json','babel.config.js','metro.config.js','tsconfig.json'].includes(b);
    });
    document.getElementById('zip-files').innerHTML = important.map(f =&gt;
      `&lt;div class=&quot;file-item&quot;&gt;&lt;span style=&quot;color:#8b949e&quot;&gt;${f}&lt;/span&gt;&lt;span class=&quot;badge badge-green&quot;&gt;encontrado&lt;/span&gt;&lt;/div&gt;`
    ).join('');

  } catch(e) {
    status.textContent = '❌ Erro ao ler ZIP: ' + e.message;
    status.style.color = '#f85149';
  }
}

function autoSlug(input) {
  input.value = input.value.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  autoPackage();
}

function autoPackage() {
  const slug = document.getElementById('app-slug').value.replace(/-/g, '');
  const owner = document.getElementById('app-owner').value.replace(/-/g, '').toLowerCase();
  if (slug &amp;&amp; owner &amp;&amp; !document.getElementById('android-package').value) {
    document.getElementById('android-package').value = `com.${owner}.${slug}`;
  }
  const schemeEl = document.getElementById('app-scheme');
  if (!schemeEl.value &amp;&amp; slug) schemeEl.value = slug;
}

function selectBuild(radio) {
  document.getElementById('opt-apk').style.borderColor = radio.value === 'apk' ? '#58a6ff' : '#30363d';
  document.getElementById('opt-aab').style.borderColor = radio.value === 'aab' ? '#58a6ff' : '#30363d';
  const step = document.getElementById('step-build');
  if (radio.value === 'aab') {
    step.querySelector('span:last-child').innerHTML = 'Gere o AAB: &lt;code style=&quot;background:#161b22;padding:2px 6px;border-radius:4px;color:#3fb950;&quot;&gt;eas build --profile production --platform android&lt;/code&gt;';
  } else {
    step.querySelector('span:last-child').innerHTML = 'Gere o APK: &lt;code style=&quot;background:#161b22;padding:2px 6px;border-radius:4px;color:#3fb950;&quot;&gt;eas build --profile preview --platform android&lt;/code&gt;';
  }
}

async function generateFiles() {
  const name = document.getElementById('app-name').value.trim();
  const slug = document.getElementById('app-slug').value.trim();
  const owner = document.getElementById('app-owner').value.trim();
  const version = document.getElementById('app-version').value.trim() || '1.0.0';
  const projectId = document.getElementById('project-id').value.trim();
  const androidPkg = document.getElementById('android-package').value.trim();
  const scheme = document.getElementById('app-scheme').value.trim() || slug;

  if (!name || !slug || !owner || !projectId || !androidPkg) {
    alert('Preencha todos os campos obrigatórios:\n- Nome, Slug, Owner, Project ID e Pacote Android');
    return;
  }

  // Gerar app.json
  const appJson = {
    expo: {
      name, slug, version,
      orientation: &quot;portrait&quot;,
      icon: &quot;./assets/images/icon.png&quot;,
      scheme,
      userInterfaceStyle: &quot;dark&quot;,
      newArchEnabled: true,
      splash: { image: &quot;./assets/images/icon.png&quot;, resizeMode: &quot;contain&quot;, backgroundColor: &quot;#0d1117&quot; },
      ios: { supportsTablet: false, bundleIdentifier: androidPkg },
      android: {
        package: androidPkg,
        versionCode: 1,
        softwareKeyboardLayoutMode: &quot;resize&quot;,
        adaptiveIcon: { foregroundImage: &quot;./assets/images/icon.png&quot;, backgroundColor: &quot;#0d1117&quot; },
        permissions: [&quot;android.permission.INTERNET&quot;,&quot;android.permission.READ_EXTERNAL_STORAGE&quot;,&quot;android.permission.WRITE_EXTERNAL_STORAGE&quot;]
      },
      web: { favicon: &quot;./assets/images/icon.png&quot;, bundler: &quot;metro&quot; },
      plugins: [&quot;expo-router&quot;,&quot;expo-font&quot;,&quot;expo-web-browser&quot;,[&quot;expo-sqlite&quot;,{&quot;enableFTS&quot;:true,&quot;useSQLCipher&quot;:false}]],
      experiments: { typedRoutes: true, reactCompiler: false },
      owner,
      extra: { eas: { projectId } }
    }
  };

  // Gerar eas.json
  const easJson = {
    cli: { version: &quot;&gt;= 16.0.0&quot;, appVersionSource: &quot;local&quot; },
    build: {
      preview: {
        android: { buildType: &quot;apk&quot;, gradleCommand: &quot;:app:assembleRelease&quot;, resourceClass: &quot;medium&quot; },
        distribution: &quot;internal&quot;,
        cache: { disabled: false },
        node: &quot;20.18.0&quot;,
        env: {}
      },
      development: {
        developmentClient: true,
        distribution: &quot;internal&quot;,
        android: { buildType: &quot;apk&quot;, resourceClass: &quot;medium&quot; },
        node: &quot;20.18.0&quot;,
        cache: { disabled: false }
      },
      production: {
        android: { buildType: &quot;app-bundle&quot;, resourceClass: &quot;medium&quot; },
        node: &quot;20.18.0&quot;,
        cache: { disabled: false }
      }
    },
    submit: { production: {} }
  };

  // Gerar .easignore
  const easIgnore = `node_modules/\n.git/\ndist/\n*.log\n.env\n`;

  // Criar ZIP de saída
  const outZip = new JSZip();

  // Se tinha ZIP importado, adicionar os arquivos originais (exceto os que vamos substituir)
  if (loadedZip) {
    for (const [name, content] of Object.entries(loadedFiles)) {
      const baseName = name.split('/').pop();
      if (!['app.json','eas.json','.easignore'].includes(baseName)) {
        outZip.file(name, content);
      }
    }
  }

  // Adicionar/substituir arquivos configurados
  const prefix = loadedZip ? (Object.keys(loadedFiles)[0]?.split('/')[0] + '/') : '';
  outZip.file(prefix + 'app.json', JSON.stringify(appJson, null, 2));
  outZip.file(prefix + 'eas.json', JSON.stringify(easJson, null, 2));
  outZip.file(prefix + '.easignore', easIgnore);

  // Gerar e baixar
  const blob = await outZip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${slug}-eas-config.zip`;
  a.click();
  URL.revokeObjectURL(url);

  // Mostrar resultado
  document.getElementById('result').style.display = 'block';
  document.getElementById('result-files').innerHTML = `
    &lt;div class=&quot;file-item&quot;&gt;&lt;span style=&quot;color:#3fb950;font-family:monospace;&quot;&gt;app.json&lt;/span&gt;&lt;span style=&quot;color:#8b949e;font-size:11px;&quot;&gt;nome, slug, owner, projectId configurados&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;file-item&quot;&gt;&lt;span style=&quot;color:#3fb950;font-family:monospace;&quot;&gt;eas.json&lt;/span&gt;&lt;span style=&quot;color:#8b949e;font-size:11px;&quot;&gt;preview (APK) + development + production&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;file-item&quot;&gt;&lt;span style=&quot;color:#3fb950;font-family:monospace;&quot;&gt;.easignore&lt;/span&gt;&lt;span style=&quot;color:#8b949e;font-size:11px;&quot;&gt;ignora node_modules no build&lt;/span&gt;&lt;/div&gt;
  `;
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

// Inicializar estilo do radio selecionado
document.getElementById('opt-apk').style.borderColor = '#58a6ff';
&lt;/script&gt;
&lt;/body&gt;

    &amp;lt;style&amp;gt;
        * {

        .spinner {

        @keyframes spin {

        .copiado {

        ::-webkit-scrollbar {

    &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;
    &amp;lt;div class=&amp;quot;container&amp;quot;&amp;gt;
        &amp;lt;h1&amp;gt;📋 Gerador de Plano de Projeto&amp;lt;/h1&amp;gt;
        &amp;lt;p class=&amp;quot;subtitulo&amp;quot;&amp;gt;Analisa qualquer projeto · Gera documentação completa em Markdown · Detecta APIs, funções, rotas · Integração com IA&amp;lt;/p&amp;gt;

        &amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
            &amp;lt;!-- COLUNA ESQUERDA --&amp;gt;
            &amp;lt;div&amp;gt;
                &amp;lt;!-- UPLOAD --&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
                    &amp;lt;h2&amp;gt;📁 Carregar Projeto&amp;lt;/h2&amp;gt;
                    &amp;lt;div class=&amp;quot;upload-area&amp;quot; id=&amp;quot;uploadArea&amp;quot; onclick=&amp;quot;document.getElementById('fileInput').click()&amp;quot;&amp;gt;
                        &amp;lt;div style=&amp;quot;font-size: 48px; margin-bottom: 12px;&amp;quot;&amp;gt;📦&amp;lt;/div&amp;gt;
                        &amp;lt;div style=&amp;quot;color: #38bdf8; font-weight: bold; margin-bottom: 8px;&amp;quot;&amp;gt;Arraste ou clique&amp;lt;/div&amp;gt;
                        &amp;lt;div style=&amp;quot;color: #64748b; font-size: 12px;&amp;quot;&amp;gt;ZIP, HTML, JS, TS, TSX, JSON&amp;lt;/div&amp;gt;
                    &amp;lt;/div&amp;gt;
                    &amp;lt;input type=&amp;quot;file&amp;quot; id=&amp;quot;fileInput&amp;quot; accept=&amp;quot;.zip,.html,.js,.ts,.tsx,.jsx,.json,.txt,.md&amp;quot; onchange=&amp;quot;carregarProjeto(event)&amp;quot;&amp;gt;
                    
                    &amp;lt;div id=&amp;quot;projetoInfo&amp;quot; style=&amp;quot;display: none;&amp;quot;&amp;gt;
                        &amp;lt;div class=&amp;quot;stats&amp;quot; id=&amp;quot;stats&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
                    &amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;

                &amp;lt;!-- OPÇÕES --&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
                    &amp;lt;h2&amp;gt;⚙️ O que incluir no plano?&amp;lt;/h2&amp;gt;
                    &amp;lt;div class=&amp;quot;checkbox-group&amp;quot;&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_arvore&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_arvore&amp;quot;&amp;gt;🌳 Árvore de arquivos&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_funcoes&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_funcoes&amp;quot;&amp;gt;⚡ Funções e métodos&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_apis&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_apis&amp;quot;&amp;gt;🌐 Rotas de API&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_tipos&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_tipos&amp;quot;&amp;gt;📦 Tipos/Interfaces (TS)&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_dependencias&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_dependencias&amp;quot;&amp;gt;📚 Dependências&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_rotas&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_rotas&amp;quot;&amp;gt;🛣️ Rotas/Páginas&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_componentes&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_componentes&amp;quot;&amp;gt;🧩 Componentes React&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                        &amp;lt;div class=&amp;quot;checkbox-item&amp;quot;&amp;gt;
                            &amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;opt_hooks&amp;quot; checked&amp;gt;
                            &amp;lt;label for=&amp;quot;opt_hooks&amp;quot;&amp;gt;🪝 Hooks customizados&amp;lt;/label&amp;gt;
                        &amp;lt;/div&amp;gt;
                    &amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;

                &amp;lt;!-- IA --&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
                    &amp;lt;h2&amp;gt;🤖 Análise com IA (Opcional)&amp;lt;/h2&amp;gt;
                    &amp;lt;div class=&amp;quot;ia-panel&amp;quot;&amp;gt;
                        &amp;lt;label style=&amp;quot;font-size: 12px; color: #64748b; display: block; margin-bottom: 6px;&amp;quot;&amp;gt;Chave de API (Groq, Gemini, OpenAI...):&amp;lt;/label&amp;gt;
                        &amp;lt;input type=&amp;quot;password&amp;quot; id=&amp;quot;iaApiKey&amp;quot; placeholder=&amp;quot;gsk_... / AIza... / sk-...&amp;quot;&amp;gt;
                        &amp;lt;div id=&amp;quot;iaProviderDetectado&amp;quot; style=&amp;quot;font-size: 11px; color: #4ade80; margin-top: 6px; min-height: 16px;&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
                    &amp;lt;/div&amp;gt;
                    &amp;lt;button class=&amp;quot;btn btn-roxo&amp;quot; onclick=&amp;quot;analisarComIA()&amp;quot; id=&amp;quot;btnIA&amp;quot; disabled&amp;gt;
                        🤖 Analisar com IA
                    &amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;

                &amp;lt;!-- AÇÕES --&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
                    &amp;lt;h2&amp;gt;🚀 Ações&amp;lt;/h2&amp;gt;
                    &amp;lt;button class=&amp;quot;btn btn-verde&amp;quot; onclick=&amp;quot;gerarPlano()&amp;quot; id=&amp;quot;btnGerar&amp;quot; disabled&amp;gt;
                        📋 Gerar Plano Completo
                    &amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;btn&amp;quot; onclick=&amp;quot;copiarPlanoCompleto()&amp;quot; id=&amp;quot;btnCopiar&amp;quot; disabled&amp;gt;
                        📋 Copiar Tudo
                    &amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;btn btn-laranja&amp;quot; onclick=&amp;quot;baixarMarkdown()&amp;quot; id=&amp;quot;btnBaixar&amp;quot; disabled&amp;gt;
                        💾 Baixar Markdown
                    &amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;

                &amp;lt;!-- SEÇÕES PARA COPIAR --&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot; id=&amp;quot;cardSecoes&amp;quot; style=&amp;quot;display: none;&amp;quot;&amp;gt;
                    &amp;lt;h2&amp;gt;📑 Copiar por Seções&amp;lt;/h2&amp;gt;
                    &amp;lt;div id=&amp;quot;listaSecoes&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;

            &amp;lt;!-- COLUNA DIREITA --&amp;gt;
            &amp;lt;div&amp;gt;
                &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
                    &amp;lt;h2 id=&amp;quot;tituloPlano&amp;quot;&amp;gt;📄 Plano do Projeto&amp;lt;/h2&amp;gt;
                    &amp;lt;div class=&amp;quot;plano-container&amp;quot; id=&amp;quot;planoContainer&amp;quot;&amp;gt;
                        &amp;lt;div style=&amp;quot;text-align: center; padding: 60px 20px; color: #64748b;&amp;quot;&amp;gt;
                            &amp;lt;div style=&amp;quot;font-size: 64px; margin-bottom: 20px;&amp;quot;&amp;gt;📋&amp;lt;/div&amp;gt;
                            &amp;lt;div style=&amp;quot;font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 12px;&amp;quot;&amp;gt;
                                Gerador de Plano de Projeto
                            &amp;lt;/div&amp;gt;
                            &amp;lt;div style=&amp;quot;font-size: 14px; line-height: 1.8;&amp;quot;&amp;gt;
                                Carregue seu projeto para gerar:&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;
                                ✅ Árvore completa de arquivos&amp;lt;br&amp;gt;
                                ✅ Lista de todas as funções&amp;lt;br&amp;gt;
                                ✅ Rotas de API e endpoints&amp;lt;br&amp;gt;
                                ✅ Tipos e interfaces TypeScript&amp;lt;br&amp;gt;
                                ✅ Dependências e scripts&amp;lt;br&amp;gt;
                                ✅ Componentes React&amp;lt;br&amp;gt;
                                ✅ Documentação em Markdown&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;
                                &amp;lt;span style=&amp;quot;color: #4ade80;&amp;quot;&amp;gt;Arraste um ZIP ou arquivo individual acima!&amp;lt;/span&amp;gt;
                            &amp;lt;/div&amp;gt;
                        &amp;lt;/div&amp;gt;
                    &amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;script&amp;gt;
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projeto = null;
        let planoGerado = '';
        let secoes = {};

        // =====================
        // DRAG &amp;amp; DROP
        // =====================
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) =&amp;gt; {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () =&amp;gt; {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) =&amp;gt; {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                carregarProjeto({ target: { files: [file] } });
            }
        });

        // =====================
        // DETECTAR PROVEDOR IA
        // =====================
        const PROVEDORES = [
            { prefix: &amp;quot;gsk_&amp;quot;, nome: &amp;quot;Groq&amp;quot;, url: &amp;quot;https://api.groq.com/openai/v1&amp;quot;, model: &amp;quot;llama-3.3-70b-versatile&amp;quot; },
            { prefix: &amp;quot;AIza&amp;quot;, nome: &amp;quot;Google Gemini&amp;quot;, url: &amp;quot;https://generativelanguage.googleapis.com/v1beta/openai&amp;quot;, model: &amp;quot;gemini-2.0-flash&amp;quot; },
            { prefix: &amp;quot;sk-&amp;quot;, nome: &amp;quot;OpenAI&amp;quot;, url: &amp;quot;https://api.openai.com/v1&amp;quot;, model: &amp;quot;gpt-4o-mini&amp;quot; },
            { prefix: &amp;quot;sk-or-&amp;quot;, nome: &amp;quot;OpenRouter&amp;quot;, url: &amp;quot;https://openrouter.ai/api/v1&amp;quot;, model: &amp;quot;openai/gpt-4o-mini&amp;quot; },
        ];

        document.getElementById('iaApiKey').addEventListener('input', function() {
            const chave = this.value.trim();
            const provedor = PROVEDORES.find(p =&amp;gt; chave.startsWith(p.prefix));
            const el = document.getElementById('iaProviderDetectado');
            
            if (provedor) {
                el.textContent = `✅ Detectado: ${provedor.nome}`;
                if (projeto) document.getElementById('btnIA').disabled = false;
            } else if (chave) {
                el.textContent = '❓ Chave não reconhecida';
            } else {
                el.textContent = '';
            }
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLoading();

            const ext = file.name.split('.').pop().toLowerCase();
            projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    caminho: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            analisarProjeto();
            mostrarStats();
            document.getElementById('btnGerar').disabled = false;
            
            const chave = document.getElementById('iaApiKey').value.trim();
            if (chave &amp;amp;&amp;amp; PROVEDORES.some(p =&amp;gt; chave.startsWith(p.prefix))) {
                document.getElementById('btnIA').disabled = false;
            }
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml','yaml','yml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho.split('/').pop(),
                                caminho: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        // =====================
        // ANALISAR PROJETO
        // =====================
        function analisarProjeto() {
            const analise = {
                totalArquivos: Object.keys(projeto.arquivos).length,
                totalLinhas: 0,
                funcoes: [],
                apis: [],
                tipos: [],
                rotas: [],
                componentes: [],
                hooks: [],
                dependencias: {}
            };

            for (const [caminho, arquivo] of Object.entries(projeto.arquivos)) {
                const linhas = arquivo.conteudo.split('\n');
                analise.totalLinhas += linhas.length;

                // Funções
                const funcoes = [...arquivo.conteudo.matchAll(/(?:function|const|let|var)\s+(\w+)\s*=?\s*(?:async\s*)?\(/g)];
                funcoes.forEach(m =&amp;gt; {
                    analise.funcoes.push({
                        nome: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // APIs
                const apis = [...arquivo.conteudo.matchAll(/(?:fetch|axios\.(?:get|post|put|delete))\s*\(\s*['&amp;quot;`]([^'&amp;quot;`]+)['&amp;quot;`]/g)];
                apis.forEach(m =&amp;gt; {
                    analise.apis.push({
                        url: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // Tipos/Interfaces (TypeScript)
                if (['ts', 'tsx'].includes(arquivo.tipo)) {
                    const tipos = [...arquivo.conteudo.matchAll(/(?:interface|type)\s+(\w+)/g)];
                    tipos.forEach(m =&amp;gt; {
                        analise.tipos.push({
                            nome: m[1],
                            arquivo: caminho,
                            linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                        });
                    });
                }

                // Componentes React
                if (['jsx', 'tsx'].includes(arquivo.tipo)) {
                    const componentes = [...arquivo.conteudo.matchAll(/(?:function|const)\s+([A-Z]\w+)\s*[=:]?\s*(?:\([^)]*\))?\s*(?:=&amp;gt;)?\s*\{/g)];
                    componentes.forEach(m =&amp;gt; {
                        analise.componentes.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });

                    // Hooks customizados
                    const hooks = [...arquivo.conteudo.matchAll(/(?:function|const)\s+(use[A-Z]\w+)/g)];
                    hooks.forEach(m =&amp;gt; {
                        analise.hooks.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });
                }

                // Rotas
                const rotas = [...arquivo.conteudo.matchAll(/(?:path|route):\s*['&amp;quot;`]([^'&amp;quot;`]+)['&amp;quot;`]/gi)];
                rotas.forEach(m =&amp;gt; {
                    analise.rotas.push({
                        caminho: m[1],
                        arquivo: caminho
                    });
                });

                // package.json
                if (arquivo.nome === 'package.json') {
                    try {
                        const pkg = JSON.parse(arquivo.conteudo);
                        analise.dependencias = {
                            ...pkg.dependencies,
                            ...pkg.devDependencies
                        };
                    } catch(e) {}
                }
            }

            projeto.analise = analise;
        }

        function gerarPlano() {
            if (!projeto) return;

            mostrarLoading();

            setTimeout(() =&amp;gt; {
                const opcoes = {
                    arvore: document.getElementById('opt_arvore').checked,
                    funcoes: document.getElementById('opt_funcoes').checked,
                    apis: document.getElementById('opt_apis').checked,
                    tipos: document.getElementById('opt_tipos').checked,

                    componentes: document.getElementById('opt_componentes').checked,
                    hooks: document.getElementById('opt_hooks').checked

                planoGerado = gerarMarkdown(opcoes);
                mostrarPlano(planoGerado);
                gerarSecoes();
                
                document.getElementById('btnCopiar').disabled = false;
                document.getElementById('btnBaixar').disabled = false;
                document.getElementById('cardSecoes').style.display = 'block';
            }, 500);
        }

        function gerarMarkdown(opcoes) {

            md += `# 📋 Plano do Projeto: ${projeto.nome}\n\n`;

            if (opcoes.arvore) md += `- [🌳 Estrutura de Arquivos](#estrutura)\n`;
            if (opcoes.dependencias) md += `- [📦 Dependências](#dependencias)\n`;
            if (opcoes.funcoes) md += `- [⚡ Funções](#funcoes)\n`;
            if (opcoes.apis) md += `- [🌐 Rotas de API](#apis)\n`;
            if (opcoes.tipos) md += `- [📘 Tipos/Interfaces](#tipos)\n`;

            // ESTATÍSTICAS
            md += `## 📊 Estatísticas\n\n`;
            md += `| Métrica | Valor |\n`;
            md += `|---------|-------|\n`;
            md += `| **Arquivos** | ${a.totalArquivos} |\n`;
            md += `| **Linhas de código** | ${a.totalLinhas.toLocaleString()} |\n`;
            md += `| **Funções** | ${a.funcoes.length} |\n`;
            md += `| **Rotas de API** | ${a.apis.length} |\n`;
            md += `| **Componentes** | ${a.componentes.length} |\n`;
            md += `| **Tipos/Interfaces** | ${a.tipos.length} |\n`;
            md += `\n---\n\n`;

            // ESTRUTURA
            if (opcoes.arvore) {
                md += `## 🌳 Estrutura de Arquivos {#estrutura}\n\n`;
                md += '```\n';
                md += gerarArvore();
                md += '```\n\n';
                md += `---\n\n`;
                
                secoes['estrutura'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // DEPENDÊNCIAS
            if (opcoes.dependencias &amp;amp;&amp;amp; Object.keys(a.dependencias).length &amp;gt; 0) {

                }

                secoes['dependencias'] = md.split('---\n\n')[md.split('---\n\n').length - 2];

            // FUNÇÕES
            if (opcoes.funcoes &amp;amp;&amp;amp; a.funcoes.length &amp;gt; 0) {

                md += `Total: **${a.funcoes.length}** funções encontradas\n\n`;

                a.tipos.forEach(t =&amp;gt; {
                    if (!porArquivo[t.arquivo]) porArquivo[t.arquivo] = [];

            if (opcoes.rotas &amp;amp;&amp;amp; a.rotas.length &amp;gt; 0) {

                secoes['rotas'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // COMPONENTES
            if (opcoes.componentes &amp;amp;&amp;amp; a.componentes.length &amp;gt; 0) {
                md += `## 🧩 Componentes React {#componentes}\n\n`;
                md += `Total: **${a.componentes.length}** componentes\n\n`;
                
                const porArquivo = {};
                a.componentes.forEach(c =&amp;gt; {
                    if (!porArquivo[c.arquivo]) porArquivo[c.arquivo] = [];
                    porArquivo[c.arquivo].push(c);

                Object.entries(porArquivo).forEach(([arquivo, componentes]) =&amp;gt; {

            if (opcoes.hooks &amp;amp;&amp;amp; a.hooks.length &amp;gt; 0) {

            md += `*Plano gerado automaticamente pelo Gerador de Plano de Projeto*\n`;

            return md;
        }

        function gerarArvore() {
            const caminhos = Object.keys(projeto.arquivos).sort();
            let arvore = `${projeto.nome}/\n`;

            const estrutura = {};
            caminhos.forEach(caminho =&amp;gt; {
                const partes = caminho.split('/');
                let atual = estrutura;
                partes.forEach((parte, idx) =&amp;gt; {
                    if (!atual[parte]) {
                        atual[parte] = idx === partes.length - 1 ? null : {};
                    }
                    if (atual[parte]) atual = atual[parte];
                });
            });

            function renderizar(obj, prefixo = '') {
                let resultado = '';
                const chaves = Object.keys(obj).sort();
                chaves.forEach((chave, idx) =&amp;gt; {
                    const ultimo = idx === chaves.length - 1;
                    const simbolo = ultimo ? '└── ' : '├── ';
                    const proximoPrefixo = prefixo + (ultimo ? '    ' : '│   ');
                    
                    resultado += prefixo + simbolo + chave + '\n';
                    
                    if (obj[chave] !== null) {
                        resultado += renderizar(obj[chave], proximoPrefixo);
                    }
                });
                return resultado;
            }

            arvore += renderizar(estrutura);
            return arvore;
        }

        function gerarSecoes() {
            const lista = document.getElementById('listaSecoes');

            const secoesList = [

                { id: 'hooks', titulo: '🪝 Hooks', desc: 'Customizados' }
            ];

            secoesList.forEach(s =&amp;gt; {
                if (secoes[s.id]) {

                    div.className = 'secao';
                    div.onclick = () =&amp;gt; copiarSecao(s.id);

                    `;
                    lista.appendChild(div);
                }
            });
        }

        // =====================
        // ANALISAR COM IA
        // =====================
        async function analisarComIA() {
            const chave = document.getElementById('iaApiKey').value.trim();
            if (!chave || !projeto) return;

            const provedor = PROVEDORES.find(p =&amp;gt; chave.startsWith(p.prefix));
            if (!provedor) {
                alert('Chave de API não reconhecida!');
                return;
            }

            mostrarLoading('Analisando com IA...');

            const resumo = `
Projeto: ${projeto.nome}
Arquivos: ${projeto.analise.totalArquivos}
Linhas: ${projeto.analise.totalLinhas}
Funções: ${projeto.analise.funcoes.length}
APIs: ${projeto.analise.apis.length}

Arquivos principais:
${Object.keys(projeto.arquivos).slice(0, 10).join('\n')}

Funções principais:
${projeto.analise.funcoes.slice(0, 20).map(f =&amp;gt; f.nome).join(', ')}

APIs detectadas:
${projeto.analise.apis.slice(0, 10).map(a =&amp;gt; a.url).join('\n')}
            `.trim();

            try {
                const resp = await fetch(`${provedor.url}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${chave}`
                    },
                    body: JSON.stringify({
                        model: provedor.model,
                        messages: [
                            {
                                role: 'system',
                                content: 'Você é um especialista em análise de código. Responda em português brasileiro de forma clara e objetiva.'
                            },
                            {
                                role: 'user',
                                content: `Analise este projeto e me diga:
1. Qual é o propósito do projeto?
2. Quais são as principais funcionalidades?
3. Que tecnologias/frameworks são usados?
4. Há algum problema ou código suspeito?
5. Sugestões de melhoria

Dados do projeto:
${resumo}`
                            }
                        ],
                        max_tokens: 2000,
                        temperature: 0.3
                    })
                });

                if (!resp.ok) throw new Error('Erro na API');

                const data = await resp.json();
                const analise = data.choices[0].message.content;

                planoGerado += `\n\n---\n\n## 🤖 Análise da IA (${provedor.nome})\n\n${analise}\n`;
                mostrarPlano(planoGerado);

            } catch(e) {
                alert('Erro ao consultar IA: ' + e.message);
                mostrarPlano(planoGerado);
            }
        }

        // =====================
        // EXIBIR E COPIAR
        // =====================
        function mostrarPlano(conteudo) {
            document.getElementById('planoContainer').textContent = conteudo;
        }

        function mostrarLoading(texto = 'Gerando plano...') {
            document.getElementById('planoContainer').innerHTML = `
                &amp;lt;div class=&amp;quot;loading&amp;quot;&amp;gt;
                    &amp;lt;div class=&amp;quot;spinner&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
                    &amp;lt;div style=&amp;quot;margin-top: 16px;&amp;quot;&amp;gt;${texto}&amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;
            `;
        }

        function copiarPlanoCompleto() {
            navigator.clipboard.writeText(planoGerado).then(() =&amp;gt; {
                const btn = document.getElementById('btnCopiar');
                const original = btn.textContent;
                btn.textContent = '✅ Copiado!';
                btn.classList.add('copiado');
                setTimeout(() =&amp;gt; {
                    btn.textContent = original;
                    btn.classList.remove('copiado');
                }, 2000);
            });
        }

        function copiarSecao(id) {
            if (!secoes[id]) return;
            navigator.clipboard.writeText(secoes[id]).then(() =&amp;gt; {
                event.target.closest('.secao').style.background = '#065f46';
                setTimeout(() =&amp;gt; {
                    event.target.closest('.secao').style.background = '';
                }, 1000);
            });
        }

        function baixarMarkdown() {
            const blob = new Blob([planoGerado], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `plano-${projeto.nome.replace(/\.[^.]+$/, '')}-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

          Suporta: .md, .markdown, .mdx, .txt
        &amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;

        💡 Você também pode &amp;lt;strong&amp;gt;colar texto Markdown&amp;lt;/strong&amp;gt; direto: Ctrl+V em qualquer lugar

&amp;lt;div class=&amp;quot;toast&amp;quot; id=&amp;quot;toast&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;

&amp;lt;script&amp;gt;
'use strict';

let rawMarkdown = '';
let currentFileName = '';
let searchHits = [];
let searchIdx = 0;

/*══════════════════════════════════════════════════════════════════
  CONFIG MARKED
══════════════════════════════════════════════════════════════════*/
marked.setOptions({
  breaks: true,
  gfm: true,
  headerIds: true,
  mangle: false,
});

// Renderer customizado pra blocos de código
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const language = (lang || '').toLowerCase().trim() || 'texto';
  let highlighted = escapeHTML(code);
  try {
    if (lang &amp;amp;&amp;amp; hljs.getLanguage(lang)) {
      highlighted = hljs.highlight(code, { language: lang }).value;
    } else {
      highlighted = hljs.highlightAuto(code).value;
    }
  } catch(e) { /* fallback pra escape */ }

  const safeCode = escapeAttr(code);
  return (
    '&amp;lt;div class=&amp;quot;code-wrap&amp;quot;&amp;gt;'+
      '&amp;lt;div class=&amp;quot;code-head&amp;quot;&amp;gt;'+
        '&amp;lt;span class=&amp;quot;code-lang&amp;quot;&amp;gt;'+language+'&amp;lt;/span&amp;gt;'+
        '&amp;lt;button class=&amp;quot;code-copy&amp;quot; data-code=&amp;quot;'+safeCode+'&amp;quot;&amp;gt;📋 Copiar código&amp;lt;/button&amp;gt;'+
      '&amp;lt;/div&amp;gt;'+
      '&amp;lt;pre&amp;gt;&amp;lt;code class=&amp;quot;hljs language-'+language+'&amp;quot;&amp;gt;'+highlighted+'&amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;'+
    '&amp;lt;/div&amp;gt;'
  );
};

// Headings com botões de copiar seção
renderer.heading = function(text, level, raw) {
  const slug = slugify(raw);
  return (
    '&amp;lt;h'+level+' id=&amp;quot;'+slug+'&amp;quot; data-heading=&amp;quot;'+level+'&amp;quot; data-raw=&amp;quot;'+escapeAttr(raw)+'&amp;quot;&amp;gt;'+
      text+
      '&amp;lt;span class=&amp;quot;section-copy&amp;quot;&amp;gt;'+
        '&amp;lt;button onclick=&amp;quot;copySection(\''+slug+'\')&amp;quot; title=&amp;quot;Copiar essa seção inteira&amp;quot;&amp;gt;📋 Seção&amp;lt;/button&amp;gt;'+
        '&amp;lt;button onclick=&amp;quot;copySectionMD(\''+slug+'\')&amp;quot; title=&amp;quot;Copiar a seção em Markdown&amp;quot;&amp;gt;📝 MD&amp;lt;/button&amp;gt;'+
      '&amp;lt;/span&amp;gt;'+
    '&amp;lt;/h'+level+'&amp;gt;'
  );
};

marked.use({ renderer });

/*══════════════════════════════════════════════════════════════════
  CARREGAR ARQUIVO
══════════════════════════════════════════════════════════════════*/
function loadFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  readFile(file);
}

function readFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev =&amp;gt; {
    rawMarkdown = ev.target.result || '';
    render();
    toast('✓ '+file.name+' carregado');
  };
  reader.onerror = () =&amp;gt; toast('Erro ao ler arquivo','err');
  reader.readAsText(file, 'UTF-8');
}

/*══════════════════════════════════════════════════════════════════
  RENDERIZAR
══════════════════════════════════════════════════════════════════*/
function render() {
  if (!rawMarkdown) return;
  const html = marked.parse(rawMarkdown);
  const content = document.getElementById('content');
  content.innerHTML = '&amp;lt;div class=&amp;quot;md&amp;quot; id=&amp;quot;md&amp;quot;&amp;gt;'+html+'&amp;lt;/div&amp;gt;';
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('docTitle').textContent = currentFileName || 'Documento';
  buildTOC();
  bindCodeCopies();
}

function buildTOC() {
  const list = document.getElementById('tocList');
  const headings = document.querySelectorAll('#md h1, #md h2, #md h3, #md h4, #md h5, #md h6');
  if (!headings.length) {
    list.innerHTML = '&amp;lt;div style=&amp;quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&amp;quot;&amp;gt;Documento sem títulos&amp;lt;/div&amp;gt;';
    return;
  }
  list.innerHTML = '';
  headings.forEach(h =&amp;gt; {
    const lvl = h.tagName.toLowerCase();
    const id  = h.id;
    const txt = h.dataset.raw || h.textContent.replace(/📋.*$/,'').trim();
    const item = document.createElement('div');
    item.className = 'toc-item ' + lvl;
    item.innerHTML =
      '&amp;lt;span class=&amp;quot;toc-text&amp;quot; title=&amp;quot;'+escapeAttr(txt)+'&amp;quot;&amp;gt;'+escapeHTML(txt)+'&amp;lt;/span&amp;gt;'+
      '&amp;lt;button class=&amp;quot;toc-copy&amp;quot; title=&amp;quot;Copiar essa seção&amp;quot; onclick=&amp;quot;event.stopPropagation();copySection(\''+id+'\')&amp;quot;&amp;gt;📋&amp;lt;/button&amp;gt;';
    item.onclick = () =&amp;gt; {
      document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
      if (window.innerWidth &amp;lt;= 768) toggleTOC();
      document.querySelectorAll('.toc-item').forEach(i =&amp;gt; i.classList.remove('active'));
      item.classList.add('active');
    };
    list.appendChild(item);
  });
}

function bindCodeCopies() {
  document.querySelectorAll('.code-copy').forEach(btn =&amp;gt; {
    btn.onclick = () =&amp;gt; {
      const code = btn.dataset.code || '';
      navigator.clipboard.writeText(decodeAttr(code)).then(() =&amp;gt; {
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ Copiado!';
        setTimeout(() =&amp;gt; btn.innerHTML = orig, 1500);
      });
    };
  });
}

/*══════════════════════════════════════════════════════════════════
  COPIAR SEÇÃO
══════════════════════════════════════════════════════════════════*/
function copySection(headingId, asMarkdown) {
  const h = document.getElementById(headingId);
  if (!h) return;
  const level = parseInt(h.dataset.heading || '1');

  // Coleta todos os elementos da seção (até o próximo heading de nível &amp;lt;= )
  const elements = [h];
  let el = h.nextElementSibling;
  while (el) {
    if (/^H[1-6]$/.test(el.tagName)) {
      const lvl = parseInt(el.dataset.heading || el.tagName[1]);
      if (lvl &amp;lt;= level) break;
    }
    elements.push(el);
    el = el.nextElementSibling;
  }

  let text;
  if (asMarkdown) {
    text = extractMarkdownSection(headingId);
  } else {
    text = elements.map(e =&amp;gt; extractText(e)).join('\n\n').trim();
  }

  navigator.clipboard.writeText(text).then(() =&amp;gt; {
    toast('✓ Seção copiada ('+text.length+' caracteres)');
  }).catch(() =&amp;gt; toast('Erro ao copiar','err'));
}

function copySectionMD(headingId) {
  copySection(headingId, true);
}

function extractText(el) {
  // Mantém quebras de bloco de código
  if (el.classList?.contains('code-wrap')) {
    const lang = el.querySelector('.code-lang')?.textContent || '';
    const code = decodeAttr(el.querySelector('.code-copy')?.dataset.code || '');
    return '```'+lang+'\n'+code+'\n```';
  }
  // Heading
  if (/^H[1-6]$/.test(el.tagName)) {
    const lvl = parseInt(el.tagName[1]);
    const raw = el.dataset.raw || el.textContent.replace(/📋.*$/,'').trim();
    return '#'.repeat(lvl)+' '+raw;
  }
  return el.innerText || el.textContent || '';
}

/* Extrai a seção do MD bruto (mais fiel) */
function extractMarkdownSection(headingId) {
  const lines = rawMarkdown.split('\n');
  const headings = [];
  lines.forEach((line, i) =&amp;gt; {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (m) headings.push({ idx:i, level:m[1].length, text:m[2], slug:slugify(m[2]) });
  });
  const start = headings.find(h =&amp;gt; h.slug === headingId);
  if (!start) return '';
  const next = headings.find(h =&amp;gt; h.idx &amp;gt; start.idx &amp;amp;&amp;amp; h.level &amp;lt;= start.level);
  const endIdx = next ? next.idx : lines.length;
  return lines.slice(start.idx, endIdx).join('\n').trim();
}

  // Clona conteúdo e adiciona botões de copiar funcionais (com JS embutido)
  const clone = md.cloneNode(true);

  clone.querySelectorAll('.section-copy').forEach(s =&amp;gt; s.remove());
  // Substitui code-wrap pra simplificar
  clone.querySelectorAll('.code-wrap').forEach(w =&amp;gt; {
    const code = decodeAttr(w.querySelector('.code-copy')?.dataset.code || '');
    const lang = w.querySelector('.code-lang')?.textContent || '';
    const newWrap = document.createElement('div');
    newWrap.className = 'code-wrap';
    newWrap.innerHTML =
      '&amp;lt;button class=&amp;quot;copy-btn&amp;quot; data-code=&amp;quot;'+escapeAttr(code)+'&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;'+
      '&amp;lt;pre&amp;gt;&amp;lt;code class=&amp;quot;language-'+lang+'&amp;quot;&amp;gt;'+escapeHTML(code)+'&amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;';
    w.replaceWith(newWrap);
  });
  // Adiciona botão em cada heading
  clone.querySelectorAll('h1,h2,h3,h4').forEach(h =&amp;gt; {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Seção';
    btn.dataset.section = h.id;
    h.appendChild(btn);
  });

  const script = `
    &amp;lt;script&amp;gt;
    document.querySelectorAll('.copy-btn[data-code]').forEach(b=&amp;gt;{
      b.onclick=()=&amp;gt;{navigator.clipboard.writeText(b.dataset.code);b.textContent='✓ Copiado!';setTimeout(()=&amp;gt;b.textContent='📋 Copiar',1500)};
    });
    document.querySelectorAll('.copy-btn[data-section]').forEach(b=&amp;gt;{
      b.onclick=()=&amp;gt;{
        const h=document.getElementById(b.dataset.section);
        const lvl=parseInt(h.tagName[1]);
        let txt=h.innerText.replace('📋 Seção','').trim()+'\\n\\n';
        let el=h.nextElementSibling;
        while(el){
          if(/^H[1-6]$/.test(el.tagName)&amp;amp;&amp;amp;parseInt(el.tagName[1])&amp;lt;=lvl)break;
          txt+=el.innerText+'\\n\\n';
          el=el.nextElementSibling;
        }
        navigator.clipboard.writeText(txt.trim());
        b.textContent='✓ Copiado!';setTimeout(()=&amp;gt;b.textContent='📋 Seção',1500);
      };
    });
    &amp;lt;\/script&amp;gt;
  `;

  const fullHTML =
    '&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html lang=&amp;quot;pt-BR&amp;quot;&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;'+
    '&amp;lt;meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width,initial-scale=1.0&amp;quot;&amp;gt;'+
    '&amp;lt;title&amp;gt;'+escapeHTML(currentFileName||'Documento')+'&amp;lt;/title&amp;gt;'+
    '&amp;lt;style&amp;gt;'+css+'&amp;lt;/style&amp;gt;&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;'+
    '&amp;lt;h1 style=&amp;quot;border:none&amp;quot;&amp;gt;'+escapeHTML(currentFileName||'Documento')+'&amp;lt;/h1&amp;gt;'+
    clone.outerHTML+
    script+
    '&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;';

  const blob = new Blob([fullHTML], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentFileName.replace(/\.(md|markdown|mdx|txt)$/i,'') || 'documento') + '.html';
  a.click();
  toast('💾 HTML exportado!');
}

/*══════════════════════════════════════════════════════════════════
  BUSCA
══════════════════════════════════════════════════════════════════*/
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const show = !bar.classList.contains('show');
  bar.classList.toggle('show', show);
  if (show) {
    document.getElementById('searchInput').focus();
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.querySelectorAll('mark.search-hit').forEach(m =&amp;gt; {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  searchHits = [];
  searchIdx = 0;
  document.getElementById('searchCount').textContent = '0/0';
}

function doSearch() {
  clearSearch();
  const q = document.getElementById('searchInput').value.trim();
  if (!q || q.length &amp;lt; 2) { document.getElementById('searchCount').textContent='0/0'; return; }

  const md = document.getElementById('md');
  if (!md) return;

  const re = new RegExp(escapeRegex(q), 'gi');
  walkAndHighlight(md, re);
  searchHits = [...document.querySelectorAll('mark.search-hit')];
  searchIdx = 0;
  if (searchHits.length) {
    searchHits[0].classList.add('current');
    searchHits[0].scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('searchCount').textContent = (searchHits.length ? 1 : 0) + '/' + searchHits.length;
}

function walkAndHighlight(node, re) {
  if (node.nodeType === 3) { // text
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index &amp;gt; last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (last &amp;lt; text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  } else if (node.nodeType === 1 &amp;amp;&amp;amp; !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
    [...node.childNodes].forEach(c =&amp;gt; walkAndHighlight(c, re));
  }
}

function searchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!searchHits.length) return;
    searchHits[searchIdx].classList.remove('current');
    searchIdx = e.shiftKey
      ? (searchIdx - 1 + searchHits.length) % searchHits.length
      : (searchIdx + 1) % searchHits.length;
    searchHits[searchIdx].classList.add('current');
    searchHits[searchIdx].scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('searchCount').textContent = (searchIdx+1)+'/'+searchHits.length;
  } else if (e.key === 'Escape') {
    toggleSearch();
  }
}

function toggleTOC() {
  const toc = document.getElementById('toc');

  if (window.innerWidth &amp;lt;= 768) {
    const show = !toc.classList.contains('show-mobile');
    toc.classList.toggle('show-mobile', show);
    bd.classList.toggle('show', show);
  } else {

  }

}

const dz = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev =&amp;gt; {
  document.addEventListener(ev, e =&amp;gt; {
    e.preventDefault();
    dz?.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(ev =&amp;gt; {

});
document.addEventListener('drop', e =&amp;gt; {
  e.preventDefault();

});

document.addEventListener('paste', e =&amp;gt; {
  if (document.activeElement?.tagName === 'INPUT') return;
  const txt = e.clipboardData?.getData('text');
  if (txt &amp;amp;&amp;amp; txt.length &amp;gt; 50) {
    rawMarkdown = txt;
    currentFileName = 'colado.md';
    render();
    toast('✓ Texto colado renderizado');

});

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function escapeHTML(s) {
  return String(s)
    .replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;')
    .replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;').replace(/'/g,'&amp;amp;#39;');
}
function escapeAttr(s) { return escapeHTML(s); }
function decodeAttr(s) {
  return String(s)
    .replace(/&amp;amp;#39;/g,&amp;quot;'&amp;quot;).replace(/&amp;amp;quot;/g,'&amp;quot;')
    .replace(/&amp;amp;gt;/g,'&amp;gt;').replace(/&amp;amp;lt;/g,'&amp;lt;').replace(/&amp;amp;amp;/g,'&amp;amp;');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;amp;'); }
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() =&amp;gt; t.classList.remove('show'), 2200);
}

'use strict';

// ═══════════════════════════════════════
// AUTO-DETECÇÃO DE PROVEDORES
// ═══════════════════════════════════════
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile',  name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',       name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest',  name:'Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',                name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',         name:'Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',            name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',            name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',              name:'OpenAI' },
];
const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];
function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

// ═══════════════════════════════════════
// SYSTEM PROMPT PRESETS
// ═══════════════════════════════════════
const PRESETS = {
  livre: '',
  juridico: `Você é um assistente jurídico especializado no direito brasileiro.
Responda de forma técnica, cite legislação e jurisprudência quando relevante.
Seja objetivo e preciso. Não use linguagem informal.`,
  codigo: `Você é um assistente de programação.
Ao responder: entregue o código completo e funcional.
Explique brevemente o que mudou. Seja direto.`,
  direto: `Responda sempre de forma direta e objetiva.
Sem introduções longas. Sem frases de empatia.
Vá direto ao ponto. Entregue a resposta e pronto.`,
  custom: null,
};

let currentPreset = localStorage.getItem('cia_preset') || 'livre';
let customSysPrompt = localStorage.getItem('cia_sysprompt') || '';
let feedbackOn = localStorage.getItem('cia_feedback') !== 'off';

function getSysPrompt() {
  if (currentPreset === 'custom') return customSysPrompt;
  return PRESETS[currentPreset] || '';
}

function applyPreset(name) {
  currentPreset = name;
  localStorage.setItem('cia_preset', name);
  document.querySelectorAll('.sys-preset').forEach(b =&amp;gt; b.classList.remove('active'));
  document.getElementById('preset-'+name)?.classList.add('active');
  if (name !== 'custom') {
    document.getElementById('sysPromptInput').value = PRESETS[name] || '';
    toast('Preset &amp;quot;'+name+'&amp;quot; aplicado');
  } else {
    document.getElementById('sysPromptInput').value = customSysPrompt;
  }
}

function saveSystemPrompt() {
  const val = document.getElementById('sysPromptInput').value.trim();
  customSysPrompt = val;
  currentPreset = 'custom';
  localStorage.setItem('cia_sysprompt', val);
  localStorage.setItem('cia_preset', 'custom');
  document.querySelectorAll('.sys-preset').forEach(b =&amp;gt; b.classList.remove('active'));
  document.getElementById('preset-custom')?.classList.add('active');
  toast('System Prompt salvo ✓');
}

function initSysPanel() {
  document.getElementById('sysPromptInput').value = getSysPrompt();
  document.querySelectorAll('.sys-preset').forEach(b =&amp;gt; b.classList.remove('active'));
  document.getElementById('preset-'+currentPreset)?.classList.add('active');
}

// ═══════════════════════════════════════
// FEEDBACK
// ═══════════════════════════════════════
function toggleFeedback() {
  feedbackOn = !feedbackOn;
  localStorage.setItem('cia_feedback', feedbackOn ? 'on' : 'off');
  document.getElementById('fbToggleBtn').style.opacity = feedbackOn ? '1' : '0.4';
  toast(feedbackOn ? '⭐ Feedback ATIVADO' : 'Feedback desativado');
}

function addFeedbackBar(msgEl, responseText) {
  if (!feedbackOn) return;
  const bar = document.createElement('div');
  bar.className = 'feedback-bar';

  const label = document.createElement('span');

// ═══════════════════════════════════════
// INDEXEDDB
// ═══════════════════════════════════════
const DB_NAME = 'ChatIAProDB_v2';
let db = null;

function openDB() {
  return new Promise((resolve, reject) =&amp;gt; {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ev =&amp;gt; {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) d.createObjectStore('conversations', { keyPath:'id' });
    };
    req.onsuccess = () =&amp;gt; { db = req.result; resolve(db); };
    req.onerror   = () =&amp;gt; reject(req.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res,rej) =&amp;gt; { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete=res; tx.onerror=()=&amp;gt;rej(tx.error); });
}
function dbGetAll(store) {
  return new Promise((res,rej) =&amp;gt; { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).getAll(); r.onsuccess=()=&amp;gt;res(r.result); r.onerror=()=&amp;gt;rej(r.error); });
}
function dbGet(store, key) {
  return new Promise((res,rej) =&amp;gt; { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).get(key); r.onsuccess=()=&amp;gt;res(r.result); r.onerror=()=&amp;gt;rej(r.error); });
}
function dbDelete(store, key) {
  return new Promise((res,rej) =&amp;gt; { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=res; tx.onerror=()=&amp;gt;rej(tx.error); });
}

async function webSearch(query) {
  try {
    const url='https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1';
    const r=await fetch(url); const j=await r.json();
    const parts=[];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText);
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.RelatedTopics?.length) {
      const t=j.RelatedTopics.slice(0,5).filter(t=&amp;gt;t.Text).map((t,i)=&amp;gt;(i+1)+'. '+t.Text);
      if (t.length) parts.push('TÓPICOS:\n'+t.join('\n'));
    }
    return parts.length?parts.join('\n\n'):null;
  } catch { return null; }
}

// ═══════════════════════════════════════
// ENVIAR
// ═══════════════════════════════════════
function handleKey(e) { if (e.key==='Enter'&amp;amp;&amp;amp;!e.shiftKey){e.preventDefault();send();} }
function adjustHeight(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,130)+'px'; }
function setPrompt(txt) { const el=document.getElementById('msgInput'); el.value=txt; adjustHeight(el); el.focus(); }

async function send(textOverride) {
  const el=document.getElementById('msgInput');
  const text=(textOverride||el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) { const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }

  document.getElementById('emptyState')?.remove();
  el.value=''; el.style.height='44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller=new AbortController();
  document.getElementById('sendBtn').style.display='none';
  document.getElementById('stopBtn').style.display='flex';

  const { content:contentEl, wrap:wrapEl } = appendMsg('bot','',true);

  // Web search
  let webContext='';
  if (webOn) {
    const note=document.createElement('div'); note.className='progress'; note.textContent='🌐 Buscando...';
    contentEl.appendChild(note);
    const result=await webSearch(text); note.remove();
    if (result) { webContext='\n\n[CONTEXTO WEB]:\n'+result+'\n[FIM]'; }
  }

  try {
    const key=apiKey.trim();
    const url=(document.getElementById('urlInput').value||apiUrl||'https://api.groq.com/openai/v1').trim().replace(/\/$/,'');
    const model=document.getElementById('modelInput').value||apiModel||'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML='&amp;lt;span style=&amp;quot;color:#60a5fa&amp;quot;&amp;gt;⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: &amp;lt;a href=&amp;quot;https://console.groq.com&amp;quot; target=&amp;quot;_blank&amp;quot; style=&amp;quot;color:#7ec87a&amp;quot;&amp;gt;console.groq.com&amp;lt;/a&amp;gt;&amp;lt;/span&amp;gt;';
      history.pop(); scheduleSave(); return;
    }

    // Monta mensagens com system prompt
    const sys = getSysPrompt();
    let msgs = sys ? [{ role:'system', content:sys }, ...history] : [...history];
    if (webContext) {
      const last=msgs[msgs.length-1];
      msgs[msgs.length-1]={ role:'user', content:last.content+webContext };
    }

    const resp=await fetch(url+'/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key, 'HTTP-Referer':location.origin, 'X-Title':'Chat IA Pro' },
      body:JSON.stringify({ model, messages:msgs, stream:true, max_tokens:16384 }),
      signal:controller.signal
    });

    if (!resp.ok) {
      const errText=await resp.text();
      let msg='Erro '+resp.status;
      try { msg=JSON.parse(errText)?.error?.message||msg; } catch {}
      contentEl.innerHTML='&amp;lt;span style=&amp;quot;color:var(--err)&amp;quot;&amp;gt;❌ '+esc(msg)+'&amp;lt;/span&amp;gt;';
      history.pop(); scheduleSave(); return;
    }

    const reader=resp.body.getReader(); const decoder=new TextDecoder();
    let full='', buf='';
    const cursor=document.createElement('span'); cursor.className='cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value }=await reader.read(); if (done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j=line.slice(6).trim(); if (j==='[DONE]') continue;
        try {
          const p=JSON.parse(j);
          if (p.error) throw new Error(typeof p.error==='string'?p.error:p.error.message||'Erro');
          const delta=p.choices?.[0]?.delta?.content||p.text||p.content||'';
          if (delta) { full+=delta; cursor.remove(); contentEl.innerHTML=renderMarkdown(full); contentEl.appendChild(cursor); scrollBottom(); }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML=renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
      // FEEDBACK AUTOMÁTICO
      addFeedbackBar(wrapEl, full);
    }

  } catch(err) {
    if (err.name==='AbortError') {
      contentEl.innerHTML+='&amp;lt;em style=&amp;quot;color:var(--muted);font-size:11px&amp;quot;&amp;gt; [parado]&amp;lt;/em&amp;gt;';
    } else {
      contentEl.innerHTML='&amp;lt;span style=&amp;quot;color:var(--err)&amp;quot;&amp;gt;❌ '+esc(err.message)+'&amp;lt;/span&amp;gt;';
      history.pop(); scheduleSave();
    }
  } finally {
    controller=null;
    document.getElementById('sendBtn').style.display='flex';
    document.getElementById('stopBtn').style.display='none';
    scrollBottom(); addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

// ═══════════════════════════════════════
// RENDERIZAÇÃO
// ═══════════════════════════════════════
function appendMsg(role, text, streaming, isRestore) {
  const wrap=document.createElement('div'); wrap.className='msg '+role;
  const bubble=document.createElement('div'); bubble.className='msg-bubble';
  const content=document.createElement('div'); content.className='msg-content';
  if (role==='user') content.textContent=text;
  else if (streaming) content.innerHTML='';
  else content.innerHTML=renderMarkdown(text);
  bubble.appendChild(content); wrap.appendChild(bubble);
  const meta=document.createElement('div'); meta.className='msg-meta';
  if (role==='bot') {
    const prov=apiKey?(detectProvider(apiKey)?.name||'IA'):'IA';
    const lbl=document.createElement('span'); lbl.className='prov-label'; lbl.textContent=prov;
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,content.textContent);};
    meta.appendChild(lbl); meta.appendChild(btn);
  } else {
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,text);};
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);
  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el:wrap, content, wrap };
}

let copyBlockId=0;
function renderMarkdown(text) {
  let html=esc(text);
  html=html.replace(/```(\w*?)\n([\s\S]*?)```/g,(_,lang,code)=&amp;gt;{
    const id='cb'+(++copyBlockId);

function exportConv(format) {
  

  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date=new Date().toLocaleString('pt-BR');
  let content='', mime='text/plain', ext=format;

  if (format==='txt') {
    const lines=['=== CONVERSA — Chat IA Pro ===','Data: '+date,''];
    history.forEach(m=&amp;gt;{ lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']'); lines.push(m.content); lines.push(''); });
    content=lines.join('\n');
  }
  else if (format==='md') {
    const lines=['# Conversa Chat IA Pro','&amp;gt; '+date,''];
    history.forEach(m=&amp;gt;{ lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA')); lines.push(''); lines.push(m.content); lines.push(''); });
    content=lines.join('\n'); mime='text/markdown';
  }
  else if (format==='json') {
    const sys=getSysPrompt();
    content=JSON.stringify({
      title: (history.find(m=&amp;gt;m.role==='user')?.content||'Conversa').slice(0,60),
      exportedAt: date,
