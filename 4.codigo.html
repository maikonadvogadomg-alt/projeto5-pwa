  &lt;div class=&quot;mbox&quot;&gt;
    &lt;div class=&quot;mtitle&quot;&gt;📁 Nova Pasta&lt;/div&gt;
    &lt;input id=&quot;inp-md&quot; class=&quot;minput&quot; type=&quot;text&quot; placeholder=&quot;minha-pasta&quot; onkeydown=&quot;if(event.key==='Enter')doCreate('d')&quot;&gt;
    &lt;div class=&quot;mbtns&quot;&gt;
      &lt;button class=&quot;btn btn-cancel&quot; onclick=&quot;closeModal('md')&quot;&gt;Cancelar&lt;/button&gt;
      &lt;button class=&quot;btn btn-ok&quot; onclick=&quot;doCreate('d')&quot;&gt;Criar&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- MODAL RENOMEAR --&gt;
&lt;div id=&quot;modal-rn&quot; class=&quot;modal&quot;&gt;
  &lt;div class=&quot;mbox&quot;&gt;
    &lt;div class=&quot;mtitle&quot;&gt;✏️ Renomear&lt;/div&gt;
    &lt;input id=&quot;inp-rn&quot; class=&quot;minput&quot; type=&quot;text&quot; onkeydown=&quot;if(event.key==='Enter')doRename()&quot;&gt;
    &lt;div class=&quot;mbtns&quot;&gt;
      &lt;button class=&quot;btn btn-cancel&quot; onclick=&quot;closeModal('rn')&quot;&gt;Cancelar&lt;/button&gt;
      &lt;button class=&quot;btn btn-ok&quot; onclick=&quot;doRename()&quot;&gt;Renomear&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- CONTEXT MENU --&gt;
&lt;div id=&quot;ctx&quot;&gt;
  &lt;button class=&quot;citem&quot; onclick=&quot;ctxAct('rename')&quot;&gt;✏️ Renomear&lt;/button&gt;
  &lt;button class=&quot;citem&quot; id=&quot;ctx-dup&quot; onclick=&quot;ctxAct('dup')&quot;&gt;⧉ Duplicar&lt;/button&gt;
  &lt;button class=&quot;citem&quot; id=&quot;ctx-dl&quot; onclick=&quot;ctxAct('dl')&quot;&gt;⬇ Baixar&lt;/button&gt;
  &lt;div class=&quot;csep&quot;&gt;&lt;/div&gt;
  &lt;button class=&quot;citem danger&quot; onclick=&quot;ctxAct('del')&quot;&gt;🗑️ Excluir&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
// =====================
// UTILITÁRIOS
// =====================
const id  = s =&gt; document.getElementById(s);
const qs  = s =&gt; document.querySelector(s);
const qsa = s =&gt; [...document.querySelectorAll(s)];
const ext = p =&gt; (p.split('.').pop()||'').toLowerCase();
const lsGet = k =&gt; { try{return localStorage.getItem(k)}catch{return null} };
const lsSet = (k,v) =&gt; { try{localStorage.setItem(k,v)}catch{} };
const esc = s =&gt; String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');

let _toastT;
function toast(msg, type='ok'){
  const el=document.createElement('div');
  el.className='toast t'+type;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=&gt;el.remove(),2800);
}

function dlBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=&gt;URL.revokeObjectURL(a.href),6000);
}

const ICON = n=&gt;({
  html:'🌐',htm:'🌐',css:'🎨',scss:'🎨',sass:'🎨',less:'🎨',
  js:'📜',mjs:'📜',cjs:'📜',jsx:'⚛',ts:'📘',tsx:'⚛',
  json:'📋',yaml:'📋',yml:'📋',toml:'📋',
  md:'📝',txt:'📄',sh:'⚙',bat:'⚙',
  py:'🐍',java:'☕',kt:'🟠',php:'🐘',rb:'💎',go:'🐹',rs:'🦀',
  sql:'🗄',prisma:'🗄',graphql:'🔷',
  png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',svg:'🖼',webp:'🖼',ico:'🖼',
  pdf:'📕',zip:'📦',tar:'📦',gz:'📦',env:'🔒'
})[ext(n)]||'📄';

// =====================
// ESTADO
// =====================
let files      = {};
let curFile    = null;
let folderOpen = {};
let pmMode     = 1;
let prevTimer  = null;
let vDrag      = false, vDragY=0, vDragH=0;
let ctxPath    = null, ctxType=null;
let modalCtx   = '';

// =====================
// INIT
// =====================
function init(){
  const saved=lsGet('ej-files');
  if(saved) try{files=JSON.parse(saved)}catch{}
  if(!Object.keys(files).length){
    files['index.html']='&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;UTF-8&quot;&gt;\n  &lt;title&gt;Meu Projeto&lt;/title&gt;\n  &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Olá!&lt;/h1&gt;\n  &lt;script src=&quot;app.js&quot;&gt;&lt;\/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;';
    files['style.css']='body {\n  font-family: sans-serif;\n  background: #f0f0f0;\n  padding: 20px;\n}\n\nh1 {\n  color: #333;\n}';
    files['app.js']='console.log(&quot;Projeto iniciado!&quot;);';
  }
  renderTree();
  const first=Object.keys(files).find(f=&gt;ext(f)==='html')||Object.keys(files)[0];
  if(first) openFile(first);
  setPM(1);
}

// =====================
// ÁRVORE DE ARQUIVOS
// =====================
function buildTree(fm){
  const root={t:'dir',name:'',kids:{}};
  for(const path of Object.keys(fm)){
    const parts=path.replace(/^\//,'').split('/');
    let node=root;
    for(let i=0;i&lt;parts.length;i++){
      const p=parts[i];
      if(i===parts.length-1){
        node.kids[p]={t:'file',name:p,path};
      } else {
        if(!node.kids[p]) node.kids[p]={t:'dir',name:p,kids:{}};
        node=node.kids[p];
      }
    }
  }
  return root;
}

function renderTree(){
  const root=buildTree(files);
  id('tree').innerHTML=renderKids(root.kids,'');
}

function renderKids(kids,parent){
  const entries=Object.entries(kids).sort(([an,av],[bn,bv])=&gt;{
    if(av.t==='dir'&amp;&amp;bv.t==='file') return -1;
    if(av.t==='file'&amp;&amp;bv.t==='dir') return 1;
    return an.localeCompare(bn);
  });
  return entries.map(([name,node])=&gt;{
    const full=parent?parent+'/'+name:name;
    if(node.t==='dir'){
      const open=folderOpen[full]!==false;
      const safeId='fc_'+full.replace(/[^a-zA-Z0-9]/g,'_');
      return `&lt;div&gt;
        &lt;div class=&quot;trow&quot; onclick=&quot;toggleDir('${full}',event)&quot; oncontextmenu=&quot;openCtx(event,'dir','${full}')&quot;&gt;
          &lt;span class=&quot;tarr ${open?'op':''}&quot;&gt;▶&lt;/span&gt;
          &lt;span class=&quot;tico&quot;&gt;📁&lt;/span&gt;
          &lt;span class=&quot;tname&quot;&gt;${esc(name)}&lt;/span&gt;
          &lt;div class=&quot;tacts&quot;&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openModal('mf','${full}')&quot; title=&quot;Novo arquivo&quot;&gt;📄&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openModal('md','${full}')&quot; title=&quot;Nova pasta&quot;&gt;📁&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openRename('dir','${full}')&quot;&gt;✏️&lt;/button&gt;
            &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();delItem('${full}','dir')&quot;&gt;🗑️&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;kids ${open?'':'hide'}&quot; id=&quot;${safeId}&quot;&gt;
          ${renderKids(node.kids,full)}
        &lt;/div&gt;
      &lt;/div&gt;`;
    } else {
      const sel=node.path===curFile?'sel':'';
      return `&lt;div class=&quot;trow ${sel}&quot; onclick=&quot;openFile('${node.path}')&quot; oncontextmenu=&quot;openCtx(event,'file','${node.path}')&quot;&gt;
        &lt;span class=&quot;tico&quot;&gt;${ICON(name)}&lt;/span&gt;
        &lt;span class=&quot;tname&quot;&gt;${esc(name)}&lt;/span&gt;
        &lt;div class=&quot;tacts&quot;&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();openRename('file','${node.path}')&quot;&gt;✏️&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();dupFile('${node.path}')&quot;&gt;⧉&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();dlFile('${node.path}')&quot;&gt;⬇&lt;/button&gt;
          &lt;button class=&quot;tabtn&quot; onclick=&quot;event.stopPropagation();delItem('${node.path}','file')&quot;&gt;🗑️&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    }
  }).join('');
}

function toggleDir(path,e){
  if(e) e.stopPropagation();
  folderOpen[path]=folderOpen[path]===false?true:false;
  renderTree();
}

// =====================
// ABRIR / SALVAR
// =====================
function openFile(path){
  if(curFile&amp;&amp;files[curFile]!==undefined){
    files[curFile]=id('cta').value;
    saveAll();
  }
  curFile=path;
  id('cta').value=files[path]||'';
  id('fname').value=path.split('/').pop();
  id('lbadge').textContent=ext(path)||'txt';
  renderTree();
  updateLN();
  refreshPreview();
}

function saveFile(){
  if(!curFile) return;
  files[curFile]=id('cta').value;
  saveAll();
  toast('💾 Salvo!');
}

function saveAll(){
  lsSet('ej-files',JSON.stringify(files));
}

// =====================
// CRIAR ARQUIVO / PASTA
// =====================
function openModal(type, folder){
  modalCtx=folder||'';
  id('inp-'+type).value='';
  id('modal-'+type).classList.add('open');
  setTimeout(()=&gt;id('inp-'+type).focus(),80);
}

function closeModal(type){
  id('modal-'+type).classList.remove('open');
}

function doCreate(type){
  const isDir=(type==='d');
  const name=(id('inp-m'+type).value||'').trim();
  if(!name){ toast('Nome inválido','err'); return; }
  const base=modalCtx?modalCtx+'/'+name:name;
  if(isDir){
    const keeper=base+'/.gitkeep';
    if(!files[keeper]) files[keeper]='';
    folderOpen[base]=true;
    saveAll();
    renderTree();
    closeModal('md');
    toast('📁 Pasta criada!');
  } else {
    if(files[base]!==undefined){ toast('Arquivo já existe','err'); return; }
    files[base]='';
    saveAll();
    renderTree();
    openFile(base);
    closeModal('mf');
    toast('📄 Arquivo criado!');
  }
}

// =====================
// RENOMEAR
// =====================
function openRename(type,path){
  ctxType=type; ctxPath=path;
  id('inp-rn').value=path.split('/').pop();
  id('modal-rn').classList.add('open');
  setTimeout(()=&gt;{ id('inp-rn').focus(); id('inp-rn').select(); },80);
}

function doRename(){
  const newName=(id('inp-rn').value||'').trim();
  if(!newName){ toast('Nome inválido','err'); return; }
  const dir=ctxPath.includes('/')?ctxPath.slice(0,ctxPath.lastIndexOf('/')+1):'';
  const newPath=dir+newName;
  if(ctxType==='file'){
    if(files[newPath]!==undefined&amp;&amp;newPath!==ctxPath){ toast('Nome já existe','err'); return; }
    files[newPath]=files[ctxPath];
    delete files[ctxPath];
    if(curFile===ctxPath) curFile=newPath;
  } else {
    const pre=ctxPath+'/', nPre=newPath+'/';
    for(const k of Object.keys(files)){
      if(k.startsWith(pre)){
        files[nPre+k.slice(pre.length)]=files[k];
        delete files[k];
        if(curFile===k) curFile=nPre+k.slice(pre.length);
      }
    }
    const nFO={};
    for(const[k,v] of Object.entries(folderOpen)){
      if(k===ctxPath) nFO[newPath]=v;
      else if(k.startsWith(ctxPath+'/')) nFO[newPath+k.slice(ctxPath.length)]=v;
      else nFO[k]=v;
    }
    folderOpen=nFO;
  }
  saveAll(); renderTree();
  if(curFile){
    id('fname').value=curFile.split('/').pop();
    id('lbadge').textContent=ext(curFile)||'txt';
  }
  closeModal('rn');
  toast('✅ Renomeado!');
}

function renameBar(){
  if(!curFile) return;
  const newName=(id('fname').value||'').trim();
  if(!newName){ id('fname').value=curFile.split('/').pop(); return; }
  const dir=curFile.includes('/')?curFile.slice(0,curFile.lastIndexOf('/')+1):'';
  const newPath=dir+newName;
  if(newPath===curFile) return;
  if(files[newPath]!==undefined){ toast('Nome já existe','err'); id('fname').value=curFile.split('/').pop(); return; }
  files[newPath]=files[curFile];
  delete files[curFile];
  curFile=newPath;
  id('lbadge').textContent=ext(newPath)||'txt';
  saveAll(); renderTree();
  toast('✅ Renomeado!');
}

// =====================
// DUPLICAR / BAIXAR / EXCLUIR
// =====================
function dupFile(path){
  const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';
  const base=path.split('/').pop().replace(/(\.[^.]+)$/,'');
  const e2=path.includes('.')?'.'+ext(path):'';
  let np=dir+base+'_copia'+e2; let i=2;
  while(files[np]!==undefined) np=dir+base+'_copia'+(i++)+e2;
  files[np]=files[path];
  saveAll(); renderTree(); openFile(np);
  toast('⧉ Duplicado!');
}

function dlFile(path){
  const p=path||curFile;
  if(!p){ toast('Nenhum arquivo selecionado','err'); return; }
  dlBlob(new Blob([files[p]||''],{type:'text/plain'}),p.split('/').pop());
}

function delItem(path,type){
  if(!confirm('Excluir &quot;'+path+'&quot;?')) return;
  if(type==='file'){
    delete files[path];
    if(curFile===path){
      curFile=null;
      id('cta').value='';
      id('fname').value='sem arquivo';
      id('lbadge').textContent='';
    }
  } else {
    for(const k of Object.keys(files))
      if(k.startsWith(path+'/')) delete files[k];
    if(curFile&amp;&amp;curFile.startsWith(path+'/')){
      curFile=null;
      id('cta').value='';
      id('fname').value='sem arquivo';
      id('lbadge').textContent='';
    }
  }
  saveAll(); renderTree();
  toast('🗑️ Excluído!');
}

// =====================
// CONTEXT MENU
// =====================
function openCtx(e,type,path){
  e.preventDefault(); e.stopPropagation();
  ctxPath=path; ctxType=type;
  id('ctx-dup').style.display=type==='file'?'block':'none';
  id('ctx-dl').style.display=type==='file'?'block':'none';
  const m=id('ctx');
  m.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-160)+'px';
  m.style.display='block';
}

function ctxAct(act){
  id('ctx').style.display='none';
  if(act==='rename') openRename(ctxType,ctxPath);
  else if(act==='dup') dupFile(ctxPath);
  else if(act==='dl') dlFile(ctxPath);
  else if(act==='del') delItem(ctxPath,ctxType);
}

document.addEventListener('click',()=&gt;id('ctx').style.display='none');

// =====================
// EDITOR
// =====================
function onInput(){
  if(curFile) files[curFile]=id('cta').value;
  updateLN();
  clearTimeout(prevTimer);
  if(pmMode&gt;0) prevTimer=setTimeout(refreshPreview,600);
}

function updateLN(){
  const ta=id('cta'), ln=id('lnum');
  const n=ta.value.split('\n').length;
  ln.innerHTML=Array.from({length:n},(_,i)=&gt;`&lt;span class=&quot;ln&quot;&gt;${i+1}&lt;/span&gt;`).join('');
}

function syncScroll(){
  id('lnum').scrollTop=id('cta').scrollTop;
}

function onKD(e){
  const ta=e.target;
  if(e.key==='Tab'){
    e.preventDefault();
    const s=ta.selectionStart, en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=s+2;
    onInput();
  }
  if(e.key==='s'&amp;&amp;(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    saveFile();
  }
}

// =====================
// PREVIEW
// =====================
function setPM(mode){
  pmMode=mode;
  qsa('.tbtn[id^=&quot;bpm&quot;]').forEach(b=&gt;b.classList.remove('on'));
  id('bpm'+mode)?.classList.add('on');
  const pv=id('prev');
  if(mode===0){
    pv.classList.remove('show');
    pv.style.height='';
  } else {
    pv.classList.add('show');
    pv.style.height=mode===2?'60vh':'220px';
    id('pframe').style.display='';
    refreshPreview();
  }
}

function toggleMin(){
  const pv=id('prev');
  const pf=id('pframe');
  const btn=qs('#prevbar .pbtn');
  if(pv.style.height==='30px'){
    pv.style.height='220px';
    pf.style.display='';
    btn.textContent='⬆ Preview';
  } else {
    pv.style.height='30px';
    pf.style.display='none';
    btn.textContent='⬇ Preview';
  }
}

function dragStart(e){
  if(pmMode===0) return;
  vDrag=true; vDragY=e.clientY;
  vDragH=id('prev').getBoundingClientRect().height;
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('mouseup',dragStop);
}

function dragMove(e){
  if(!vDrag) return;
  const total=id('work').getBoundingClientRect().height;
  const delta=vDragY-e.clientY;
  const newH=Math.max(60,Math.min(total-60,vDragH+delta));
  id('prev').style.height=newH+'px';
}

function dragStop(){
  vDrag=false;
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('mouseup',dragStop);
}

function refreshPreview(){
  if(!curFile) return;
  const e2=ext(curFile);
  const fr=id('pframe');
  const lb=id('prevlbl');
  if(e2==='html'){
    lb.textContent='🌐 '+curFile;
    fr.srcdoc=files[curFile]||'';
  } else if(e2==='css'){
    lb.textContent='🎨 CSS';
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;${files[curFile]||''}&lt;/style&gt;&lt;/head&gt;&lt;body style=&quot;background:#1e293b;color:#e2e8f0;padding:20px&quot;&gt;&lt;h2&gt;Preview CSS&lt;/h2&gt;&lt;p&gt;Estilos aplicados.&lt;/p&gt;&lt;/body&gt;&lt;/html&gt;`;
  } else if(e2==='md'){
    lb.textContent='📝 Markdown';
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px;background:#0f172a;color:#e2e8f0;line-height:1.7}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;pre style=&quot;white-space:pre-wrap;font-family:inherit&quot;&gt;${esc(files[curFile]||'')}&lt;/pre&gt;&lt;/body&gt;&lt;/html&gt;`;
  } else {
    lb.textContent='📄 '+curFile;
    fr.srcdoc=`&lt;html&gt;&lt;head&gt;&lt;style&gt;body{background:#1e293b;color:#94a3b8;font-family:monospace;padding:20px;font-size:13px;line-height:1.6;white-space:pre-wrap}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;${esc(files[curFile]||'')}&lt;/body&gt;&lt;/html&gt;`;
  }
}

// =====================
// IMPORTAR / EXPORTAR

async function doImport(e){
  const f=e.target.files[0];
  if(!f) return;
  if(!window.JSZip){ toast('JSZip não carregou','err'); return; }
  try{
    const z=await JSZip.loadAsync(f);
    const nf={};
    for(const[p,obj] of Object.entries(z.files)){
      if(obj.dir) continue;
      try{ nf[p]=await obj.async('string') }catch{}
    }
    files=nf; folderOpen={};
    renderTree();
    const first=Object.keys(files).find(f2=&gt;ext(f2)==='html')||Object.keys(files)[0];
    if(first) openFile(first);
    saveAll();
    toast('📦 '+Object.keys(files).length+' arquivos importados!');
  } catch(err){
    toast('Erro: '+err.message,'err');
  }
  e.target.value='';
}

async function exportZip(){
  if(!window.JSZip){ toast('JSZip não carregou','err'); return; }
  if(curFile) files[curFile]=id('cta').value;
  const z=new JSZip();
  for(const[n,c] of Object.entries(files)) z.file(n,c||'');
  dlBlob(await z.generateAsync({type:'blob',compression:'DEFLATE'}),'projeto-'+Date.now()+'.zip');
  toast('📥 ZIP exportado!');
}

function toggleSB(){

}

  if(e.key==='Escape'){
    ['mf','md','rn'].forEach(t=&gt;closeModal(t));
    id('ctx').style.display='none';
  }
});

      &lt;div style=&quot;display:flex;gap:6px;&quot;&gt;
        &lt;button id=&quot;testSupabaseBtn&quot; class=&quot;btn primary&quot;&gt;Testar&lt;/button&gt;
        &lt;button id=&quot;clearSupabaseBtn&quot; class=&quot;btn outline&quot;&gt;Limpar&lt;/button&gt;
      &lt;/div&gt;

      &lt;div id=&quot;configStatus&quot; class=&quot;config-status&quot;&gt;
        Nenhum teste realizado.
      &lt;/div&gt;

      &lt;div class=&quot;modal-actions&quot;&gt;
        &lt;button id=&quot;closeConfigBtn&quot; class=&quot;btn outline&quot;&gt;Fechar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    &quot;use strict&quot;;

    const STORAGE_KEY = &quot;playground_v2&quot;;
    const CONFIG_KEY = &quot;playground_config_v2&quot;;

    const DEFAULT_HTML = `&lt;div style=&quot;padding:20px;text-align:center;font-family:Arial&quot;&gt;
  &lt;h1&gt;Olá, Playground!&lt;/h1&gt;
  &lt;p&gt;Edite o código e veja o resultado ao vivo.&lt;/p&gt;
  &lt;button id=&quot;btn&quot;&gt;Clique aqui&lt;/button&gt;
&lt;/div&gt;`;

    const DEFAULT_CSS = `body {
  margin: 0;
  background: #f0f0f0;
  font-family: Arial, sans-serif;
}

button {
  padding: 10px 20px;
  background: #6b8e23;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #556b2f;
}`;

    const DEFAULT_JS = `document.getElementById(&quot;btn&quot;)?.addEventListener(&quot;click&quot;, () =&gt; {
  alert(&quot;Funcionou!&quot;);
});`;

    const state = {
      tab: &quot;html&quot;,
      html: DEFAULT_HTML,
      css: DEFAULT_CSS,
      js: DEFAULT_JS,
      jsx: &quot;&quot;,
      autoRun: true,
      editorCollapsed: false,
      previewCollapsed: false,
      supabase: null,
      supabaseConnected: false,
      searchMatches: [],
      searchIndex: 0
    };

    const $ = (id) =&gt; document.getElementById(id);

    function showStatus(type, message, timeout = 5000) {
      const el = $(&quot;status&quot;);
      el.className = &quot;status show &quot; + type;
      el.textContent = message;

      if (timeout) {
        window.clearTimeout(showStatus.timer);
        showStatus.timer = window.setTimeout(() =&gt; {
          el.className = &quot;status&quot;;
        }, timeout);
      }
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          Object.assign(state, JSON.parse(saved));
        } catch (e) {
          console.error(&quot;Erro ao carregar estado:&quot;, e);
        }
      }

      const config = localStorage.getItem(CONFIG_KEY);
      if (config) {
        try {
          const cfg = JSON.parse(config);
          $(&quot;supabaseUrl&quot;).value = cfg.url || &quot;&quot;;
          $(&quot;supabaseKey&quot;).value = cfg.key || &quot;&quot;;
        } catch (e) {
          console.error(&quot;Erro ao carregar config:&quot;, e);
        }
      }

      renderAll();
    }

    function persistState() {
      const copy = {
        tab: state.tab,
        html: state.html,
        css: state.css,
        js: state.js,
        jsx: state.jsx,
        autoRun: state.autoRun,
        editorCollapsed: state.editorCollapsed,
        previewCollapsed: state.previewCollapsed
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    }

    function getCurrentCode() {
      return state[state.tab] || &quot;&quot;;
    }

    function setCurrentCode(value) {
      state[state.tab] = value;
      persistState();
      updateEditor();
      if (state.autoRun) {
        schedulePreview();
      }
    }

    function setTab(tab) {
      state.tab = tab;
      persistState();
      renderAll();
    }

    function updateEditor() {
      const value = getCurrentCode();
      $(&quot;codeEditor&quot;).value = value;

      const lines = Math.max(1, value.split(&quot;\n&quot;).length);
      $(&quot;lineNumbers&quot;).textContent = Array.from(
        { length: lines },
        (_, i) =&gt; i + 1
      ).join(&quot;\n&quot;);

      $(&quot;lineCount&quot;).textContent = `${lines} ${lines === 1 ? &quot;linha&quot; : &quot;linhas&quot;}`;
    }

    function renderTabs() {
      document.querySelectorAll(&quot;[data-tab]&quot;).forEach((button) =&gt; {
        button.classList.toggle(&quot;active&quot;, button.dataset.tab === state.tab);
      });
    }

    function renderLayout() {
      $(&quot;editorPanel&quot;).classList.toggle(&quot;collapsed&quot;, state.editorCollapsed);
      $(&quot;previewPanel&quot;).classList.toggle(&quot;collapsed&quot;, state.previewCollapsed);
      $(&quot;expandEditorBtn&quot;).style.display = state.editorCollapsed ? &quot;inline-flex&quot; : &quot;none&quot;;
      $(&quot;collapseEditorBtn&quot;).style.display = state.editorCollapsed ? &quot;none&quot; : &quot;inline-flex&quot;;
      $(&quot;collapsePreviewBtn&quot;).style.display = state.previewCollapsed ? &quot;none&quot; : &quot;inline-flex&quot;;

      $(&quot;autoRunBtn&quot;).classList.toggle(&quot;primary&quot;, state.autoRun);
      $(&quot;autoRunBtn&quot;).textContent = state.autoRun ? &quot;◉ Ao vivo&quot; : &quot;○ Manual&quot;;

      const isMobile = window.innerWidth &lt;= 650;
      if (isMobile) {
        if (state.editorCollapsed) {
          $(&quot;editorPanel&quot;).classList.add(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        } else if (state.previewCollapsed) {
          $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.add(&quot;mobile-hidden&quot;);
        } else {
          $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        }
      } else {
        $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
      }

      updateSupabaseStatus();
    }

    function updateSupabaseStatus() {
      const indicator = document.querySelector(&quot;.supabase-status&quot;);
      if (state.supabaseConnected) {
        indicator.classList.add(&quot;connected&quot;);
      } else {
        indicator.classList.remove(&quot;connected&quot;);
      }
    }

    function renderAll() {
      renderTabs();
      updateEditor();
      renderLayout();
    }

    function buildDocument() {
      return `&lt;!doctype html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
  &lt;style&gt;${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  ${state.html}
  &lt;script&gt;
try {
${state.js}
} catch (error) {
  document.body.insertAdjacentHTML(
    &quot;beforeend&quot;,
    &quot;&lt;pre style='color:red;padding:12px;white-space:pre-wrap'&gt;&quot; +
    error.stack +
    &quot;&lt;/pre&gt;&quot;
  );
}
  &lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
    }

    let previewTimer = null;

    function schedulePreview() {
      window.clearTimeout(previewTimer);
      previewTimer = window.setTimeout(updatePreview, 350);
    }

    function updatePreview() {
      persistState();

      const blob = new Blob([buildDocument()], {
        type: &quot;text/html;charset=utf-8&quot;
      });

      const url = URL.createObjectURL(blob);
      const oldUrl = $(&quot;previewFrame&quot;).dataset.objectUrl;

      $(&quot;previewFrame&quot;).src = url;
      $(&quot;previewFrame&quot;).dataset.objectUrl = url;

      if (oldUrl) {
        window.setTimeout(() =&gt; URL.revokeObjectURL(oldUrl), 1000);
      }
    }

    function findMatches(text, searchTerm) {
      if (!searchTerm) return [];
      
      const regex = new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'), 'gi');
      const matches = [];
      let match;

      while ((match = regex.exec(text)) !== null) {
        matches.push({
          start: match.index,
          end: match.index + match[0].length,
          text: match[0]
        });
      }

      return matches;
    }

    function highlightMatch(editor, match) {
      if (!match) return;

      const text = editor.value;
      const before = text.substring(0, match.start);
      const lineNum = before.split(&quot;\n&quot;).length;

      editor.setSelectionRange(match.start, match.end);
      editor.focus();

      const lineHeight = parseInt(window.getComputedStyle(editor).lineHeight);
      editor.scrollTop = (lineNum - 1) * lineHeight - editor.clientHeight / 2;
    }

    function doSearch() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      state.searchMatches = findMatches(editor.value, searchTerm);
      state.searchIndex = 0;

      if (state.searchMatches.length &gt; 0) {
        highlightMatch(editor, state.searchMatches[0]);
        $(&quot;searchInfo&quot;).textContent = `1/${state.searchMatches.length}`;
      } else {
        $(&quot;searchInfo&quot;).textContent = &quot;0/0&quot;;
      }
    }

    function doReplace() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const replaceTerm = $(&quot;replaceInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      if (!searchTerm || state.searchMatches.length === 0) return;

      const match = state.searchMatches[state.searchIndex];
      const before = editor.value.substring(0, match.start);
      const after = editor.value.substring(match.end);

      editor.value = before + replaceTerm + after;
      setCurrentCode(editor.value);

      state.searchMatches = findMatches(editor.value, searchTerm);
      if (state.searchMatches.length &gt; 0) {
        highlightMatch(editor, state.searchMatches[0]);
        $(&quot;searchInfo&quot;).textContent = `1/${state.searchMatches.length}`;
      }
    }

    function doReplaceAll() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const replaceTerm = $(&quot;replaceInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      if (!searchTerm) return;

      const regex = new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'), 'g');
      const newValue = editor.value.replace(regex, replaceTerm);
      const count = (editor.value.match(regex) || []).length;

      editor.value = newValue;
      setCurrentCode(newValue);

      showStatus(&quot;success&quot;, `${count} ocorrência(s) substituída(s).`);
      doSearch();
    }

    async function saveLocal() {
      persistState();
      showStatus(&quot;success&quot;, &quot;Salvo localmente.&quot;);
    }

    async function saveCloud() {
      if (!state.supabase &amp;&amp; !connectSupabase()) {
        showStatus(&quot;error&quot;, &quot;Configure o Supabase antes.&quot;);
        return;
      }

      const payload = {
        name: &quot;Snippet &quot; + new Date().toLocaleTimeString(),
        html: state.html,
        css: state.css,
        js: state.js
      };

      const { error } = await state.supabase
        .from(&quot;snippets&quot;)
        .insert(payload);

      if (error) {
        showStatus(&quot;error&quot;, &quot;Erro: &quot; + error.message);
        return;
      }

      state.supabaseConnected = true;
      renderLayout();
      showStatus(&quot;success&quot;, &quot;Salvo no Supabase.&quot;);
    }

    function connectSupabase() {
      const url = $(&quot;supabaseUrl&quot;).value.trim();
      const key = $(&quot;supabaseKey&quot;).value.trim();

      if (!url || !key) {
        showStatus(&quot;error&quot;, &quot;Informe URL e chave.&quot;);
        return false;
      }

      if (!window.supabase) {
        showStatus(&quot;error&quot;, &quot;Biblioteca Supabase não carregada.&quot;);
        return false;
      }

      state.supabase = window.supabase.createClient(url, key);
      localStorage.setItem(CONFIG_KEY, JSON.stringify({ url, key }));
      return true;
    }

    async function testSupabase() {
      if (!connectSupabase()) return;

      const { error } = await state.supabase
        .from(&quot;snippets&quot;)
        .select(&quot;id&quot;)
        .limit(1);

      if (error) {
        state.supabaseConnected = false;
        showStatus(&quot;error&quot;, &quot;Falha: &quot; + error.message);
        renderLayout();
        return;
      }

      state.supabaseConnected = true;
      showStatus(&quot;success&quot;, &quot;Supabase conectado!&quot;);
      renderLayout();
    }

    function importFile(file) {
      const reader = new FileReader();

      reader.onload = () =&gt; {
        const content = String(reader.result || &quot;&quot;);
        const ext = file.name.split(&quot;.&quot;).pop().toLowerCase();

        if (ext === &quot;html&quot; || ext === &quot;htm&quot;) {
          state.html = content;
          state.tab = &quot;html&quot;;
        } else if (ext === &quot;css&quot;) {
          state.css = content;
          state.tab = &quot;css&quot;;
        } else if (ext === &quot;js&quot;) {
          state.js = content;
          state.tab = &quot;js&quot;;
        } else if (ext === &quot;jsx&quot; || ext === &quot;tsx&quot;) {
          state.jsx = content;
          state.tab = &quot;jsx&quot;;
        } else {
          state.html = content;
          state.tab = &quot;html&quot;;
        }

        persistState();
        renderAll();
        updatePreview();
        showStatus(&quot;success&quot;, &quot;Arquivo importado: &quot; + file.name);
      };

      reader.readAsText(file);
    }

    function downloadCurrent() {
      let content;
      let ext;

      if (state.tab === &quot;jsx&quot;) {
        content = state.jsx;
        ext = &quot;jsx&quot;;
      } else if (state.tab === &quot;css&quot;) {
        content = state.css;
        ext = &quot;css&quot;;
      } else if (state.tab === &quot;js&quot;) {
        content = state.js;
        ext = &quot;js&quot;;
      } else {
        content = buildDocument();
        ext = &quot;html&quot;;
      }

      const blob = new Blob([content], { type: &quot;text/plain;charset=utf-8&quot; });
      const url = URL.createObjectURL(blob);
      const link = document.createElement(&quot;a&quot;);

      link.href = url;
      link.download = &quot;playground.&quot; + ext;
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
      showStatus(&quot;success&quot;, &quot;Arquivo baixado.&quot;);
    }

    async function copyCurrent() {
      try {
        await navigator.clipboard.writeText(buildDocument());
        showStatus(&quot;success&quot;, &quot;Código copiado.&quot;);
      } catch {
        showStatus(&quot;error&quot;, &quot;Erro ao copiar.&quot;);
      }
    }

    function resetCurrent() {
      state.html = DEFAULT_HTML;
      state.css = DEFAULT_CSS;
      state.js = DEFAULT_JS;
      state.tab = &quot;html&quot;;
      persistState();
      renderAll();
      updatePreview();
      showStatus(&quot;success&quot;, &quot;Restaurado.&quot;);
    }

    function openFullscreen() {
      const blob = new Blob([buildDocument()], {
        type: &quot;text/html;charset=utf-8&quot;
      });
      const url = URL.createObjectURL(blob);
      window.open(url, &quot;_blank&quot;, &quot;noopener,noreferrer&quot;);
      window.setTimeout(() =&gt; URL.revokeObjectURL(url), 5000);
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle(&quot;light&quot;);
      localStorage.setItem(&quot;playground_theme&quot;, isLight ? &quot;light&quot; : &quot;dark&quot;);
      $(&quot;themeBtn&quot;).textContent = isLight ? &quot;☀&quot; : &quot;☾&quot;;
    }

    function applyTheme() {
      const theme = localStorage.getItem(&quot;playground_theme&quot;) || &quot;dark&quot;;
      document.documentElement.classList.toggle(&quot;light&quot;, theme === &quot;light&quot;);
      $(&quot;themeBtn&quot;).textContent = theme === &quot;light&quot; ? &quot;☀&quot; : &quot;☾&quot;;
    }

    function bindEvents() {
      document.querySelectorAll(&quot;[data-tab]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; setTab(button.dataset.tab));
      });

      $(&quot;codeEditor&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
        setCurrentCode(event.target.value);
      });

      $(&quot;autoRunBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.autoRun = !state.autoRun;
        persistState();
        renderLayout();
        if (state.autoRun) updatePreview();
      });

      $(&quot;runBtn&quot;).addEventListener(&quot;click&quot;, updatePreview);
      $(&quot;saveLocalBtn&quot;).addEventListener(&quot;click&quot;, saveLocal);
      $(&quot;saveCloudBtn&quot;).addEventListener(&quot;click&quot;, saveCloud);
      $(&quot;copyBtn&quot;).addEventListener(&quot;click&quot;, copyCurrent);
      $(&quot;downloadBtn&quot;).addEventListener(&quot;click&quot;, downloadCurrent);
      $(&quot;fullscreenBtn&quot;).addEventListener(&quot;click&quot;, openFullscreen);
      $(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, resetCurrent);
      $(&quot;themeBtn&quot;).addEventListener(&quot;click&quot;, toggleTheme);

      $(&quot;collapseEditorBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.editorCollapsed = true;
        persistState();
        renderLayout();
      });

      $(&quot;expandEditorBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.editorCollapsed = false;
        persistState();
        renderLayout();
      });

      $(&quot;collapsePreviewBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.previewCollapsed = true;
        persistState();
        renderLayout();
      });

      $(&quot;importBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; $(&quot;fileInput&quot;).click());

      $(&quot;fileInput&quot;).addEventListener(&quot;change&quot;, (event) =&gt; {
        const file = event.target.files[0];
        if (file) importFile(file);
        event.target.value = &quot;&quot;;
      });

      $(&quot;searchBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;searchBox&quot;).classList.toggle(&quot;show&quot;);
        if ($(&quot;searchBox&quot;).classList.contains(&quot;show&quot;)) {
          $(&quot;searchInput&quot;).focus();
        }
      });

      $(&quot;searchInput&quot;).addEventListener(&quot;input&quot;, doSearch);
      $(&quot;replaceBtn&quot;).addEventListener(&quot;click&quot;, doReplace);
      $(&quot;replaceAllBtn&quot;).addEventListener(&quot;click&quot;, doReplaceAll);

      $(&quot;closeSearchBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;searchBox&quot;).classList.remove(&quot;show&quot;);
        $(&quot;codeEditor&quot;).focus();
      });

      $(&quot;configBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;configModal&quot;).classList.add(&quot;open&quot;);
      });

      $(&quot;closeConfigBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;configModal&quot;).classList.remove(&quot;open&quot;);
      });

      $(&quot;testSupabaseBtn&quot;).addEventListener(&quot;click&quot;, testSupabase);

      $(&quot;clearSupabaseBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;supabaseUrl&quot;).value = &quot;&quot;;
        $(&quot;supabaseKey&quot;).value = &quot;&quot;;
        state.supabase = null;
        state.supabaseConnected = false;
        localStorage.removeItem(CONFIG_KEY);
        showStatus(&quot;success&quot;, &quot;Configuração removida.&quot;);
        renderLayout();
      });

      window.addEventListener(&quot;resize&quot;, renderLayout);
    }

    function startup() {
      applyTheme();
      bindEvents();
      loadState();
      updatePreview();

      const config = localStorage.getItem(CONFIG_KEY);
      if (config) {
        try {
          const cfg = JSON.parse(config);
          if (cfg.url &amp;&amp; cfg.key &amp;&amp; window.supabase) {
            state.supabase = window.supabase.createClient(cfg.url, cfg.key);
            state.supabaseConnected = true;
            renderLayout();
          }
        } catch (e) {
          console.error(&quot;Erro ao conectar Supabase:&quot;, e);
        }
      }
    }

    startup();
  &lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;"></iframe>
</div>


<script>
function trocarProjeto(index) {
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  localStorage.setItem('ultimo-projeto', index);
}

window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
