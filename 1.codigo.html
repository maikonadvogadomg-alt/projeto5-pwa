    &lt;script&gt;
        // ===== STATE MANAGEMENT =====
        const state = {
            mode: 'html',
            activeTab: 'html',
            html: localStorage.getItem('playground_html') || '&lt;div style=&quot;max-width: 600px; margin: 40px auto; padding: 20px; font-family: sans-serif;&quot;&gt;&lt;h1 style=&quot;color: #333;&quot;&gt;Bem-vindo ao HTML Playground&lt;/h1&gt;&lt;p style=&quot;color: #666; margin: 16px 0;&quot;&gt;Cole seu código HTML aqui e veja o resultado ao vivo!&lt;/p&gt;&lt;button onclick=&quot;alert(\'Funcionou!\')&quot; style=&quot;padding: 10px 24px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;&quot;&gt;Clique aqui&lt;/button&gt;&lt;/div&gt;',
            css: localStorage.getItem('playground_css') || '',
            js: localStorage.getItem('playground_js') || '',
            react: localStorage.getItem('playground_react') || 'function App() {\n  return (\n    &lt;div style={{padding: &quot;20px&quot;, fontFamily: &quot;sans-serif&quot;}}&gt;\n      &lt;h1&gt;React Playground&lt;/h1&gt;\n      &lt;p&gt;Escreva seu código React aqui!&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}',
            python: localStorage.getItem('playground_python') || 'print(&quot;Hello, Python!&quot;)\nprint(&quot;Escreva seu código Python aqui&quot;)',
            title: localStorage.getItem('playground_title') || 'Sem titulo',
            snippets: JSON.parse(localStorage.getItem('playground_snippets') || '[]'),
            autoRun: true,
            mobileView: 'editor'
        };

        // ===== DOM ELEMENTS =====
        const elements = {
            projectTitle: document.getElementById('projectTitle'),
            htmlEditor: document.getElementById('htmlEditor'),
            cssEditor: document.getElementById('cssEditor'),
            jsEditor: document.getElementById('jsEditor'),
            reactEditor: document.getElementById('reactEditor'),
            pythonEditor: document.getElementById('pythonEditor'),
            previewFrame: document.getElementById('previewFrame'),
            pythonOutput: document.getElementById('pythonOutput'),
            lineNumbers: document.getElementById('lineNumbers'),
            lineCount: document.getElementById('lineCount'),
            searchInput: document.getElementById('searchInput'),
            editorSection: document.getElementById('editorSection'),
            previewSection: document.getElementById('previewSection'),
            editorToggle: document.getElementById('editorToggle'),
            previewToggle: document.getElementById('previewToggle'),
            snippetsModal: document.getElementById('snippetsModal'),
            snippetList: document.getElementById('snippetList'),
            modalSearchInput: document.getElementById('modalSearchInput'),
            fileInput: document.getElementById('fileInput'),
            runBtn: document.getElementById('runBtn'),
            mobileToggle: document.querySelector('.mobile-toggle'),
            separator1: document.getElementById('separator1')
        };

        // ===== INITIALIZATION =====
        function init() {
            loadState();
            setupEventListeners();
            updateEditors();
            updatePreview();
            checkMobileView();
            window.addEventListener('resize', checkMobileView);
        }

        function loadState() {
            elements.projectTitle.value = state.title;
            elements.htmlEditor.value = state.html;
            elements.cssEditor.value = state.css;
            elements.jsEditor.value = state.js;
            elements.reactEditor.value = state.react;
            elements.pythonEditor.value = state.python;
        }

        function saveState() {
            localStorage.setItem('playground_html', state.html);
            localStorage.setItem('playground_css', state.css);
            localStorage.setItem('playground_js', state.js);
            localStorage.setItem('playground_react', state.react);
            localStorage.setItem('playground_python', state.python);
            localStorage.setItem('playground_title', state.title);
            localStorage.setItem('playground_snippets', JSON.stringify(state.snippets));
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Mode selector
            document.querySelectorAll('[data-mode]').forEach(btn =&gt; {
                btn.addEventListener('click', () =&gt; switchMode(btn.dataset.mode));
            });

            // Tab selector
            document.querySelectorAll('[data-tab]').forEach(btn =&gt; {
                btn.addEventListener('click', () =&gt; switchTab(btn.dataset.tab));
            });

            // Editors
            elements.htmlEditor.addEventListener('input', (e) =&gt; {
                state.html = e.target.value;
                updateLineNumbers();
                updatePreview();
                saveState();
            });

            elements.cssEditor.addEventListener('input', (e) =&gt; {
                state.css = e.target.value;
                updatePreview();
                saveState();
            });

            elements.jsEditor.addEventListener('input', (e) =&gt; {
                state.js = e.target.value;
                updatePreview();
                saveState();
            });

            elements.reactEditor.addEventListener('input', (e) =&gt; {
                state.react = e.target.value;
                updateLineNumbers();
                updatePreview();
                saveState();
            });

            elements.pythonEditor.addEventListener('input', (e) =&gt; {
                state.python = e.target.value;
                updateLineNumbers();
                saveState();
            });

            // Title
            elements.projectTitle.addEventListener('change', (e) =&gt; {
                state.title = e.target.value || 'Sem titulo';
                saveState();
            });

            // Search
            elements.searchInput.addEventListener('input', (e) =&gt; {
                const query = e.target.value.toLowerCase();
                const editor = getCurrentEditor();
                highlightSearchResults(editor, query);
            });

            // Buttons
            document.getElementById('importBtn').addEventListener('click', () =&gt; elements.fileInput.click());
            document.getElementById('fullscreenBtn').addEventListener('click', openFullscreen);
            document.getElementById('copyBtn').addEventListener('click', copyCode);
            document.getElementById('downloadBtn').addEventListener('click', downloadCode);
            document.getElementById('saveBtn').addEventListener('click', saveSnippet);
            document.getElementById('openBtn').addEventListener('click', openSnippets);
            document.getElementById('resetBtn').addEventListener('click', resetCode);
            document.getElementById('clearBtn').addEventListener('click', clearCode);
            document.getElementById('runBtn').addEventListener('click', runPython);

            // Mobile toggle
            elements.editorToggle?.addEventListener('click', () =&gt; {
                state.mobileView = 'editor';
                updateMobileView();
            });

            elements.previewToggle?.addEventListener('click', () =&gt; {
                state.mobileView = 'preview';
                updateMobileView();
            });

            // File import
            elements.fileInput.addEventListener('change', handleFileImport);

            // Modal
            document.getElementById('closeModal').addEventListener('click', () =&gt; {
                elements.snippetsModal.classList.remove('active');
            });

            elements.modalSearchInput.addEventListener('input', (e) =&gt; {
                filterSnippets(e.target.value);
            });

            // Close modal on outside click
            elements.snippetsModal.addEventListener('click', (e) =&gt; {
                if (e.target === elements.snippetsModal) {
                    elements.snippetsModal.classList.remove('active');
                }
            });
        }

        // ===== MODE &amp; TAB SWITCHING =====
        function switchMode(mode) {
            state.mode = mode;
            state.activeTab = mode === 'html' ? 'html' : mode;

            // Update mode buttons
            document.querySelectorAll('[data-mode]').forEach(btn =&gt; {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Update tab visibility
            updateTabVisibility();
            updateEditors();
            updatePreview();
        }

        function switchTab(tab) {
            state.activeTab = tab;

            // Update tab buttons
            document.querySelectorAll('[data-tab]').forEach(btn =&gt; {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            // Update editor visibility
            updateEditors();
            updateLineNumbers();
        }

        function updateTabVisibility() {
            const tabs = document.querySelectorAll('[data-tab]');
            tabs.forEach(tab =&gt; tab.classList.add('hidden'));

            if (state.mode === 'html') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;css&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;js&quot;]')?.classList.remove('hidden');
            } else if (state.mode === 'react') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;html&quot;]').textContent = 'JSX';
            } else if (state.mode === 'python') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;html&quot;]').textContent = 'Python';
            }
        }

        function updateEditors() {
            elements.htmlEditor.classList.add('hidden');
            elements.cssEditor.classList.add('hidden');
            elements.jsEditor.classList.add('hidden');
            elements.reactEditor.classList.add('hidden');
            elements.pythonEditor.classList.add('hidden');

            if (state.mode === 'html') {
                if (state.activeTab === 'html') elements.htmlEditor.classList.remove('hidden');
                else if (state.activeTab === 'css') elements.cssEditor.classList.remove('hidden');
                else if (state.activeTab === 'js') elements.jsEditor.classList.remove('hidden');
            } else if (state.mode === 'react') {
                elements.reactEditor.classList.remove('hidden');
            } else if (state.mode === 'python') {
                elements.pythonEditor.classList.remove('hidden');
                elements.runBtn.style.display = 'flex';
            } else {
                elements.runBtn.style.display = 'none';
            }

            updateLineNumbers();
        }

        // ===== LINE NUMBERS =====
        function updateLineNumbers() {
            const editor = getCurrentEditor();
            const lines = editor.value.split('\n').length;
            elements.lineCount.textContent = `${lines} linhas`;

            let html = '';
            for (let i = 1; i &lt;= lines; i++) {
                html += `&lt;div class=&quot;line-number&quot;&gt;${i}&lt;/div&gt;`;
            }
            elements.lineNumbers.innerHTML = html;
        }

        // ===== SEARCH &amp; HIGHLIGHT =====
        function highlightSearchResults(editor, query) {
            if (!query) {
                editor.style.backgroundColor = 'transparent';
                return;
            }

            const text = editor.value;
            const regex = new RegExp(query, 'gi');
            let count = 0;
            while (regex.exec(text)) count++;

            if (count &gt; 0) {
                showMessage(`${count} resultado(s) encontrado(s)`);
            }
        }

        // ===== PREVIEW =====
        function updatePreview() {
            if (state.mode === 'python') {
                elements.pythonOutput.classList.remove('hidden');
                elements.previewFrame.classList.add('hidden');
                return;
            }

            elements.pythonOutput.classList.add('hidden');
            elements.previewFrame.classList.remove('hidden');

            let html;

            if (state.mode === 'react') {
                html = buildReactDocument();
            } else {
                html = buildHtmlDocument();
            }

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            elements.previewFrame.src = url;
        }

        function buildHtmlDocument() {
            return `&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;style&gt;${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    ${state.html}
    &lt;script&gt;${state.js}&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
        }

        function buildReactDocument() {
            return `&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;&gt;&lt;\/script&gt;
    &lt;script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;&gt;&lt;\/script&gt;
    &lt;script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;&gt;&lt;\/script&gt;
    &lt;style&gt;* { box-sizing: border-box; } body { margin: 0; font-family: sans-serif; } ${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div id=&quot;root&quot;&gt;&lt;/div&gt;
    &lt;script type=&quot;text/babel&quot;&gt;
        const { useState, useEffect, useRef, useCallback } = React;
        ${state.react}
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(&lt;App /&gt;);
        } catch(e) {
            document.getElementById('root').innerHTML = '&lt;div style=&quot;color:red;padding:20px;font-family:monospace;white-space:pre-wrap&quot;&gt;Erro: ' + e.message + '&lt;/div&gt;';
        }
    &lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
        }

        // ===== PYTHON EXECUTION =====
        async function runPython() {
            elements.runBtn.disabled = true;
            elements.pythonOutput.innerHTML = '&lt;span class=&quot;output-info&quot;&gt;⟳ Executando...&lt;/span&gt;';

            try {
                const response = await fetch('/api/code/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: state.python, language: 'python' })
                });

                const data = await response.json();

                if (data.error) {
                    elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-error&quot;&gt;${escapeHtml(data.error)}&lt;/span&gt;`;
                } else {
                    elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-success&quot;&gt;$ python3\n${escapeHtml(data.output || '')}&lt;/span&gt;`;
                }
            } catch (error) {
                elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-error&quot;&gt;Erro: ${error.message}&lt;/span&gt;`;
            } finally {
                elements.runBtn.disabled = false;
            }
        }

        // ===== FILE OPERATIONS =====
        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) =&gt; {
                const content = event.target.result;
                const ext = file.name.split('.').pop().toLowerCase();

                if (ext === 'py') {
                    state.mode = 'python';
                    state.python = content;
                    switchMode('python');
                } else if (ext === 'jsx' || ext === 'tsx') {
                    state.mode = 'react';
                    state.react = content;
                    switchMode('react');
                } else {
                    state.mode = 'html';
                    state.html = content;
                    switchMode('html');
                }

                state.title = file.name.replace(/\.[^.]+$/, '');
                elements.projectTitle.value = state.title;
                saveState();
                showMessage(`✅ Arquivo &quot;${file.name}&quot; importado!`);
            };

            reader.readAsText(file);
            e.target.value = '';
        }

        function openFullscreen() {
            const html = state.mode === 'react' ? buildReactDocument() : buildHtmlDocument();
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function copyCode() {
            const code = state.mode === 'react' ? buildReactDocument() : 
                        state.mode === 'python' ? state.python :
                        buildHtmlDocument();
            navigator.clipboard.writeText(code);
            showMessage('✅ Código copiado!');
        }

        function downloadCode() {
            let content, filename, ext;

            if (state.mode === 'python') {
                content = state.python;
                ext = 'py';
            } else if (state.mode === 'react') {
                content = state.react;
                ext = 'jsx';
            } else {
                content = buildHtmlDocument();
                ext = 'html';
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.title || 'playground'}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
            showMessage(`✅ Arquivo .${ext} baixado!`);
        }

        // ===== SNIPPETS =====
        function saveSnippet() {
            if (!state.title || state.title === 'Sem titulo') {
                showMessage('⚠️ Dê um nome ao projeto primeiro!');
                return;
            }

            const snippet = {
                id: Date.now().toString(),
                title: state.title,
                mode: state.mode,
                html: state.html,
                css: state.css,
                js: state.js,
                react: state.react,
                python: state.python,
                date: new Date().toLocaleString('pt-BR')
            };

            state.snippets = state.snippets.filter(s =&gt; s.title !== state.title);
            state.snippets.unshift(snippet);
            saveState();
            showMessage('✅ Código salvo!');
        }

        function openSnippets() {
            elements.snippetsModal.classList.add('active');
            renderSnippets();
        }

        function renderSnippets(filter = '') {
            const filtered = state.snippets.filter(s =&gt;
                s.title.toLowerCase().includes(filter.toLowerCase())
            );

            elements.snippetList.innerHTML = filtered.length === 0
                ? '&lt;p style=&quot;text-align: center; color: var(--text-secondary); padding: 2rem;&quot;&gt;Nenhum código salvo&lt;/p&gt;'
                : filtered.map(s =&gt; `
                    &lt;div class=&quot;snippet-item&quot; onclick=&quot;loadSnippet('${s.id}')&quot;&gt;
                        &lt;div class=&quot;snippet-info&quot;&gt;
                            &lt;div class=&quot;snippet-title&quot;&gt;${escapeHtml(s.title)}&lt;/div&gt;
                            &lt;div class=&quot;snippet-meta&quot;&gt;${s.mode.toUpperCase()} • ${s.date}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;snippet-actions&quot;&gt;
                            &lt;button class=&quot;btn&quot; onclick=&quot;deleteSnippet('${s.id}', event)&quot;&gt;🗑️&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `).join('');
        }

        function loadSnippet(id) {
            const snippet = state.snippets.find(s =&gt; s.id === id);
            if (!snippet) return;

            state.mode = snippet.mode;
            state.html = snippet.html;
            state.css = snippet.css;
            state.js = snippet.js;
            state.react = snippet.react;
            state.python = snippet.python;
            state.title = snippet.title;

            elements.projectTitle.value = state.title;
            loadState();
            switchMode(state.mode);
            elements.snippetsModal.classList.remove('active');
            showMessage(`✅ &quot;${snippet.title}&quot; carregado!`);
        }

        function deleteSnippet(id, event) {
            event.stopPropagation();
            state.snippets = state.snippets.filter(s =&gt; s.id !== id);
            saveState();
            renderSnippets(elements.modalSearchInput.value);
            showMessage('✅ Código removido!');
        }

        function filterSnippets(query) {
            renderSnippets(query);
        }

        // ===== UTILITIES =====
        function getCurrentEditor() {
            if (state.mode === 'react') return elements.reactEditor;
            if (state.mode === 'python') return elements.pythonEditor;
            if (state.activeTab === 'css') return elements.cssEditor;
            if (state.activeTab === 'js') return elements.jsEditor;
            return elements.htmlEditor;
        }

        function resetCode() {
            if (state.mode === 'python') {
                state.python = 'print(&quot;Hello, Python!&quot;)';
            } else if (state.mode === 'react') {
                state.react = 'function App() {\n  return &lt;h1&gt;React App&lt;/h1&gt;;\n}';
            } else {
                state.html = '&lt;h1&gt;Novo projeto&lt;/h1&gt;';
                state.css = '';
                state.js = '';
            }
            loadState();
            updatePreview();
            saveState();
            showMessage('🔄 Código restaurado!');
        }

        function clearCode() {
            if (confirm('Tem certeza? Isso limpará todo o código.')) {
                if (state.mode === 'python') {
                    state.python = '';
                } else if (state.mode === 'react') {
                    state.react = '';
                } else {
                    state.html = '';
                    state.css = '';
                    state.js = '';
                }
                loadState();
                updatePreview();
                saveState();
                showMessage('🗑️ Código limpo!');
            }
        }

        function escapeHtml(text) {
            const map = {
                '&amp;': '&amp;amp;',
                '&lt;': '&amp;lt;',
                '&gt;': '&amp;gt;',
                '&quot;': '&amp;quot;',
                &quot;'&quot;: '&amp;#039;'
            };
            return text.replace(/[&amp;&lt;&gt;&quot;']/g, m =&gt; map[m]);
        }

        function showMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'status-message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() =&gt; msg.remove(), 3000);
        }

        // ===== MOBILE VIEW =====
        function checkMobileView() {
            const isMobile = window.innerWidth &lt;= 768;
            elements.mobileToggle.classList.toggle('hidden', !isMobile);
            elements.separator1.classList.toggle('hidden', !isMobile);

            if (isMobile) {
                updateMobileView();
            } else {
                elements.editorSection.classList.remove('hidden', 'full');
                elements.previewSection.classList.remove('hidden', 'full');
            }
        }

        function updateMobileView() {
            if (state.mobileView === 'editor') {
                elements.editorSection.classList.remove('hidden', 'full');
                elements.previewSection.classList.add('hidden');
                elements.editorToggle.classList.add('active');
                elements.previewToggle.classList.remove('active');
            } else {
                elements.editorSection.classList.add('hidden');
                elements.previewSection.classList.remove('hidden');
                elements.previewSection.classList.add('full');
                elements.editorToggle.classList.remove('active');
                elements.previewToggle.classList.add('active');
            }
        }

        // ===== START =====
        init();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>

      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.6rem;
      text-align: right;
      user-select: none;
      overflow: hidden;
    }

    .code-editor {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 8px 10px;
      border: 0;
      outline: none;
      resize: none;
      color: var(--text);
      background: var(--editor);
      font-family: Consolas, &quot;Courier New&quot;, monospace;
      font-size: 12px;
      line-height: 1.6rem;
      tab-size: 2;
    }

    .preview-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: white;
    }

    .search-box {
      display: none;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      gap: 4px;
      align-items: center;
    }

    .search-box.show {
      display: flex;
    }

    .search-box input {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--editor);
      color: var(--text);
      font-size: 11px;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .search-info {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgb(0 0 0 / 65%);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 20px 60px rgb(0 0 0 / 35%);
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .form-row {
      margin-bottom: 10px;
    }

    .form-row label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .form-row input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      outline: none;
      color: var(--text);
      background: var(--editor);
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .config-status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      color: var(--muted);
      background: var(--editor);
      font-size: 10px;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }

    .supabase-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: #dc2626;
    }

    .supabase-status.connected {
      background: #059669;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 650px) {
      .topbar {
        min-height: 48px;
        padding: 6px 8px;
      }

      .toolbar {
        width: 100%;
        order: 3;
        flex-basis: 100%;
      }

      .btn,
      .mode-btn,
      .tab-btn {
        min-height: 32px;
        padding: 6px 10px;
        font-size: 10px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
      }

      .main {
        flex-direction: column;
      }

      .workarea {
        flex-direction: column;
      }

      .editor-panel,
      .preview-panel {
        width: 100%;
        height: 50%;
      }

      .editor-panel.mobile-hidden,
      .preview-panel.mobile-hidden {
        display: none;
      }

      .editor-panel.mobile-hidden+.preview-panel,
      .preview-panel.mobile-hidden {
        height: 100%;
      }

      .panel-header {
        min-height: 32px;
        padding: 4px 6px;
      }

      .panel-label {
        font-size: 10px;
      }

      .editor-tabs {
        padding: 3px;
        gap: 2px;
      }

      .editor-tabs .tab-btn {
        min-height: 22px;
        padding: 3px 6px;
        font-size: 9px;
      }

      .line-count {
        display: none;
      }

      .line-numbers {
        width: 30px;
        padding: 6px 4px 6px 0;

        line-height: 1.5rem;
      }

      .code-editor {
        padding: 6px 8px;

        line-height: 1.5rem;
      }

      .modal {
        width: 95%;
        padding: 12px;
      }

      .modal h2 {
        font-size: 14px;
        margin-bottom: 10px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .topbar {
        min-height: 40px;
        padding: 4px 6px;
      }

      .btn,
      .mode-btn,
      .tab-btn {
        min-height: 28px;
        padding: 4px 6px;
        font-size: 9px;
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }

      .panel-header {
        min-height: 28px;
        padding: 3px 4px;
      }

      .line-numbers {
        width: 28px;
        padding: 4px 3px 4px 0;
        font-size: 8px;
        line-height: 1.4rem;
      }

      .code-editor {
        padding: 4px 6px;
        font-size: 10px;
        line-height: 1.4rem;
      }
    }
  &lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;
  &lt;div class=&quot;app&quot;&gt;
    &lt;header class=&quot;topbar&quot;&gt;
      &lt;div class=&quot;brand&quot;&gt;
        &lt;span class=&quot;brand-icon&quot;&gt;◆&lt;/span&gt;
        &lt;span class=&quot;brand-name&quot;&gt;Playground&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;toolbar&quot;&gt;

          &lt;div class=&quot;search-box&quot; id=&quot;searchBox&quot;&gt;

  &lt;input id=&quot;fileInput&quot; type=&quot;file&quot; hidden accept=&quot;.html,.htm,.css,.js,.jsx,.tsx,.py,.txt&quot; /&gt;

  &lt;div id=&quot;configModal&quot; class=&quot;modal-backdrop&quot;&gt;
    &lt;div class=&quot;modal&quot;&gt;
      &lt;h2&gt;Configuração Supabase&lt;/h2&gt;

      &lt;div class=&quot;form-row&quot;&gt;
        &lt;label for=&quot;supabaseUrl&quot;&gt;Project URL&lt;/label&gt;
        &lt;input id=&quot;supabaseUrl&quot; placeholder=&quot;https://seu-projeto.supabase.co&quot; /&gt;
      &lt;/div&gt;

      &lt;div class=&quot;form-row&quot;&gt;
        &lt;label for=&quot;supabaseKey&quot;&gt;Chave pública anon&lt;/label&gt;
        &lt;input id=&quot;supabaseKey&quot; type=&quot;password&quot; placeholder=&quot;eyJ...&quot; /&gt;
      &lt;/div&gt;

      &lt;div style=&quot;display:flex;gap:6px;&quot;&gt;
        &lt;button id=&quot;testSupabaseBtn&quot; class=&quot;btn primary&quot;&gt;Testar&lt;/button&gt;
        &lt;button id=&quot;clearSupabaseBtn&quot; class=&quot;btn outline&quot;&gt;Limpar&lt;/button&gt;
      &lt;/div&gt;

      &lt;div id=&quot;configStatus&quot; class=&quot;config-status&quot;&gt;
        Nenhum teste realizado.
      &lt;/div&gt;

      &lt;div class=&quot;modal-actions&quot;&gt;

      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    &quot;use strict&quot;;

    const STORAGE_KEY = &quot;playground_v2&quot;;
    const CONFIG_KEY = &quot;playground_config_v2&quot;;

    const DEFAULT_HTML = `&lt;div style=&quot;padding:20px;text-align:center;font-family:Arial&quot;&gt;
  &lt;h1&gt;Olá, Playground!&lt;/h1&gt;
  &lt;p&gt;Edite o código e veja o resultado ao vivo.&lt;/p&gt;
  &lt;button id=&quot;btn&quot;&gt;Clique aqui&lt;/button&gt;
&lt;/div&gt;`;

    const DEFAULT_CSS = `body {
  margin: 0;
  background: #f0f0f0;
  font-family: Arial, sans-serif;
}

button {
  padding: 10px 20px;
  background: #6b8e23;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #556b2f;
}`;

    const DEFAULT_JS = `document.getElementById(&quot;btn&quot;)?.addEventListener(&quot;click&quot;, () =&gt; {
  alert(&quot;Funcionou!&quot;);
});`;

    const state = {
      tab: &quot;html&quot;,
      html: DEFAULT_HTML,
      css: DEFAULT_CSS,
      js: DEFAULT_JS,
      jsx: &quot;&quot;,
      autoRun: true,
      editorCollapsed: false,
      previewCollapsed: false,
      supabase: null,
      supabaseConnected: false,
      searchMatches: [],
      searchIndex: 0
    };

    const $ = (id) =&gt; document.getElementById(id);

    function showStatus(type, message, timeout = 5000) {
      const el = $(&quot;status&quot;);
      el.className = &quot;status show &quot; + type;
      el.textContent = message;

      if (timeout) {
        window.clearTimeout(showStatus.timer);
        showStatus.timer = window.setTimeout(() =&gt; {
          el.className = &quot;status&quot;;
        }, timeout);
      }
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          Object.assign(state, JSON.parse(saved));
        } catch (e) {
          console.error(&quot;Erro ao carregar estado:&quot;, e);
        }
      }

      const config = localStorage.getItem(CONFIG_KEY);
      if (config) {
        try {
          const cfg = JSON.parse(config);
          $(&quot;supabaseUrl&quot;).value = cfg.url || &quot;&quot;;
          $(&quot;supabaseKey&quot;).value = cfg.key || &quot;&quot;;
        } catch (e) {
          console.error(&quot;Erro ao carregar config:&quot;, e);
        }
      }

      renderAll();
    }

    function persistState() {
      const copy = {
        tab: state.tab,
        html: state.html,
        css: state.css,
        js: state.js,
        jsx: state.jsx,
        autoRun: state.autoRun,
        editorCollapsed: state.editorCollapsed,
        previewCollapsed: state.previewCollapsed
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    }

    function getCurrentCode() {
      return state[state.tab] || &quot;&quot;;
    }

    function setCurrentCode(value) {
      state[state.tab] = value;
      persistState();
      updateEditor();
      if (state.autoRun) {
        schedulePreview();
      }
    }

    function setTab(tab) {
      state.tab = tab;
      persistState();
      renderAll();
    }

    function updateEditor() {
      const value = getCurrentCode();
      $(&quot;codeEditor&quot;).value = value;

      const lines = Math.max(1, value.split(&quot;\n&quot;).length);
      $(&quot;lineNumbers&quot;).textContent = Array.from(
        { length: lines },
        (_, i) =&gt; i + 1
      ).join(&quot;\n&quot;);

      $(&quot;lineCount&quot;).textContent = `${lines} ${lines === 1 ? &quot;linha&quot; : &quot;linhas&quot;}`;
    }

    function renderTabs() {
      document.querySelectorAll(&quot;[data-tab]&quot;).forEach((button) =&gt; {
        button.classList.toggle(&quot;active&quot;, button.dataset.tab === state.tab);
      });
    }

    function renderLayout() {
      $(&quot;editorPanel&quot;).classList.toggle(&quot;collapsed&quot;, state.editorCollapsed);
      $(&quot;previewPanel&quot;).classList.toggle(&quot;collapsed&quot;, state.previewCollapsed);
      $(&quot;expandEditorBtn&quot;).style.display = state.editorCollapsed ? &quot;inline-flex&quot; : &quot;none&quot;;
      $(&quot;collapseEditorBtn&quot;).style.display = state.editorCollapsed ? &quot;none&quot; : &quot;inline-flex&quot;;
      $(&quot;collapsePreviewBtn&quot;).style.display = state.previewCollapsed ? &quot;none&quot; : &quot;inline-flex&quot;;

      $(&quot;autoRunBtn&quot;).classList.toggle(&quot;primary&quot;, state.autoRun);
      $(&quot;autoRunBtn&quot;).textContent = state.autoRun ? &quot;◉ Ao vivo&quot; : &quot;○ Manual&quot;;

      const isMobile = window.innerWidth &lt;= 650;
      if (isMobile) {
        if (state.editorCollapsed) {
          $(&quot;editorPanel&quot;).classList.add(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        } else if (state.previewCollapsed) {
          $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.add(&quot;mobile-hidden&quot;);
        } else {
          $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
          $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        }
      } else {
        $(&quot;editorPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
        $(&quot;previewPanel&quot;).classList.remove(&quot;mobile-hidden&quot;);
      }

      updateSupabaseStatus();
    }

    function updateSupabaseStatus() {
      const indicator = document.querySelector(&quot;.supabase-status&quot;);
      if (state.supabaseConnected) {
        indicator.classList.add(&quot;connected&quot;);
      } else {
        indicator.classList.remove(&quot;connected&quot;);
      }
    }

    function renderAll() {
      renderTabs();
      updateEditor();
      renderLayout();
    }

    function buildDocument() {
      return `&lt;!doctype html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
  &lt;style&gt;${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  ${state.html}
  &lt;script&gt;
try {
${state.js}
} catch (error) {
  document.body.insertAdjacentHTML(
    &quot;beforeend&quot;,
    &quot;&lt;pre style='color:red;padding:12px;white-space:pre-wrap'&gt;&quot; +
    error.stack +
    &quot;&lt;/pre&gt;&quot;
  );
}
  &lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
    }

    let previewTimer = null;

    function schedulePreview() {
      window.clearTimeout(previewTimer);
      previewTimer = window.setTimeout(updatePreview, 350);
    }

    function updatePreview() {
      persistState();

      const blob = new Blob([buildDocument()], {
        type: &quot;text/html;charset=utf-8&quot;
      });

      const url = URL.createObjectURL(blob);
      const oldUrl = $(&quot;previewFrame&quot;).dataset.objectUrl;

      $(&quot;previewFrame&quot;).src = url;
      $(&quot;previewFrame&quot;).dataset.objectUrl = url;

      if (oldUrl) {
        window.setTimeout(() =&gt; URL.revokeObjectURL(oldUrl), 1000);
      }
    }

    function findMatches(text, searchTerm) {
      if (!searchTerm) return [];
      
      const regex = new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'), 'gi');
      const matches = [];
      let match;

      while ((match = regex.exec(text)) !== null) {
        matches.push({
          start: match.index,
          end: match.index + match[0].length,
          text: match[0]
        });
      }

      return matches;
    }

    function highlightMatch(editor, match) {
      if (!match) return;

      const text = editor.value;
      const before = text.substring(0, match.start);
      const lineNum = before.split(&quot;\n&quot;).length;

      editor.setSelectionRange(match.start, match.end);
      editor.focus();

      const lineHeight = parseInt(window.getComputedStyle(editor).lineHeight);
      editor.scrollTop = (lineNum - 1) * lineHeight - editor.clientHeight / 2;
    }

    function doSearch() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      state.searchMatches = findMatches(editor.value, searchTerm);
      state.searchIndex = 0;

      if (state.searchMatches.length &gt; 0) {
        highlightMatch(editor, state.searchMatches[0]);
        $(&quot;searchInfo&quot;).textContent = `1/${state.searchMatches.length}`;
      } else {
        $(&quot;searchInfo&quot;).textContent = &quot;0/0&quot;;
      }
    }

    function doReplace() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const replaceTerm = $(&quot;replaceInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      if (!searchTerm || state.searchMatches.length === 0) return;

      const match = state.searchMatches[state.searchIndex];
      const before = editor.value.substring(0, match.start);
      const after = editor.value.substring(match.end);

      editor.value = before + replaceTerm + after;
      setCurrentCode(editor.value);

      state.searchMatches = findMatches(editor.value, searchTerm);
      if (state.searchMatches.length &gt; 0) {
        highlightMatch(editor, state.searchMatches[0]);
        $(&quot;searchInfo&quot;).textContent = `1/${state.searchMatches.length}`;
      }
    }

    function doReplaceAll() {
      const searchTerm = $(&quot;searchInput&quot;).value;
      const replaceTerm = $(&quot;replaceInput&quot;).value;
      const editor = $(&quot;codeEditor&quot;);

      if (!searchTerm) return;

      const regex = new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'), 'g');
      const newValue = editor.value.replace(regex, replaceTerm);
      const count = (editor.value.match(regex) || []).length;

      editor.value = newValue;
      setCurrentCode(newValue);

      showStatus(&quot;success&quot;, `${count} ocorrência(s) substituída(s).`);
      doSearch();
    }

    async function saveLocal() {
      persistState();
      showStatus(&quot;success&quot;, &quot;Salvo localmente.&quot;);
    }

    async function saveCloud() {
      if (!state.supabase &amp;&amp; !connectSupabase()) {
        showStatus(&quot;error&quot;, &quot;Configure o Supabase antes.&quot;);
        return;
      }

      const payload = {
        name: &quot;Snippet &quot; + new Date().toLocaleTimeString(),
        html: state.html,
        css: state.css,
        js: state.js
      };

      const { error } = await state.supabase
        .from(&quot;snippets&quot;)
        .insert(payload);

      if (error) {
        showStatus(&quot;error&quot;, &quot;Erro: &quot; + error.message);
        return;
      }

      state.supabaseConnected = true;
      renderLayout();
      showStatus(&quot;success&quot;, &quot;Salvo no Supabase.&quot;);
    }

    function connectSupabase() {
      const url = $(&quot;supabaseUrl&quot;).value.trim();
      const key = $(&quot;supabaseKey&quot;).value.trim();

      if (!url || !key) {
        showStatus(&quot;error&quot;, &quot;Informe URL e chave.&quot;);
        return false;
      }

      if (!window.supabase) {
        showStatus(&quot;error&quot;, &quot;Biblioteca Supabase não carregada.&quot;);
        return false;
      }

      state.supabase = window.supabase.createClient(url, key);
      localStorage.setItem(CONFIG_KEY, JSON.stringify({ url, key }));
      return true;
    }

    async function testSupabase() {
      if (!connectSupabase()) return;

      const { error } = await state.supabase
        .from(&quot;snippets&quot;)
        .select(&quot;id&quot;)
        .limit(1);

      if (error) {
        state.supabaseConnected = false;
        showStatus(&quot;error&quot;, &quot;Falha: &quot; + error.message);
        renderLayout();
        return;
      }

      state.supabaseConnected = true;
      showStatus(&quot;success&quot;, &quot;Supabase conectado!&quot;);
      renderLayout();
    }

    function importFile(file) {
      const reader = new FileReader();

      reader.onload = () =&gt; {
        const content = String(reader.result || &quot;&quot;);
        const ext = file.name.split(&quot;.&quot;).pop().toLowerCase();

        if (ext === &quot;html&quot; || ext === &quot;htm&quot;) {
          state.html = content;
          state.tab = &quot;html&quot;;
        } else if (ext === &quot;css&quot;) {
          state.css = content;
          state.tab = &quot;css&quot;;
        } else if (ext === &quot;js&quot;) {
          state.js = content;
          state.tab = &quot;js&quot;;
        } else if (ext === &quot;jsx&quot; || ext === &quot;tsx&quot;) {
          state.jsx = content;
          state.tab = &quot;jsx&quot;;
        } else {
          state.html = content;
          state.tab = &quot;html&quot;;
        }

        persistState();
        renderAll();
        updatePreview();
        showStatus(&quot;success&quot;, &quot;Arquivo importado: &quot; + file.name);
      };

      reader.readAsText(file);
    }

    function downloadCurrent() {
      let content;
      let ext;

      if (state.tab === &quot;jsx&quot;) {
        content = state.jsx;
        ext = &quot;jsx&quot;;
      } else if (state.tab === &quot;css&quot;) {
        content = state.css;
        ext = &quot;css&quot;;
      } else if (state.tab === &quot;js&quot;) {
        content = state.js;
        ext = &quot;js&quot;;
      } else {
        content = buildDocument();
        ext = &quot;html&quot;;
      }

      const blob = new Blob([content], { type: &quot;text/plain;charset=utf-8&quot; });
      const url = URL.createObjectURL(blob);
      const link = document.createElement(&quot;a&quot;);

      link.href = url;
      link.download = &quot;playground.&quot; + ext;
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
      showStatus(&quot;success&quot;, &quot;Arquivo baixado.&quot;);
    }

    async function copyCurrent() {
      try {
        await navigator.clipboard.writeText(buildDocument());
        showStatus(&quot;success&quot;, &quot;Código copiado.&quot;);
      } catch {
        showStatus(&quot;error&quot;, &quot;Erro ao copiar.&quot;);
      }
    }

    function resetCurrent() {
      state.html = DEFAULT_HTML;
      state.css = DEFAULT_CSS;
      state.js = DEFAULT_JS;
      state.tab = &quot;html&quot;;
      persistState();
      renderAll();
      updatePreview();
      showStatus(&quot;success&quot;, &quot;Restaurado.&quot;);
    }

    function openFullscreen() {
      const blob = new Blob([buildDocument()], {
        type: &quot;text/html;charset=utf-8&quot;
      });
      const url = URL.createObjectURL(blob);
      window.open(url, &quot;_blank&quot;, &quot;noopener,noreferrer&quot;);
      window.setTimeout(() =&gt; URL.revokeObjectURL(url), 5000);
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle(&quot;light&quot;);
      localStorage.setItem(&quot;playground_theme&quot;, isLight ? &quot;light&quot; : &quot;dark&quot;);
      $(&quot;themeBtn&quot;).textContent = isLight ? &quot;☀&quot; : &quot;☾&quot;;
    }

    function applyTheme() {
      const theme = localStorage.getItem(&quot;playground_theme&quot;) || &quot;dark&quot;;
      document.documentElement.classList.toggle(&quot;light&quot;, theme === &quot;light&quot;);
      $(&quot;themeBtn&quot;).textContent = theme === &quot;light&quot; ? &quot;☀&quot; : &quot;☾&quot;;
    }

    function bindEvents() {
      document.querySelectorAll(&quot;[data-tab]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; setTab(button.dataset.tab));
      });

      $(&quot;codeEditor&quot;).addEventListener(&quot;input&quot;, (event) =&gt; {
        setCurrentCode(event.target.value);
      });

      $(&quot;autoRunBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.autoRun = !state.autoRun;
        persistState();
        renderLayout();
        if (state.autoRun) updatePreview();
      });

      $(&quot;runBtn&quot;).addEventListener(&quot;click&quot;, updatePreview);
      $(&quot;saveLocalBtn&quot;).addEventListener(&quot;click&quot;, saveLocal);
      $(&quot;saveCloudBtn&quot;).addEventListener(&quot;click&quot;, saveCloud);
      $(&quot;copyBtn&quot;).addEventListener(&quot;click&quot;, copyCurrent);
      $(&quot;downloadBtn&quot;).addEventListener(&quot;click&quot;, downloadCurrent);
      $(&quot;fullscreenBtn&quot;).addEventListener(&quot;click&quot;, openFullscreen);
      $(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, resetCurrent);
      $(&quot;themeBtn&quot;).addEventListener(&quot;click&quot;, toggleTheme);

      $(&quot;collapseEditorBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.editorCollapsed = true;
        persistState();
        renderLayout();
      });

      $(&quot;expandEditorBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.editorCollapsed = false;
        persistState();
        renderLayout();
      });

      $(&quot;collapsePreviewBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.previewCollapsed = true;
        persistState();
        renderLayout();
      });

      $(&quot;importBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; $(&quot;fileInput&quot;).click());

      $(&quot;fileInput&quot;).addEventListener(&quot;change&quot;, (event) =&gt; {
        const file = event.target.files[0];
        if (file) importFile(file);
        event.target.value = &quot;&quot;;
      });

      $(&quot;searchBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;searchBox&quot;).classList.toggle(&quot;show&quot;);
        if ($(&quot;searchBox&quot;).classList.contains(&quot;show&quot;)) {
          $(&quot;searchInput&quot;).focus();
        }
      });

      $(&quot;searchInput&quot;).addEventListener(&quot;input&quot;, doSearch);
      $(&quot;replaceBtn&quot;).addEventListener(&quot;click&quot;, doReplace);
      $(&quot;replaceAllBtn&quot;).addEventListener(&quot;click&quot;, doReplaceAll);

      $(&quot;closeSearchBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;searchBox&quot;).classList.remove(&quot;show&quot;);
        $(&quot;codeEditor&quot;).focus();
      });

      $(&quot;configBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;configModal&quot;).classList.add(&quot;open&quot;);
      });

      $(&quot;closeConfigBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;configModal&quot;).classList.remove(&quot;open&quot;);
      });

      $(&quot;testSupabaseBtn&quot;).addEventListener(&quot;click&quot;, testSupabase);

      $(&quot;clearSupabaseBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        $(&quot;supabaseUrl&quot;).value = &quot;&quot;;
        $(&quot;supabaseKey&quot;).value = &quot;&quot;;
        state.supabase = null;
        state.supabaseConnected = false;
        localStorage.removeItem(CONFIG_KEY);
        showStatus(&quot;success&quot;, &quot;Configuração removida.&quot;);
        renderLayout();
      });

      window.addEventListener(&quot;resize&quot;, renderLayout);
    }

    function startup() {
      applyTheme();
      bindEvents();
      loadState();
      updatePreview();

      const config = localStorage.getItem(CONFIG_KEY);
      if (config) {
        try {
          const cfg = JSON.parse(config);
          if (cfg.url &amp;&amp; cfg.key &amp;&amp; window.supabase) {
            state.supabase = window.supabase.createClient(cfg.url, cfg.key);
            state.supabaseConnected = true;
            renderLayout();
          }
        } catch (e) {
          console.error(&quot;Erro ao conectar Supabase:&quot;, e);
        }
      }
    }

    startup();
  &lt;/script&gt;
&lt;/body&gt;

.typing{display:flex;gap:4px;padding:3px 0;}
.typing span{
    width:7px;height:7px;background:var(--text2);
    border-radius:50%;animation:bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{
    0%,80%,100%{transform:translateY(0);opacity:.4;}
    40%{transform:translateY(-5px);opacity:1;}
}

&lt;input type=&quot;file&quot; id=&quot;fileImportBackup&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; onchange=&quot;MODULE_Storage.handleImport(event)&quot;&gt;
