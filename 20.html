<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema Profissional Modular com Supabase">
    <meta name="theme-color" content="#667eea">
    <title>Sistema Profissional - Modular</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='96' y='120' font-size='120' fill='white' text-anchor='middle' font-weight='bold'>S</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #1e1e1e;
            --border: #e9ecef;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.2);
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* LAYOUT PRINCIPAL */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-weight: 500;
        }

        .menu-item:hover {
            background: var(--light);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .menu-item.active {
            background: rgba(102, 126, 234, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .menu-icon {
            font-size: 1.3em;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: var(--light);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
        }

        .status-dot.connected {
            background: #28a745;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .topbar-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--light);
            color: #666;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f5f6fa;
        }

        /* CARDS E COMPONENTES */
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .card-body {
            color: #666;
            line-height: 1.6;
        }

        /* FORMULÁRIOS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* TABELAS */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--light);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: var(--light);
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        /* ALERTAS */
        .alert {
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            color: #999;
            margin-top: 10px;
            font-size: 0.95em;
        }

        /* ABAS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 60px;
                flex-direction: row;
                transform: translateX(-100%);
                position: absolute;
                top: 0;
                left: 0;
                z-index: 200;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .sidebar-header {
                flex: 0 0 60px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar-menu {
                display: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 15px;
            }

            .content-area {
                padding: 15px;
            }
        }

        /* LOADING */
        .spinner {
            border: 3px solid var(--light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>📊 Sistema</h1>
                <p>Profissional Modular</p>
            </div>

            <nav class="sidebar-menu" id="sidebarMenu">
                <div class="menu-item active" data-page="dashboard">
                    <span class="menu-icon">📈</span>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item" data-page="projetos">
                    <span class="menu-icon">📁</span>
                    <span>Projetos</span>
                </div>
                <div class="menu-item" data-page="tarefas">
                    <span class="menu-icon">✅</span>
                    <span>Tarefas</span>
                </div>
                <div class="menu-item" data-page="usuarios">
                    <span class="menu-icon">👥</span>
                    <span>Usuários</span>
                </div>
                <div class="menu-item" data-page="relatorios">
                    <span class="menu-icon">📋</span>
                    <span>Relatórios</span>
                </div>
                <div class="menu-item" data-page="configuracoes">
                    <span class="menu-icon">⚙️</span>
                    <span>Configurações</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Desconectado</span>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main-content">
            <!-- TOPBAR -->
            <header class="topbar">
                <h2 class="topbar-title" id="pageTitle">Dashboard</h2>
                <div class="topbar-actions">
                    <button class="btn btn-secondary btn-small" id="connectBtn" onclick="abrirConexao()">
                        🔗 Conectar Supabase
                    </button>
                    <button class="btn btn-secondary btn-small" id="menuToggle">
                        ☰ Menu
                    </button>
                </div>
            </header>

            <!-- ÁREA DE CONTEÚDO -->
            <div class="content-area" id="contentArea">
                <!-- Conteúdo dinâmico será inserido aqui -->
            </div>
        </div>
    </div>

    <!-- MODAL DE CONEXÃO -->
    <div class="modal" id="conexaoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🔗 Conectar ao Supabase</h2>
                <button class="close-btn" onclick="fecharModal('conexaoModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>URL do Supabase:</label>
                    <input type="text" id="supabaseUrl" placeholder="https://seu-projeto.supabase.co">
                </div>
                <div class="form-group">
                    <label>Chave Pública (anon):</label>
                    <input type="password" id="supabaseKey" placeholder="sua-chave-publica">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="conectarSupabase()">
                    Conectar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL GENÉRICO -->
    <div class="modal" id="genericModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="genericModalTitle">Modal</h2>
                <button class="close-btn" onclick="fecharModal('genericModal')">✕</button>
            </div>
            <div class="modal-body" id="genericModalBody">
                <!-- Conteúdo dinâmico -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS MODULARES -->
    <script>
        // ============================================
        // MÓDULO: CONFIGURAÇÃO GLOBAL
        // ============================================
        const CONFIG = {
            supabase: {
                url: localStorage.getItem('supabase_url') || '',
                key: localStorage.getItem('supabase_key') || ''
            },
            currentPage: 'dashboard',
            isConnected: false
        };

        // ============================================
        // MÓDULO: INICIALIZAÇÃO
        // ============================================
        class App {
            static init() {
                this.setupEventListeners();
                this.verificarConexao();
                this.carregarPagina('dashboard');
                this.registerServiceWorker();
            }

            static setupEventListeners() {
                // Menu items
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const page = item.dataset.page;
                        this.mudarPagina(page);
                    });
                });

                // Menu toggle mobile
                document.getElementById('menuToggle').addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('active');
                });

                // Fechar menu ao clicar em um item (mobile)
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        if (window.innerWidth <= 768) {
                            document.getElementById('sidebar').classList.remove('active');
                        }
                    });
                });
            }

            static mudarPagina(page) {
                CONFIG.currentPage = page;
                
                // Atualizar menu ativo
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.page === page) {
                        item.classList.add('active');
                    }
                });

                this.carregarPagina(page);
            }

            static carregarPagina(page) {
                const titles = {
                    dashboard: 'Dashboard',
                    projetos: 'Projetos',
                    tarefas: 'Tarefas',
                    usuarios: 'Usuários',
                    relatorios: 'Relatórios',
                    configuracoes: 'Configurações'
                };

                document.getElementById('pageTitle').textContent = titles[page] || 'Página';

                const contentArea = document.getElementById('contentArea');
                contentArea.innerHTML = `<div class="spinner" style="margin: 50px auto;"></div>`;

                // Simular carregamento
                setTimeout(() => {
                    const conteudo = this.renderizarPagina(page);
                    contentArea.innerHTML = conteudo;
                }, 300);
            }

            static renderizarPagina(page) {
                const paginas = {
                    dashboard: this.renderDashboard(),
                    projetos: this.renderProjetos(),
                    tarefas: this.renderTarefas(),
                    usuarios: this.renderUsuarios(),
                    relatorios: this.renderRelatorios(),
                    configuracoes: this.renderConfiguracoes()
                };

                return paginas[page] || '<p>Página não encontrada</p>';
            }

            static renderDashboard() {
                return `
                    <div class="grid">
                        <div class="stat-card">
                            <div class="stat-number">24</div>
                            <div class="stat-label">Projetos Ativos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">156</div>
                            <div class="stat-label">Tarefas Concluídas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">12</div>
                            <div class="stat-label">Usuários</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">📊 Atividade Recente</h3>
                            <button class="btn btn-primary btn-small">Ver Mais</button>
                        </div>
                        <div class="card-body">
                            <p>✅ Projeto "Sistema Web" iniciado</p>
                            <p>✅ Tarefa "Design UI" concluída</p>
                            <p>✅ Novo usuário "João Silva" adicionado</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">🎯 Próximos Passos</h3>
                        </div>
                        <div class="card-body">
                            <ol style="margin-left: 20px; line-height: 2;">
                                <li>Conectar ao Supabase</li>
                                <li>Criar tabelas no banco de dados</li>
                                <li>Configurar autenticação</li>
                                <li>Testar sincronização de dados</li>
                                <li>Publicar como PWA</li>
                            </ol>
                        </div>
                    </div>
                `;
            }

            static renderProjetos() {
                return `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">📁 Meus Projetos</h3>
                            <button class="btn btn-primary btn-small" onclick="abrirNovoProjet()">
                                ➕ Novo Projeto
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Status</th>
                                        <th>Progresso</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Sistema Web</td>
                                        <td><span style="background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;">Ativo</span></td>
                                        <td>75%</td>
                                        <td>
                                            <button class="btn btn-secondary btn-small">Editar</button>
                                            <button class="btn btn-danger btn-small">Deletar</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>App Mobile</td>
                                        <td><span style="background: #fff3cd; padding: 5px 10px; border-radius: 3px; color: #856404;">Planejamento</span></td>
                                        <td>25%</td>
                                        <td>
                                            <button class="btn btn-secondary btn-small">Editar</button>
                                            <button class="btn btn-danger btn-small">Deletar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            static renderTarefas() {
                return `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">✅ Tarefas</h3>
                            <button class="btn btn-primary btn-small" onclick="abrirNovaTarefa()">
                                ➕ Nova Tarefa
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Tarefa</th>
                                        <th>Projeto</th>
                                        <th>Responsável</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Design da interface</td>
                                        <td>Sistema Web</td>
                                        <td>Maria</td>
                                        <td><span style="background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;">Concluída</span></td>
                                    </tr>
                                    <tr>
                                        <td>Implementar autenticação</td>
                                        <td>Sistema Web</td>
                                        <td>João</td>
                                        <td><span style="background: #d1ecf1; padding: 5px 10px; border-radius: 3px; color: #0c5460;">Em Progresso</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            static renderUsuarios() {
                return `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">👥 Usuários</h3>
                            <button class="btn btn-primary btn-small" onclick="abrirNovoUsuario()">
                                ➕ Novo Usuário
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Email</th>
                                        <th>Função</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>

            static verificarConexao() {

            static registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                        self.addEventListener('install', event => {

                        });
                        self.addEventListener('fetch', event => {
                            console.log('Fetch interceptado:', event.request.url);

                    `)).catch(err => console.log('SW erro:', err));
                }
            }
        }

        // ============================================
        // MÓDULO: SUPABASE
        // ============================================
        class SupabaseManager {
            static async conectar(url, key) {
                try {
                    // Validar conexão
                    const response = await fetch(`${url}/rest/v1/`, {
                        headers: {
                            'apikey': key,
                            'Authorization': `Bearer ${key}`
                        }
                    });

                    if (response.ok) {
                        CONFIG.supabase.url = url;
                        CONFIG.supabase.key = key;
                        CONFIG.isConnected = true;

                        localStorage.setItem('supabase_url', url);
                        localStorage.setItem('supabase_key', key);

                        document.getElementById('statusDot').classList.add('connected');
                        document.getElementById('statusText').textContent = 'Conectado';

                        mostrarAlerta('✅ Conectado ao Supabase com sucesso!', 'success');
                        return true;
                    }
                } catch (error) {
                    mostrarAlerta('❌ Erro ao conectar: ' + error.message, 'error');
                    return false;
                }
            }

            static desconectar() {
                CONFIG.supabase = { url: '', key: '' };
                CONFIG.isConnected = false;

                localStorage.removeItem('supabase_url');
                localStorage.removeItem('supabase_key');

                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Desconectado';

                mostrarAlerta('🔌 Desconectado do Supabase', 'info');
            }

            static async query(table, options = {}) {
                if (!CONFIG.isConnected) {
                    mostrarAlerta('❌ Não conectado ao Supabase', 'error');
                    return null;
                }

                try {
                    const url = `${CONFIG.supabase.url}/rest/v1/${table}`;
                    const response = await fetch(url, {
                        headers: {
                            'apikey': CONFIG.supabase.key,
                            'Authorization': `Bearer ${CONFIG.supabase.key}`,
                            'Content-Type': 'application/json'
                        },
                        ...options
                    });

                    return await response.json();
                } catch (error) {
                    console.error('Erro na query:', error);
                    return null;
                }
            }
        }

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function abrirConexao() {
            document.getElementById('conexaoModal').classList.add('active');
        }

        function fecharModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function conectarSupabase() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;

            if (!url || !key) {
                mostrarAlerta('❌ Preencha todos os campos', 'error');
                return;
            }

            SupabaseManager.conectar(url, key).then(sucesso => {
                if (sucesso) {
                    fecharModal('conexaoModal');
                    document.getElementById('statusConexao').textContent = 'Conectado ✅';
                    document.getElementById('urlConexao').textContent = `URL: ${url}`;
                }
            });
        }

        function desconectarSupabase() {
            if (confirm('Desconectar do Supabase?')) {
                SupabaseManager.desconectar();
                document.getElementById('statusConexao').textContent = 'Desconectado ❌';
                document.getElementById('urlConexao').textContent = '';
            }
        }

        function mostrarAlerta(mensagem, tipo = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${tipo}`;
            alertDiv.innerHTML = `<span>${mensagem}</span>`;
            
            const contentArea = document.getElementById('contentArea');
            contentArea.insertBefore(alertDiv, contentArea.firstChild);

            setTimeout(() => alertDiv.remove(), 5000);
        }

        function abrirNovoProjet() {
            mostrarAlerta('📁 Funcionalidade de novo projeto em desenvolvimento', 'info');
        }

        function abrirNovaTarefa() {
            mostrarAlerta('✅ Funcionalidade de nova tarefa em desenvolvimento', 'info');
        }

        function abrirNovoUsuario() {
            mostrarAlerta('👥 Funcionalidade de novo usuário em desenvolvimento', 'info');
        }

        // ============================================
        // INICIALIZAR APP
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
